# Staging compose — OCI/LXC deploy target.
#
# This file is *not* used for local dev. Local devs run only postgres via the
# `docker/compose.dev.yml` (port 5433 exposed for `cargo run`); staging
# bundles postgres + the published Reverie image into one network with no
# host port exposure on postgres (LXC-internal only).
#
# Routing/TLS terminate at the host's reverse proxy via out-of-tree dynamic
# config — no traefik labels here. The `.env` and `.env.runtime` files
# alongside this file are populated by the host secret-management agent
# (out-of-tree); compose only consumes them.
#
# Three env files keep each credential scoped to the one container that
# needs it, so a compromise of any single container leaks only that
# container's creds via `/proc/<pid>/environ`:
#
#   `.env` — auto-loaded by compose for `${VAR}` interpolation. Holds
#            postgres-bootstrap creds and runtime-role passwords (including
#            REVERIE_MIGRATOR_PASSWORD), consumed only by `reverie-postgres`
#            via the explicit `environment:` block below, plus REVERIE_VERSION
#            (image tag). Spec: docker/staging.env.bootstrap.example.
#
#   `.env.runtime` — injected only into the `reverie` service. Holds
#            DATABASE_URL, DATABASE_URL_INGESTION, REVERIE_FRONTEND_DIST_PATH,
#            REVERIE_PORT, REVERIE_OPERATOR_CONTACT, REVERIE_LOG_LEVEL,
#            OIDC config. Carries NO schema-management credential by design —
#            in the shipped topology the long-lived app holds zero DDL creds
#            (see adr/2026-06-02-hybrid-migration-entrypoints-and-role.md).
#            Spec: docker/staging.env.runtime.example.
#
#   `.env.migrate` — injected only into the one-shot `reverie-migrate`
#            service. Holds DATABASE_URL_MIGRATION (the least-privilege
#            `reverie_migrator` DSN). Scoped away from the app so DDL creds
#            never reach the long-lived process.
#            Spec: docker/staging.env.migrate.example.
#
# Compromise of the long-lived reverie container exposes only the
# non-superuser DATABASE_URL passwords via `/proc/<pid>/environ` — not
# POSTGRES_PASSWORD and not the migration DDL credential.
#
# Bring up:  docker compose -f docker/compose.staging.yml up -d
# Validate:  docker compose -f docker/compose.staging.yml config

services:
  reverie-postgres:
    image: postgres:18-alpine@sha256:1b1689b20d16a014a3d195653381cf2caa75a41a92d93b255a9d6ea29fd353aa
    # Scope explicitly: postgres only needs bootstrap credentials and the
    # init-roles.sql password inputs. Loading the full app `.env` would
    # leak unrelated secrets (DATABASE_URL, OIDC client secret, session
    # secret, CSP endpoint) into the postgres container's environment,
    # readable via `/proc/<pid>/environ` to anyone with exec on the
    # container. The `:?` form makes a missing var an immediate hard fail
    # rather than a silent empty-string substitution.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
      REVERIE_APP_PASSWORD: ${REVERIE_APP_PASSWORD:?required}
      REVERIE_INGESTION_PASSWORD: ${REVERIE_INGESTION_PASSWORD:?required}
      REVERIE_READONLY_PASSWORD: ${REVERIE_READONLY_PASSWORD:?required}
      REVERIE_MIGRATOR_PASSWORD: ${REVERIE_MIGRATOR_PASSWORD:?required}
    volumes:
      # Parent-dir mount required by postgres:18+ (image places data in a
      # major-version subdirectory `/var/lib/postgresql/<major>/<cluster>/`
      # to make `pg_upgrade --link` mount-boundary-safe). Mounting the
      # legacy `…/data` child path errors out at first init.
      - pg-data:/var/lib/postgresql
      # init-roles.sql creates the runtime roles (reverie_app,
      # reverie_ingestion, reverie_readonly) plus the reverie_migrator
      # migration identity on first-boot DB init. The
      # postgres entrypoint only runs /docker-entrypoint-initdb.d/* against
      # an uninitialized data directory (no `PG_VERSION` file present); on
      # subsequent restarts the script is skipped.
      - ./init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # One-shot schema-migration step. Runs `reverie migrate` to completion
  # against the least-privilege `reverie_migrator` DSN, then exits. The app
  # is gated on its successful exit (see `reverie` depends_on), so the shipped
  # upgrade path stays one command: `docker compose pull && up -d` runs this
  # to completion, then starts the app. All-or-nothing batch semantics mean a
  # failed migration leaves the DB untouched — recovery is "pin the old tag,
  # restart" (adr/2026-06-02-hybrid-migration-entrypoints-and-role.md).
  reverie-migrate:
    image: ghcr.io/unkos-dev/reverie:${REVERIE_VERSION:?required}
    # Appends to the image's exec-form ENTRYPOINT (`["reverie-api"]`, see
    # Dockerfile) → `reverie-api migrate` → Command::Migrate
    # (backend/src/lib.rs). Migrates then exits zero on success, non-zero on
    # failure. Two distinct fragilities to keep in mind:
    #   - ENTRYPOINT switched to shell form: `command` is then passed to
    #     `sh -c`, so `migrate` alone is a command-not-found. Fix by writing
    #     the full exec-form `command: ["reverie-api", "migrate"]`.
    #   - Binary renamed: update ENTRYPOINT itself; this `command` stays just
    #     the subcommand and keeps appending to whatever the new binary is.
    command: ["migrate"]
    # DDL credential isolation: `.env.migrate` carries ONLY
    # DATABASE_URL_MIGRATION (the reverie_migrator DSN). The isolation is
    # structural — this service's env_file is `.env.migrate`, the app's is
    # `.env.runtime`, and `.env.runtime` deliberately holds no migration
    # credential — so the DDL credential never reaches the long-lived
    # `reverie` app container. A CI step enforces this against the rendered
    # config (asserts the key is absent from the `reverie` service).
    env_file:
      - path: .env.migrate
        required: true
    depends_on:
      reverie-postgres:
        condition: service_healthy
    # The image's baked HEALTHCHECK probes the HTTP server, which a one-shot
    # migrate container never starts — disable it so the container isn't
    # marked unhealthy. `depends_on: service_completed_successfully` gates on
    # exit code, not health, so this does not affect the app's start gate.
    healthcheck:
      disable: true
    # One-shot: do not restart on exit. A non-zero exit must surface as a
    # failed migrate step (and block the app), not a crash-loop.
    restart: "no"

  reverie:
    image: ghcr.io/unkos-dev/reverie:${REVERIE_VERSION:?required}
    # Scoped runtime env — `.env.runtime` excludes postgres-bootstrap
    # superuser creds (POSTGRES_USER/PASSWORD/DB) AND the migration DDL
    # credential (DATABASE_URL_MIGRATION, scoped to `reverie-migrate`), so a
    # compromised app container reading `/proc/<pid>/environ` can neither
    # escalate to a DB superuser nor obtain schema-management rights. Spec:
    # docker/staging.env.runtime.example.
    env_file:
      - path: .env.runtime
        required: true
    depends_on:
      reverie-postgres:
        condition: service_healthy
      # Gate on the migrate step finishing cleanly. The app refuses to serve
      # against a schema-behind database (bidirectional divergence check), so
      # this ordering is what makes `up -d` a correct one-command upgrade.
      reverie-migrate:
        condition: service_completed_successfully
    # Healthcheck baked into the runtime image (see Dockerfile) — compose
    # inherits HEALTHCHECK from the image so no override here.
    #
    # No `ports:` mapping and no Traefik labels by design. Routing/TLS
    # terminate at the host's reverse proxy (out-of-tree). The operator
    # is expected to attach this service to a Traefik-reachable docker
    # network out-of-band — typically:
    #
    #   docker network connect <traefik-net> docker-reverie-1
    #
    # or, if the operator's deploy automation already declares the
    # Traefik network as `external`, an override compose file extends
    # this service with the appropriate `networks:` entry. Keeping the
    # in-tree compose minimal means the same file works regardless of
    # the operator's reverse-proxy choice (Traefik file provider,
    # Traefik docker provider, Caddy, nginx-proxy, etc.).
    restart: unless-stopped

volumes:
  pg-data:
