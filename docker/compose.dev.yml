# Pinned project name: without it compose derives the project from this
# file's directory (`docker`), so the stack's identity, and with it the
# pgdata volume's name, hangs on a directory name and diverges on rename.
# Pinning makes the volume deterministically `reverie_pgdata` for every
# checkout and worktree. REVERIE_COMPOSE_ENV suffixes the project
# (reverie_dev, reverie_stage) for a deliberately separate stack with its
# own volume; export it or set it in `docker/.env`, which is the dotenv
# file compose loads for this project, not the repository root `.env`.
# Compose precedence still puts `-p` and an exported COMPOSE_PROJECT_NAME
# above this field, and either override provisions a separate empty volume.
name: reverie${REVERIE_COMPOSE_ENV:+_${REVERIE_COMPOSE_ENV}}

services:
  postgres:
    # A major-version bump can change the unaccent dictionary the folded
    # search indexes were built under; this volume persists, so REINDEX the
    # immutable_unaccent indexes and recompute works.search_vector with the
    # bump. See debt/2026-08-02-unaccent-dictionary-reindex-obligation.md.
    image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    # Suffixed like the project so an alternate-env stack does not clash on
    # the global container namespace; the published host port and the socket
    # directory are then the only resources shared between env stacks, and
    # both already serialize the stacks (two postmasters cannot bind the
    # same port or the same socket path).
    container_name: reverie-postgres${REVERIE_COMPOSE_ENV:+_${REVERIE_COMPOSE_ENV}}
    restart: unless-stopped
    environment:
      POSTGRES_USER: reverie
      POSTGRES_PASSWORD: reverie
      POSTGRES_DB: reverie_dev
    ports:
      # Loopback-only: Docker-published ports bypass host firewalls (nat
      # precedes INPUT), and this dev cluster uses trivial role-name passwords.
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18+ stores data in a major-version subdirectory
      # (`/var/lib/postgresql/<major>/<cluster>/`) for `pg_upgrade --link`
      # mount-boundary safety. Mounting the legacy `…/data` child path
      # errors out at first init — mount the parent.
      - pgdata:/var/lib/postgresql
      - ./init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
      # Serve the cluster's unix socket on the host alongside TCP. Local
      # tooling (the DB-backed just recipes) connects here, which is what
      # lets it run inside network-isolated dev sandboxes; the dev server
      # and GUI clients keep using the published TCP port. Socket
      # connections match pg_hba's `local all all trust` and are therefore
      # passwordless for every role: the same effective access the
      # role-name-password TCP port already grants, without a listener.
      # The image entrypoint owns the directory (chowns it at startup and
      # recreates the socket), so nothing needs to pre-create it, but the
      # result is uid-999-owned with the sticky bit: deleting it needs
      # root or a container exec. Docker Desktop (macOS/Windows) cannot
      # share unix sockets across its VM boundary; there, drop this mount
      # via a local compose override and set REVERIE_DEV_DB_URL to the TCP
      # form. The interpolation mirrors the shell default
      # `${XDG_STATE_HOME:-$HOME/.local/state}` used by the recipes, so
      # both sides resolve to the same directory.
      - ${XDG_STATE_HOME:-${HOME}/.local/state}/reverie/pgsock:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reverie -d reverie_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
