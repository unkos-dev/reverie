extends: existence
message: "Avoid em dashes in prose. Recast with a comma, colon, or full stop."
level: warning
nonword: true
# Prose only: skip YAML frontmatter values (e.g. the MADR `consulted: "—"`
# placeholder) and table cells (em dashes used as column markers are structure,
# not prose). Vale exposes frontmatter fields as `text.frontmatter.*` scopes.
scope:
  - ~text.frontmatter & ~table.cell & ~table.header
tokens:
  - '\x{2014}'
