extends: existence
# Gate every em dash in prose. Bare token, not a word-adjacency heuristic, so no
# The bare token also catches bold or italic Markdown formatting around the dash.
# Inline code remains outside Vale's prose scope.
message: "Avoid em dashes in prose. Recast with a comma, colon, or full stop."
level: error
nonword: true
tokens:
  - '\x{2014}'
