## Clippy configuration for backend.
##
## Project-wide deny on `clippy::unwrap_used` and `clippy::expect_used` lives
## in `Cargo.toml` (`[lints.clippy]`). These options pin the test-code
## exemption explicitly so the carve-out is independent of any heuristic
## drift across clippy versions: tests may use `unwrap()` / `expect()`
## freely, production code may not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

## `OpenAPI` is a proper-noun standard name (like clippy's built-in `OAuth` /
## `GraphQL`) and should not be code-formatted in prose. `..` extends clippy's
## default valid-ident list rather than replacing it.
doc-valid-idents = ["OpenAPI", ".."]

## UNK-378: escalation path of `adr/2026-05-18-outbound-http-user-agent.md`
## ("if this happens twice, escalate to Option C — compile-time lint").
## reqwest sends NO User-Agent header by default, and common WAFs
## (Cloudflare's default scanner blocklist among them) drop empty-UA
## requests with 403 before they reach the origin — UNK-255 was a
## startup-time OIDC discovery failure from exactly this. Every
## production outbound client must therefore be built through one of the
## sanctioned UA-setting constructors, which carry scoped `#[expect]`s:
##   - `api_client` / `cover_client` (src/services/enrichment/http.rs)
##   - `http_client` (src/auth/oidc.rs)
## Test-only wiremock clients on loopback are ADR-exempt; their test
## modules carry their own scoped expects.
disallowed-methods = [
  { path = "reqwest::Client::new", reason = "no default User-Agent — WAFs 403 empty-UA requests (UNK-255); build clients via api_client()/cover_client() (enrichment) or the OIDC http_client(); see adr/2026-05-18-outbound-http-user-agent.md" },
  { path = "reqwest::Client::builder", reason = "no default User-Agent — WAFs 403 empty-UA requests (UNK-255); build clients via api_client()/cover_client() (enrichment) or the OIDC http_client(); see adr/2026-05-18-outbound-http-user-agent.md" },
  { path = "reqwest::ClientBuilder::new", reason = "no default User-Agent — WAFs 403 empty-UA requests (UNK-255); build clients via api_client()/cover_client() (enrichment) or the OIDC http_client(); see adr/2026-05-18-outbound-http-user-agent.md" },
]
