## Clippy configuration for backend.
##
## Project-wide deny on `clippy::unwrap_used` and `clippy::expect_used` lives
## in `Cargo.toml` (`[lints.clippy]`). These options pin the test-code
## exemption explicitly so the carve-out is independent of any heuristic
## drift across clippy versions: tests may use `unwrap()` / `expect()`
## freely, production code may not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

## `OpenAPI` is a proper-noun standard name (like clippy's built-in `OAuth` /
## `GraphQL`) and should not be code-formatted in prose. `..` extends clippy's
## default valid-ident list rather than replacing it.
doc-valid-idents = ["OpenAPI", ".."]

## These entries are the compile-time escalation that
## `docs/adr/0007-outbound-http-clients-send-an-explicit-user-agent.md` reserved
## for a second lapse; that lapse happened, so they now back the convention.
## reqwest sends NO User-Agent header by default, and common WAFs
## (Cloudflare's default scanner blocklist among them) drop empty-UA
## requests with 403 before they reach the origin: a startup-time OIDC
## discovery failure happened from exactly this. Every production
## outbound client must therefore be built through one of the sanctioned
## UA-setting constructors, which carry scoped `#[expect]`s:
##   - `api_client` / `cover_client` (src/services/enrichment/http.rs)
##   - `http_client` (src/auth/oidc.rs)
##   - `jwks_http_client` (src/auth/jwt.rs)
## Test-only wiremock clients on loopback are ADR-exempt; their test
## modules carry their own scoped expects.
disallowed-methods = [
  { path = "reqwest::Client::new", reason = "no default User-Agent: WAFs 403 empty-UA requests; build clients via api_client()/cover_client() (enrichment), the OIDC http_client(), or jwks_http_client() (auth::jwt); see docs/adr/0007-outbound-http-clients-send-an-explicit-user-agent.md" },
  { path = "reqwest::Client::builder", reason = "no default User-Agent: WAFs 403 empty-UA requests; build clients via api_client()/cover_client() (enrichment), the OIDC http_client(), or jwks_http_client() (auth::jwt); see docs/adr/0007-outbound-http-clients-send-an-explicit-user-agent.md" },
  { path = "reqwest::ClientBuilder::new", reason = "no default User-Agent: WAFs 403 empty-UA requests; build clients via api_client()/cover_client() (enrichment), the OIDC http_client(), or jwks_http_client() (auth::jwt); see docs/adr/0007-outbound-http-clients-send-an-explicit-user-agent.md" },
]

## First-party code uses chrono. The `time` crate stays in the tree only
## because three third-party signatures take its types and accept nothing
## else: tower-sessions' `Expiry` and `Record`, and the cookie builder's
## `max_age`. Those sites carry scoped `#[expect]`s naming the API that
## forces them:
##   - `build_router_with_session_store` (src/lib.rs) and its store tests
##   - `theme_cookie` (src/auth/theme_cookie.rs)
##   - `PostgresStore` (src/auth/store.rs), which converts at the boundary
##
## This is a lint rather than a text search because the question is what a
## path resolves to, not how it is spelled: `use time::Duration`,
## `::time::Duration`, `tower_sessions::cookie::time::Duration`, and
## `use time::Duration as D` are one `DefId` and one entry, while
## `std::time::Duration` is a different `DefId` and needs no exclusion.
## An `#[expect]` that stops being necessary fails the build, so the
## carve-outs cannot rot the way a checked-in allowlist can. That property
## depends on `-D warnings`, which `rust.just`'s clippy recipe passes.
## See docs/adr/0046-chrono-is-the-first-party-datetime-crate.md.
disallowed-types = [
  { path = "time::OffsetDateTime", reason = "first-party code uses chrono::DateTime<Utc>; `time` is permitted only at the tower-sessions and cookie boundaries, which carry scoped #[expect]s; see docs/adr/0046-chrono-is-the-first-party-datetime-crate.md" },
  { path = "time::Duration", reason = "first-party code uses chrono::TimeDelta for datetime arithmetic and std::time::Duration for timers; `time::Duration` is permitted only at the tower-sessions and cookie boundaries; see docs/adr/0046-chrono-is-the-first-party-datetime-crate.md" },
  { path = "time::Date", reason = "first-party code uses chrono::NaiveDate for calendar dates; see docs/adr/0046-chrono-is-the-first-party-datetime-crate.md" },
  { path = "time::PrimitiveDateTime", reason = "first-party code uses chrono::NaiveDateTime, and chrono::DateTime<Utc> for instants; see docs/adr/0046-chrono-is-the-first-party-datetime-crate.md" },
]
