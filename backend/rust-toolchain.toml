# The Rust toolchain both planes compile with.
#
# rustup reads this file for every cargo invocation under backend/, so a local
# build and a CI build cannot land on different compilers. Without it each side
# tracked `stable` on its own schedule, and a release could introduce lints
# that fired in CI on a branch touching none of the code they fired on, or that
# a developer saw weeks before CI did.
#
# CI installs this same version explicitly rather than leaving rustup to
# auto-install it on the first cargo call: an explicit install adds the
# components a single job needs, fails loudly and early when this file cannot
# be read, and puts the pinned rustc on PATH before anything keys a build cache
# on it. .github/actions/rust-toolchain reads the channel from here.
# `rust-version` in backend/Cargo.toml must match `channel`; Renovate updates
# both declarations in one grouped PR.
#
# clippy and rustfmt are not listed because rustup's default profile already
# carries them. `rust-src` and `rust-analyzer` are not listed because nothing
# in CI or in any recipe uses them: they serve an editor, so they belong on
# the machine that runs one, via `rustup component add`.
[toolchain]
channel = "1.99.0"
