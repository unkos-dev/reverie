type Query {
  viewer: Viewer!
  node(id: ID!): Node
  work(id: ID!): Work
  manifestation(id: ID!): Manifestation
  shelf(id: ID!): Shelf
  series(id: ID!): Series
  fetch__Series(id: ID!): Series
  fetch__Shelf(id: ID!): Shelf
  fetch__Manifestation(id: ID!): Manifestation
  books(first: Int!, after: String, filter: BooksFilter, sort: [SortLevel!]): ManifestationConnection!
  shelves(first: Int!, after: String): ShelfConnection!
  search(q: String!): [SearchHit!]!
  authorLabels(ids: [ID!]!): [AuthorSuggestion!]!
  seriesLabels(ids: [ID!]!): [SeriesSuggestion!]!
  authorSuggestions(q: String!, limit: Int): [AuthorSuggestion!]!
  seriesSuggestions(q: String!, limit: Int): [SeriesSuggestion!]!
  genreSuggestions(q: String!, limit: Int): [GenreSuggestion!]!
  moodSuggestions(q: String!, limit: Int): [MoodSuggestion!]!
  tagSuggestions(q: String!, limit: Int): [TagSuggestion!]!
  publisherSuggestions(q: String!, limit: Int): [PublisherSuggestion!]!
}

