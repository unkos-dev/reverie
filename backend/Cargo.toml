[package]
name = "reverie-api"
version = "0.0.0"
edition = "2024"
# Minimum supported Rust version. Now set by a dependency: sqlx 0.9 declares
# rust-version 1.94, above our first-party floor (session_sweep/settings use
# `Duration::from_hours`/`from_mins`, stabilized in 1.91.0) and the edition-2024
# floor (1.85). Enforced two ways:
# clippy's `incompatible_msrv` lint (denied workspace-wide) flags any use of a
# newer std API, and the CI `msrv` job compiles on exactly this toolchain. Bump
# only when one of those proves the real floor has risen.
rust-version = "1.94"
license = "AGPL-3.0-or-later"
description = "Reverie ebook library manager — API server"

# Library + binary split, per
# docs/adr/0004-tiered-comment-policy-for-an-open-source-codebase.md. The library
# carries every module so that `missing_docs` and the clippy pedantic
# doc lints fire on externally-reachable items; the binary is a thin
# entry that calls `reverie_api::run()` under `#[tokio::main]`.
[lib]
name = "reverie_api"
path = "src/lib.rs"

[[bin]]
name = "reverie-api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
argon2 = "0.6.0"
async-trait = "0.1.89"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "query"] }
base64ct = { version = "1.8.3", features = ["std"] }
# First-party datetime crate. `DateTime<Utc>` carries the UTC invariant in the
# type parameter, and its serde default is RFC 3339 both directions, so the
# published wire contract holds without a per-field adapter attribute.
# See docs/adr/0046-chrono-is-the-first-party-datetime-crate.md.
chrono = { version = "0.4.44", features = ["serde"] }
crc = "3.4.0"
email_address = "0.2.9"
encoding_rs = "0.8.35"
futures = "0.3.32"
governor = { version = "0.10.4", features = ["dashmap"] }
hickory-resolver = "0.26.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# Resource-server JWT validation (RFC 9068) for IdP-issued Bearer access
# tokens; jsonwebtoken has no default crypto backend, so a backend feature
# is mandatory. jwks_client_rs pulls its own jsonwebtoken dependency
# transitively, and its JwksClientError: From<jsonwebtoken::errors::Error>
# impl only satisfies the trait bound in auth/jwt.rs when both crates
# resolve the same jsonwebtoken major version — bump them together, never
# independently, or the build breaks with two incompatible same-named
# jsonwebtoken types in the graph. jwks_client_rs's own defaults already
# select reqwest's rustls backend and rust_crypto (reqwest 0.13's
# default-tls feature is itself an alias for rustls, not native-tls); the
# explicit feature list below pins that selection by name rather than
# relying on the crate's current defaults.
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
jwks_client_rs = { version = "0.6.2", default-features = false, features = [
  "rustls",
  "rust_crypto",
] }
notify = "8.2.0"
openidconnect = { version = "4.0.1", features = ["reqwest"] }
quick-xml = "0.41.0"
rand = "0.10.1"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream"] }
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
rmp-serde = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = { version = "3.20.0", default-features = false, features = ["std"] }
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6.1"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "macros",
  "migrate",
] }
tempfile = "3.27.0"
thiserror = "2.0.18"
# Boundary-only. First-party code uses chrono; `time` is declared because three
# third-party signatures take its types directly (tower-sessions `Expiry` and
# `Record`, and the cookie builder's `max_age`). clippy's `disallowed-types`
# in clippy.toml holds that list, and each site carries a scoped `#[expect]`.
time = "0.3.51"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
# `util` supplies ServiceExt::oneshot, which lets the composite fallback
# drive a ServeDir for a single request before deciding whether the path
# is a real dist file or an SPA route.
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
# tower-sessions core is the maintained session-lifecycle primitive (kept);
# the abandoned axum-login + tower-sessions-sqlx-store wrappers were replaced
# with first-party code (auth::store, auth::session, auth::middleware).
# ADR: docs/adr/0015-first-party-session-layer-on-the-tower-sessions-core.md.
tower-sessions = "0.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
figment = { version = "0.10.19", features = ["env"] }
validator = { version = "0.21.0", features = ["derive"] }
schemars = { version = "1.2.1", features = ["url2"] }
percent-encoding = "2.3.2"
# OpenAPI 3.1 contract generated code-first from the handlers (docs-as-done;
# docs/adr/0016-api-versioning-by-url-path-with-openapi-as-the-contract.md). The `chrono`/`uuid`
# features map those types into the schema as `string`/`date-time` and
# `string`/`uuid`. utoipa-axum's `OpenApiRouter` makes a handler routed without
# `#[utoipa::path]` a compile error.
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
walkdir = "2.5.0"
zip = "8.6.0"
# Server-side password-strength estimator (NIST SP 800-63B strength floor,
# docs/adr/0034-password-policy-zxcvbn-floor-plus-a-fail-open-hibp-check.md). Pure Rust, no network.
zxcvbn = "3"

[dev-dependencies]
axum-test = "21.0.0"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["std", "getrandom"] }
rsa = { version = "0.9.10", features = ["pem"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic lints inappropriate for application crates (vs library crates).
# See docs/adr/0002-strict-lint-policy-pedantic-clippy-and-strict-frontend-lint.md for rationale;
# docs/adr/0004-tiered-comment-policy-for-an-open-source-codebase.md re-enables missing_errors_doc after the backfill.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Pedantic lints that only became reachable with the lib/bin split above:
# every module pub item is now externally visible, so they surface
# pre-existing instances across the crate rather than new defects. Held at
# allow alongside the two doc lints above; the comment-policy record owns
# whether any of the four return.
too_long_first_doc_paragraph = "allow"
implicit_hasher = "allow"

# nursery lint that fires inside the `utoipa::IntoParams` derive for query
# param structs with many fields (the books-list filter grammar): the derive
# materializes one array over every parameter while building the OpenAPI spec
# at startup, never on a request path. A per-item `#[expect]` cannot catch a
# lint raised inside a derive-macro expansion (the diagnostic span sits in the
# generated code), so the carve-out lives here. See the strict-lint-policy ADR.
large_stack_arrays = "allow"

# Project-specific hard rules from backend/AGENTS.md.
#
# Suppressions must be self-purging and justified: #[expect] errors via
# unfulfilled_lint_expectations the moment the suppressed lint stops
# firing, and every expectation must carry a `reason`. Stale #[allow]
# attributes are invisible to every tool; see the expect-over-allow ADR.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
todo = "warn"
unimplemented = "warn"

# Optimise all dependencies in `dev`/`run` builds.
#
# Cover serving rasterizes SVG covers (resvg/usvg/tiny-skia) and unzips +
# decodes + Lanczos-resizes + re-encodes rasters (zip/flate2/miniz_oxide,
# image/png/zune-jpeg/fdeflate). Under the unoptimised dev profile these pixel-
# and byte-loop crates dominate a cold cover generation — ~11s on the dev box.
# Building dependencies at opt-level 3 keeps that path fast. Applying it to all
# deps (`"*"`) rather than an enumerated cover-crate list is deliberate: an
# explicit list silently drifts (a package override for a crate not in the graph
# is ignored without warning), and missing one hot transitive crate — e.g. the
# `miniz_oxide` deflate codec behind both the ZIP reader and PNG decode — leaves
# part of the path slow. Deps compile once at opt3, then cache.
#
# Scope: the `dev` profile. `"*"` covers dependencies, not the first-party
# crate, so our own code stays at opt-level 0 for fast incremental rebuilds.
# `release` (the shipped binary) is untouched. The `test` profile inherits
# `dev`, so `cargo test` also builds dependencies at opt-level 3 — this only
# makes test builds faster and changes no semantics; the one-time recompile is
# absorbed by `rust-cache` in CI.
# Debuginfo level for `dev`, and for `test` which inherits it.
#
# Full debuginfo dominates the first-party artifact: across the sections of
# the dev-profile rlib, DWARF outweighs code and data by roughly seven to one.
# The content-addressed build cache keeps one entry per distinct source state
# compiled, so that crate's own churn, not the dependency graph, is what fills
# the store. Line tables keep file and line numbers in panics, backtraces, and
# test failures, which is the debugging surface this workflow actually uses;
# what goes is a stepping debugger's variable inspection.
#
# CI already compiled this way, through a `CARGO_PROFILE_DEV_DEBUG` set once
# per job. Declaring it here instead makes the local and CI dev profiles
# identical by construction rather than by several places agreeing.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
