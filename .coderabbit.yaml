# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for unkos-dev/reverie.
#
# Background: .github/CONTRIBUTING.md documents the active AI reviewers
# and the data-handling terms that apply when opening a PR.
#
# Remit: CodeRabbit is scoped to the operational plane (shell scripts,
# just recipes, CI workflows, git hooks, container files), where its
# review record shows unique catches the rest of the stack misses:
# portability, signal handling, and set -u/-e edge cases. The positive
# path_filters below act as an allowlist, so a PR touching none of
# these paths is skipped entirely; that is both the noise control and
# what keeps usage under the per-developer review rate limit. Product
# code review is owned by Greptile plus the native lint/CI surface.

language: en-AU
tone_instructions: ""
early_access: true
enable_free_tier: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  in_progress_fortune: false
  review_status: false
  review_details: false
  commit_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_reviewers: false
  suggested_labels: false
  enable_prompt_for_ai_agents: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
  path_filters:
    - "scripts/**"
    - "**/justfile"
    - "**/*.just"
    - ".github/**"
    - "lefthook.yml"
    - "**/Dockerfile*"
    - "docker/**"
    - "**/*.sh"
  path_instructions:
    - path: "{**/*.sh,**/justfile,**/*.just,.github/workflows/**}"
      instructions: |
        Shell is the review target here, including where it is embedded:
        just recipe bodies and workflow `run:` blocks are bash and get
        the same scrutiny as *.sh files. Flag GNU-only flags on tools
        that differ on BSD/macOS (stat, sed, date, xargs), variables
        that can be unbound under `set -u`, exit-code capture patterns
        that break under `set -e`, and signal or process-group handling
        races. Every guard script in scripts/ has a matching
        *-selftest.sh; a behaviour change without a selftest update is
        incomplete.
    - path: "**/*"
      instructions: |
        Reverie is open-source and self-hosted. Threat model is a multi-
        user exposed instance, not a private homelab. Treat security
        findings on user input, secrets, file I/O, and outbound HTTP as
        load-bearing, not nice-to-have. Never surface decrypted secret
        values; describe presence and shape only (source, length,
        format), never the value itself. TDD is mandatory. A code
        change without a corresponding test (happy path, negative, edge
        case where non-obvious) should be flagged as incomplete.
        Conventional Commits are mandatory. Branch names follow GitHub
        Flow with prefixes feat/, fix/, refactor/, docs/, chore/,
        test/, perf/.
  abort_on_close: true
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
  tools:
    # CI duplicates — explicitly disabled. CI is the authoritative lint
    # surface (clippy, oxlint, oxfmt, stylelint, markdownlint-cli2,
    # actionlint, shellcheck, hadolint, yamllint), each scoped to
    # git-tracked files with the repo's own pinned config. CodeRabbit's
    # bundled wrappers either duplicate the same diagnostics or run a
    # different (default / weaker) ruleset.
    markdownlint:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    ruff:
      enabled: false
    clippy:
      enabled: false
    stylelint:
      enabled: false
    shellcheck:
      enabled: false
    yamllint:
      enabled: false
    actionlint:
      enabled: false
    hadolint:
      enabled: false
    # Structural pattern matching over the in-scope paths.
    ast-grep:
      essential_rules: true
    # Secret scanning on the operational plane, where CI env plumbing
    # and generated configs make leakage plausible.
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    presidio:
      enabled: true
    # SAST + IaC/image scanning — native, blocking CI gates own these
    # (opengrep, trivy, checkov), so CR's advisory duplicates stay off.
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    trivy:
      enabled: false
    checkov:
      enabled: false
    # Lockfiles sit outside the path allowlist, so SCA cannot fire;
    # native Snyk, dependency-review, and the audit crons own that
    # surface.
    osvScanner:
      enabled: false
    # Markdown and docs sit outside the path allowlist (.github/** MD
    # excepted), and grammar review is not worth a review-limit slot.
    languagetool:
      enabled: false
chat:
  auto_reply: true
  art: false
knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    project_keys: []
  linear:
    usage: disabled
    team_keys: []
