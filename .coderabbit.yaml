# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for unkos-dev/reverie.
#
# Background: adr/2026-05-07-coderabbit-parallel-trial.md records the
# evaluation that led to adopting CodeRabbit as a standing review bot.
#
# Profile is `chill`. CodeRabbit runs alongside the repo's own lint/CI
# surface and multi-agent review, so its remit is net-new signal, not
# volume.

language: en-AU
tone_instructions: ""
early_access: true
enable_free_tier: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  in_progress_fortune: false
  review_status: false
  review_details: false
  commit_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_reviewers: false
  suggested_labels: false
  enable_prompt_for_ai_agents: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
  path_filters:
    - "!**/package-lock.json"
    - "!**/Cargo.lock"
  path_instructions:
    - path: "backend/**/*.rs"
      instructions: |
        Errors flow through `thiserror`-derived `AppError`; never return
        raw `anyhow::Error` from public APIs. SQL queries use sqlx
        compile-time macros (`query!` / `query_as!` / `query_scalar!`); a
        new runtime-form `sqlx::query(...)` outside the documented
        carve-outs in `.github/sqlx-runtime-allowlist.txt` is a regression
        — flag it. (The `chrono` ban is now a native CI grep guard.)
    - path: "frontend/src/**/*.{ts,tsx}"
      instructions: |
        No raw hex colour literals — every brand colour comes from the
        canonical token system (--color-canvas, --color-fg, --color-accent,
        etc.). `Lockup.tsx` is the documented exemption (philosophy §11C
        invariant). No TypeScript `enum` — use `as const` objects + union
        types. No `as` type assertions. No `!` non-null assertions.
        `useEffect` always returns a cleanup function; async work uses
        `AbortController`, never `async () => …` directly.
    - path: "frontend/src/**/*.tsx"
      instructions: |
        No inline JSX `style={{...}}` object literals — use Tailwind
        classes or design tokens. `Lockup.tsx` and `src/components/ui/**`
        (shadcn-generated) are the documented exemptions.
    - path: "frontend/src/components/ui/**"
      instructions: |
        shadcn/ui primitives are CLI-generated (`npx shadcn@latest add`).
        Do not flag style or convention divergences in this directory
        unless they affect runtime correctness.
    - path: "**/*"
      instructions: |
        Reverie is open-source and self-hosted. Threat model is a multi-
        user exposed instance, not a private homelab. Treat security
        findings on user input, auth, sessions, secrets, file I/O, XML
        parsing, outbound HTTP, and response headers as load-bearing —
        not nice-to-have. Never surface decrypted secret values; describe
        presence and shape only (source, length, format) — never the
        value itself. TDD is mandatory. A code change without a
        corresponding test (happy path, negative, edge case where
        non-obvious) should be flagged as incomplete. Conventional
        Commits are mandatory. Branch names follow GitHub Flow with
        prefixes feat/, fix/, refactor/, docs/, chore/, test/, perf/.
  abort_on_close: true
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
  tools:
    # CI duplicates — explicitly disabled. CI is the authoritative lint
    # surface: the `lint`, `Workflow lint`, and `Repo lint` jobs in
    # ci.yml run on every pull_request — cargo clippy --deny warnings,
    # eslint strictTypeChecked, prettier, stylelint, markdownlint-cli2,
    # actionlint, shellcheck, hadolint, and yamllint — each scoped to
    # git-tracked files with the repo's own pinned config. CodeRabbit's
    # bundled wrappers either duplicate the same diagnostics or run
    # against a different (default / weaker) ruleset, both of which
    # produce noise without signal.
    markdownlint:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    ruff:
      enabled: false
    clippy:
      enabled: false
    stylelint:
      enabled: false
    shellcheck:
      enabled: false
    yamllint:
      enabled: false
    actionlint:
      enabled: false
    hadolint:
      enabled: false
    # Structural pattern matching — net-new signal. `essential_rules`
    # turns on CodeRabbit's built-in anti-pattern set. The remaining
    # judgement-based convention rules (the `as`/`!` and raw-hex bans from
    # path_instructions above) are the high-value follow-up: authored under
    # rule_dirs, they enforce those bans deterministically instead of
    # relying on the model's judgement, which the `chill` profile makes
    # less reliable. (The `chrono` and runtime-`sqlx::query` bans are now
    # native CI guards.)
    ast-grep:
      essential_rules: true
      rule_dirs:
        - ".coderabbit/ast-grep-rules"
    # Secret scanning. Reverie has no secrets in tree, but Renovate and
    # contributor PRs touch generated configs where leakage is plausible.
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    presidio:
      enabled: true
    # SAST + IaC/image scanning — now native, blocking CI gates, so
    # disabled here to avoid a second advisory (diff-only, non-gating)
    # opinion. UNK-378 reproduced each as a ci.yml job: opengrep SAST over
    # backend/src + frontend/src (#472), trivy image-CVE + IaC-misconfig
    # scan (#469), and checkov OpenAPI/IaC policy (#470). CR's versions
    # never gated merge, so dropping them is zero enforcement loss.
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    trivy:
      enabled: false
    checkov:
      enabled: false
    # Multi-ecosystem SCA (lockfile vuln scan) — kept. Complements, rather
    # than duplicates, the native cargo-audit cron + npm advisory cron
    # (#471) + dependency-review with a cross-ecosystem advisory pass.
    osvScanner:
      enabled: true
    # Markdown grammar and style. The markdown documentation surface
    # (README, CONTRIBUTING, ADRs, docs/, debt/) is load-bearing for the
    # open-source self-hosting audience, so grammar/style signal is worth
    # keeping despite the occasional false positive.
    languagetool:
      enabled: true
chat:
  auto_reply: true
  art: false
knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    project_keys: []
  linear:
    usage: enabled
    team_keys: [UNK]
