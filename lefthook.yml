# Git hooks for Reverie, driven by lefthook (a single Go binary, npm devDep).
#
# One declarative file owns pre-commit, pre-push, and commit-msg. pre-commit
# scopes each tool to the staged files it applies to; pre-push runs the backend
# verification gate; commit-msg runs commitlint and the DCO sign-off check.
#
# glob_matcher: doublestar makes `**` match zero-or-more directories and lets a
# slashless `**/*.ext` pattern match by basename at any depth, including files
# directly under a base dir (e.g. `**/*.rs` matches `backend/src/main.rs`). The
# default gobwas engine would silently skip those, so this key is load-bearing;
# every slashless glob is written as `**/*.ext` to hold the basename-anywhere
# semantics.
glob_matcher: doublestar

# pre-commit splits into two groups by design, not convenience:
#   1. A PIPED (sequential) formatter group. Both oxfmt commands set
#      stage_fixed, which re-stages rewritten files via `git add`. lefthook has
#      no cross-command coordination on the git index, so running two staging
#      commands in parallel races `.git/index.lock` and intermittently aborts an
#      otherwise-valid commit. Sequencing them removes the race. Sequencing also
#      guarantees a formatter never rewrites a file while a reader in group 2 is
#      validating the pre-format bytes.
#   2. A PARALLEL read-only group. Nothing here writes the tree, so they run
#      concurrently for speed.
pre-commit:
  jobs:
    - name: format
      group:
        piped: true
        jobs:
          # Covers every type oxfmt formats except YAML (split out below so the
          # formatter is ordered before yamllint). stage_fixed re-stages the
          # rewrite, so the formatted bytes are what the commit captures.
          # --no-error-on-unmatched-pattern keeps a commit of only ignored files
          # (e.g. a regenerated backend/config.schema.json) a clean no-op.
          - name: oxfmt
            glob: "**/*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,json,jsonc,css,md,mdx,html,toml}"
            run: vp fmt --write --no-error-on-unmatched-pattern {staged_files}
            stage_fixed: true
          # The `&&` orders oxfmt before yamllint within the one command, so the
          # formatter always completes before the linter reads the file
          # regardless of scheduling. Second stage_fixed command, hence in the
          # piped group alongside oxfmt, never parallel with it.
          - name: yaml
            glob: "**/*.{yml,yaml}"
            run: vp fmt --write --no-error-on-unmatched-pattern {staged_files} && yamllint {staged_files}
            stage_fixed: true
    - name: checks
      group:
        parallel: true
        jobs:
          - name: gitleaks
            run: gitleaks protect --staged --no-banner --redact
          - name: markdownlint
            glob: "**/*.md"
            run: vp exec markdownlint-cli2 {staged_files}
          - name: actionlint
            glob: ".github/workflows/**/*.{yml,yaml}"
            run: actionlint -color {staged_files}
          - name: shellcheck
            glob: "**/*.sh"
            run: shellcheck {staged_files}
          - name: hadolint
            glob: "**/Dockerfile*"
            run: hadolint {staged_files}
          - name: typos
            glob: "**/*.{md,rs,ts,tsx,js,jsx,toml}"
            run: typos {staged_files}
          # Advisory and whole-tree: cross-file checks can change a verdict, so
          # it scans frontend/src entirely (no {staged_files}) and never blocks
          # (|| true). The glob only gates WHETHER it runs for this commit.
          - name: impeccable
            glob: "frontend/src/**/*.{ts,tsx,html,css}"
            run: vp run --filter frontend detect || true
          # Each guard self-scopes via its own is_gated(), so one job each is
          # enough; the glob only pre-filters which commits invoke it. no-plan-refs
          # omits Markdown by design (its scope is backend/src + frontend/src).
          - name: no-issue-refs
            glob: "{backend/src/**/*.rs,frontend/src/**/*.{ts,tsx,js,jsx,css},**/*.{md,mdx}}"
            run: just infra::no-issue-refs {staged_files}
          - name: no-plan-refs
            glob: "{backend/src/**/*.rs,frontend/src/**/*.{ts,tsx,js,jsx,css}}"
            run: just infra::no-plan-refs {staged_files}
          - name: vale
            glob: "**/*.{md,mdx}"
            run: vale {staged_files}
          # oxlint and stylelint route through the just recipes for their
          # frontend/ prefix-strip (repo-relative staged paths against a
          # frontend/ CWD). oxlint is type-aware: it loads the whole tsconfig
          # graph for type context but reports only on the {staged_files} passed
          # in, so a commit scans its own staged files (CI's whole-project lint
          # remains the full backstop).
          - name: oxlint
            glob: "frontend/src/**/*.{ts,tsx}"
            run: just js::oxlint {staged_files}
          - name: stylelint
            glob: "frontend/src/**/*.css"
            run: just js::stylelint {staged_files}

# Backend gate, scoped to pushes that touch backend/: the glob gates WHETHER
# each job runs (same pattern as the impeccable pre-commit job); the commands
# themselves still cd into backend and validate the whole crate. CI's backend
# job is path-filtered the same way, so local and CI agree that a docs- or
# frontend-only push owes no cargo build.
# piped: true gives stop-on-first-failure; in the jobs array form, array order is
# the execution order, so fmt -> clippy -> drift means the cheap check fails
# before the heavy clippy and cargo-test builds run on a constrained host.
pre-push:
  piped: true
  jobs:
    - name: backend-fmt
      glob: "backend/**"
      run: cd "$(git rev-parse --show-toplevel)/backend" && cargo fmt --all -- --check
    - name: backend-clippy
      glob: "backend/**"
      run: cd "$(git rev-parse --show-toplevel)/backend" && cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: backend-drift
      glob: "backend/**"
      run: cd "$(git rev-parse --show-toplevel)/backend" && SQLX_OFFLINE=true cargo test --locked --test gen_openapi --test gen_config_ref --test gen_config_schema
      fail_text: "Generated artifacts stale. Regenerate ALL and commit: (cd backend && REGEN=1 cargo test --locked --test gen_openapi --test gen_config_ref --test gen_config_schema)"

# {1} is the commit-message file path git passes to the hook. commitlint config
# lives in package.json and resolves automatically.
commit-msg:
  jobs:
    - name: commitlint
      run: vp exec commitlint --edit {1}
    # Merge commits certify no new work of their own, so they are exempt.
    - name: dco
      run: 'head -n1 {1} | grep -q "^Merge " || grep -Eq "^Signed-off-by: .+ <.+@.+>" {1}'
      fail_text: "Missing Signed-off-by trailer. Commit with git commit -s (see CONTRIBUTING.md, Developer Certificate of Origin)."
