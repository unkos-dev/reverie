name: Set up repository tooling
description: >-
  Install the mise-pinned tools a job needs and, when it runs JS recipes, the
  vp toolchain and the workspace's node dependencies.

  Both pins live here rather than at each call site. A workflow that repeats an
  action pin repeats the work of updating it, and the copies drift silently
  because nothing fails when one of them lags. Renovate reads the annotated
  version comment below through the same custom manager it uses for workflow
  files, so consolidating the pin does not cost visibility.

inputs:
  mise-install-args:
    description: >-
      Tools to install, passed through to mise-action's install_args. Empty
      skips mise entirely.
    required: false
    default: ""
  add-shims-to-path:
    description: >-
      Whether mise shims go on PATH. True suits jobs running from the
      repository root, where mise.toml is a shim's ancestor. Jobs that invoke
      pinned tools from a subdirectory pass false and call mise exec instead.
    required: false
    default: "true"
  vp:
    description: >-
      Whether the job needs the JS workspace. True installs the vp toolchain
      and runs `vp install`, which resolves dependencies under the package
      manager package.json declares.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pinned tools (mise)
      if: inputs.mise-install-args != ''
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
        version: "2026.8.10"
        install_args: ${{ inputs.mise-install-args }}
        add_shims_to_path: ${{ inputs.add-shims-to-path }}

    - name: Install vp
      if: inputs.vp == 'true'
      uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
      with:
        node-manager: true
        cache: true

    # Anchored explicitly: composite steps don't inherit the calling job's
    # default working-directory, and the workspace root is where the lockfile
    # and the package manager declaration live.
    - name: Install workspace
      if: inputs.vp == 'true'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: vp install
