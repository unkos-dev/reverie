name: Install pinned tool
description: >-
  Download a pinned upstream release, verify its SHA256, and install the
  binary to ~/.local/bin. Used for tools that publish official release
  binaries but are not tracked by taiki-e/install-action. The checksum makes
  a version bump without a matching checksum update a loud failure instead of
  silent drift; Renovate updates the version token via the inline annotation
  at each call site but cannot recompute the SHA256, so bump PRs red-X here
  until a reviewer pastes the new checksum.

inputs:
  version:
    description: Upstream release version (no leading v)
    required: true
  url:
    description: Download URL; occurrences of {version} are substituted
    required: true
  sha256:
    description: Expected SHA256 of the downloaded file
    required: true
  binary:
    description: Name the tool is installed as in ~/.local/bin
    required: true
  archive-member:
    description: >-
      Path of the binary inside the downloaded archive. Empty means the
      download is the raw binary itself.
    required: false
    default: ""
  strip-components:
    description: tar --strip-components value when extracting archive-member
    required: false
    default: "0"

runs:
  using: composite
  steps:
    - name: Download, verify, install
      shell: bash
      env:
        TOOL_VERSION: ${{ inputs.version }}
        TOOL_URL: ${{ inputs.url }}
        TOOL_SHA256: ${{ inputs.sha256 }}
        TOOL_BINARY: ${{ inputs.binary }}
        ARCHIVE_MEMBER: ${{ inputs.archive-member }}
        STRIP_COMPONENTS: ${{ inputs.strip-components }}
      # ~/.local/bin is already on the runner-image PATH, so no GITHUB_PATH
      # write is needed, which keeps this clear of zizmor's github-env audit.
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        url="${TOOL_URL//\{version\}/${TOOL_VERSION}}"
        member="${ARCHIVE_MEMBER//\{version\}/${TOOL_VERSION}}"
        # Fail fast on a stalled release server instead of hanging the
        # runner until the job timeout; retry transient failures.
        fetch() {
          curl -fsSL --connect-timeout 10 --max-time 300 \
            --retry 2 --retry-all-errors -o "$1" "$url"
        }
        if [ -z "$member" ]; then
          fetch "$HOME/.local/bin/$TOOL_BINARY"
          echo "$TOOL_SHA256  $HOME/.local/bin/$TOOL_BINARY" | sha256sum -c -
          chmod +x "$HOME/.local/bin/$TOOL_BINARY"
        else
          tmp="$(mktemp -d)"
          fetch "$tmp/archive"
          echo "$TOOL_SHA256  $tmp/archive" | sha256sum -c -
          tar -xf "$tmp/archive" -C "$HOME/.local/bin" \
            --strip-components="$STRIP_COMPONENTS" "$member"
          rm -rf "$tmp"
        fi
