name: Backend

on:
  workflow_call:
    secrets:
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID_RW:
        required: false
      R2_ACCESS_KEY_ID_RO:
        required: false
      R2_SECRET_ACCESS_KEY_RW:
        required: false
      R2_SECRET_ACCESS_KEY_RO:
        required: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # merge_group's default base (HEAD~1) sees only the synthetic merge ref's
          # topmost commit; pin to base_sha to match the PR-against-main diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          # scripts/preflight-scope.sh reads the same file, so the two cannot drift.
          filters: .github/path-filters.yml

  checks:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Debuginfo deliberately absent here: backend/Cargo.toml declares it, so both
      # planes compile the same way without two settings having to agree.
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # A captured runner log is never a terminal, so cargo needs colour forced.
      CARGO_TERM_COLOR: always
      # Belt and braces with the object-read credentials below: a pull request is told
      # not to write to the store main restores from, not just relying on the bucket.
      KACHE_REMOTE_READONLY: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
      # -fmerge-all-constants is deterministic codegen so is safe to allowlist; kache
      # otherwise refuses to cache it and zstd-sys recompiles every run. Set via env,
      # not .kache.toml: these compiles run under ~/.cargo/registry, which the repo
      # is not an ancestor of.
      KACHE_CC_EXTRA_ALLOWLIST_FLAGS: -fmerge-all-constants
      # Fork PRs have no repository secrets, so the remote doesn't exist for them; they
      # fall back to the target/ tarball. In job env, since secrets reach env/with, not if.
      R2_CONFIGURED: ${{ secrets.R2_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # sqlx-cli must track the sqlx crate version, or `cargo sqlx prepare --check`
      # validates against a cache built by a mismatched proc-macro.
      - name: sqlx-cli pin matches sqlx crate version
        run: |
          crate="$(yq -p toml -o yaml '.dependencies.sqlx.version // .dependencies.sqlx' Cargo.toml)"
          cli="$(yq -p toml -o yaml '.tools."cargo:sqlx-cli".version' ../mise.toml)"
          case "$crate" in
            [0-9]*.[0-9]*) ;;
            *)
              echo "::error file=backend/Cargo.toml::could not parse sqlx crate version (got '$crate'); the dependency shape may have changed — update this guard"
              exit 1
              ;;
          esac
          if [ "$crate" != "$cli" ]; then
            echo "::error file=mise.toml::sqlx-cli pin ($cli) != sqlx crate version ($crate in backend/Cargo.toml) — keep the cli pin in lockstep with the crate"
            exit 1
          fi
          echo "sqlx-cli pin ($cli) matches sqlx crate ($crate)"

      # Shims stay off for the whole job: rustc links a registry dependency from
      # ~/.cargo/registry, which has no mise.toml above it for a shim to resolve
      # against. Steps needing a mise tool run under `mise exec` instead.
      - uses: ./.github/actions/setup
        with:
          mise-install-args: just
          add-shims-to-path: "false"

      - name: Backend static guards
        working-directory: ${{ github.workspace }}
        run: mise exec just -- just rust::guards

      # Components are scoped per job; this one installs clippy and rustfmt for linting.
      - id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
          # A fork has no store credentials and falls back to caching target/ instead
          # (a cold compile once the last full-target generation expires). Tracked in
          # debt/2026-07-26-fork-pr-cache-fallback.md.
          cache-targets: ${{ secrets.R2_ACCOUNT_ID == '' }}
          # Restore-only on PR branches: the 10 GiB repo quota can't hold per-branch
          # copies of the gigabyte-scale rust caches without evicting others.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Content-addressed compile cache in R2, keyed per crate. See
      # docs/adr/0043-remote-rust-build-cache-on-object-storage.md.
      #
      # Write credentials are reserved for pushes to main; a PR gets object-read keys.
      #
      # Digest pinned past v1, the action's only tag: GitHub silently drops an
      # undeclared input rather than erroring, so check any new input against
      # action.yml at this revision. The trailing comment names the branch on
      # its own because Renovate reads it as the ref to resolve.
      - name: Remote build cache (kache)
        if: env.R2_CONFIGURED == 'true'
        uses: kunobi-ninja/kache-action@1a33fb2ff51be23eb9e87abeae6edb65be78f71c # main
        with:
          # renovate: datasource=github-releases depName=kunobi-ninja/kache extractVersion=^v(?<version>.+)$
          version: "0.28.1"
          s3-bucket: reverie-ci-cache
          s3-region: auto
          s3-endpoint: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          s3-access-key-id: ${{ github.ref == 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID_RW || secrets.R2_ACCESS_KEY_ID_RO }}
          s3-secret-access-key: ${{ github.ref == 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY_RW || secrets.R2_SECRET_ACCESS_KEY_RO }}
          # github-cache would refill the 10 GiB quota this cache exists to
          # escape; pr-comment needs `pull-requests: write`, not granted here.
          github-cache: false
          pr-comment: false
          # Explicit despite being the current Linux default: that default rests on
          # platform debug-info placement, not a caching guarantee.
          cache-executables: true
          # Shards make prefetch useful; unset, hits arrive one at a time. Keyed on
          # build configuration, not job name, so a toolchain bump rotates it rather
          # than warming shards for artifacts that no longer exist.
          manifest-key: x86_64-unknown-linux-gnu/${{ steps.rust.outputs.version }}/dev
          namespace: x86_64-unknown-linux-gnu/${{ steps.rust.outputs.version }}/dev

      # kache degrades quietly by design: it compiles for real when the store is
      # unreachable and still exits 0, so a mistyped secret would leave every job
      # uncached and green forever. Assert the remote resolved before depending on it.
      - name: Verify the remote cache resolved
        if: env.R2_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          stats="$(kache stats 2>&1 || true)"
          printf '%s\n' "${stats}"
          remote="$(printf '%s\n' "${stats}" | grep -m1 'Remote:' || true)"
          if [ -z "${remote}" ]; then
            echo "kache stats reported no Remote line; the output shape changed and this check can no longer tell configured from not" >&2
            exit 1
          fi
          case "${remote}" in
            *"not configured"*)
              echo "kache has no remote configured: the S3 inputs did not reach it, so this job would compile uncached and still pass" >&2
              exit 1
              ;;
          esac

      - name: Check formatting
        run: cargo fmt --check

      # Must land before the first linking cargo invocation (sqlx-cli below), since
      # job-level RUSTFLAGS routes every link through mold.
      - uses: ./.github/actions/setup
        with:
          mise-install-args: mold github:bnjbvr/cargo-machete
          add-shims-to-path: "false"

      # The cargo backend reads version, features and the no-lock exception from
      # mise.toml. It rebuilds PATH for the install, so use the system linker.
      - name: Install sqlx-cli
        working-directory: ${{ github.workspace }}
        env:
          RUSTFLAGS: ""
        run: mise install --locked cargo:sqlx-cli

      - name: Unused dependencies (cargo-machete)
        run: mise exec github:bnjbvr/cargo-machete -- cargo machete

      - name: Lint
        run: mise exec mold cargo:sqlx-cli -- bash ../scripts/postgres-provision.sh schema -- cargo clippy --workspace --all-targets --locked -- -D warnings

      # Without --document-private-items the scope is pub items only, matching the
      # Tier 1 comment-policy surface.
      - name: Doc lint (broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: mise exec mold cargo:sqlx-cli -- bash ../scripts/postgres-provision.sh schema -- cargo doc --locked --no-deps --workspace

      - name: Check sqlx query cache freshness
        run: mise exec mold cargo:sqlx-cli -- bash ../scripts/postgres-provision.sh schema -- cargo sqlx prepare --check -- --locked --tests

      - name: Check the schema dump against the migrations
        working-directory: ${{ github.workspace }}
        run: mise exec just cargo:sqlx-cli -- just rust::schema-check

      # nextest does not run doctests; Reverie has none today, so this exists to fail
      # CI from day one on doctest drift.
      - name: Doctests
        env:
          SQLX_OFFLINE: "true"
        run: mise exec mold -- bash ../scripts/postgres-provision.sh test -- cargo test --locked --doc --workspace

      # The cache action's post step runs from $GITHUB_WORKSPACE, which has no
      # Cargo.lock (the crate root is backend/), so it skips this upload itself.
      # Tracked in debt/2026-07-26-kache-shard-upload-step.md.
      - name: Upload prefetch shards
        if: env.R2_CONFIGURED == 'true' && github.ref == 'refs/heads/main'
        run: kache save-manifest

  # Kept off the checks job's serial critical path.
  tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # See the checks job.
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
          # Restore-only on PR branches; see the checks job's cache step.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Shims stay off here for the same reason as the checks job.
      - uses: ./.github/actions/setup
        with:
          mise-install-args: mold github:nextest-rs/nextest
          add-shims-to-path: "false"

      - name: Test
        env:
          SQLX_OFFLINE: "true"
        run: mise exec mold github:nextest-rs/nextest -- bash ../scripts/postgres-provision.sh test -- cargo nextest run --locked --workspace
