name: PR labeler

# Runs from the base branch so the config on main is authoritative (fork-safe).
# Applies labels defined in .github/labeler.yml based on changed files.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

# Coalesce rapid synchronize events on the same PR; only the latest
# changed-file set needs labeling.
concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull_request_target runs with a write-capable token in the base-repo
    # context; scope the write to this job alone rather than the workflow.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Additive only. sync-labels removes any label named in labeler.yml that
      # the changed paths do not match, and it cannot tell a stale path label
      # from one another actor set deliberately. Both `security` and
      # `dependencies` are path rules here and are also applied by Renovate and
      # by hand, so syncing strips them from exactly the pull requests that
      # need them: a vulnerability PR touches only a lockfile, matches no
      # security path, and loses the label minutes after Renovate sets it. The
      # cost of turning this off is a path label that lingers after a file is
      # dropped from a PR, which is the cheaper failure.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
