name: PR labeler

# Runs from the base branch so the config on main is authoritative (fork-safe).
# Applies labels defined in .github/labeler.yml based on changed files.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

# Coalesce rapid synchronize events on the same PR; only the latest
# changed-file set needs labeling.
concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pull_request_target runs with a write-capable token in the base-repo
    # context; scope the write to this job alone rather than the workflow.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
