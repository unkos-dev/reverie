name: PR labeler

# Runs from the base branch so the config on main is authoritative (fork-safe).
# Applies labels defined in .github/labeler.yml based on changed files.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    # pull_request_target runs with a write-capable token in the base-repo
    # context; scope the write to this job alone rather than the workflow.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
