name: Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      iac: ${{ steps.filter.outputs.iac }}
      openapi: ${{ steps.filter.outputs.openapi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # merge_group's default base (HEAD~1) sees only the synthetic merge ref's
          # topmost commit; pin to base_sha to match the PR-against-main diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          # scripts/preflight-scope.sh reads the same file, so the two cannot drift.
          filters: .github/path-filters.yml

  sast:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout opengrep-rules (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: opengrep/opengrep-rules
          ref: f1d2b562b414783763fd02a6ed2736eaed622efa
          path: .opengrep-rules
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mise-install-args: opengrep

      # Tests are not excluded wholesale (a blanket file drop is a coverage blind
      # spot); a legitimate insecure-API test gets a call-site `// nosemgrep:
      # <rule-id>` carve-out instead.
      #
      # rust.lang.security.args is excluded: main.rs reads argv for CLI subcommand
      # dispatch, not a security decision, and the rule can't tell the difference.
      # Its ID prefix derives from the rules-checkout path above — keep the two in
      # lockstep or the exclusion silently stops matching.
      - name: Scan source (gating)
        run: |
          set -euo pipefail
          opengrep scan \
            --config .opengrep-rules/rust/lang/security \
            --config .opengrep-rules/typescript/lang/security \
            --config .opengrep-rules/typescript/react/security \
            --exclude-rule opengrep-rules.rust.lang.security.args \
            --error \
            backend/src frontend/src

  iac:
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mise-install-args: trivy

      - name: Scan IaC for misconfigurations (gating)
        run: |
          set -euo pipefail
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs node_modules,frontend/node_modules,docs/node_modules,backend/target \
            --skip-dirs .github \
            .

  # Lints the generated spec against every oas and owasp rule it already
  # satisfies. Which rules those are, and why the rest are off, is .vacuum.yaml.
  openapi:
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mise-install-args: vacuum

      - name: Lint OpenAPI spec (gating)
        # info, not the default error: the strict security rule reports at info,
        # so a higher threshold would let a newly-public write endpoint pass.
        # The baseline is zero findings at every severity, so nothing else moves.
        run: >-
          vacuum lint --ruleset .vacuum.yaml --ignore-file .vacuum-ignore.yaml
          --fail-severity info --details docs/openapi.json

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the pull_request scan below can walk the whole branch
          # range, not just the tip commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mise-install-args: gitleaks

      # On a pull_request, scan every commit the branch introduces: a secret added
      # and later removed within the branch is gone from the working tree but stays
      # readable in the pushed history. push/merge_group falls back to a full-tree
      # scan.
      - name: Scan for secrets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA}" ]; then
            gitleaks git . --no-banner --redact --log-opts "${PR_BASE_SHA}..HEAD"
          else
            gitleaks dir . --no-banner --redact
          fi
