name: Scorecard supply-chain security

# OpenSSF Scorecard — automated, objective scoring of the repo's
# supply-chain security posture (branch protection, pinned dependencies,
# signed releases, SAST presence, token permissions, dangerous-workflow
# patterns, …). Results upload to the code-scanning dashboard and, with
# `publish_results: true`, to the public OpenSSF API that backs the
# README badge. Unlike a self-attested checklist, the score is recomputed
# from repo state on every run — it cannot be faked.

on:
  # Re-score whenever a branch protection rule changes — protection
  # posture is a heavily-weighted Scorecard check, so a rule edit should
  # refresh the grade promptly rather than waiting for the weekly cron.
  branch_protection_rule:
  schedule:
    # Weekly, 23:23 UTC Tuesday (~07:23 Wednesday Perth). Off-peak and
    # off the top of the hour to dodge runner contention; deliberately
    # not on Sunday 17:37 where CodeQL's weekly scan already sits.
    - cron: "23 23 * * 2"
  push:
    branches: [main]

# Least privilege at the top; the analysis job widens to exactly the two
# write scopes it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Read repo contents for checkout. A public repo would clone fine
      # even at `contents: none` (OSSF's template omits this for public
      # repos), but stating it explicitly matches codeql.yml's job-level
      # block and keeps the workflow correct if the repo ever goes private.
      contents: read
      # Upload the SARIF result into the code-scanning dashboard.
      security-events: write
      # Mint the OIDC token Scorecard uses to publish results to the
      # public OpenSSF API (required for the badge + `publish_results`).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Scorecard reads repo metadata via the API, not the checked-out
          # credentials; persisting them would needlessly widen the token
          # surface the run exposes.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF API so the README badge resolves.
          # Public-repo scores are public by design.
          publish_results: true

      # Retain the raw SARIF as a build artifact for inspection even when
      # the code-scanning upload below is rate-limited or unavailable.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: results.sarif
