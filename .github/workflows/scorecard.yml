name: Scorecard supply-chain security

# OpenSSF Scorecard — recomputed supply-chain security score.

on:
  # Protection posture is a heavily-weighted Scorecard check, so re-score on change.
  branch_protection_rule:
  schedule:
    # Off-peak and off CodeQL's weekly slot (Sunday 17:37 UTC), to dodge runner contention.
    - cron: "23 23 * * 2"
  push:
    branches: [main]

# Kept narrow in case a future job is added without its own permissions block.
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the SARIF result into the code-scanning dashboard.
      security-events: write
      # Mint the OIDC token Scorecard uses to publish to the public OpenSSF API.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Scorecard reads repo metadata via the API, not checked-out credentials.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Public-repo scores are public by design; this is how the README badge resolves.
          publish_results: true

      # Retain raw SARIF even if the code-scanning upload below is unavailable.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif
