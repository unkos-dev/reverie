name: Scorecard supply-chain security

# OpenSSF Scorecard — recomputed supply-chain security score. Results
# upload to the code-scanning dashboard and, with publish_results, to the
# public OpenSSF API that backs the README badge.

on:
  # Re-score whenever a branch protection rule changes — protection
  # posture is a heavily-weighted Scorecard check, so a rule edit should
  # refresh the grade promptly rather than waiting for the weekly cron.
  branch_protection_rule:
  schedule:
    # Weekly, 23:23 UTC Tuesday (~07:23 Wednesday Perth). Off-peak and
    # off the top of the hour to dodge runner contention; deliberately
    # not on Sunday 17:37 where CodeQL's weekly scan already sits.
    - cron: "23 23 * * 2"
  push:
    branches: [main]

# The job declares its own permissions block, which fully overrides this —
# kept narrow for correctness if a future job is added without its own.
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the SARIF result into the code-scanning dashboard.
      security-events: write
      # Mint the OIDC token Scorecard uses to publish results to the
      # public OpenSSF API (required for the badge + publish_results).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Scorecard reads repo metadata via the API, not the checked-out
          # credentials; persisting them would needlessly widen the token
          # surface the run exposes.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public OpenSSF API so the README badge resolves.
          # Public-repo scores are public by design.
          publish_results: true

      # Retain the raw SARIF as a build artifact for inspection even when
      # the code-scanning upload below is rate-limited or unavailable.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: results.sarif
