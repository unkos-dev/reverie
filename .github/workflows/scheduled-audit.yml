name: Scheduled advisory scan

# ci.yml's checks only fire on dependency-file changes, so a newly-disclosed
# advisory against an unchanged lockfile is invisible there. These crons
# re-scan daily as a deterministic backstop to Renovate's reactive alerts.
on:
  schedule:
    # Off-peak, clear of the Renovate schedule windows in .github/renovate.json.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-audit
  cancel-in-progress: true

jobs:
  advisories:
    name: Advisory scan (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cargo-deny (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.6"
          install_args: github:EmbarkStudios/cargo-deny

      # Advisories only; license/bans/sources policy is checked PR-time (ci.yml).
      - name: Check advisories
        run: cargo deny check advisories

  # npm counterpart of the cargo-deny cron. Full tree including devDependencies:
  # a compromised dev tool has the same repo write access as a runtime one.
  npm-advisories:
    name: Advisory scan (dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install node (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.6"
          install_args: node
          add_shims_to_path: true

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-manager: false
          cache: false

      # One root lockfile covers every workspace project. `--` passes the
      # severity threshold through vp to the package manager; without it vp
      # rejects the flag as its own.
      - name: Audit the lockfile
        run: vp pm audit -- --audit-level=high

  # Distro-layer CVEs drift after publish; the publish-time trivy gate only
  # sees what was known at build time, so re-scan daily.
  image-advisories:
    name: Advisory scan (published image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      issues: write # open/comment a failure alert (see final step)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install trivy (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.6"
          install_args: trivy

      # --platform is load-bearing: :main is an arm64-only manifest list, and
      # trivy otherwise resolves it against this amd64 host and errors before
      # analyzing anything (layer analysis, not execution, so the pin is safe).
      - name: Scan published :main image
        run: |
          set -euo pipefail
          trivy image \
            --platform linux/arm64 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            ghcr.io/unkos-dev/reverie:main

      # Red cron runs are easy to miss; an open issue is not.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Published image advisory scan failed"
          n=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Recurred: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "The daily trivy scan of ghcr.io/unkos-dev/reverie:main found a fixable HIGH/CRITICAL CVE (or the scan errored). Review the run log: ${RUN_URL}. Remediation is usually a base-image or dependency bump followed by a main push to republish."
          fi

  # The SBOM is a published deliverable rather than a security control, so
  # nothing gates on it and a defect cannot fail a release. It still has to be
  # accurate, and every way it has broken so far emits a structurally valid
  # document and exits 0. This job is what makes that failure visible: it reads
  # the verdict the image build recorded beside the document, and separately
  # confirms the Rust half is present at all.
  sbom-integrity:
    name: SBOM integrity (published image)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      issues: write # open/comment a failure alert (see final step)
    env:
      IMAGE: ghcr.io/unkos-dev/reverie:main
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --platform matches the trivy job above: :main is an arm64-only manifest
      # list. `create` + `cp` never executes the image, so pulling a foreign
      # architecture onto this amd64 host is safe — the file is copied out of
      # the container's filesystem, not read by anything running inside it.
      - name: Read the build's own SBOM verdict
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 --quiet "$IMAGE"
          c=$(docker create --platform linux/arm64 "$IMAGE")
          trap 'docker rm -f "$c" > /dev/null' EXIT
          docker cp "$c:/usr/share/reverie/sbom/verify.txt" verdict.txt
          verdict=$(cat verdict.txt)
          echo "verdict: ${verdict}"
          case "$verdict" in
            OK\ *) ;;
            *) echo "::error::The frontend SBOM failed its own consistency check at build time: ${verdict}"; exit 1 ;;
          esac

      # cargo-auditable embeds the crate list into the release binary, and it is
      # the only reason any crate appears in the image SBOM — there is no
      # Cargo.lock in the runtime image to scan. Dropping the wrapper from the
      # build leaves a working binary, a green build, and an SBOM missing most
      # of the application. Presence is the whole check: the realistic failure
      # is binary, the section is embedded or it is not.
      - name: Confirm the SBOM still describes the Rust binary
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" \
            --format '{{ json .SBOM }}' > sbom.json
          jq -e '. != null' sbom.json > /dev/null \
            || { echo "::error::${IMAGE} carries no SBOM attestation"; exit 1; }
          crates=$(jq '[.. | objects | select(.referenceType == "purl")
            | .referenceLocator | select(startswith("pkg:cargo/"))] | length' sbom.json)
          echo "cargo components: ${crates}"
          if [ "$crates" -eq 0 ]; then
            echo "::error::${IMAGE} lists no cargo components. The release binary is probably no longer built with \`cargo auditable\`, so every crate is absent from its SBOM."
            exit 1
          fi

      # Red cron runs are easy to miss; an open issue is not.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Published SBOM is inaccurate"
          n=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Recurred: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "The SBOM published with ghcr.io/unkos-dev/reverie:main no longer describes what the image ships. Nothing is gated on this and no release is blocked, but the document is a published deliverable and is currently wrong. Review the run log: ${RUN_URL}. The verdict text names which check failed; the checks themselves live in the \`frontend-sbom\` stage of the Dockerfile."
          fi

  # gitleaks (hot path) only sees the working tree / PR diff; this cron
  # sweeps full history daily.
  trufflehog:
    name: Secret history sweep (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open/comment a failure alert (see final step)
    steps:
      # persist-credentials: false keeps GITHUB_TOKEN out of .git/config,
      # which a full-history scan would otherwise surface.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog full-history scan
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          # Pin the image (default is :latest).
          # renovate: datasource=github-releases depName=trufflesecurity/trufflehog extractVersion=^v(?<version>.+)$
          version: "3.97.0"
          # verified-only: unverifiable test DSNs would red the cron daily as
          # noise; a real live leak still verifies.
          extra_args: --results=verified

      # THREAT: never copy findings into the issue body — a detected secret
      # must not be re-leaked into readable text; link the run log instead.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="TruffleHog secret history sweep failed"
          n=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Recurred: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "Scheduled TruffleHog full-history sweep failed (verified secret found, or scan error). Findings are NOT copied here to avoid re-leaking secrets; review the access-controlled run log: ${RUN_URL}"
          fi
