name: Scheduled advisory scan

# A newly-disclosed advisory against an unchanged lockfile is invisible to
# the PR-triggered checks in ci.yml, which only fire when dependency files
# change. These crons re-scan the committed lockfiles daily so a fresh
# advisory surfaces within a day even with zero dependency churn. Renovate's
# vulnerability alerts cover the same ground reactively; this is the
# deterministic backstop.
on:
  schedule:
    # 18:00 UTC daily (02:00 Australia/Perth) — off-peak, clear of the
    # Renovate schedule windows in .github/renovate.json.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-audit
  cancel-in-progress: true

env:
  # Own copy: this workflow does not share ci.yml's env. Kept in lockstep
  # with ci.yml's pins by the vite-plus Renovate group and the repo-lint
  # drift guard.
  # renovate: datasource=npm depName=vite-plus
  VP_VERSION: "0.2.4"
  # renovate: datasource=node-version depName=node
  NODE_VERSION: "24.18.0"

jobs:
  advisories:
    name: Advisory scan (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Same pin as ci.yml's audit job; Renovate keeps both in lockstep.
      # fallback:none fails closed rather than silently switching the
      # install source of a security scanner.
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-deny@0.19.8
          fallback: none

      # Advisories only: the license/bans/sources policy is PR-time
      # (ci.yml's audit job), so a red run here unambiguously means a new
      # advisory, not a policy edit.
      - name: Check advisories
        run: cargo deny check advisories

  # npm counterpart of the cargo-deny cron. `npm audit` queries the
  # registry's bulk-advisory endpoint from the lockfile alone — no install
  # needed. Full tree including devDependencies: a compromised dev tool runs
  # with repo write access locally and in CI, so its advisories matter as
  # much as runtime ones. --audit-level=high keeps the red-run signal
  # meaningful in npm's noisier advisory ecosystem.
  npm-advisories:
    name: Advisory scan (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          version: ${{ env.VP_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cache: false

      # One root lockfile covers all workspaces.
      - name: Audit npm lockfile
        run: npm audit --audit-level=high

  # The lockfile crons above cover application dependencies, but the
  # published image also carries distro layers whose CVEs drift after
  # publish — the publish-time trivy gate only sees what was known at
  # build time. Re-scan the tag staging consumes so a newly-disclosed
  # fixable HIGH/CRITICAL surfaces within a day.
  image-advisories:
    name: Advisory scan (published image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      issues: write # open/comment a failure alert (see final step)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep this pin in lockstep with ci.yml's and docker-publish.yml's.
      - name: Install trivy
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
          version: "0.72.0"
          sha256: "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460"
          url: "https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_Linux-64bit.tar.gz"
          binary: trivy
          archive-member: trivy

      # Same gate posture as the publish-time scan: fixable HIGH/CRITICAL
      # only — unfixed CVEs would red the cron daily with no action
      # available. --platform is load-bearing: :main is an arm64-only
      # manifest list and trivy otherwise resolves it against this amd64
      # scanner host and errors before analyzing anything (cross-platform
      # scanning is layer analysis, not execution, so the pin is safe).
      - name: Scan published :main image
        run: |
          set -euo pipefail
          trivy image \
            --platform linux/arm64 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            ghcr.io/unkos-dev/reverie:main

      # Same alert shape as the trufflehog job below: red cron runs are
      # easy to miss, an open issue is not.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Published image advisory scan failed"
          n=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Recurred: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "The daily trivy scan of ghcr.io/unkos-dev/reverie:main found a fixable HIGH/CRITICAL CVE (or the scan errored). Review the run log: ${RUN_URL}. Remediation is usually a base-image or dependency bump followed by a main push to republish."
          fi

  # gitleaks (hot path) only sees the working tree / PR diff. This cron
  # sweeps full history daily so a history-buried or freshly-disclosed
  # secret surfaces within a day.
  trufflehog:
    name: Secret history sweep (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open/comment a failure alert (see final step)
    steps:
      # persist-credentials: false keeps GITHUB_TOKEN out of .git/config,
      # which a full-history scan would otherwise surface.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog full-history scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          # Pin the image (default is :latest); Renovate keeps it in
          # lockstep with the action SHA via the annotation below.
          # renovate: datasource=github-releases depName=trufflesecurity/trufflehog extractVersion=^v(?<version>.+)$
          version: "3.95.9"
          # verified-only: example/test Postgres DSNs error verification and
          # would red the cron daily as noise; a real live leak still
          # verifies. No base:/head: so the schedule run scans full history.
          extra_args: --results=verified

      # A failed sweep otherwise only surfaces as a red run + GitHub's
      # default email. The issue body links the access-controlled run log
      # and never copies findings, so a detected secret is not re-leaked
      # into a readable issue. Deduped: comment on the open alert instead
      # of one issue per day.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="TruffleHog secret history sweep failed"
          n=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Recurred: ${RUN_URL}"
          else
            gh issue create --title "$title" --body "Scheduled TruffleHog full-history sweep failed (verified secret found, or scan error). Findings are NOT copied here to avoid re-leaking secrets; review the access-controlled run log: ${RUN_URL}"
          fi
