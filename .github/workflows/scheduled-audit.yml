name: Scheduled advisory scan

# A newly-disclosed RustSec advisory against an unchanged Cargo.lock is
# invisible to the PR-triggered `audit` job in ci.yml, which only fires when
# dependency or workflow files change. This cron re-runs the advisory half of cargo-deny
# against the committed lockfile so a freshly-published advisory surfaces
# within a day even with zero dependency churn. Renovate's vulnerability alerts
# cover the same ground reactively; this is the deterministic backstop. The
# former standalone `cargo audit` step was retired in #427 when cargo-deny took
# over advisory coverage, so this cron runs `cargo deny check advisories`
# rather than `cargo audit` (UNK-327).
on:
  schedule:
    # 18:00 UTC daily (02:00 Australia/Perth) — off-peak, clear of the Renovate
    # schedule windows in .github/renovate.json.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-audit
  cancel-in-progress: true

jobs:
  advisories:
    name: Advisory scan (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      # Read-only job (lockfile scan) — keep the token out of .git/config.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Prebuilt cargo-deny via install-action, mirroring the `audit` job in
      # ci.yml. Version pinned; Renovate's install-action customManager keeps
      # both occurrences in lockstep. fallback:none fails closed if no prebuilt
      # is available rather than silently switching install source.
      - uses: taiki-e/install-action@9bcaee1dcae34154180f412e2fa69355a7cda9f6 # v2
        with:
          tool: cargo-deny@0.19.8
          fallback: none

      # Advisories only. The license/bans/sources policy is a PR-time concern
      # already enforced by ci.yml's `audit` job; this cron exists solely to
      # catch newly-disclosed advisories against the static lockfile, so
      # scoping to the advisories check keeps a red run unambiguous — it means
      # a new advisory, not a policy edit.
      - name: Check advisories
        run: cargo deny check advisories

  # UNK-378: npm counterpart of the cargo-deny advisory cron above. A newly
  # disclosed npm advisory against an unchanged lockfile is invisible to
  # PR-time checks (dependency-review-action only diffs PR-introduced deps),
  # so this scans all three committed npm lockfiles daily. `npm audit`
  # queries the registry's bulk-advisory endpoint from the lockfile alone —
  # no install needed. Full tree including devDependencies: a compromised
  # dev tool runs with repo write access locally and in CI, so its
  # advisories matter as much as runtime ones. --audit-level=high keeps the
  # red-run signal meaningful in npm's noisier advisory ecosystem (the
  # license policy is PR-time in ci.yml's npm-license job — licenses have
  # no temporal drift).
  npm-advisories:
    name: Advisory scan (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.16.0

      - name: Audit npm lockfiles
        run: |
          set -euo pipefail
          rc=0
          for tree in . frontend docs; do
            echo "::group::npm audit (${tree})"
            # Audit every tree before failing so one finding doesn't mask
            # another tree's report.
            (cd "$tree" && npm audit --audit-level=high) || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  # gitleaks (hot path) only sees the working tree / PR diff. This cron
  # sweeps full history daily so a history-buried or freshly-disclosed secret
  # surfaces within a day.
  trufflehog:
    name: Secret history sweep (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # persist-credentials: false keeps GITHUB_TOKEN out of .git/config,
      # which a full-history scan would otherwise surface.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog full-history scan
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          # Pin the image (default is :latest). renovate keeps this in lockstep
          # with the action SHA via the customManager keyed to this annotation.
          # renovate: datasource=github-releases depName=trufflesecurity/trufflehog extractVersion=^v(?<version>.+)$
          version: "3.95.6"
          # verified + unknown (verification errored) so the daily history
          # sweep stays low-noise without dropping unconfirmable hits; gitleaks
          # only sees the PR diff, not history. No base:/head: so the run scans
          # full history without tripping the base==head guard.
          extra_args: --results=verified,unknown
