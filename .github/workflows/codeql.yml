name: CodeQL

on:
  # PR, push and merge-queue runs arrive through ci.yml's caller. Direct
  # triggers for those events would double every scan under clashing check
  # names; the weekly deep scan has no caller and keeps its own.
  workflow_call:
  schedule:
    # Off-peak, off top-of-the-hour, to dodge runner contention.
    - cron: "37 17 * * 0"

permissions:
  contents: read

# Inert under the caller, whose group governs composed runs; kept because it
# still guards the direct weekly schedule. Never cancel main-branch runs: it
# would drop that commit's code-scanning results.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Gates the analyze jobs on push only. PR and merge-queue runs analyze every
  # language: the ruleset's code-scanning rule expects per-category results, so
  # a skipped analyzer blocks the PR forever.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            javascript-typescript:
              - 'frontend/**'
              - '**/*.html'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            rust:
              - 'backend/**'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'

  actions:
    # Always runs — guarantees a CodeQL result exists for every commit.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # actions: read lets the extractor fetch referenced workflows.
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: actions
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:actions

  javascript-typescript:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.javascript-typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:javascript-typescript

  rust:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: rust
          # The Rust extractor (beta) pins Rust to `none` and rejects
          # manual/autobuild; it invokes cargo internally.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:rust
