name: CodeQL

on:
  # PR, push and merge-queue runs arrive through ci.yml's caller. Direct
  # triggers for those events would double every scan under clashing check
  # names; the weekly deep scan has no caller and keeps its own.
  workflow_call:
    secrets:
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID_RW:
        required: false
      R2_ACCESS_KEY_ID_RO:
        required: false
      R2_SECRET_ACCESS_KEY_RW:
        required: false
      R2_SECRET_ACCESS_KEY_RO:
        required: false
  schedule:
    # Off-peak, off top-of-the-hour, to dodge runner contention.
    - cron: "37 17 * * 0"

permissions:
  contents: read

# Inert under the caller, whose group governs composed runs; kept because it
# still guards the direct weekly schedule. Never cancel main-branch runs: it
# would drop that commit's code-scanning results.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'schedule'
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          filters: |
            javascript-typescript:
              - 'frontend/**'
              # The extractor file types this repository has or plausibly will,
              # matched repo-wide so a file added outside frontend/ cannot fall
              # out of coverage. Left out on purpose: the template and embedded
              # HTML types (.vue, .hbs, .ejs, .njk, .erb, .jsp, .dot), the
              # legacy JavaScript spellings (.es6, .es, .xsjs, .xsjslib), and
              # JSON and YAML, since '**/*.yml' would scan on every workflow
              # edit.
              - '**/*.html'
              - '**/*.htm'
              - '**/*.xhtml'
              - '**/*.xhtm'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.mts'
              - '**/*.cts'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            rust:
              # The crate, its manifests, lockfile and toolchain files all live
              # under backend/, so no root Cargo, lockfile or toolchain pattern
              # selects Rust.
              - 'backend/**'
              - '.github/actions/rust-toolchain/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'

  actions:
    # Always runs — guarantees a CodeQL result exists for every commit.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # actions: read lets the extractor fetch referenced workflows.
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:actions

  javascript-typescript:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.javascript-typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

  rust:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    env:
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: -test
      CARGO_INCREMENTAL: 0
      KACHE_REMOTE_READONLY: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
      KACHE_CC_EXTRA_ALLOWLIST_FLAGS: -fmerge-all-constants
      R2_CONFIGURED: ${{ secrets.R2_ACCOUNT_ID != '' }}
    steps:
      - name: Validate remote cache credentials
        if: env.R2_CONFIGURED == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ github.ref == 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID_RW || github.ref != 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID_RO || '' }}
          R2_SECRET_ACCESS_KEY: ${{ github.ref == 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY_RW || github.ref != 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY_RO || '' }}
          R2_CREDENTIAL_SUFFIX: ${{ github.ref == 'refs/heads/main' && 'RW' || 'RO' }}
        run: |
          missing=0
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "::error::Missing R2_ACCESS_KEY_ID_${R2_CREDENTIAL_SUFFIX} for the configured remote cache"
            missing=1
          fi
          if [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::Missing R2_SECRET_ACCESS_KEY_${R2_CREDENTIAL_SUFFIX} for the configured remote cache"
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Remote build cache (kache)
        if: env.R2_CONFIGURED == 'true'
        uses: kunobi-ninja/kache-action@1a33fb2ff51be23eb9e87abeae6edb65be78f71c # main
        with:
          # renovate: datasource=github-releases depName=kunobi-ninja/kache extractVersion=^v(?<version>.+)$
          version: "1.0.0"
          s3-bucket: reverie-ci-cache
          s3-region: auto
          s3-endpoint: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          s3-access-key-id: ${{ github.ref == 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID_RW || secrets.R2_ACCESS_KEY_ID_RO }}
          s3-secret-access-key: ${{ github.ref == 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY_RW || secrets.R2_SECRET_ACCESS_KEY_RO }}
          github-cache: false
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          pr-comment: false
          cache-executables: true
          manifest-key: x86_64-unknown-linux-gnu/${{ steps.rust.outputs.version }}/codeql
          namespace: x86_64-unknown-linux-gnu/${{ steps.rust.outputs.version }}/codeql
          # kache compiles uncached and still exits 0 when the remote does not
          # resolve; strict turns every action warning, including a daemon remote
          # the action cannot verify, into a step failure.
          strict: true

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
          # The Rust extractor (beta) pins Rust to `none` and rejects
          # manual/autobuild; it invokes cargo internally.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        env:
          RUST_LOG: single_arch_extractor=info,codeql_extractor=info,codeql_rust=info,ra_ap_load_cargo=debug
        with:
          category: /language:rust

      - name: Macro expansion coverage (temporary diagnostic)
        if: always()
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
        run: |
          set -euo pipefail
          db="${RUNNER_TEMP}/codeql_databases/rust"
          pack="$(find "$(dirname "${CODEQL}")/qlpacks/codeql/rust-queries" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          mkdir -p "${pack}/reverie-diag"
          cat > "${pack}/reverie-diag/coverage.ql" <<'QL'
          import rust

          predicate firstParty(AstNode n) {
            n.getLocation().getFile().getRelativePath().matches("backend/src/%")
          }

          from string category, string name, int total, int expanded
          where
            category = "macro call" and
            name = any(MacroCall mc | firstParty(mc)).getPath().toString() and
            total = count(MacroCall mc | firstParty(mc) and mc.getPath().toString() = name) and
            expanded =
              count(MacroCall mc |
                firstParty(mc) and mc.getPath().toString() = name and mc.hasMacroCallExpansion()
              )
            or
            category = "derive" and
            name = "type items" and
            total = count(TypeItem t | firstParty(t)) and
            expanded = count(TypeItem t | firstParty(t) and t.getNumberOfDeriveMacroExpansions() > 0)
            or
            category = "attribute macro" and
            name = "items" and
            total = count(Item i | firstParty(i)) and
            expanded = count(Item i | firstParty(i) and i.hasAttributeMacroExpansion())
          select category, name, total, expanded order by category, total desc
          QL
          cat > "${pack}/reverie-diag/unexpanded.ql" <<'QL'
          import rust

          from MacroCall mc, Location loc
          where
            loc = mc.getLocation() and
            loc.getFile().getRelativePath().matches("backend/src/%") and
            not mc.hasMacroCallExpansion()
          select mc.getPath().toString(), loc.getFile().getRelativePath(), loc.getStartLine()
          QL
          for q in coverage unexpanded; do
            echo "::group::${q}"
            "${CODEQL}" query run --database "${db}" --output "${RUNNER_TEMP}/${q}.bqrs" "${pack}/reverie-diag/${q}.ql"
            "${CODEQL}" bqrs decode --format text "${RUNNER_TEMP}/${q}.bqrs" | sed -n "1,80p"
            echo "::endgroup::"
          done

      # The action's post step cannot find backend/Cargo.lock from the repository root.
      - name: Upload prefetch shards
        if: env.R2_CONFIGURED == 'true' && github.ref == 'refs/heads/main'
        working-directory: backend
        run: kache save-manifest
