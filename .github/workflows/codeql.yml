name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Off-peak, off top-of-the-hour, to dodge runner contention.
    - cron: "37 17 * * 0"

permissions:
  contents: read

# Never cancel main-branch runs: it would drop that commit's code-scanning
# results. Superseded PR runs cancel freely.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Gates the analyze jobs on push only. PR and merge-queue runs analyze every
  # language: the ruleset's code-scanning rule expects per-category results, so
  # a skipped analyzer blocks the PR forever.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            javascript-typescript:
              - 'frontend/**'
              - '**/*.html'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            rust:
              - 'backend/**'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'

  analyze-actions:
    name: Analyze (actions)
    # Always runs — guarantees a CodeQL result exists for every commit.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # actions: read lets the extractor fetch referenced workflows.
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: actions
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:actions

  analyze-javascript-typescript:
    name: Analyze (javascript-typescript)
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.javascript-typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:javascript-typescript

  analyze-rust:
    name: Analyze (rust)
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: rust
          # The Rust extractor (beta) pins Rust to `none` and rejects
          # manual/autobuild; it invokes cargo internally.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:rust

  # Single required CodeQL context: a gate in ci.yml can't `needs:` jobs in
  # this separate workflow. Requiring this aggregate instead of the
  # per-language jobs means a PR that skips a language's analyze job isn't
  # blocked by an unsatisfied required check. `if: always()` is load-bearing.
  codeql-gate:
    name: CodeQL gate
    if: always()
    needs:
      - changes
      - analyze-actions
      - analyze-javascript-typescript
      - analyze-rust
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any analysis failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required CodeQL analysis failed or was cancelled:"
          echo "$RESULTS"
          exit 1
