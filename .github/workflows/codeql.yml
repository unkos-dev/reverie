name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly scan, 17:37 UTC Sunday (~01:37 Monday Perth). Off-peak and
    # avoids top-of-the-hour contention on GitHub-hosted runners.
    - cron: "37 17 * * 0"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which languages' source actually changed so downstream analyze
  # jobs can skip when their inputs are untouched. Scheduled runs always
  # analyze everything — the path filter is skipped and the analyze jobs
  # fall through the `schedule` branch of their `if:` expressions.
  #
  # Actions analyzer is deliberately NOT path-gated. It runs on every PR
  # to guarantee at least one CodeQL result exists for the commit — the
  # default-branch-protection ruleset requires code scanning results,
  # and a PR that matches none of the path filters (e.g. docs-only or
  # .github/renovate.json-only) would otherwise have zero results and
  # be permanently blocked from merging. Actions analysis is the
  # cheapest of the three (~48s) so the always-on cost is modest.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        if: github.event_name != 'schedule'
        id: filter
        with:
          # On merge_group events, paths-filter's default base (HEAD~1)
          # only sees the topmost commit in the synthetic merge ref —
          # it would miss the diff for any PR sharing the queue. Pin
          # explicitly to merge_group.base_sha so downstream skip
          # decisions match the actual PR-against-main diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          filters: |
            javascript-typescript:
              - 'frontend/**'
              - '**/*.html'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            rust:
              - 'backend/**'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'

  analyze-actions:
    name: Analyze (actions)
    # Always runs — guarantees a CodeQL result exists for the commit so
    # the default-branch-protection ruleset's code-scanning rule is
    # satisfied even on PRs that touch no path-gated source.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # CodeQL needs security-events: write to upload SARIF results.
      security-events: write
      # actions: read lets the Actions extractor fetch referenced workflows.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: actions
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: /language:actions

  analyze-javascript-typescript:
    name: Analyze (javascript-typescript)
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.javascript-typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: /language:javascript-typescript

  analyze-rust:
    name: Analyze (rust)
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: rust
          # All three languages use build-mode: none. The Rust extractor
          # (codeql/rust-queries, beta) currently pins Rust to `none` and
          # rejects `manual`/`autobuild`; the extractor invokes cargo
          # internally. Revisit when upstream exposes manual mode.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: /language:rust

  # Single required CodeQL context for the branch ruleset. A gate in ci.yml
  # cannot `needs:` jobs in this separate workflow, so CodeQL carries its own.
  # Requiring this aggregate instead of the per-language Analyze (*) jobs means
  # a PR that doesn't touch a given language (its analyze job skips) is not
  # blocked by an unsatisfied required check. `analyze-actions` always runs, so
  # there is always at least one real CodeQL result per commit. `if: always()`
  # is load-bearing for the same reason as the CI gate.
  codeql-gate:
    name: CodeQL gate
    if: always()
    needs:
      - changes
      - analyze-actions
      - analyze-javascript-typescript
      - analyze-rust
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any analysis failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required CodeQL analysis failed or was cancelled:"
          echo "$RESULTS"
          exit 1
