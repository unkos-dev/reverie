name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly scan, 17:37 UTC Sunday (~01:37 Monday Perth). Off-peak and
    # avoids top-of-the-hour contention on GitHub-hosted runners.
    - cron: "37 17 * * 0"

permissions:
  contents: read

# Never cancel main-branch runs (pushes and the weekly schedule both carry
# refs/heads/main): a cancelled run reddens the README badge and drops the
# commit's code-scanning results. Superseded PR runs cancel freely.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detect which languages' source changed so analyze jobs can skip.
  # Scheduled runs always analyze everything (the analyze jobs' `if:` falls
  # through on `schedule`). The Actions analyzer is deliberately NOT
  # path-gated: the ruleset requires code-scanning results, and a PR
  # matching no path filter would otherwise have zero results and be
  # permanently blocked from merging; Actions analysis is the cheapest of
  # the three, so the always-on cost is modest.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      javascript-typescript: ${{ steps.filter.outputs.javascript-typescript }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name != 'schedule'
        id: filter
        with:
          # On merge_group events, paths-filter's default base (HEAD~1)
          # only sees the topmost commit in the synthetic merge ref —
          # it would miss the diff for any PR sharing the queue. Pin
          # explicitly to merge_group.base_sha so downstream skip
          # decisions match the actual PR-against-main diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          filters: |
            javascript-typescript:
              - 'frontend/**'
              - '**/*.html'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            rust:
              - 'backend/**'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'

  analyze-actions:
    name: Analyze (actions)
    # Always runs — guarantees a CodeQL result exists for every commit (see
    # the changes-job comment).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # security-events: write to upload SARIF; actions: read lets the
      # extractor fetch referenced workflows.
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: actions
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:actions

  analyze-javascript-typescript:
    name: Analyze (javascript-typescript)
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.javascript-typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:javascript-typescript

  analyze-rust:
    name: Analyze (rust)
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: rust
          # The Rust extractor (beta) pins Rust to `none` and rejects
          # manual/autobuild; it invokes cargo internally.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:rust

  # Single required CodeQL context for the branch ruleset. A gate in ci.yml
  # cannot `needs:` jobs in this separate workflow, so CodeQL carries its own.
  # Requiring this aggregate instead of the per-language Analyze (*) jobs means
  # a PR that doesn't touch a given language (its analyze job skips) is not
  # blocked by an unsatisfied required check. `analyze-actions` always runs, so
  # there is always at least one real CodeQL result per commit. `if: always()`
  # is load-bearing for the same reason as the CI gate.
  codeql-gate:
    name: CodeQL gate
    if: always()
    needs:
      - changes
      - analyze-actions
      - analyze-javascript-typescript
      - analyze-rust
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any analysis failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required CodeQL analysis failed or was cancelled:"
          echo "$RESULTS"
          exit 1
