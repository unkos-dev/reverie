name: Release Please

on:
  push:
    branches:
      - main

# Workflow stays read-only; the job below widens to the writes it needs.
permissions:
  contents: read

# Queue rather than cancel: a half-applied release-PR update is worse than waiting.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Create release commits, tags, and GitHub Releases.
      contents: write
      # Open and update the standing release PR.
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
