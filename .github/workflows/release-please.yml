name: Release Please

on:
  push:
    branches:
      - main

# Least privilege at the top; the single job widens to exactly the
# writes release-please needs (create tags/releases + manage the
# release PR), keeping write tokens off the workflow-wide scope.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      # Create release commits, tags, and GitHub Releases.
      contents: write
      # Open and update the standing release PR.
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
