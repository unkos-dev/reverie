name: Dependencies

on:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      audit: ${{ steps.filter.outputs.audit }}
      advisories: ${{ steps.filter.outputs.advisories }}
      npm: ${{ steps.filter.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # merge_group's default base (HEAD~1) sees only the synthetic merge ref's
          # topmost commit; pin to base_sha to match the PR-against-main diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          # scripts/preflight-scope.sh reads the same file, so the two cannot drift.
          filters: .github/path-filters.yml

  cargo-deny:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          mise-install-args: github:EmbarkStudios/cargo-deny

      - name: Check dependencies (licenses, bans, sources)
        run: cargo deny check bans licenses sources

  cargo-deny-advisories:
    needs: changes
    if: needs.changes.outputs.advisories == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          mise-install-args: github:EmbarkStudios/cargo-deny

      - name: Check advisories
        run: cargo deny check advisories

  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # License policy is owned by cargo-deny; this layer gates vulnerabilities only.
          fail-on-severity: moderate

  npm-licenses:
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          vp: "true"

      - name: Check npm licenses (gating)
        run: |
          set -euo pipefail
          allow="MIT;Apache-2.0;ISC;0BSD;BSD-2-Clause;BSD-3-Clause;BlueOak-1.0.0;CC0-1.0;Python-2.0;Unlicense"
          rc=0
          for tree in . frontend website; do
            echo "::group::license check (${tree})"
            (
              cd "$tree"
              # Excluded by name, not license: build-time native tooling whose own
              # code never lands in the shipped output.
              vp exec license-checker-rseidelsohn \
                --production \
                --excludePrivatePackages \
                --excludePackagesStartingWith "@img/sharp-libvips;@bruits/satteri;satteri;lightningcss" \
                --onlyAllow "$allow"
            ) || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
