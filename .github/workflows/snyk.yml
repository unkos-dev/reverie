name: Snyk advisory scan

# Snyk runs alongside the incumbent scanners (cargo-deny, npm audit,
# trivy, checkov, zizmor, CodeQL, dependency-review) in advisory mode:
# findings upload to the code-scanning dashboard and annotate PRs, but a
# finding never fails the check. The overlap is deliberate. A triaged
# Snyk baseline has to accrue before any decision on promoting Snyk to a
# gate or retiring the scanners it duplicates, and none of the incumbent
# gates are weakened in the meantime.
#
# Coverage split: Snyk Code (SAST) analyzes the Rust and TypeScript
# sources; Snyk Open Source reads the npm lockfile only; Snyk Container
# reads the published runtime image, covering the Debian base layer that
# neither source-side scanner sees.
#
# Rust dependencies are absent by product limitation, not by choice:
# Snyk supports Cargo through `snyk sbom test` alone, which creates no
# monitored target and so yields neither a dashboard entry nor a
# baseline. cargo-deny scans Cargo.lock directly and is the higher
# fidelity tool for that job regardless; see debt/ for the lift
# condition.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR pushes cancel as usual, but main runs complete: a rapid
# follow-up merge must not cancel the prior commit's SARIF upload and
# baseline snapshot, which are the artifacts this workflow exists for.
concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  code:
    name: Snyk Code (SAST)
    # Fork PRs run without secrets, so the scan can only fail on auth;
    # skip rather than hand every external contribution two red checks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the SARIF result into the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Keep this pin in lockstep with the deps job below.
      - name: Install snyk
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-release-attachments depName=snyk/cli extractVersion=^v(?<version>.+)$
          version: "1.1306.0"
          sha256: "aad6d43f936e4357b3bda299c02d446c80602106484c36615bb4b654ef7de740"
          url: "https://github.com/snyk/cli/releases/download/v{version}/snyk-linux"
          binary: snyk

      # Exit 1 means findings and is tolerated while the job is advisory
      # (the SARIF still lands in the dashboard). Anything above 1 is a
      # scan failure (auth, engine error, no supported files) and fails
      # loud rather than reporting a silently empty scan.
      - name: Snyk Code scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          rc=0
          snyk code test --org=reverie --sarif-file-output=snyk-code.sarif || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

      # Snyk labels a finding it places in test code with a distinct
      # `<rule>/test` rule ID. Registered ones are analysed but withheld
      # from the dashboard so the alert queue stays actionable. The scan
      # itself is unchanged, so a trace running from a test helper into
      # production code is still found and still reported, under its
      # ordinary rule ID. An unregistered `/test` ID fails the job rather
      # than widening the suppression on its own.
      - name: Withhold registered test-variant rules
        run: |
          scripts/filter-sarif-test-rules.sh \
            snyk-code.sarif snyk-code-filtered.sarif \
            .github/snyk-code-test-rule-allowlist.txt \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: snyk-code-filtered.sarif
          category: snyk-code

      # Withheld must not mean unobservable: the pre-filter SARIF is
      # retained so a reviewer can audit exactly what the dashboard did
      # not receive, without rerunning the scan.
      #
      # always() because the case that most needs this artifact is the
      # filter refusing an unregistered rule. `warn` rather than `error`
      # for the same reason: on a hard scan failure there is no SARIF to
      # retain, and a second red step there would only bury the real
      # cause. A silently absent file still fails loud one step later,
      # where the filter cannot read its input.
      - name: Upload unfiltered SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snyk-code-sarif-unfiltered
          path: snyk-code.sarif
          if-no-files-found: warn
          retention-days: 14

  deps:
    name: Snyk Open Source (npm SCA)
    # Same fork guard as the code job above.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the SARIF result into the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Keep this pin in lockstep with the code job above.
      - name: Install snyk
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-release-attachments depName=snyk/cli extractVersion=^v(?<version>.+)$
          version: "1.1306.0"
          sha256: "aad6d43f936e4357b3bda299c02d446c80602106484c36615bb4b654ef7de740"
          url: "https://github.com/snyk/cli/releases/download/v{version}/snyk-linux"
          binary: snyk

      # Resolved from the committed lockfile alone, no install needed.
      # --dev includes devDependencies for the same reason the npm-audit
      # cron does: a compromised dev tool runs with repo write access.
      # Same advisory exit-code split as the code job.
      - name: Snyk Open Source scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          rc=0
          snyk test --org=reverie --all-projects --dev \
            --sarif-file-output=snyk-oss.sarif || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

      # Snyk stamps license-issue rules with a security-severity of
      # "undefined" (license findings carry no CVSS), which the
      # code-scanning SARIF processor rejects as non-numeric. The shared
      # sanitizer drops only the invalid property; every finding is
      # preserved.
      - name: Sanitize SARIF severities
        run: scripts/sanitize-sarif-severities.sh snyk-oss.sarif snyk-oss-clean.sarif

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: snyk-oss-clean.sarif
          category: snyk-open-source

      # Refresh the Snyk-side dependency snapshot the advisory baseline
      # is judged against; PRs only test, main also monitors.
      #
      # --target-reference names the branch the snapshot belongs to.
      # Without it every monitored project collapses into one unlabelled
      # group, so a future branch-scoped monitor would silently overwrite
      # the main baseline instead of sitting beside it.
      #
      # --remote-repo-url pins the snapshot to this repository's target so
      # CLI runs land on the same dashboard entry rather than minting a
      # parallel listing; drift and remediation history stay on one target.
      # Derived from the run context so a fork or rename cannot leave a
      # stale hardcoded URL behind.
      - name: Snyk baseline snapshot
        if: github.event_name == 'push'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          snyk monitor --org=reverie --all-projects --dev \
            --target-reference=main \
            --remote-repo-url="$REPO_URL"

  container:
    name: Snyk Container (image CVEs)
    # Scans the published runtime image, which only exists for main, so
    # this lane has no PR form: a PR's image is not built until merge and
    # scanning main's image from a PR would report the wrong artifact.
    # The PR-time image gate is trivy's, in docker-publish.yml.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Pull the image from GHCR.
      packages: read
      # Upload the SARIF result into the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Keep this pin in lockstep with the jobs above.
      - name: Install snyk
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-release-attachments depName=snyk/cli extractVersion=^v(?<version>.+)$
          version: "1.1306.0"
          sha256: "aad6d43f936e4357b3bda299c02d446c80602106484c36615bb4b654ef7de740"
          url: "https://github.com/snyk/cli/releases/download/v{version}/snyk-linux"
          binary: snyk

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The floating :main tag rather than :sha-<7>: docker-publish.yml
      # runs independently of this workflow and may not have published
      # this commit's image yet, and a main push that changes no image
      # input never builds one at all. Scanning whatever main currently
      # ships is the honest reading and never races a per-commit tag.
      #
      # The tag can still be absent outright: before the first
      # image-producing push, after the package is deleted, or after a
      # rename. Snyk cannot distinguish that from a broken scan and exits
      # above 1, so probe first and record the outcome.
      #
      # The probe fails closed. A registry error is not an absent tag:
      # network faults, expired credentials and GHCR outages all make
      # `inspect` exit non-zero, and treating those as "nothing to scan"
      # would let a real image slip past both the scan and the baseline
      # while the workflow reported success. Only an explicit
      # manifest-unknown response counts as absent; every other failure
      # exits non-zero and reddens the job. Transient faults get three
      # attempts before that verdict.
      #
      # Skipping is reported as a warning annotation and in the step
      # summary rather than passing quietly, because "no image to scan"
      # must stay distinguishable from "image scanned clean" once this
      # lane is promoted from advisory to a gate.
      #
      # Lowercasing is required for forks: image references must be
      # lowercase, and github.repository preserves account casing.
      - name: Resolve image reference
        id: image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:main
        run: |
          set -euo pipefail
          ref="${IMAGE_REF,,}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

          for attempt in 1 2 3; do
            if err=$(docker buildx imagetools inspect "$ref" 2>&1 >/dev/null); then
              echo "present=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Registry vocabulary for "this tag does not exist". Anything
            # else is an infrastructure fault, not an answer.
            if grep -qiE 'manifest unknown|MANIFEST_UNKNOWN|not found' <<<"$err"; then
              echo "present=false" >> "$GITHUB_OUTPUT"
              echo "::warning::${ref} is not published; skipping the container scan and baseline."
              echo "Snyk container scan skipped: \`${ref}\` is not published." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::notice::attempt ${attempt} to inspect ${ref} failed; retrying."
            sleep $((attempt * 5))
          done

          echo "::error::Could not determine whether ${ref} exists. Last error: ${err}"
          exit 1

      # --platform is required because main publishes linux/arm64 only, so
      # the manifest list carries no entry matching this amd64 runner.
      # Scanning is layer analysis, not execution, so the arch mismatch is
      # immaterial. --file lets Snyk attribute findings to base-image
      # lines and suggest base-image upgrades.
      #
      # Same advisory exit-code split as the jobs above.
      - name: Snyk Container scan
        if: steps.image.outputs.present == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          rc=0
          snyk container test "$IMAGE_REF" \
            --org=reverie \
            --platform=linux/arm64 \
            --file=Dockerfile \
            --sarif-file-output=snyk-container.sarif || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

      # Container rules for advisories without an assigned CVSS score carry
      # a security-severity of null, which the code-scanning SARIF processor
      # rejects as non-numeric; same failure class, and same shared
      # sanitizer, as the "undefined" license rules in the npm job above.
      - name: Sanitize SARIF severities
        if: steps.image.outputs.present == 'true'
        run: scripts/sanitize-sarif-severities.sh snyk-container.sarif snyk-container-clean.sarif

      # The runtime image is Debian slim plus ca-certificates and curl, so
      # most of what a container scan finds is base-layer CVEs Debian has
      # not fixed and this project cannot fix either. Withholding those
      # keeps the dashboard an actionable queue instead of a standing
      # inventory of the base image.
      #
      # The predicate is evaluated against each scan rather than held in a
      # static ignore list, so nothing can go stale: when Debian ships a
      # fix the remediation text changes, the finding stops matching, and
      # the alert reappears on its own. It also fails closed. A finding
      # with a fix available, an application-layer finding, or one the
      # filter cannot classify is ingested.
      - name: Withhold unfixable base-OS findings
        if: steps.image.outputs.present == 'true'
        run: |
          scripts/filter-sarif-unfixable-os.sh \
            snyk-container-clean.sarif snyk-container-filtered.sarif \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Upload to code-scanning
        if: steps.image.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: snyk-container-filtered.sarif
          category: snyk-container

      # Same audit trail, and the same always()/warn reasoning, as the
      # Snyk Code job above: the full result set stays retrievable so
      # "withheld" is reviewable rather than invisible.
      - name: Upload unfiltered SARIF
        if: always() && steps.image.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snyk-container-sarif-unfiltered
          path: snyk-container.sarif
          if-no-files-found: warn
          retention-days: 14

      # The image's counterpart to the npm baseline snapshot above:
      # `test` reports today's findings, `monitor` is what accrues the
      # base-layer drift and remediation history the advisory period
      # exists to gather.
      #
      # No --remote-repo-url here: container targets are keyed by image
      # reference, not repository, so the flag has no documented effect on
      # this command. --target-reference still applies and keeps the
      # snapshot labelled by branch, matching the npm baseline.
      - name: Snyk container baseline snapshot
        if: steps.image.outputs.present == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          snyk container monitor "$IMAGE_REF" \
            --org=reverie \
            --platform=linux/arm64 \
            --file=Dockerfile \
            --target-reference=main
