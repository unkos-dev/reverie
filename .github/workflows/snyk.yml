name: Snyk advisory scan

# Advisory mode alongside the incumbent scanners: findings upload to the
# dashboard and annotate PRs, but never fail the check, until a triaged
# baseline justifies promoting Snyk to a gate.
#
# Coverage split: Snyk Code (SAST) covers Rust/TypeScript sources; Snyk Open
# Source reads the npm lockfile only; Snyk Container covers the Debian base
# layer neither source scanner sees. Rust dependencies are absent by product
# limitation — see debt/ for the lift condition.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Main runs complete even when superseded: cancelling would drop the prior
# commit's SARIF upload and baseline snapshot.
concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  code:
    name: Snyk Code (SAST)
    # Fork PRs run without secrets, so the scan can only fail on auth;
    # skip rather than hand every external contribution two red checks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the SARIF result into the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install snyk (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.6"
          install_args: snyk

      # Exit 1 (findings) is tolerated while advisory; anything above 1 is a
      # scan failure and fails loud rather than reporting an empty scan.
      - name: Snyk Code scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          rc=0
          snyk code test --org=reverie --sarif-file-output=snyk-code.sarif || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

      # Withholds only registered `<rule>/test` findings from the dashboard;
      # an unregistered `/test` ID fails the job instead of silently widening.
      - name: Withhold registered test-variant rules
        run: |
          scripts/filter-sarif-test-rules.sh \
            snyk-code.sarif snyk-code-filtered.sarif \
            .github/snyk-code-test-rule-allowlist.txt \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: snyk-code-filtered.sarif
          category: snyk-code

      # Retain the pre-filter SARIF so withheld findings stay auditable.
      # always() covers the filter-refusal case; `warn` avoids a second red
      # step on top of a scan failure that already left no SARIF to retain.
      - name: Upload unfiltered SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snyk-code-sarif-unfiltered
          path: snyk-code.sarif
          if-no-files-found: warn
          retention-days: 14

  deps:
    name: Snyk Open Source (npm SCA)
    # Same fork guard as the code job above.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload the SARIF result into the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install snyk (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.6"
          install_args: snyk

      # --dev includes devDependencies: a compromised dev tool has the same
      # repo write access as a runtime one.
      - name: Snyk Open Source scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail
          rc=0
          snyk test --org=reverie --all-projects --dev \
            --sarif-file-output=snyk-oss.sarif || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

      # License findings carry no CVSS, so Snyk stamps them security-severity
      # "undefined", which the SARIF processor rejects as non-numeric.
      - name: Sanitize SARIF severities
        run: scripts/sanitize-sarif-severities.sh snyk-oss.sarif snyk-oss-clean.sarif

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: snyk-oss-clean.sarif
          category: snyk-open-source

      # Refreshes the dependency snapshot the advisory baseline is judged
      # against; PRs only test, main also monitors. --target-reference keeps
      # this labelled separately so a future branch-scoped monitor can't
      # overwrite the main baseline.
      - name: Snyk baseline snapshot
        if: github.event_name == 'push'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          snyk monitor --org=reverie --all-projects --dev \
            --target-reference=main \
            --remote-repo-url="$REPO_URL"

  container:
    name: Snyk Container (image CVEs)
    # No PR form: a PR's image isn't built until merge. The PR-time image
    # gate is trivy's, in docker-publish.yml.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Pull the image from GHCR.
      packages: read
      # Upload the SARIF result into the code-scanning dashboard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install snyk (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.6"
          install_args: snyk

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scans the floating :main tag (docker-publish.yml runs independently
      # and may not have published this commit's image yet). Snyk can't tell
      # "tag absent" from "scan broken" itself, so probe first and fail
      # closed: only an explicit manifest-unknown counts as absent, every
      # other inspect failure reddens the job after three retries.
      - name: Resolve image reference
        id: image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:main
        run: |
          set -euo pipefail
          ref="${IMAGE_REF,,}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

          for attempt in 1 2 3; do
            if err=$(docker buildx imagetools inspect "$ref" 2>&1 >/dev/null); then
              echo "present=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Registry vocabulary for "this tag does not exist". Anything
            # else is an infrastructure fault, not an answer.
            if grep -qiE 'manifest unknown|MANIFEST_UNKNOWN|not found' <<<"$err"; then
              echo "present=false" >> "$GITHUB_OUTPUT"
              echo "::warning::${ref} is not published; skipping the container scan and baseline."
              echo "Snyk container scan skipped: \`${ref}\` is not published." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::notice::attempt ${attempt} to inspect ${ref} failed; retrying."
            sleep $((attempt * 5))
          done

          echo "::error::Could not determine whether ${ref} exists. Last error: ${err}"
          exit 1

      # --platform is required: main publishes linux/arm64 only, so this
      # amd64 runner has no matching manifest entry (layer analysis, not
      # execution, so the mismatch is immaterial).
      - name: Snyk Container scan
        if: steps.image.outputs.present == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          rc=0
          snyk container test "$IMAGE_REF" \
            --org=reverie \
            --platform=linux/arm64 \
            --file=Dockerfile \
            --sarif-file-output=snyk-container.sarif || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi

      # Unscored advisories carry security-severity null, same failure class
      # as the license rules in the npm job above.
      - name: Sanitize SARIF severities
        if: steps.image.outputs.present == 'true'
        run: scripts/sanitize-sarif-severities.sh snyk-container.sarif snyk-container-clean.sarif

      # Withholds base-layer CVEs Debian hasn't fixed and we can't fix either,
      # keeping the dashboard actionable. Evaluated per-scan, not a static
      # ignore list, so a Debian fix un-suppresses the finding on its own.
      - name: Withhold unfixable base-OS findings
        if: steps.image.outputs.present == 'true'
        run: |
          scripts/filter-sarif-unfixable-os.sh \
            snyk-container-clean.sarif snyk-container-filtered.sarif \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Upload to code-scanning
        if: steps.image.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: snyk-container-filtered.sarif
          category: snyk-container

      # Same audit-trail reasoning as the Snyk Code job above.
      - name: Upload unfiltered SARIF
        if: always() && steps.image.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snyk-container-sarif-unfiltered
          path: snyk-container.sarif
          if-no-files-found: warn
          retention-days: 14

      # Image counterpart to the npm baseline snapshot above; container
      # targets are keyed by image reference, so no --remote-repo-url here.
      - name: Snyk container baseline snapshot
        if: steps.image.outputs.present == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          snyk container monitor "$IMAGE_REF" \
            --org=reverie \
            --platform=linux/arm64 \
            --file=Dockerfile \
            --target-reference=main
