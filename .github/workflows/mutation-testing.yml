name: Mutation testing

# Advisory-only: a mutant the suite fails to kill marks behaviour no test
# asserts, but only infrastructure failures (not missed mutants) fail the run.
# Sharded 1/8 per week on the ISO week number, covering the full population
# every 8 weeks at a bounded per-run cost.
on:
  schedule:
    # Off-peak; clear of the CodeQL, Scorecard, and daily-audit crons.
    - cron: "7 19 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: true

jobs:
  mutants:
    name: Mutation testing (cargo-mutants)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reverie
          # Non-secret credential scoped to this ephemeral CI run.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: reverie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reverie -d reverie_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Compile against the committed .sqlx cache; tests connect live and
      # create their own per-test databases.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://reverie:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/reverie_dev
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create database roles
        run: psql "$DATABASE_URL" -f docker/init-roles.sql
        working-directory: ${{ github.workspace }}

      # Pins to backend/rust-toolchain.toml, keeping this workflow on the same
      # compiler as ci.yml and a developer's machine.
      - uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      # Shims stay off PATH: a shim re-resolves its version per exec from the
      # cwd's mise.toml, but rustc links each unit from that unit's package
      # root — a registry dependency would link from ~/.cargo/registry with
      # no mise.toml above it. `mise exec` below sidesteps that.
      - name: Install mold and cargo-mutants (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.14"
          install_args: mold cargo:cargo-mutants
          add_shims_to_path: false

      # Exit codes 2 (missed mutants) and 3 (timeouts) are findings, not
      # failures; anything else is real breakage and reds the run.
      - name: Run mutants (weekly shard)
        run: |
          set -euo pipefail
          shard=$(( 10#$(date -u +%V) % 8 ))
          echo "ISO week $(date -u +%V) -> shard ${shard}/8"
          rc=0
          mise exec mold cargo:cargo-mutants -- cargo mutants --workspace --shard "${shard}/8" -- --locked --all-targets || rc=$?
          case "$rc" in
            0) echo "shard clean: every mutant caught" ;;
            2|3)
              echo "::warning title=Mutation testing findings::cargo-mutants exit ${rc} (2 = missed mutants, 3 = timeouts) — see the artifact and step summary."
              ;;
            *) exit "$rc" ;;
          esac
          {
            echo "## Mutation testing (shard ${shard}/8)"
            echo ""
            echo '```'
            for f in missed.txt timeout.txt unviable.txt; do
              if [ -s "mutants.out/$f" ]; then
                echo "== $f ($(wc -l < "mutants.out/$f") lines) =="
                head -40 "mutants.out/$f"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-report
          path: backend/mutants.out
          if-no-files-found: warn
          retention-days: 30
