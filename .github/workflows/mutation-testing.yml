name: Mutation testing

# Weekly, advisory-only mutation testing over the backend: cargo-mutants
# patches the source one mutation at a time and re-runs the tests; a mutant
# the suite fails to kill marks behaviour no test asserts. Coverage says a
# line executed — this says a test would notice if it broke.
#
# Advisory posture: not a required check, never blocks anything. Missed
# mutants surface in the step summary + artifact for periodic triage;
# infrastructure failures (build errors, bad flags) still fail the run so
# the cron cannot rot silently.
#
# Sharded 1/8 per week, rotating on the ISO week number, so the full
# mutant population is covered every 8 weeks at a bounded per-run cost.
on:
  schedule:
    # Weekly, 19:07 UTC Saturday (~03:07 Sunday Perth). Off-peak; clear of
    # the CodeQL (Sun), Scorecard (Tue), and daily-audit (18:00) crons.
    - cron: "7 19 * * 6"
  # Manual runs for validating the harness or chasing a specific week's
  # findings.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: true

jobs:
  mutants:
    name: Mutation testing (cargo-mutants)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reverie
          POSTGRES_PASSWORD: reverie
          POSTGRES_DB: reverie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reverie -d reverie_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Compile against the committed .sqlx cache; tests connect live and
      # create their own per-test databases (same split as the backend CI
      # job's clippy/test phases).
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://reverie:reverie@localhost:5432/reverie_dev
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # Colour survives the captured runner log; see ci.yml's backend-checks
      # job.
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create database roles
        run: psql postgres://reverie:reverie@localhost:5432/reverie_dev -f docker/init-roles.sql
        working-directory: ${{ github.workspace }}

      # Installs the version backend/rust-toolchain.toml pins, the file rustup
      # honours for every cargo call, so this workflow cannot drift onto a
      # different compiler from the one ci.yml and a developer's machine use.
      - uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend

      # Mutation testing rebuilds and relinks once per mutant, so the linker
      # choice compounds here more than anywhere else in CI. mold rides along
      # with cargo-mutants rather than taking a step of its own: mise's setup
      # dominates a small tool install, so one step installing two tools costs
      # less than two steps installing one. Taking it from mise also drops an
      # unpinned `apt-get install mold` from this workflow, which is the whole
      # reason mise.toml pins mold in the first place, and puts this job on the
      # same mold build as ci.yml and a developer's machine.
      #
      # Shims stay off PATH and the run below goes through `mise exec`, for the
      # reason ci.yml records on its own mold step: `-fuse-ld=mold` makes the
      # linker driver search for a program named `ld.mold`, which it must find
      # as the real binary. A mise shim re-resolves its version per exec from
      # the config at the caller's working directory, and rustc links each unit
      # from that unit's package root, so a registry dependency links from
      # ~/.cargo/registry with no mise.toml above it.
      - name: Install mold and cargo-mutants (mise)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.2"
          install_args: mold cargo:cargo-mutants
          add_shims_to_path: false

      # Exit-code triage keeps the advisory posture honest: missed mutants
      # (2) and mutant timeouts (3) are findings, not failures; anything
      # else (usage error, clean-tree build failure) is real breakage and
      # reds the run.
      - name: Run mutants (weekly shard)
        run: |
          set -euo pipefail
          shard=$(( 10#$(date -u +%V) % 8 ))
          echo "ISO week $(date -u +%V) -> shard ${shard}/8"
          rc=0
          mise exec mold cargo:cargo-mutants -- cargo mutants --workspace --shard "${shard}/8" -- --locked --all-targets || rc=$?
          case "$rc" in
            0) echo "shard clean: every mutant caught" ;;
            2|3)
              echo "::warning title=Mutation testing findings::cargo-mutants exit ${rc} (2 = missed mutants, 3 = timeouts) — see the artifact and step summary."
              ;;
            *) exit "$rc" ;;
          esac
          {
            echo "## Mutation testing (shard ${shard}/8)"
            echo ""
            echo '```'
            for f in missed.txt timeout.txt unviable.txt; do
              if [ -s "mutants.out/$f" ]; then
                echo "== $f ($(wc -l < "mutants.out/$f") lines) =="
                head -40 "mutants.out/$f"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-report
          path: backend/mutants.out
          if-no-files-found: warn
          retention-days: 30
