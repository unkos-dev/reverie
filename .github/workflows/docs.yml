name: Docs

# PR-time docs builds live in ci.yml (cross-workflow `needs` is impossible);
# this workflow owns only the Pages deploy on push-to-main + tags.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # docs is an npm workspace; a root manifest/lockfile change must redeploy too.
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/docs-build.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel: a cancelled deploy-pages call can strand a red deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    uses: ./.github/workflows/docs-build.yml
    with:
      # Only this deploy lane runs the advisory external-link pass, not the PR gate.
      check-external-links: true
      upload-pages-artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
