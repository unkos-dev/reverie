name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege by default; only the deploy job is elevated to publish
# Pages. Pull-request runs build-only and never reach the elevated job.
permissions:
  contents: read

# Isolate pull-request builds into their own per-PR group so they never
# cancel an in-flight deploy, while keeping every real deploy event
# (main, tags, manual) in one shared `pages` group so concurrent Pages
# deployments stay serialized.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: cd docs && npm ci

      - name: Build Starlight
        run: cd docs && npm run build

      # Deploy artifacts are only needed for the actual Pages publish.
      # Pull-request runs validate the build and stop here.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
