# Server-side Conventional Commits gate: the local commit-msg hook is
# bypassable and never runs on fork PRs, yet release-please's changelog
# depends on commit shape. Two surfaces:
# every commit the PR introduces (keeps branch history greppable), and
# the PR title — squash merging composes the merge commit from the title,
# so the title is the one commit subject the commit-msg hook never sees and
# the one release-please consumes.
#
# Its own workflow rather than a job in ci.yml, so a title edit reruns this
# check alone rather than the full CI matrix. pull_request-only: push and
# merge_group have no PR range or title.
name: Commit lint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  commitlint:
    name: Commit lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so commitlint can walk the whole PR range.
          fetch-depth: 0
          persist-credentials: false

      - name: Install node (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: node "npm:npm"
          add_shims_to_path: true

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-manager: false
          cache: true

      # Root lockfile carries the same pinned commitlint the local
      # commit-msg hook runs.
      - name: Install commitlint
        run: vp install

      # Event-payload SHAs, not refs: base.sha pins the fork point even if
      # the base branch moves mid-run, and neither value is
      # attacker-controlled text.
      - name: Lint PR commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # GitHub appends ` (#N)` to the squash subject; commitlint parses it
      # as part of the subject, so linting the bare title matches what
      # release-please will see. The title is attacker-controlled input on a
      # public repository; it reaches the shell only through the
      # environment, never through template interpolation into the script.
      - name: Lint PR title (squash-merge subject)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose
