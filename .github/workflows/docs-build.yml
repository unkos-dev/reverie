name: Docs build (reusable)

# Shared by ci.yml's PR-time docs job and docs.yml's push-to-main deploy
# (cross-workflow `needs` is impossible).
on:
  workflow_call:
    inputs:
      check-external-links:
        description: Run the advisory external-link pass (deploy lane only)
        type: boolean
        default: false
      upload-pages-artifact:
        description: Upload docs/dist as a Pages artifact for a deploy job
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No dependency cache: this feeds the privileged Pages publish, and a
      # shared cache there is a cache-poisoning surface (zizmor).
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-manager: true
          cache: false

      - name: Install workspace
        run: vp install

      # --fail-if-no-match: a filter matching nothing exits 0, so without it a
      # renamed or relocated docs package passes this job having built nothing.
      - name: Build Starlight
        run: vp run --filter docs --fail-if-no-match build

      # Links render root-relative under /reverie/; symlink dist under a
      # `reverie` subdir so lychee's --root-dir resolution matches.
      - name: Stage built docs at the Pages base path
        run: |
          mkdir -p "${RUNNER_TEMP}/linkroot"
          ln -sfn "${GITHUB_WORKSPACE}/docs/dist" "${RUNNER_TEMP}/linkroot/reverie"

      # --offline means this gating pass cannot flake on external network state.
      - name: Check internal links (gating)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--offline --no-progress --root-dir ${{ runner.temp }}/linkroot ${{ runner.temp }}/linkroot/reverie"
          fail: true

      # External URLs are flaky, so continue-on-error swallows the exit code
      # while fail:true still surfaces broken links in the step log.
      - name: Check external links (advisory)
        if: inputs.check-external-links
        id: external-links
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--no-progress --scheme http --scheme https --root-dir ${{ runner.temp }}/linkroot ${{ runner.temp }}/linkroot/reverie"
          fail: true

      # Annotate so a green job doesn't hide broken links in the step log.
      - name: Flag broken external links
        if: inputs.check-external-links && steps.external-links.outcome == 'failure'
        run: echo "::warning::lychee found broken external links in the docs — see the 'Check external links (advisory)' step summary."

      - name: Upload Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/dist
