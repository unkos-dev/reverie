# Main-baseline static analysis; PR decoration is deliberately absent.
name: Sonar

on:
  # THREAT: workflow_run's branch filter also matches fork PRs from a branch
  # named main, putting fork code in a job whose environment holds SONAR_TOKEN.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # blame-based new-code detection
          persist-credentials: false

      # No official scanner caching guidance; established community pattern to
      # avoid re-fetching scanner on every main push.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
