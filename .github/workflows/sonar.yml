# Main-baseline static analysis after successful CI; PR decoration is deliberately absent.
name: Sonar

on:
  workflow_run:
    # "CI" is ci.yml's `name:` — renaming either side silently orphans this trigger.
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Main CI runs vary in duration so completions can invert; queueing serializes
# scans instead of letting a scan of an older commit cancel a newer one.
concurrency:
  group: sonar
  cancel-in-progress: false

jobs:
  scan:
    name: SonarQube Cloud
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # blame-based new-code detection
          persist-credentials: false

      # No official scanner caching guidance; established community pattern to
      # avoid re-fetching scanner on every main push.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
