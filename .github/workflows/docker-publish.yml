name: Docker Publish

# Two publication channels per ADR
# adr/2026-05-12-platform-matrix-via-native-runners.md
# (supersedes adr/2026-05-12-decouple-staging-image-from-semver-releases.md):
#   - `main`-branch push -> `:main` (floating) + `:sha-<7>` (immutable pin)
#   - `v*` tag push      -> `:vX.Y.Z` + `:X.Y` (semver, via release-please)
# `:latest` is intentionally not auto-assigned; reserved for the first
# semver release.
#
# Platform matrix split by trigger — see ADR:
#   - `main`-branch push -> linux/arm64 only. Sole consumer is
#     oci-compute-1 (Ampere A1, arm64). Single-arch keeps main-push CI
#     fast.
#   - `v*` tag push      -> linux/amd64,linux/arm64 manifest list.
#     Public-release boundary; self-hosters run mixed architectures.
#
# Build shape: a small `prepare-matrix` job emits the include list for
# the current trigger, then `build` instantiates one job per arch on a
# native GitHub-hosted runner (amd64 on ubuntu-latest, arm64 on
# ubuntu-24.04-arm), pushed by digest. A final `merge` job assembles
# the manifest list with `docker buildx imagetools create`. No QEMU;
# release boundary fully native on both legs.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  # Manual trigger for ad-hoc rebuilds and feature-branch verification of
  # workflow changes that wouldn't otherwise fire on a non-main push.
  workflow_dispatch:

# Least privilege at the top; the `build` and `merge` jobs widen to
# `packages: write` themselves to push to GHCR. `prepare-matrix` needs
# no write token, so it stays off the workflow scope.
permissions:
  contents: read

# Serialize per-ref runs but do not cancel in-flight builds: omit
# `cancel-in-progress` so a near-complete publish (build → merge →
# sign) is never aborted by a newer push on the same ref. The build is
# idempotent, so sequential, uncancelled runs are the correct trade.
concurrency:
  group: docker-publish-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: unkos-dev/reverie

jobs:
  # Emit the matrix include list dynamically per trigger. Job-level
  # `if:` cannot reference the `matrix` context, so the per-trigger
  # filter lives here in the matrix shape rather than as a job gate.
  prepare-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo 'matrix={"include":[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare-matrix
    runs-on: ${{ matrix.runner }}
    # Native Rust image build (no QEMU); bounded well above observed
    # build time but far below the 6h default so a hung build fails fast.
    timeout-minutes: 60
    # Push the per-arch image by digest to GHCR.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # metadata-action emits OCI labels (org.opencontainers.image.*)
      # consumed by the per-arch build below. Tag emission also runs
      # here but is unused per-arch — tags are assigned in the `merge`
      # job against the final manifest list. `imagetools create` can't
      # back-fill labels into already-pushed image configs, so labels
      # must be set at per-arch build time.
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Per-arch builds push by digest only; tag assignment happens in
      # the `merge` job against the final manifest list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=buildcache-${{ matrix.arch }}
          cache-to: type=gha,scope=buildcache-${{ matrix.arch }},mode=max

      # Tier 1 observability — surfaces per-run buildkit content-store state
      # without external infra. `if: always()` so failures don't suppress
      # diagnostic output. Note: `buildx du` reports the *ephemeral* buildkit
      # daemon's local content store on this runner, not the persistent gha
      # cache pool — useful for spotting whether the build hydrated the local
      # store correctly, but not a substitute for `gh api ...actions/caches`
      # to inspect the persistent pool. Adopt Tier 2 (weekly cache-inventory
      # cron against the persistent pool) only on revisit conditions per ADR.
      - name: Local buildkit content store
        if: always()
        run: docker buildx du

      - name: Step summary
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "## Build cache report (arch=${ARCH})"
            echo
            echo "\`docker buildx du\` above shows this runner's local buildkit"
            echo "content store (ephemeral). Persistent gha cache state lives in"
            echo "the repo-level Actions cache pool. To confirm cooker layer"
            echo "reuse, inspect 'Build and push by digest' step log for"
            echo "per-stage \`CACHED\` lines."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export digest
        env:
          # Map expansions into env vars rather than interpolating into the
          # run body (zizmor template-injection). Both are trusted here —
          # runner.temp is GitHub-controlled, build.outputs.digest is a buildx
          # sha256 — but env-mapping is the idiomatic hardening and clears the
          # finding on this privileged GHCR-publish workflow.
          RUNNER_TEMP: ${{ runner.temp }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${BUILD_DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
    # Job-level block replaces the workflow-level grant (it does not merge
    # with it), so the two scopes the merge job already relied on must be
    # restated alongside the new `id-token: write`:
    #   - packages: write  — push the manifest list to GHCR.
    #   - id-token: write  — mint the OIDC token cosign exchanges with
    #     Fulcio for a short-lived keyless signing certificate.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # cosign for keyless (Sigstore) signing of the published manifest
      # list. Pinned to a specific cosign release so the signing toolchain
      # is reproducible across runs.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,enable=${{ github.ref_type != 'tag' }}

      # UNK-378: CVE-gate the image BEFORE it is tagged and signed. Until
      # now the image was cosign-signed + SBOM-attested but never
      # vuln-scanned — signing an unscanned artifact is attestation
      # theatre. Placement is load-bearing: the per-arch images exist in
      # GHCR only as untagged digests at this point, so a failing scan
      # stops the manifest list from ever being created, tagged, or
      # signed — no floating `:main` tag can point at a vulnerable image.
      #
      # Direct curl-tarball install pins the exact upstream release +
      # SHA256, mirroring the actionlint/shellcheck/gitleaks installs in
      # ci.yml (supply-chain discipline on a privileged publish workflow).
      - name: Install trivy v0.71.0
        env:
          # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
          TRIVY_VERSION: "0.71.0"
          TRIVY_SHA256: "30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$HOME/.local/bin" trivy
          rm "$tarball"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Blocking on fixable HIGH/CRITICAL CVEs; unfixed CVEs (no patched
      # package available upstream) are excluded from the gate — they would
      # block every publish until a distro fix ships, with no action
      # available to us. trivy reads the registry credential from the
      # docker login above. Every per-arch image is scanned (x-platform
      # scanning is layer analysis, not execution, so the amd64 runner
      # scans arm64 images fine).
      #
      # Indirection: buildx with `provenance`/`sbom` pushes each per-arch
      # "digest" as an OCI image *index* whose children are the real image
      # manifest plus an attestation manifest. trivy's remote backend
      # resolves an index via the *scanner host's* platform (linux/amd64),
      # which an arm64-only index doesn't carry — so enumerate the
      # non-attestation children and scan each child manifest digest
      # directly (a plain manifest needs no platform resolution).
      - name: Scan image for vulnerabilities (gating)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          for digest in *; do
            raw=$(docker buildx imagetools inspect --raw "${IMAGE_REF}@sha256:${digest}")
            # Index → scan every non-attestation child; bare manifest
            # (no .manifests) → scan the digest itself.
            children=$(jq -r '
              if .manifests then
                .manifests[]
                | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                | .digest
              else
                empty
              end' <<<"$raw")
            if [ -z "$children" ]; then
              children="sha256:${digest}"
            fi
            for child in $children; do
              echo "::group::trivy scan ${IMAGE_REF}@${child}"
              trivy image \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                --no-progress \
                "${IMAGE_REF}@${child}" \
                || { echo "::endgroup::"; exit 1; }
              echo "::endgroup::"
            done
          done

      # imagetools create assembles a manifest list from the per-arch
      # digests and tags it. Provenance/SBOM attestations on the per-arch
      # images are preserved on the resulting manifest list. OCI labels
      # are set on the per-arch images at build time (above) — they
      # cannot be added retroactively here.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest_args=$(printf "${IMAGE_REF}@sha256:%s " *)
          # shellcheck disable=SC2086  # word-splitting intended on both
          docker buildx imagetools create $tag_args $digest_args

      - name: Inspect image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Env-mapped rather than interpolated into the run body
          # (zizmor template-injection). meta.outputs.version is the first
          # docker/metadata-action tag — semver on a release-tag push, the
          # branch name on a push to main — never attacker-controlled.
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE_REF}:${IMAGE_VERSION}"

      # Keyless Sigstore signing of every published image — both the
      # floating `:main` / `:sha-<7>` staging tags and the `vX.Y.Z`
      # release tags. cosign exchanges this job's OIDC token for a
      # short-lived Fulcio certificate and records the signature in the
      # public Rekor transparency log; there is no long-lived private key
      # to store or rotate. Lifts the OpenSSF Scorecard Signed-Releases
      # check and lets self-hosters verify image provenance before pull.
      - name: Sign published image (keyless)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Sign by immutable digest, never by tag. A tag can be
          # re-pointed after signing; the content-addressed digest cannot,
          # so the signature binds to exactly these bytes. The manifest
          # list (index) digest transitively covers every per-arch image
          # beneath it, so one signature secures the whole multi-arch set.
          digest=$(docker buildx imagetools inspect "${IMAGE_REF}:${VERSION}" \
            --format '{{ .Manifest.Digest }}')
          # set -e aborts if inspect itself fails, but an empty-yet-exit-0
          # result would slip through and produce a malformed `…@` ref that
          # cosign rejects with an opaque error. Fail loud and attributable
          # instead — this is the signing step, clarity matters.
          [[ -n "$digest" ]] || { echo "::error::Failed to capture manifest digest for ${IMAGE_REF}:${VERSION}"; exit 1; }
          echo "Signing ${IMAGE_REF}@${digest}"
          cosign sign --yes "${IMAGE_REF}@${digest}"

  # Surface the image SBOM where release-page consumers expect it (UNK-329).
  # The buildkit-generated SBOM attestation on the published image stays the
  # authoritative copy (sbom: true above; verifiable via imagetools/cosign);
  # this job re-exports that same attestation — no second SBOM generation,
  # so the release asset cannot drift from the image. Runs on `v*` tags
  # (attach to the release-please GitHub Release) and on workflow_dispatch
  # (upload as a workflow artifact only — feature-branch verification with
  # no release to attach to). Skipped on plain main pushes: no release
  # exists there and the in-registry attestation already covers staging.
  release-sbom:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - merge
    # contents: write only to upload the release asset; packages: read to
    # pull the attestation from GHCR. No id-token — nothing is signed here.
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # Same version derivation as the merge job: semver on a tag push,
      # branch slug on workflow_dispatch — keeps the inspected ref identical
      # to what merge just pushed.
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Export SBOM from image attestation
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Unmatched globs (empty sbom-out) must fail the glob itself, not
          # hand a literal `*.spdx.json` path to jq's opaque ENOENT.
          shopt -s failglob
          mkdir -p sbom-out
          docker buildx imagetools inspect "${IMAGE_REF}:${IMAGE_VERSION}" \
            --format '{{ json .SBOM }}' > sbom-raw.json
          # An image published without an SBOM attestation inspects to JSON
          # `null` — fail with a legible diagnostic instead of letting the
          # shape-dispatch below trip over it.
          jq -e '. != null' sbom-raw.json > /dev/null \
            || { echo "::error::${IMAGE_REF}:${IMAGE_VERSION} carries no SBOM attestation"; exit 1; }
          # Single-platform inspect yields {"SPDX": …}; a multi-platform
          # index yields a platform-keyed map {"linux/amd64": {"SPDX": …}, …}.
          # Handle both so the job works for the single-arch staging shape
          # and the multi-arch release shape alike.
          if jq -e '.SPDX' sbom-raw.json > /dev/null; then
            jq '.SPDX' sbom-raw.json > "sbom-out/reverie-${IMAGE_VERSION}.spdx.json"
          else
            jq -r 'keys[]' sbom-raw.json | while read -r platform; do
              safe=${platform//\//-}
              jq --arg p "$platform" '.[$p].SPDX' sbom-raw.json \
                > "sbom-out/reverie-${IMAGE_VERSION}-${safe}.spdx.json"
            done
          fi
          # Empty or SPDX-less attestation output must fail loudly, not
          # publish an empty asset.
          for f in sbom-out/*.spdx.json; do
            jq -e '.spdxVersion' "$f" > /dev/null \
              || { echo "::error::$f is not a valid SPDX document"; exit 1; }
          done
          ls -l sbom-out

      - name: Attach SBOM to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" sbom-out/*.spdx.json --clobber --repo "$REPO"

      # workflow_dispatch verification path: no release exists; surface the
      # exported SBOM as a downloadable artifact instead.
      - name: Upload SBOM as workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom-out/*.spdx.json
          if-no-files-found: error
