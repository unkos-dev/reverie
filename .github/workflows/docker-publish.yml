name: Docker Publish

# Two publication channels per adr/2026-05-12-platform-matrix-via-native-runners.md:
#   - `main`-branch push -> `:main` + `:sha-<7>`, linux/arm64 only (staging).
#   - `v*` tag push      -> `:vX.Y.Z` + `:X.Y`, linux/amd64+arm64 (public release).
# `prepare-matrix` emits the include list, `build` runs one job per arch on a
# native runner (no QEMU) and pushes by digest, `merge` tags the manifest list.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  # Ad-hoc rebuilds and feature-branch verification of workflow changes.
  workflow_dispatch:

permissions:
  contents: read

# Serialize, never cancel: an in-flight publish (build → merge → sign) must
# never be aborted by a newer push. The build is idempotent, so queueing is safe.
concurrency:
  group: docker-publish-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: unkos-dev/reverie

jobs:
  # Job-level `if:` can't reference `matrix`, so the platform filter lives in its shape.
  prepare-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      # A `paths:` filter on the trigger would also filter tag pushes, silently
      # skipping a release build, so the gate lives here instead. Skipped on
      # tag/dispatch, where the empty output falls through as "build".
      build: ${{ steps.filter.outputs.image != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          # Keep in lockstep with the Dockerfile's COPY surface.
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'backend/**'
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docs/package.json'
              - 'version.txt'
              - '.github/workflows/docker-publish.yml'
      - id: set
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo 'matrix={"include":[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # OCI labels must be set at build time; `imagetools create` can't back-fill them.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          # Pinned: the floating stable-1 generator lags syft releases and
          # silently drops CycloneDX spec versions its bundled syft cannot
          # parse (the Dockerfile's frontend SBOM depends on this keeping
          # pace with SYFT_VERSION there).
          # renovate: datasource=docker depName=docker/buildkit-syft-scanner
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          cache-from: type=gha,scope=buildcache-${{ matrix.arch }}
          cache-to: type=gha,scope=buildcache-${{ matrix.arch }},mode=max
          # A cached runtime stage would freeze apt-get upgrade at its last
          # cold build, silently breaking the fixes-lead-the-base-image design.
          no-cache-filters: runtime

      # The CVE gate is layer analysis only; this actually executes the pushed
      # digest, so a non-executing image is never tagged or signed.
      - name: Boot smoke (entrypoint executes)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE_REF}@${BUILD_DIGEST}" print-config-schema | jq -e . > /dev/null
          echo "entrypoint OK: config schema is valid JSON"

      # Reports this runner's ephemeral store, not the persistent gha cache pool.
      - name: Local buildkit content store
        if: always()
        run: docker buildx du

      - name: Step summary
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "## Build cache report (arch=${ARCH})"
            echo
            echo "\`docker buildx du\` above shows this runner's local buildkit"
            echo "content store (ephemeral). Persistent gha cache state lives in"
            echo "the repo-level Actions cache pool. To confirm cooker layer"
            echo "reuse, inspect 'Build and push by digest' step log for"
            echo "per-stage \`CACHED\` lines."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export digest
        env:
          # Env-mapped, not interpolated: idiomatic hardening here.
          RUNNER_TEMP: ${{ runner.temp }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${BUILD_DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
    # Job-level block restates scopes: packages: write pushes the manifest
    # list; id-token: write mints the OIDC token cosign exchanges with Fulcio.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # cosign for keyless (Sigstore) signing of the published manifest list.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Needed for mise.toml, which pins the trivy version installed below;
      # image content comes from GHCR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            # THREAT: sha-<7> tags trigger staging auto-deploy, so mint them
            # for main only — a feature-branch dispatch must never land on a deployable tag.
            type=sha,prefix=sha-,enable=${{ github.ref_type != 'tag' && github.ref_name == 'main' }}

      # CVE-gate before tagging/signing: images exist only as untagged digests
      # here, so a failing scan stops the manifest list ever being created.
      - name: Install trivy (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.6"
          install_args: trivy
          # THREAT: this job signs and publishes on the privileged tag-push
          # trigger, so a cache entry an earlier push could have poisoned
          # would reach the released image. mise-action caches by default.
          cache: false

      # buildx with provenance/sbom pushes each per-arch "digest" as an OCI
      # index (real manifest + attestation manifest), and trivy can't resolve
      # an arm64-only index from this amd64 host — so enumerate the
      # non-attestation children and scan each manifest digest directly.
      - name: Scan image for vulnerabilities (gating)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          for digest in *; do
            raw=$(docker buildx imagetools inspect --raw "${IMAGE_REF}@sha256:${digest}")
            children=$(jq -r '
              if .manifests then
                .manifests[]
                | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                | .digest
              else
                empty
              end' <<<"$raw")
            if [ -z "$children" ]; then
              children="sha256:${digest}"
            fi
            for child in $children; do
              echo "::group::trivy scan ${IMAGE_REF}@${child}"
              trivy image \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                --no-progress \
                "${IMAGE_REF}@${child}" \
                || { echo "::endgroup::"; exit 1; }
              echo "::endgroup::"
            done
          done

      # Gate here, per untagged digest, before `imagetools create`: a manifest
      # list's SBOM is platform-keyed, so counting across it could let a
      # complete arm64 doc mask a broken amd64 one. Crates appear in the SBOM
      # only via `cargo auditable`; npm packages only via a CycloneDX doc
      # syft ingests — both are quiet mechanisms a refactor could break silently.
      - name: Verify SBOM covers application dependencies (gating)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          # Scratch file lives OUTSIDE this dir: manifest-create below globs
          # it as the digest list, and a stray file breaks every publish.
          sbom="${RUNNER_TEMP}/sbom-check.json"
          rc=0
          for digest in *; do
            ref="${IMAGE_REF}@sha256:${digest}"
            docker buildx imagetools inspect "$ref" \
              --format '{{ json .SBOM }}' > "$sbom"
            # No SBOM attestation inspects to JSON `null`, which is a failure.
            jq -e '. != null' "$sbom" > /dev/null \
              || { echo "::error::${ref} carries no SBOM attestation"; rc=1; continue; }
            count() {
              jq -r --arg p "$1" \
                '[.. | strings | select(startswith($p))] | length' "$sbom"
            }
            crates=$(count "pkg:cargo/")
            npm=$(count "pkg:npm/")
            debs=$(count "pkg:deb/")
            echo "sha256:${digest} -> ${crates} cargo, ${npm} npm, ${debs} deb"
            if [ "$crates" -eq 0 ]; then
              echo "::error::${ref} lists no cargo components. The release binary is probably no longer built with \`cargo auditable\`, so every crate is absent from its SBOM."
              rc=1
            fi
            if [ "$npm" -eq 0 ]; then
              echo "::error::${ref} lists no npm components. The frontend CycloneDX document is probably no longer present at /usr/share/reverie/sbom/ for syft to ingest, so every bundled frontend dependency is absent from its SBOM."
              rc=1
            fi
          done
          exit "$rc"

      # Provenance/SBOM attestations on the per-arch images carry through
      # to the resulting manifest list.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest_args=$(printf "${IMAGE_REF}@sha256:%s " *)
          # shellcheck disable=SC2086  # word-splitting intended on both
          docker buildx imagetools create $tag_args $digest_args

      - name: Inspect image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # meta.outputs.version is the first metadata-action tag — never attacker-controlled.
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE_REF}:${IMAGE_VERSION}"

      # Keyless: cosign exchanges this job's OIDC token for a short-lived
      # Fulcio certificate and records the signature in Rekor.
      - name: Sign published image (keyless)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Sign by immutable digest, never by tag: a tag can be re-pointed after signing.
          digest=$(docker buildx imagetools inspect "${IMAGE_REF}:${VERSION}" \
            --format '{{ .Manifest.Digest }}')
          # An empty-yet-exit-0 result would produce a malformed ref cosign
          # rejects with an opaque error; fail loud instead.
          [[ -n "$digest" ]] || { echo "::error::Failed to capture manifest digest for ${IMAGE_REF}:${VERSION}"; exit 1; }
          echo "Signing ${IMAGE_REF}@${digest}"
          cosign sign --yes "${IMAGE_REF}@${digest}"

  # Re-exports the buildkit-generated attestation (no second SBOM generation,
  # so the asset can't drift). Skipped on plain main pushes: no release
  # exists and the in-registry attestation covers staging.
  release-sbom:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - merge
    # contents: write uploads the release asset; packages: read pulls the
    # attestation. No id-token — nothing is signed here.
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Same version derivation as the merge job, so the ref matches what merge pushed.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Export SBOM from image attestation
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Fail the glob itself rather than hand jq a literal `*.spdx.json` path.
          shopt -s failglob
          mkdir -p sbom-out
          docker buildx imagetools inspect "${IMAGE_REF}:${IMAGE_VERSION}" \
            --format '{{ json .SBOM }}' > sbom-raw.json
          # No SBOM attestation inspects to JSON `null` — fail with a legible diagnostic.
          jq -e '. != null' sbom-raw.json > /dev/null \
            || { echo "::error::${IMAGE_REF}:${IMAGE_VERSION} carries no SBOM attestation"; exit 1; }
          # Single-platform inspect yields {"SPDX": …}; multi-platform yields
          # a platform-keyed map. Handle both shapes.
          if jq -e '.SPDX' sbom-raw.json > /dev/null; then
            jq '.SPDX' sbom-raw.json > "sbom-out/reverie-${IMAGE_VERSION}.spdx.json"
          else
            jq -r 'keys[]' sbom-raw.json | while read -r platform; do
              safe=${platform//\//-}
              jq --arg p "$platform" '.[$p].SPDX' sbom-raw.json \
                > "sbom-out/reverie-${IMAGE_VERSION}-${safe}.spdx.json"
            done
          fi
          # Fail loudly on empty or SPDX-less output rather than publish an empty asset.
          for f in sbom-out/*.spdx.json; do
            jq -e '.spdxVersion' "$f" > /dev/null \
              || { echo "::error::$f is not a valid SPDX document"; exit 1; }
          done
          ls -l sbom-out

      - name: Attach SBOM to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" sbom-out/*.spdx.json --clobber --repo "$REPO"

      # workflow_dispatch verification path: no release exists; surface the
      # exported SBOM as a downloadable artifact instead.
      - name: Upload SBOM as workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom-out/*.spdx.json
          if-no-files-found: error
