name: Docker Publish

# Two publication channels per
# adr/2026-05-12-platform-matrix-via-native-runners.md:
#   - `main`-branch push -> `:main` (floating) + `:sha-<7>` (immutable pin),
#     linux/arm64 only (the sole staging consumer is arm64).
#   - `v*` tag push      -> `:vX.Y.Z` + `:X.Y`, linux/amd64+arm64 manifest
#     list (public release boundary; self-hosters run mixed arches).
# `:latest` is reserved for the first semver release.
#
# Build shape: `prepare-matrix` emits the include list for the trigger,
# `build` runs one job per arch on a native runner (no QEMU) and pushes by
# digest, `merge` assembles and tags the manifest list.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  # Ad-hoc rebuilds and feature-branch verification of workflow changes
  # that wouldn't otherwise fire on a non-main push.
  workflow_dispatch:

# Least privilege at the top; build/merge widen to packages: write
# themselves.
permissions:
  contents: read

# Serialize per-ref runs without cancelling in-flight builds: a
# near-complete publish (build → merge → sign) must never be aborted by a
# newer push. The build is idempotent, so sequential runs are the right
# trade.
concurrency:
  group: docker-publish-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: unkos-dev/reverie

jobs:
  # Job-level `if:` cannot reference the `matrix` context, so the
  # per-trigger platform filter lives in the matrix shape.
  prepare-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      # Branch pushes build only when an image input changed; tag pushes
      # and manual dispatches always build. A `paths:` filter on the push
      # trigger cannot express this split — it would also filter tag
      # pushes, and a silently skipped release build is unacceptable — so
      # the gate lives here. The filter step is skipped on tag/dispatch, in
      # which case its empty output falls through as "build".
      build: ${{ steps.filter.outputs.image != 'false' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          # Image inputs: the definition files plus everything the build
          # context COPYs. Keep in lockstep with the Dockerfile's COPY
          # surface.
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'backend/**'
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docs/package.json'
              - '.github/workflows/docker-publish.yml'
      - id: set
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo 'matrix={"include":[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    # Bounded well above observed build time but far below the 6h default
    # so a hung build fails fast.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # OCI labels must be set at per-arch build time — `imagetools create`
      # cannot back-fill labels into already-pushed image configs. Tag
      # assignment happens in `merge` against the final manifest list.
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=buildcache-${{ matrix.arch }}
          cache-to: type=gha,scope=buildcache-${{ matrix.arch }},mode=max

      # The CVE gate downstream is layer analysis and never executes the
      # binary; this does, on the digest just pushed, natively on this
      # runner's arch. print-config-schema exercises the entrypoint,
      # dynamic linking, and the config structs with no database, and must
      # emit valid JSON. Full /health readiness needs a live Postgres and
      # is the staging smoke's remit. Failing here stops the merge job, so
      # a non-executing image is never tagged or signed.
      - name: Boot smoke (entrypoint executes)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE_REF}@${BUILD_DIGEST}" print-config-schema | jq -e . > /dev/null
          echo "entrypoint OK: config schema is valid JSON"

      # `buildx du` reports the *ephemeral* buildkit content store on this
      # runner, not the persistent gha cache pool — useful for spotting
      # whether the build hydrated the local store, not a substitute for
      # inspecting the repo Actions cache.
      - name: Local buildkit content store
        if: always()
        run: docker buildx du

      - name: Step summary
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "## Build cache report (arch=${ARCH})"
            echo
            echo "\`docker buildx du\` above shows this runner's local buildkit"
            echo "content store (ephemeral). Persistent gha cache state lives in"
            echo "the repo-level Actions cache pool. To confirm cooker layer"
            echo "reuse, inspect 'Build and push by digest' step log for"
            echo "per-stage \`CACHED\` lines."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export digest
        env:
          # Env-mapped rather than interpolated into the run body; both are
          # trusted here, but env-mapping is the idiomatic hardening on a
          # privileged GHCR-publish workflow.
          RUNNER_TEMP: ${{ runner.temp }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${BUILD_DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
    # A job-level block replaces the workflow-level grant, so the scopes
    # this job relies on must be restated alongside id-token:
    #   - packages: write — push the manifest list to GHCR.
    #   - id-token: write — mint the OIDC token cosign exchanges with
    #     Fulcio for a short-lived keyless signing certificate.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # cosign for keyless (Sigstore) signing of the published manifest
      # list.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # The composite checkout below only fetches the local action
      # definition; the image content comes from GHCR digests.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            # THREAT: immutable sha-<7> tags are the staging auto-deploy
            # trigger, so they are minted for main only — a workflow_dispatch
            # on a feature branch must be able to verify the full publish
            # pipeline without putting unreviewed code on a deployable tag.
            type=sha,prefix=sha-,enable=${{ github.ref_type != 'tag' && github.ref_name == 'main' }}

      # CVE-gate the image BEFORE it is tagged and signed — signing an
      # unscanned artifact is attestation theatre. Placement is
      # load-bearing: the per-arch images exist in GHCR only as untagged
      # digests here, so a failing scan stops the manifest list from ever
      # being created, tagged, or signed. Keep this pin in lockstep with
      # ci.yml's.
      - name: Install trivy
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
          version: "0.71.2"
          sha256: "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460"
          url: "https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_Linux-64bit.tar.gz"
          binary: trivy
          archive-member: trivy

      # Blocking on fixable HIGH/CRITICAL CVEs; unfixed CVEs are excluded —
      # they would block every publish until a distro fix ships, with no
      # action available to us. Cross-platform scanning is layer analysis,
      # not execution, so the amd64 runner scans arm64 images fine.
      #
      # Indirection: buildx with provenance/sbom pushes each per-arch
      # "digest" as an OCI image *index* whose children are the real image
      # manifest plus an attestation manifest. trivy resolves an index via
      # the scanner host's platform, which an arm64-only index doesn't
      # carry — so enumerate the non-attestation children and scan each
      # child manifest digest directly.
      - name: Scan image for vulnerabilities (gating)
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          for digest in *; do
            raw=$(docker buildx imagetools inspect --raw "${IMAGE_REF}@sha256:${digest}")
            children=$(jq -r '
              if .manifests then
                .manifests[]
                | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                | .digest
              else
                empty
              end' <<<"$raw")
            if [ -z "$children" ]; then
              children="sha256:${digest}"
            fi
            for child in $children; do
              echo "::group::trivy scan ${IMAGE_REF}@${child}"
              trivy image \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                --no-progress \
                "${IMAGE_REF}@${child}" \
                || { echo "::endgroup::"; exit 1; }
              echo "::endgroup::"
            done
          done

      # Provenance/SBOM attestations on the per-arch images are preserved
      # on the resulting manifest list.
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          tag_args=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest_args=$(printf "${IMAGE_REF}@sha256:%s " *)
          # shellcheck disable=SC2086  # word-splitting intended on both
          docker buildx imagetools create $tag_args $digest_args

      - name: Inspect image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # meta.outputs.version is the first metadata-action tag — semver
          # on a release-tag push, the branch name on a push to main —
          # never attacker-controlled.
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE_REF}:${IMAGE_VERSION}"

      # Keyless Sigstore signing of every published image: cosign exchanges
      # this job's OIDC token for a short-lived Fulcio certificate and
      # records the signature in the public Rekor transparency log — no
      # long-lived private key to store or rotate.
      - name: Sign published image (keyless)
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Sign by immutable digest, never by tag: a tag can be re-pointed
          # after signing; the digest cannot. The manifest-list digest
          # transitively covers every per-arch image beneath it.
          digest=$(docker buildx imagetools inspect "${IMAGE_REF}:${VERSION}" \
            --format '{{ .Manifest.Digest }}')
          # set -e aborts if inspect itself fails, but an empty-yet-exit-0
          # result would produce a malformed `…@` ref that cosign rejects
          # with an opaque error; fail loud and attributable instead.
          [[ -n "$digest" ]] || { echo "::error::Failed to capture manifest digest for ${IMAGE_REF}:${VERSION}"; exit 1; }
          echo "Signing ${IMAGE_REF}@${digest}"
          cosign sign --yes "${IMAGE_REF}@${digest}"

  # Surface the image SBOM where release-page consumers expect it. The
  # buildkit-generated SBOM attestation on the published image stays the
  # authoritative copy; this job re-exports that same attestation — no
  # second SBOM generation, so the release asset cannot drift from the
  # image. Runs on `v*` tags (attach to the GitHub Release) and on
  # workflow_dispatch (workflow artifact only — no release to attach to).
  # Skipped on plain main pushes: no release exists and the in-registry
  # attestation covers staging.
  release-sbom:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - merge
    # contents: write only to upload the release asset; packages: read to
    # pull the attestation from GHCR. No id-token — nothing is signed here.
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # Same version derivation as the merge job, so the inspected ref is
      # identical to what merge just pushed.
      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Export SBOM from image attestation
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Unmatched globs (empty sbom-out) must fail the glob itself, not
          # hand a literal `*.spdx.json` path to jq's opaque ENOENT.
          shopt -s failglob
          mkdir -p sbom-out
          docker buildx imagetools inspect "${IMAGE_REF}:${IMAGE_VERSION}" \
            --format '{{ json .SBOM }}' > sbom-raw.json
          # An image published without an SBOM attestation inspects to JSON
          # `null` — fail with a legible diagnostic.
          jq -e '. != null' sbom-raw.json > /dev/null \
            || { echo "::error::${IMAGE_REF}:${IMAGE_VERSION} carries no SBOM attestation"; exit 1; }
          # Single-platform inspect yields {"SPDX": …}; a multi-platform
          # index yields a platform-keyed map. Handle both so the job works
          # for the single-arch staging shape and the multi-arch release
          # shape alike.
          if jq -e '.SPDX' sbom-raw.json > /dev/null; then
            jq '.SPDX' sbom-raw.json > "sbom-out/reverie-${IMAGE_VERSION}.spdx.json"
          else
            jq -r 'keys[]' sbom-raw.json | while read -r platform; do
              safe=${platform//\//-}
              jq --arg p "$platform" '.[$p].SPDX' sbom-raw.json \
                > "sbom-out/reverie-${IMAGE_VERSION}-${safe}.spdx.json"
            done
          fi
          # Empty or SPDX-less attestation output must fail loudly, not
          # publish an empty asset.
          for f in sbom-out/*.spdx.json; do
            jq -e '.spdxVersion' "$f" > /dev/null \
              || { echo "::error::$f is not a valid SPDX document"; exit 1; }
          done
          ls -l sbom-out

      - name: Attach SBOM to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" sbom-out/*.spdx.json --clobber --repo "$REPO"

      # workflow_dispatch verification path: no release exists; surface the
      # exported SBOM as a downloadable artifact instead.
      - name: Upload SBOM as workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom-out/*.spdx.json
          if-no-files-found: error
