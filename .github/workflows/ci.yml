name: CI

on:
  # Run on pushes to main so coverage is uploaded for main's head commit.
  # PRs are squash-merged, which lands a new SHA on main that no
  # pull_request run ever tested — without a push trigger, Codecov never
  # receives a default-branch report and the coverage badge reads "unknown".
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas of the repo changed so downstream jobs can skip
  # entirely when their inputs are untouched. Documentation-only PRs
  # (CLAUDE.md, README, /plans/, etc.) skip the heavy jobs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      audit: ${{ steps.filter.outputs.audit }}
      frontend: ${{ steps.filter.outputs.frontend }}
      staging: ${{ steps.filter.outputs.staging }}
      workflows: ${{ steps.filter.outputs.workflows }}
      iac: ${{ steps.filter.outputs.iac }}
      openapi: ${{ steps.filter.outputs.openapi }}
      npm: ${{ steps.filter.outputs.npm }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          # On merge_group events, paths-filter's default base (HEAD~1)
          # only sees the topmost commit in the synthetic merge ref —
          # it would miss the diff for any PR sharing the queue. Pin
          # explicitly to merge_group.base_sha so downstream skip
          # decisions match the actual PR-against-main diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - 'docker/init-roles.sql'
              - 'docker/compose.dev.yml'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            audit:
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - 'backend/deny.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            staging:
              - 'docker/compose.staging.yml'
              - 'docker/init-roles.sql'
              - 'docker/staging.env.bootstrap.example'
              - 'docker/staging.env.runtime.example'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
              # zizmor reads .github/zizmor.yml; a suppression edit must
              # re-run the workflow-security scan even with no workflow change.
              - '.github/zizmor.yml'
            iac:
              # trivy config (IaC misconfiguration) inputs: every Dockerfile
              # and compose file, wherever it lives. A .trivyignore edit must
              # re-run the scan even with no IaC change (same rationale as
              # the zizmor.yml entry above).
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker/**'
              - '.trivyignore'
              - '.github/workflows/ci.yml'
            openapi:
              # checkov OpenAPI policy inputs. A .checkov.yaml suppression
              # edit must re-run the scan even with no spec change (same
              # rationale as the zizmor.yml entry above).
              - 'docs/openapi.json'
              - '.checkov.yaml'
              - '.github/workflows/ci.yml'
            npm:
              # npm license gate inputs: any of the three npm trees'
              # manifests or lockfiles. Licenses only change when the
              # dependency tree changes, so PR-time gating here is
              # complete — no cron needed (unlike advisories, which have
              # temporal drift; see scheduled-audit.yml).
              - 'package.json'
              - 'package-lock.json'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'docs/package.json'
              - 'docs/package-lock.json'
              - '.github/workflows/ci.yml'
            docs:
              # The generated reference artifacts (docs/openapi.json,
              # reference/configuration.mdx) live under docs/, so a backend
              # regen that updates them trips this filter too — no separate
              # backend trigger needed (a stale-but-unregenerated artifact is
              # caught by the backend job's drift tests instead).
              - 'docs/**'
              - '.github/workflows/ci.yml'
              # docs.yml carries its own astro build; a docs.yml-only PR must
              # still run the docs gate here rather than first failing on the
              # post-merge deploy lane.
              - '.github/workflows/docs.yml'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reverie
          POSTGRES_PASSWORD: reverie
          POSTGRES_DB: reverie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reverie -d reverie_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # `sqlx::test` connects as the schema owner to create per-test databases
      # and run migrations against them; role pools for reverie_app /
      # reverie_ingestion are built per-test in code.
      DATABASE_URL: postgres://reverie:reverie@localhost:5432/reverie_dev
      # Single source of truth for the sqlx-cli pin. Both the cache key
      # and the `cargo install` invocation reference this; bumping it in
      # one place without the other would let a stale binary be restored.
      SQLX_CLI_VERSION: "0.9.0"
      # CI build-speed tweaks (CI-only — local dev untouched).
      #
      # Incremental builds add metadata-tracking overhead that's wasted in
      # CI's single-shot scenario. rust-cache's own README recommends
      # disabling for CI.
      CARGO_INCREMENTAL: 0
      # Trim test/dev debuginfo to `line-tables-only`: keeps panic
      # backtraces with `file:line` but drops full debug symbols. Cuts
      # link size + link time meaningfully (~10-20% on a 600-dep
      # workspace) without hiding panic detail in CI logs. Local dev
      # keeps default `debug = true` because `CARGO_PROFILE_*` is a
      # process-env override, not a Cargo.toml mutation.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # mold linker via GCC's `-fuse-ld=` driver flag (GCC 12+ supports
      # mold directly; Ubuntu 24.04 ships GCC 13). Cuts link time by
      # roughly 5-10× vs default `ld`, which is the single-threaded
      # bottleneck at the end of every cargo invocation. First CI run
      # after this PR pays a one-time rust-cache miss (RUSTFLAGS is part
      # of the cache key); subsequent runs see the speedup.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # The sqlx-cli version that regenerates/checks the `.sqlx` offline
      # cache must track the `sqlx` *crate* version, or `cargo sqlx prepare
      # --check` validates against a cache produced by a mismatched
      # proc-macro. Both are hand-set in different files (the crate in
      # backend/Cargo.toml, the cli pin here), so Renovate bumping one
      # without a human mirroring the other is a silent within-repo drift.
      # This guard anchors on the crate (the source) and fails loud if the
      # cli pin (the copy) lags. Homelab's Coder-image guard anchors on the
      # same crate version for its sqlx-cli pin.
      - name: sqlx-cli pin matches sqlx crate version
        run: |
          # This step runs in the job's default working-directory (backend/),
          # so Cargo.toml is relative; the ::error file= paths below stay
          # repo-root-relative for GitHub's annotation resolver.
          crate="$(yq -p toml -o yaml '.dependencies.sqlx.version // .dependencies.sqlx' Cargo.toml)"
          case "$crate" in
            [0-9]*.[0-9]*) ;;
            *)
              echo "::error file=backend/Cargo.toml::could not parse sqlx crate version (got '$crate'); the dependency shape may have changed — update this guard"
              exit 1
              ;;
          esac
          if [ "$crate" != "$SQLX_CLI_VERSION" ]; then
            echo "::error file=.github/workflows/ci.yml::SQLX_CLI_VERSION ($SQLX_CLI_VERSION) != sqlx crate version ($crate in backend/Cargo.toml) — keep the cli pin in lockstep with the crate"
            exit 1
          fi
          echo "sqlx-cli pin ($SQLX_CLI_VERSION) matches sqlx crate ($crate)"

      - name: Create database roles
        run: psql postgres://reverie:reverie@localhost:5432/reverie_dev -f docker/init-roles.sql
        working-directory: ${{ github.workspace }}

      # mold itself; the RUSTFLAGS at the job level routes the linker
      # invocation through it. Installs in ~5s from apt; pinned-version
      # not required because mold is ABI-compatible at the linker
      # interface and the binary is exercised only at build time.
      - name: Install mold linker
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends mold

      # SHA-pinned: dtolnay/rust-toolchain reads the toolchain from the
      # git ref name (`@stable`), so pinning to a SHA requires naming the
      # channel explicitly via `toolchain:`.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          # llvm-tools-preview ships the llvm-profdata/llvm-cov binaries
          # cargo-llvm-cov shells out to for instrumentation-based coverage.
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: backend

      # sqlx-cli has no upstream prebuilt binaries (launchbadge/sqlx never
      # publishes GitHub release assets and has no quickinstall mirror), so
      # install-action's only path was a 2-minute `cargo install` from source
      # on every run. Two-pronged fix:
      #
      # 1. Feature-trim — drop sqlite, mysql, native-tls, completions; keep
      #    only rustls + postgres (Reverie's actual surface). Cuts the
      #    cold-cache compile to ~60-90s.
      # 2. Dedicated cache keyed on sqlx-cli version + features alone (not
      #    workspace Cargo.lock). Renovate-triggered lock churn no longer
      #    invalidates the binary cache. Warm-cache restore is ~5s.
      #
      # If the sqlx-cli version or features change, bump the cache key
      # suffix so a stale binary isn't restored.
      - name: Cache sqlx-cli binary
        id: cache-sqlx-cli
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SQLX_CLI_VERSION }}-postgres-rustls

      - name: Install sqlx-cli (cache miss only)
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        # No `--locked`: sqlx-cli 0.9 stopped shipping Cargo.lock in its
        # published crate (the sqlx workspace dropped lockfile git-tracking),
        # so `cargo install --locked sqlx-cli` errors with no lockfile to honour.
        run: cargo install sqlx-cli --version ${{ env.SQLX_CLI_VERSION }} --no-default-features --features rustls,postgres

      # cargo-nextest replaces the default `cargo test` runner for the
      # Test step below; cargo-llvm-cov wraps that run to collect
      # instrumentation-based coverage. install-action ships prebuilt
      # binaries for both, so this is a ~5s download.
      - uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: cargo-nextest@0.9,cargo-llvm-cov@0.8.7

      - name: Apply migrations
        run: sqlx migrate run

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Phase 1 of the tiered comment policy rollout
      # (adr/2026-05-08-tiered-comment-policy.md). No missing-docs
      # requirement yet — just kills broken intra-doc cross-refs in the
      # docstrings that already exist. `cargo doc` over the workspace
      # without `--document-private-items` is the conservative scope:
      # pub items only, matching Tier 1 surface.
      - name: Doc lint (broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: cargo doc --no-deps --workspace

      # UNK-167: drift guard on the committed .sqlx/ query cache. Every
      # `cargo sqlx prepare` regeneration must be checked in; CI fails if
      # cache is stale relative to query macros + live schema.
      - name: Check sqlx query cache freshness
        run: cargo sqlx prepare --check -- --tests

      # UNK-375: drift guard on the committed config JSON Schema. The schema is
      # generated from the config structs by `print-config-schema`; a stale
      # commit (struct changed but schema not regenerated) fails here — the same
      # contract as the .sqlx cache above. UNK-370's config reference renders
      # from this artifact. `--quiet --locked` keeps stdout to the schema alone.
      - name: Check config schema freshness
        run: cargo run --quiet --locked -- print-config-schema | diff -u config.schema.json -

      # The schema descriptions are the config structs' doc-comments (schemars
      # folds them in). The Vale gate covers Markdown but not this generated
      # JSON, so a doc-comment em dash that surfaces only here would otherwise
      # escape. Match the raw U+2014 UTF-8 bytes (`LC_ALL=C` + fixed-string) so
      # the check never depends on grep's PCRE or locale support: a PCRE-mode
      # grep that rejected `\x{2014}` would exit non-zero and let the `if` pass
      # the gate open. Fix: recast the source doc-comment and regenerate.
      - name: Guard against em dashes in the config schema
        run: |
          if LC_ALL=C grep -nF $'\xe2\x80\x94' config.schema.json; then
            echo "::error::config.schema.json contains an em dash (lines above); recast the source doc-comment in backend/src/config and regenerate." >&2
            exit 1
          fi

      # UNK-172: grep-guard against new runtime `sqlx::query[*](...)`
      # invocations creeping back in. Allowlist documents legitimate
      # carve-outs (DDL, dynamic SQL, set_config GUC, enum-drift probes).
      - name: Guard against new runtime sqlx::query invocations
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Allowlist must exist and hold at least one active pattern; a
          # missing file or empty pattern set fails the step here (set -e)
          # instead of failing open downstream.
          allow=$(grep -vE '^\s*(#|$)' .github/sqlx-runtime-allowlist.txt)
          # grep exit 1 = no runtime sqlx (clean tree); exit >1 = real
          # error (e.g. unreadable tree). Capture the code so an error
          # can't read as "clean". Same shape as the .route( guard below.
          rc=0
          matches=$(grep -rnE 'sqlx::query[a-z_]*\(' backend/src/) || rc=$?
          if [ "$rc" -gt 1 ]; then
              exit "$rc"
          fi
          violations=''
          if [ -n "$matches" ]; then
              rc=0
              violations=$(grep -v -F -f <(printf '%s\n' "$allow") <<<"$matches") || rc=$?
              if [ "$rc" -gt 1 ]; then
                  exit "$rc"
              fi
          fi
          if [ -n "$violations" ]; then
              echo "Disallowed runtime sqlx::query invocations detected." >&2
              echo "Use compile-time macros (query!, query_as!, query_scalar!)" >&2
              echo "or add a justified entry to .github/sqlx-runtime-allowlist.txt." >&2
              echo "" >&2
              echo "$violations" >&2
              exit 1
          fi

      # UNK-379: grep-guard against raw `.route(` registrations creeping in
      # outside the OpenAPI pipeline. Every shipped endpoint must register via
      # `OpenApiRouter` + `routes!(...)` backed by a `#[utoipa::path]`
      # annotation so the generated spec stays complete (UNK-376). Allowlist
      # documents the exempt sites (test-only routers, justified carve-outs).
      - name: Guard against undocumented raw .route( registrations
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Allowlist must exist and hold at least one active pattern; a
          # missing file or empty pattern set fails the step here (set -e)
          # instead of failing open downstream.
          allow=$(grep -vE '^\s*(#|$)' .github/axum-route-allowlist.txt)
          # grep exit 1 = no raw routes (clean tree); exit >1 = real error
          # (e.g. unreadable tree). Capture the code so an error can't
          # read as "clean".
          rc=0
          matches=$(grep -rnE '\.route\(' backend/src/) || rc=$?
          if [ "$rc" -gt 1 ]; then
              exit "$rc"
          fi
          violations=''
          if [ -n "$matches" ]; then
              rc=0
              violations=$(grep -v -F -f <(printf '%s\n' "$allow") <<<"$matches") || rc=$?
              if [ "$rc" -gt 1 ]; then
                  exit "$rc"
              fi
          fi
          if [ -n "$violations" ]; then
              echo "Raw .route( registrations detected outside the allowlist." >&2
              echo "Register endpoints via OpenApiRouter + routes!(...) with #[utoipa::path]," >&2
              echo "or add a justified entry to .github/axum-route-allowlist.txt." >&2
              echo "" >&2
              echo "$violations" >&2
              exit 1
          fi

      # UNK-378: grep-guard against chrono imports creeping back into
      # runtime code. Reverie standardises on the `time` crate
      # (backend/CLAUDE.md); chrono exists in Cargo.toml solely for
      # openidconnect's test-support signature (see the dependency
      # comment there). Previously enforced only by a CodeRabbit
      # path_instruction — this is the native equivalent. Same
      # allowlist shape as the sqlx + .route( guards above.
      - name: Guard against chrono usage in runtime code
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Allowlist must exist and hold at least one active pattern; a
          # missing file or empty pattern set fails the step here (set -e)
          # instead of failing open downstream.
          allow=$(grep -vE '^\s*(#|$)' .github/chrono-allowlist.txt)
          # grep exit 1 = no chrono imports (clean tree); exit >1 = real
          # error (e.g. unreadable tree). Capture the code so an error
          # can't read as "clean".
          rc=0
          matches=$(grep -rnE 'use chrono|extern crate chrono' backend/src/) || rc=$?
          if [ "$rc" -gt 1 ]; then
              exit "$rc"
          fi
          violations=''
          if [ -n "$matches" ]; then
              rc=0
              violations=$(grep -v -F -f <(printf '%s\n' "$allow") <<<"$matches") || rc=$?
              if [ "$rc" -gt 1 ]; then
                  exit "$rc"
              fi
          fi
          if [ -n "$violations" ]; then
              echo "chrono imports detected outside the allowlist." >&2
              echo "Reverie uses the time crate (backend/CLAUDE.md); chrono is" >&2
              echo "reserved for the documented openidconnect test-support carve-out." >&2
              echo "Justify any new entry in .github/chrono-allowlist.txt." >&2
              echo "" >&2
              echo "$violations" >&2
              exit 1
          fi

      # nextest runs each test in its own process — better parallelism
      # than the default thread-per-test runner, and a crashing test
      # can't take down its siblings. Each `#[sqlx::test]` already gets
      # an isolated per-test database, so the per-process model adds
      # connection pressure (default nextest fans out to one process
      # per CPU; ubuntu-latest = 4 vCPUs × ~10 conns/process ≈ 40
      # concurrent conns vs. Postgres's default `max_connections=100`).
      # Comfortable headroom; first cold-run on this PR validates it
      # empirically.
      # Single pass: run the nextest suite under llvm-cov instrumentation
      # and emit an LCOV report for Codecov. cargo-llvm-cov keeps its
      # instrumented build in a separate target dir (target/llvm-cov-target),
      # so it neither disturbs nor reuses the regular build above.
      - name: Test (with coverage)
        run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info

      # nextest does not run doctests. Reverie has none today, but the
      # tiered comment policy (`adr/2026-05-08-tiered-comment-policy.md`)
      # will add examples on Tier 1 surface; keep this step so doctest
      # drift fails CI from day one. Near-instant while empty.
      - name: Doctests
        run: cargo test --doc --workspace

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: backend/lcov.info
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage is informational — a Codecov outage or a missing/expired
          # token must never red-X the build.
          fail_ci_if_error: false

  # UNK-327: MSRV floor enforcement. backend/Cargo.toml declares a
  # `rust-version`; this job compiles the whole workspace on exactly that
  # pinned toolchain so a dependency bump or new syntax that silently raises
  # the real minimum fails CI here instead of breaking self-hosters who build
  # from source on the documented floor. Compile-only (`cargo check`) against
  # the committed .sqlx cache (SQLX_OFFLINE) — no Postgres service needed,
  # since this verifies the toolchain, not runtime behaviour.
  msrv:
    name: MSRV check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # Use the committed query cache so no live database is required.
      SQLX_OFFLINE: "true"
      # Single-shot CI build — incremental metadata tracking is pure overhead.
      CARGO_INCREMENTAL: 0
    steps:
      # Read-only job (compile check) — keep the token out of .git/config.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Read the MSRV straight from Cargo.toml so the toolchain this job pins
      # and the declared `rust-version` can never drift apart. The sed anchors
      # on `^rust-version` and stops at the first quote (`[^"]*"`), so it
      # captures the *value's* version even if a trailing inline comment carries
      # another quoted version (a greedy `.*"..."` would grab the comment's
      # number and silently install the wrong toolchain). `|| true` lets a
      # dropped field flow through as empty (grep exits 1 under pipefail
      # otherwise) so the format guard — not an opaque pipe failure — reports
      # it. The guard also rejects a malformed value (e.g. unquoted `1.91`,
      # which the sed passes through whole).
      - name: Resolve declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/^rust-version[^"]*"([0-9.]+)".*/\1/' || true)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Could not extract a valid rust-version from backend/Cargo.toml (got: '${version}')" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The pinned SHA is dtolnay/rust-toolchain's `stable` tag; the
      # `toolchain:` input overrides which channel is actually installed, so
      # the same action revision installs the MSRV toolchain here.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: backend

      # --locked forbids the resolver from upgrading to newer, higher-MSRV
      # dependency versions than the committed lockfile; --all-targets ensures
      # tests and benches compile on the floor too, not just lib + bin.
      - name: Check workspace builds on MSRV
        run: cargo check --workspace --all-targets --locked

  audit:
    name: Dependency policy (cargo-deny)
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      # Prebuilt cargo-deny (GitHub Releases via install-action) instead of
      # `cargo install` from source. Mirrors the nextest/llvm-cov/typos install
      # pattern; version pinned (Renovate's install-action customManager keeps
      # it current).
      - uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: cargo-deny@0.19.8
          # Fail closed: without this, install-action falls back to
          # cargo-binstall/cargo-install if a prebuilt is unavailable, silently
          # changing the install source. A security scanner's provenance must be
          # deterministic, so a missing prebuilt should fail the job, not drift.
          fallback: none
      # Replaces the former `cargo audit` step. cargo-deny's `advisories` check
      # reads the same RustSec database, so advisory coverage is unchanged;
      # `cargo deny check` additionally enforces the license, ban, and source
      # policy in backend/deny.toml. Advisory suppressions (RUSTSEC-2023-0071,
      # RUSTSEC-2026-0097) and their justifications live in deny.toml's
      # [advisories].ignore.
      - name: Check dependencies (advisories, licenses, bans, sources)
        run: cargo deny check

  # UNK-327: PR-gate newly-introduced vulnerable dependencies. Diffs the PR's
  # dependency manifest against the base branch and fails on any added crate or
  # npm package carrying a known advisory at/above the severity floor. This
  # complements the other two layers: cargo-deny scans the whole lockfile
  # (already-present advisories), Renovate reacts post-merge, and this gates
  # the introduction inline on the PR. pull_request-only — the action compares
  # base..head and has no diff to evaluate on push or merge_group, so it is
  # gated to PR events and counts as a pass (skipped) for the CI gate
  # elsewhere. contents:read (job inherits the workflow default) is sufficient;
  # no PR comment is emitted, so pull-requests:write is deliberately not
  # granted.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Read-only job — the action talks to the dependency-review API via the
      # job's GITHUB_TOKEN env, not .git/config, so dropping persisted creds
      # costs nothing and keeps the token off disk.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # License policy is owned by cargo-deny (backend/deny.toml) to avoid a
          # second, drifting allowlist; this layer gates vulnerabilities only.
          fail-on-severity: moderate

  # UNK-245: catch syntax / context-availability violations in workflow
  # files before merge. Mirrors the `actionlint` invocation wired into
  # the lefthook pre-commit hook; both pin the same version so local + CI
  # behaviour cannot drift.
  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Direct curl-tarball install pins the exact upstream release.
      # taiki-e/install-action's manifest doesn't track actionlint@1.7.12,
      # so it falls through to cargo-install which fails (actionlint is a
      # Go binary, not a Rust crate). Mirrors the install instructions in
      # CONTRIBUTING.md so local + CI use the same artefact.
      - name: Install actionlint v1.7.12
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$HOME/.local/bin" actionlint
          rm "$tarball"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint workflow files
        run: actionlint -color

  # UNK-327: workflow-security scanner. actionlint (above) checks workflow
  # syntax and context availability; zizmor checks the security class neither
  # actionlint nor CodeQL's actions analyzer covers — credential persistence
  # (artipacked), template injection in run blocks, cache poisoning of
  # privileged deploys, dangerous triggers (pull_request_target), and
  # over-broad permissions. Relevant here because label.yml uses
  # pull_request_target and docker-publish.yml is a privileged GHCR deployer.
  workflow-security:
    name: Workflow security (zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          # Gate mode: fail the job on any finding rather than uploading SARIF
          # to code-scanning (CodeQL already owns that surface). This keeps the
          # job at contents:read — SARIF upload would need security-events:write
          # — and makes a finding a hard red, not a silently-filed Security-tab
          # entry that does not block merge.
          advanced-security: false
          # Pin the zizmor binary so a new upstream release cannot silently add
          # findings and break the gate on an unrelated PR; bump deliberately.
          # Matches the version the workflow baseline was triaged against.
          version: "1.25.2"

  # UNK-378: IaC misconfiguration scan over the Dockerfile and compose
  # files. hadolint (repo-lint below) lints Dockerfile instruction syntax;
  # trivy config checks the security-misconfiguration class it doesn't —
  # root-user defaults, missing healthchecks, privileged/host-mode compose
  # services, secrets-in-env shapes. Gates on HIGH/CRITICAL to match the
  # image-scan gate in docker-publish.yml. Suppressions live in
  # .trivyignore with per-finding justification (zizmor discipline).
  iac-scan:
    name: IaC misconfig (trivy)
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Same pinned curl-tarball install as docker-publish.yml; keep the
      # two TRIVY_VERSION pins in lockstep when bumping.
      - name: Install trivy v0.71.2
        env:
          # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
          TRIVY_VERSION: "0.71.2"
          TRIVY_SHA256: "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$HOME/.local/bin" trivy
          rm "$tarball"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Scope to the container/IaC surface rather than the whole tree:
      # workflow security is zizmor's remit and Starlight/docs templates
      # are not deployable IaC. --skip-dirs keeps node_modules and target
      # noise out on a cold cache.
      - name: Scan IaC for misconfigurations (gating)
        run: |
          set -euo pipefail
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs node_modules,frontend/node_modules,docs/node_modules,backend/target \
            --skip-dirs .github \
            .

  # UNK-378 (scope addition from UNK-380): checkov OpenAPI policy gate over
  # the generated docs/openapi.json. Enforces the API-spec security-policy
  # class nothing else covers — securitySchemes present and non-cleartext
  # (CKV_OPENAPI_3), global security rules defined (CKV_OPENAPI_4),
  # operation-level security coverage (CKV_OPENAPI_5), no global apiKey
  # over cleartext. CKV_OPENAPI_4/5 are acceptance criteria for
  # UNK-380/UNK-376. Suppressions, if ever needed, live in .checkov.yaml
  # with per-finding justification (zizmor discipline). Scoped to the
  # openapi framework — Dockerfile/compose misconfig is trivy's remit
  # (iac-scan), workflow security is zizmor's.
  openapi-policy:
    name: OpenAPI policy (checkov)
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # checkov is pip-only (no standalone release binary), so it installs
      # via pipx like yamllint above. Version pinned so a new upstream
      # policy cannot silently add findings and break the gate on an
      # unrelated PR; bump deliberately.
      - name: Install checkov 3.3.0
        run: pipx install checkov==3.3.0

      # --config-file makes the suppression registry explicit; every skip
      # in .checkov.yaml carries a justification and lift condition.
      - name: Scan OpenAPI spec (gating)
        run: checkov -f docs/openapi.json --framework openapi --compact --config-file .checkov.yaml

  # UNK-378: npm license-policy gate — the counterpart of cargo-deny's
  # [licenses] allowlist (backend/deny.toml), which covers only the Rust
  # tree. Without this, a copyleft npm dependency can enter any of the
  # three npm trees unreviewed (dependency-review-action gates only
  # *vulnerabilities* on PR-introduced deps, not licenses).
  #
  # Scope: --production of each tree. The licensing surface that matters
  # is what we *distribute* (the frontend bundle, the published docs
  # site); dev tooling is not redistributed, so even a GPL dev tool is
  # fine. The root tree has no production deps today — included anyway so
  # one added later is gated from day one.
  #
  # Allowlist mirrors deny.toml's permissive-only set, extended with the
  # permissive licenses actually present in the npm trees (BlueOak-1.0.0,
  # Python-2.0). The exceptions below are all build-time-only native
  # tooling whose compiled output (images, CSS) ships, but whose own
  # code never lands in the site output, so their licenses do not bind
  # the project. Each is excluded by name prefix, not by license, so the
  # gate still fails any other package carrying these licenses:
  #   - @img/sharp-libvips-* (LGPL-3.0): sharp's libvips image prebuilts.
  #   - lightningcss* (MPL-2.0): Astro 7 / Vite 8 CSS transform; output is
  #     plain CSS, the MPL-covered binary is not redistributed.
  #   - satteri / @bruits/satteri-* (MIT upstream, no license field
  #     published): Astro 7 default Markdown processor prebuilts. Upstream
  #     bruits/satteri is MIT; the npm packages omit the field, reading as
  #     UNKNOWN until that pre-1.0 packaging gap is fixed.
  # The prefix form covers the per-arch package name variants.
  npm-license:
    name: npm license policy
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.16.0

      # license-checker reads node_modules, so each tree needs a real
      # install. npx pin (-y, exact version) keeps the scanner itself
      # deterministic; bump deliberately.
      - name: Check npm licenses (gating)
        run: |
          set -euo pipefail
          allow="MIT;Apache-2.0;ISC;0BSD;BSD-2-Clause;BSD-3-Clause;BlueOak-1.0.0;CC0-1.0;Python-2.0;Unlicense"
          rc=0
          for tree in . frontend docs; do
            echo "::group::npm ci + license check (${tree})"
            (
              cd "$tree"
              npm ci
              npx -y license-checker-rseidelsohn@5.0.1 \
                --production \
                --excludePrivatePackages \
                --excludePackagesStartingWith "@img/sharp-libvips;@bruits/satteri;satteri;lightningcss" \
                --onlyAllow "$allow"
            ) || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  # UNK-378: rule-based SAST. Primary motivation is backfilling Rust,
  # where CodeQL's extractor resolves only ~47% of call targets (UNK-109)
  # — pattern-matching rules don't depend on call-graph resolution, so
  # they catch what CodeQL structurally cannot. Engine: opengrep (the
  # Linux Foundation fork of semgrep) — fully OSS, no telemetry, signed
  # release binaries, semgrep-compatible rules and CLI. Ruleset: the
  # rust + typescript packs from opengrep/opengrep-rules, SHA-pinned so
  # upstream rule additions can't break the gate on an unrelated PR.
  # Custom repo-specific rules can join later under .opengrep/rules/.
  sast:
    name: SAST (opengrep)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Rules checked out read-only at a pinned commit; bump deliberately
      # after reviewing upstream rule diffs.
      - name: Checkout opengrep-rules (pinned)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: opengrep/opengrep-rules
          ref: f1d2b562b414783763fd02a6ed2736eaed622efa
          path: .opengrep-rules
          persist-credentials: false

      # Standalone signed binary; SHA256-pinned like the other scanner
      # installs (actionlint/shellcheck/gitleaks/trivy pattern).
      - name: Install opengrep v1.22.0
        env:
          # renovate: datasource=github-releases depName=opengrep/opengrep extractVersion=^v(?<version>.+)$
          OPENGREP_VERSION: "1.22.0"
          OPENGREP_SHA256: "45bcd58440e397ed52c50e953ccf5948909ea77087c9186fc7d277216f62e319"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/v${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $HOME/.local/bin/opengrep" | sha256sum -c -
          chmod +x "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --error exits non-zero on any finding. Security packs only — the
      # full language packs bundle best-practice and portability rules
      # (props-spreading, i18n) that are the linter's remit and pure style
      # noise here; this gate is a security scanner, not a second linter.
      #
      # Tests are not excluded wholesale: a blanket file drop is a coverage
      # blind spot (a hardcoded secret, or a helper later promoted to
      # production, sitting in a test file would go unseen). A test that
      # legitimately exercises an insecure API is carved out per-line with
      # `// nosemgrep: <rule-id>` at the call site — the same call-site-
      # scoped, self-documenting shape as the clippy `#[expect(...)]`
      # carve-outs (#468), not a silent file drop.
      #
      # Excluded rule, with justification (zizmor discipline):
      #   rust.lang.security.args — audit-class rule firing on ANY
      #   std::env::args use; main.rs reads argv for CLI subcommand
      #   dispatch (`reverie migrate`), not for security decisions, and
      #   the rule has no way to tell the difference. The rule-ID prefix
      #   (`opengrep-rules.`) is the rules-checkout `path:` above — opengrep
      #   derives rule IDs from the config path, so keep the two in lockstep
      #   when renaming, or the exclusion silently stops matching.
      - name: Scan source (gating)
        run: |
          set -euo pipefail
          opengrep scan \
            --config .opengrep-rules/rust/lang/security \
            --config .opengrep-rules/typescript/lang/security \
            --config .opengrep-rules/typescript/react/security \
            --exclude-rule opengrep-rules.rust.lang.security.args \
            --error \
            backend/src frontend/src

  # Server-side lint gate for shell scripts, the Dockerfile, spelling, YAML,
  # and Markdown. The lefthook pre-commit hook runs these locally, but pre-commit
  # is client-side: it is bypassable (`git commit --no-verify`) and never runs on
  # PRs opened from forks. This job is the authoritative surface for contributor
  # changes. Tool versions are pinned to match the workspace image so local
  # pre-commit and CI evaluate against the same binaries.
  repo-lint:
    name: Repo lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # just is a Rust crate (install-action tracks it directly, unlike the
      # curl-tarball tools below). Pinned to the workspace-image version
      # (hard-rule-8) to keep local and CI on one just. The lint steps below
      # call the infra.just / js.just recipes, so each tool's globs and flags
      # are CI's single definition instead of inline duplicates.
      - name: Install just
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: just@1.53.0

      # Direct curl-tarball install pins the exact upstream release + SHA256,
      # mirroring the actionlint install above. taiki-e/install-action carries
      # neither shellcheck nor hadolint; both publish official release binaries.
      - name: Install shellcheck v0.9.0
        env:
          # renovate: datasource=github-releases depName=koalaman/shellcheck extractVersion=^v(?<version>.+)$
          SHELLCHECK_VERSION: "0.9.0"
          SHELLCHECK_SHA256: "700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball" --strip-components=1 -C "$HOME/.local/bin" \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm "$tarball"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install hadolint 2.14.0
        env:
          # renovate: datasource=github-releases depName=hadolint/hadolint extractVersion=^v(?<version>.+)$
          HADOLINT_VERSION: "2.14.0"
          HADOLINT_SHA256: "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  $HOME/.local/bin/hadolint" | sha256sum -c -
          chmod +x "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # typos ships official release binaries that install-action tracks; pin
      # to the workspace-image version.
      - uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: typos@1.46.2

      # Scoping (git ls-files vs the typos tree-walk) lives in the infra.just
      # recipes; this job calls them rather than inlining the commands.
      - name: Shell lint (shellcheck)
        run: just infra::shellcheck

      - name: Dockerfile lint (hadolint)
        run: just infra::hadolint

      - name: Spell check (typos)
        run: just infra::typos

      # yamllint is pip-only (no standalone release binary), so it installs via
      # pipx (preinstalled on ubuntu-latest) rather than the curl-tarball path
      # used for shellcheck and hadolint above. Version pinned to the yamllint
      # the workspace image ships (hard-rule-8: tooling lands in the image
      # first), keeping local pre-commit and CI on the same linter. Config is
      # the repo-root .yamllint.yaml, auto-discovered from the working directory.
      - name: Install yamllint 1.33.0
        run: pipx install yamllint==1.33.0

      - name: YAML lint (yamllint)
        run: just infra::yamllint

      # markdownlint-cli2 is npm-only (no standalone release binary), so unlike
      # shellcheck/hadolint/typos it needs Node + an install. `npm ci` off the
      # committed root lockfile keeps the CI version in lockstep with the
      # markdownlint-cli2 the lefthook pre-commit hook runs locally.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install markdownlint-cli2
        run: npm ci

      # markdownlint is a js-plane recipe (it runs the npm-local markdownlint-cli2
      # installed by the npm ci above). The .claude/ exclusion and pathspec scope
      # live in the js::markdownlint recipe.
      - name: Markdown lint (markdownlint-cli2)
        run: just js::markdownlint

      # Vale prose linter. Catches mechanical AI-writing tells in Markdown docs.
      # Vale is a Go binary with official release archives, so it installs via
      # the SHA-pinned curl-tarball path used for shellcheck and hadolint above
      # (taiki-e/install-action does not carry it). Pinned to the version the
      # workspace image ships (hard-rule-8), keeping local pre-commit and CI on
      # the same linter.
      - name: Install Vale 3.15.1
        env:
          # renovate: datasource=github-releases depName=errata-ai/vale extractVersion=^v(?<version>.+)$
          VALE_VERSION: "3.15.1"
          VALE_SHA256: "c024d9c157874fb043d4f24a055d60050d1bb18755251f590593eed5bace1857"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tarball="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${tarball}"
          echo "${VALE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$HOME/.local/bin" vale
          rm "$tarball"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The ruleset self-test (stdin snippets, no fixtures on disk) is the gate:
      # it fails the build if a prose rule stops firing or starts matching clean
      # prose. jq ships on ubuntu-latest.
      - name: Prose lint self-test (Vale ruleset)
        run: just infra::vale-selftest

      # Scope-policy test for vale-lint.sh: asserts the include/exclude
      # classification (agent-process docs, .claude, non-scope paths) and the
      # ./ path normalisation, the second half of the prose-lint gate.
      - name: Prose lint scope test (vale-lint.sh)
        run: just infra::vale-scope-test

      # The prose pass is a hard gate: every rule emits at `error`, so Vale
      # exits non-zero on any finding and fails the build. Scope is prose only
      # (YAML frontmatter and table structure excluded; the ADR tree is exempt
      # from the Wh-opener rule). New slop in the Starlight docs, ADRs, or
      # repo-root Markdown fails CI.
      - name: Prose lint (Vale)
        run: just infra::prose

      # Authoritative formatting gate. The pre-commit hook runs `oxfmt --write`
      # on staged files locally, but pre-commit is bypassable (`--no-verify`)
      # and never runs on fork PRs; this whole-tree `--check` is the surface
      # that actually fails the build. The `js::fmt-check` recipe owns the
      # invocation; the `ignorePatterns` in `.oxfmtrc.json` scope it (vendored
      # shadcn/ui, archival .claude docs, build output). Uses the oxfmt from the
      # `npm ci` above, in lockstep with local.
      - name: Format check (oxfmt)
        run: just js::fmt-check

      # Validate the Greptile review-context config: greptile.json must parse and
      # every customContext.files[] path it pins must still resolve. A pin to a
      # moved or superseded file degrades reviews silently, so this turns a stale
      # pin into a loud failure. Unconditional (not changed-files gated) so a PR
      # that deletes or moves a pinned file fails here even if it never touches
      # greptile.json. jq ships on ubuntu-latest.
      - name: Validate greptile.json
        run: just infra::greptile-config

      # Validate lefthook.yml parses and its job graph is well-formed. This gate
      # is net-new in CI (the recipe existed but nothing called it), so a broken
      # hooks config now fails the build instead of only surfacing on the next
      # local commit.
      - name: Validate lefthook.yml
        run: just infra::lefthook-validate

      # Reject issue-tracker references (UNK- + digits) in public-facing source
      # and docs — they describe the codebase/product, not a private tracker,
      # and such a reference is usually a symptom that the whole comment/passage
      # narrates process/deferred work. Changed-files only: paths-filter lists
      # the candidate files that differ from the PR base, and
      # scripts/no-issue-refs.sh applies the in-scope policy (source + Markdown,
      # minus agent-process / vendored / archival files) and greps them — so
      # pre-existing references in untouched files don't fail the build (a
      # pre-release sweep clears those). The lefthook pre-commit hook is the local mirror.
      - name: Detect changed source and docs
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: source-changed
        with:
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          list-files: json
          filters: |
            source:
              - 'backend/src/**/*.rs'
              - 'frontend/src/**/*.{ts,tsx,js,jsx,css}'
              - '**/*.{md,mdx}'

      # source_files is a JSON array; pass it through an env var (not inline
      # `${{ }}` in the script) and parse with jq so the run block stays free
      # of template interpolation. NUL-delimited (jq -j … + "\u0000" / mapfile
      # -d '') so a filename containing a newline can't be split and bypass the
      # guard. `shell: bash` is explicit — mapfile + process substitution are
      # bash-only, and this self-documents rather than relying on the runner
      # default.
      - name: Reject issue-tracker refs in changed source
        if: steps.source-changed.outputs.source == 'true'
        shell: bash
        env:
          SOURCE_FILES: ${{ steps.source-changed.outputs.source_files }}
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(printf '%s' "$SOURCE_FILES" | jq -j '.[] + "\u0000"')
          if [ "${#files[@]}" -gt 0 ]; then
            just infra::no-issue-refs "${files[@]}"
          fi

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # just walks up to the repo-root justfile from this frontend/ working
      # directory, and each js:: recipe re-enters frontend/ via its own
      # [working-directory], so the calls resolve correctly. A uses: step
      # ignores the job's working-directory, so install-action runs fine here.
      - name: Install just
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: just@1.53.0

      - name: Lint
        run: just js::oxlint

      - name: Test (with coverage)
        run: just js::test-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage is informational — a Codecov outage or a missing/expired
          # token must never red-X the build.
          fail_ci_if_error: false

      - name: Stylelint
        run: just js::stylelint

      # impeccable design anti-pattern detector (advisory). Flip to
      # blocking once the 3 known `bg-black` findings in stock shadcn
      # overlays are addressed (see memory entry
      # `project_bg_black_overlays_deferred`).
      - name: Detect (impeccable, advisory)
        run: just js::detect
        continue-on-error: true

      - name: Verify font integrity
        run: just js::font-integrity

      - name: Build
        run: just js::build

  # UNK-268: WCAG 2.2 AA accessibility gate. Runs axe-core (via agent-browser
  # over CDP) against the dev-only design showcase and fails on any violation
  # outside the documented allowlist in frontend/scripts/a11y/allowlist.mjs.
  # Frontend-conditional so docs/backend-only PRs skip it (and the ci-gate
  # aggregator treats a skip as a pass).
  #
  # Driver = agent-browser, not @axe-core/cli: the cli's bundled chromedriver is
  # x64-only and unusable on the ARM64 dev workspace, so the gate would not be
  # locally reproducible. agent-browser drives a CDP browser on both arches. The
  # showcase routes are dev-only (registered under import.meta.env.DEV), so axe
  # MUST run against `npm run dev`, never the production build.
  a11y:
    name: Accessibility (axe)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # agent-browser is a verification-stack binary (hard-rule-8): pinned to the
      # workspace-image version, fail-closed (no `command -v` fallback). The local
      # ARM workspace points it at Brave via AGENT_BROWSER_EXECUTABLE; on the x86
      # CI runner `install --with-deps` fetches the Chromium it drives by default.
      #
      # Integrity: unlike the curl-tarball installs above (actionlint, shellcheck,
      # gitleaks — SHA256-pinned), the Chromium binary is fetched by agent-browser's
      # own installer from an opaque, version-derived URL we don't control, so there
      # is no stable artifact to SHA-pin. Integrity is delegated to the version-
      # pinned npm package (`agent-browser@0.27.0`, registry-served). Scope-limited:
      # the browser only drives a read-only axe scan of our own local dev server —
      # not a privileged/deploy context — so the residual supply-chain surface is low.
      - name: Install agent-browser 0.27.0
        run: |
          set -euo pipefail
          npm install -g agent-browser@0.27.0
          agent-browser install --with-deps

      # The design showcase exists only under `npm run dev`. Start it, wait for
      # readiness, then run the gate — both in one step so the backgrounded server
      # shares the step's lifetime. The gate writes a11y-results.json regardless
      # of pass/fail; the upload step captures it on always(). `npm run a11y` is
      # the last command, so its exit code is the step's (a violation = red).
      #
      # Blocking: fails the job (and the ci-gate aggregator) on any WCAG 2.2 AA
      # violation outside frontend/scripts/a11y/allowlist.mjs. Shipped advisory
      # during rollout while the default-Badge contrast violation (UNK-345) sat
      # un-allowlisted; UNK-345 shipped (PR #434), the showcase baseline is now
      # clean, so the gate blocks.
      - name: Run accessibility gate
        run: |
          npm run dev > /tmp/vite-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/design/system > /dev/null; then
              echo "dev server ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "dev server did not become ready in 60s" >&2
              cat /tmp/vite-dev.log >&2
              exit 1
            fi
            sleep 1
          done
          npm run a11y

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a11y-results
          path: frontend/a11y-results.json
          if-no-files-found: warn

  # UNK-185: smoke test the staging compose init path. Catches role-clause
  # regressions in init-roles.sql and required-env-var regressions in the
  # compose `${VAR:?required}` interpolations before they land on staging.
  # Postgres-only `up` — the `reverie` service isn't booted (no image
  # available in this lane; the init surface under test is postgres).
  staging-smoke:
    name: Staging compose smoke
    needs: changes
    if: needs.changes.outputs.staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Build .env from the committed example to also catch regressions where
      # a required key is renamed in compose.staging.yml but not in the
      # example (debt entry's failure mode #2). Distinct passwords per role
      # so a swapped CREATE ROLE clause in init-roles.sql can't authenticate
      # cross-role and pass silently.
      - name: Prepare env files from examples
        working-directory: docker
        run: |
          set -euo pipefail
          cp staging.env.bootstrap.example .env
          # `.env.runtime` and `.env.migrate` are required: true on the
          # reverie / reverie-migrate services; compose validates env_file
          # presence at parse time even when those services aren't started.
          # Populate with stub values — never read since neither is started.
          cp staging.env.runtime.example .env.runtime
          cp staging.env.migrate.example .env.migrate
          # Use `=.*` (not `=$`) so substitutions remain robust if the
          # example files ever acquire non-empty default values; an exact-
          # empty anchor would silently no-op and the smoke would fail
          # later at auth with an opaque 28P01. REVERIE_MIGRATOR_PASSWORD is
          # `${...:?required}` on postgres now, so leaving it empty would make
          # compose hard-fail interpolation at `up` — a distinct value here is
          # mandatory.
          sed -i \
            -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=smoke_super_pw_1|' \
            -e 's|^REVERIE_APP_PASSWORD=.*|REVERIE_APP_PASSWORD=smoke_app_pw_2|' \
            -e 's|^REVERIE_INGESTION_PASSWORD=.*|REVERIE_INGESTION_PASSWORD=smoke_ing_pw_3|' \
            -e 's|^REVERIE_READONLY_PASSWORD=.*|REVERIE_READONLY_PASSWORD=smoke_ro_pw_4|' \
            -e 's|^REVERIE_MIGRATOR_PASSWORD=.*|REVERIE_MIGRATOR_PASSWORD=smoke_mig_pw_5|' \
            -e 's|^REVERIE_VERSION=.*|REVERIE_VERSION=smoke-test|' \
            .env

      - name: Bring up postgres service
        run: docker compose -f docker/compose.staging.yml up -d --wait --wait-timeout 120 reverie-postgres

      # Assert init-roles.sql actually provisioned the three runtime roles
      # with LOGIN and CONNECT grant on POSTGRES_DB. `docker compose exec`
      # keeps the psql client version matched to the server image (postgres:18).
      - name: Assert roles exist with CONNECT grant
        run: |
          set -euo pipefail
          exec_psql() {
            docker compose -f docker/compose.staging.yml exec -T \
              -e PGPASSWORD=smoke_super_pw_1 \
              reverie-postgres psql -v ON_ERROR_STOP=1 -At \
              -U reverie -d reverie "$@"
          }
          for role in reverie_app reverie_ingestion reverie_readonly reverie_migrator; do
            exists=$(exec_psql -c "SELECT 1 FROM pg_roles WHERE rolname = '${role}' AND rolcanlogin")
            if [ "$exists" != "1" ]; then
              echo "Role ${role} missing or cannot login" >&2
              exit 1
            fi
            # Query pg_database.datacl directly (not has_database_privilege)
            # so a regression that deletes the explicit GRANT CONNECT lines
            # from init-roles.sql is caught even while Postgres' default
            # PUBLIC -> CONNECT grant is still in place. has_database_privilege
            # returns true via PUBLIC and would mask the deletion.
            has_connect=$(exec_psql -c "SELECT EXISTS (SELECT 1 FROM pg_database d, aclexplode(d.datacl) acl WHERE d.datname = current_database() AND acl.grantee = (SELECT oid FROM pg_roles WHERE rolname = '${role}') AND acl.privilege_type = 'CONNECT')")
            if [ "$has_connect" != "t" ]; then
              echo "Role ${role} lacks an explicit CONNECT grant on $(exec_psql -c 'SELECT current_database()')" >&2
              exit 1
            fi
          done

      # Authenticate as each runtime role with the password we supplied via
      # env. Catches `LOGIN PASSWORD` clause regressions in init-roles.sql
      # (the 28P01-at-runtime failure mode the debt entry calls out).
      - name: Assert each role authenticates with its supplied password
        run: |
          set -euo pipefail
          login_as() {
            local role=$1 pw=$2
            docker compose -f docker/compose.staging.yml exec -T \
              -e PGPASSWORD="${pw}" \
              reverie-postgres psql -v ON_ERROR_STOP=1 -At \
              -h localhost -U "${role}" -d reverie -c 'SELECT 1' >/dev/null
          }
          login_as reverie_app       smoke_app_pw_2
          login_as reverie_ingestion smoke_ing_pw_3
          login_as reverie_readonly  smoke_ro_pw_4
          login_as reverie_migrator  smoke_mig_pw_5

      # The migration identity must not be a superuser, create roles, or
      # bypass RLS (adr/2026-06-02-hybrid-migration-entrypoints-and-role.md).
      # Scope of this assertion: it catches *active* escalation — a CREATE
      # ROLE with SUPERUSER/CREATEROLE/BYPASSRLS, or a later ALTER ROLE that
      # adds one. It does NOT catch deletion of the explicit NOSUPERUSER
      # NOCREATEROLE NOBYPASSRLS clause from init-roles.sql, because those are
      # the Postgres CREATE ROLE defaults — removing the clause yields the
      # same f|f|f. That clause is retained for audit-legibility; its presence
      # is guarded by code review, not by this check.
      - name: Assert reverie_migrator is not over-privileged
        run: |
          set -euo pipefail
          attrs=$(docker compose -f docker/compose.staging.yml exec -T \
            -e PGPASSWORD=smoke_super_pw_1 \
            reverie-postgres psql -v ON_ERROR_STOP=1 -At \
            -U reverie -d reverie \
            -c "SELECT rolsuper, rolcreaterole, rolbypassrls FROM pg_roles WHERE rolname = 'reverie_migrator'")
          if [ "$attrs" != "f|f|f" ]; then
            echo "reverie_migrator is over-privileged: rolsuper|rolcreaterole|rolbypassrls = ${attrs} (want f|f|f)" >&2
            exit 1
          fi

      # The migrator's two non-obvious grants make migrations actually work and
      # are flagged load-bearing in init-roles.sql: CREATE on the database (for
      # `CREATE SCHEMA tower_sessions` in the initial migration) and CREATE on
      # schema public (PG15+ revoked the implicit PUBLIC grant). Role-exists /
      # login / f|f|f all stay green if either is dropped — only a real DDL
      # round-trip catches it. One statement exercises both (schema create =
      # database CREATE; table-in-schema = schema CREATE), leaving no residue.
      - name: Assert reverie_migrator has DDL capability
        run: |
          set -euo pipefail
          docker compose -f docker/compose.staging.yml exec -T \
            -e PGPASSWORD=smoke_mig_pw_5 \
            reverie-postgres psql -v ON_ERROR_STOP=1 -At \
            -h localhost -U reverie_migrator -d reverie \
            -c "CREATE SCHEMA _smoke_ddl; CREATE TABLE _smoke_ddl.probe (id int); DROP SCHEMA _smoke_ddl CASCADE;"

      # Threat-model backstop: the long-lived app must hold zero DDL
      # credentials, so DATABASE_URL_MIGRATION must reach `reverie-migrate` and
      # NOT the `reverie` app service. Asserted against the fully-rendered
      # config so a future edit that inlines it under `reverie` or adds it to
      # `.env.runtime` fails here instead of shipping green. Parse-time only —
      # no running container needed; runs while env files are still intact
      # (before the negative-path step blanks a var).
      - name: Assert DATABASE_URL_MIGRATION is scoped to reverie-migrate only
        working-directory: docker
        run: |
          set -euo pipefail
          rendered=$(docker compose -f compose.staging.yml config)
          if ! awk '/^  reverie-migrate:/{f=1} f && /^  [a-z]/ && !/^  reverie-migrate:/{f=0} f' <<<"$rendered" \
               | grep -q 'DATABASE_URL_MIGRATION'; then
            echo "DATABASE_URL_MIGRATION missing from reverie-migrate service config" >&2
            exit 1
          fi
          if awk '/^  reverie:/{f=1} f && /^  [a-z]/ && !/^  reverie:/{f=0} f' <<<"$rendered" \
               | grep -q 'DATABASE_URL_MIGRATION'; then
            echo "DATABASE_URL_MIGRATION leaked into the reverie app service — credential isolation broken" >&2
            exit 1
          fi

      - name: Tear down postgres service
        if: always()
        run: docker compose -f docker/compose.staging.yml down -v

      # Negative path: blank a required env var, run `compose config`, assert
      # the `${VAR:?required}` interpolation surfaces a hard fail. `config`
      # is sufficient because variable substitution happens at parse time;
      # no daemon spin-up needed. Key-name presence in stderr is the
      # load-bearing signal — exact wording of compose's error message is
      # not pinned across versions.
      #
      # `if: !cancelled()` ensures this step runs even if the happy-path
      # assertions failed — otherwise a regression in the `:?required`
      # mechanism would be silently skipped behind any earlier failure,
      # since `compose config` is independent of the live containers.
      - name: Assert missing required env var hard-fails
        if: ${{ !cancelled() }}
        working-directory: docker
        run: |
          set -euo pipefail
          sed -i 's|^REVERIE_APP_PASSWORD=.*|REVERIE_APP_PASSWORD=|' .env
          if stderr=$(docker compose -f compose.staging.yml config 2>&1 >/dev/null); then
            echo "Expected compose config to fail with missing REVERIE_APP_PASSWORD, but it succeeded" >&2
            echo "stderr was:" >&2
            echo "${stderr}" >&2
            exit 1
          fi
          if ! grep -qF REVERIE_APP_PASSWORD <<<"${stderr}"; then
            echo "compose config failed but stderr did not mention REVERIE_APP_PASSWORD" >&2
            echo "stderr was:" >&2
            echo "${stderr}" >&2
            exit 1
          fi

  # Server-side secret scan. gitleaks runs as a husky pre-commit hook
  # (`gitleaks protect --staged`), but pre-commit is client-side: bypassable
  # (`git commit --no-verify`) and never runs on fork PRs. CLAUDE.md hard-rule-8
  # asserts a server-side secret-scan guarantee the hook alone cannot give.
  # Intentionally unconditional — no `changes` path filter: a secret can land
  # in markdown, .env.example, or any non-code file, so every PR is scanned.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so the pull_request scan below can walk the whole
          # branch range (base..HEAD), not just the tip commit.
          fetch-depth: 0
          # This job only reads the filesystem; do not persist the auth token
          # into the checked-out repo's .git/config — least privilege for the
          # one job whose whole purpose is to find credentials.
          persist-credentials: false

      # Direct curl-tarball install pins the exact upstream release + SHA256,
      # mirroring the actionlint/shellcheck/hadolint installs. gitleaks is a Go
      # binary; install-action does not carry it. Version matches the
      # workspace-image gitleaks the pre-commit hook uses, so local and CI
      # evaluate against the same scanner.
      - name: Install gitleaks v8.30.1
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$HOME/.local/bin" gitleaks
          rm "$tarball"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # On a pull_request, scan every commit the branch introduces
      # (`base..HEAD`) via git mode — not just the HEAD tree. A secret added and
      # later removed within the same branch is gone from the working tree but
      # stays permanently readable in the pushed branch history, so a HEAD-only
      # `dir` scan would pass while the credential is still exposed. On
      # push/merge_group there is no PR base, so fall back to a full-tree `dir`
      # scan of the checkout. --redact keeps any match out of the public CI log.
      - name: Scan for secrets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA}" ]; then
            gitleaks git . --no-banner --redact --log-opts "${PR_BASE_SHA}..HEAD"
          else
            gitleaks dir . --no-banner --redact
          fi

  # Build the Starlight docs site and gate on broken internal links. This is
  # the PR-time docs build: docs.yml no longer triggers on pull_request (it
  # keeps the push-to-main + tag Pages deploy), so the build lives here where
  # it can join ci-gate. Cross-workflow `needs` is impossible, which is why the
  # job is duplicated into ci.yml rather than referenced from docs.yml. A
  # skipped docs job (no docs/** change) is treated as a pass by ci-gate's
  # always()/failure-only aggregator, so this does not re-introduce the
  # skip-blocks-merge trap (#406).
  docs:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # No npm cache: this build mirrors docs.yml, which deliberately drops the
      # cache to close a cache-poisoning surface shared with the Pages deploy
      # path (zizmor cache-poisoning; UNK-327). The install is small.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.16.0

      - name: Install docs dependencies
        run: cd docs && npm ci

      - name: Build Starlight
        run: cd docs && npm run build

      # Starlight builds with base path /reverie/, so internal links render as
      # root-relative /reverie/...; lychee resolves a root-relative /X against
      # --root-dir as <root-dir>/X. Expose docs/dist under a `reverie` subdir
      # and point --root-dir at its parent so /reverie/X resolves to
      # docs/dist/X. A symlink avoids duplicating the built site. (Mirrors
      # docs.yml.)
      - name: Stage built docs at the Pages base path
        run: |
          mkdir -p "${RUNNER_TEMP}/linkroot"
          ln -sfn "${GITHUB_WORKSPACE}/docs/dist" "${RUNNER_TEMP}/linkroot/reverie"

      # Internal/relative links are deterministic and under our control, so a
      # broken one fails the build. --offline resolves file/relative links with
      # no network IO, so this gating pass cannot flake. External-URL checking
      # stays in docs.yml (advisory, on main) — not duplicated into the gate.
      - name: Check internal links (gating)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: "--offline --no-progress --root-dir ${{ runner.temp }}/linkroot ${{ runner.temp }}/linkroot/reverie"
          fail: true

  # UNK-378: server-side Conventional Commits gate. The local commit-msg
  # hook (UNK-274) is bypassable (`git commit --no-verify`) and never runs
  # on fork PRs, yet release-please's changelog and linear-close.yml's
  # UNK-extraction both depend on commit shape. Two surfaces are linted:
  #
  #   1. Every commit the PR introduces (base..head) — keeps branch
  #      history greppable and linear-close's branch/title extraction sane.
  #   2. The PR title — squash-merge makes the title the subject of the
  #      commit that actually lands on main, which is the artifact
  #      release-please consumes. Linting only branch commits would miss
  #      the one message that matters.
  #
  # pull_request-only: push/merge_group events have no PR range or title;
  # ci-gate treats the skip as a pass (same shape as dependency-review).
  commitlint:
    name: Commit message lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so commitlint can walk the whole PR range
          # (base..head), not just the tip commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.16.0
          cache: npm

      # Root lockfile carries @commitlint/cli + config-conventional — the
      # same pinned versions the local commit-msg hook runs.
      - name: Install commitlint
        run: npm ci

      # Event-payload SHAs, not refs: base.sha pins the fork point even if
      # the base branch moves mid-run, and neither value is
      # attacker-controlled text (zizmor template-injection surface is
      # refs/titles, handled via env below).
      - name: Lint PR commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # GitHub appends ` (#N)` to the squash subject; commitlint parses it
      # as part of the subject, so linting the bare title matches what
      # release-please will see.
      - name: Lint PR title (squash-merge subject)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose

  # UNK-378: hard-rule-9 (CLAUDE.md) requires a `Closes UNK-XXX` magic word
  # in every PR body that has a tracking issue — linear-close.yml's
  # branch/title extraction is the fallback, and Linear's own
  # branch-name matching is unreliable against our prefix convention.
  # Until now nothing enforced the rule pre-merge (UNK-276 shipped without
  # it and its issue sat stuck in Backlog).
  #
  # Advisory for now: emits a workflow warning + step-summary note instead
  # of failing, so legitimate no-issue PRs (docs/, chore/ without an id)
  # are never blocked while the convention beds in. Graduation to blocking
  # = swap the final `exit 0` for `exit 1`.
  pr-linear-ref:
    name: PR body Linear reference (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # PR body and branch name are attacker-controlled text on fork PRs —
      # both reach the script via env, never template interpolation.
      - name: Check for Closes UNK-N magic word
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if grep -qiE 'closes UNK-[0-9]+' <<<"${PR_BODY}"; then
            echo "PR body carries a Closes UNK-N magic word."
            exit 0
          fi
          # Legitimate no-issue class: docs/ or chore/ branch with no
          # embedded issue id. Everything else should either close its
          # issue or be renamed into the no-issue convention.
          if grep -qE '^(docs|chore)/' <<<"${HEAD_REF}" && ! grep -qiE 'unk-[0-9]+' <<<"${HEAD_REF}"; then
            echo "No-issue branch (${HEAD_REF}) — Closes line not required."
            exit 0
          fi
          msg="PR body lacks a 'Closes UNK-N' line. Hard-rule-9: without the magic word the Linear issue is never auto-closed on merge (branch-name matching is unreliable). Add 'Closes UNK-XXX' to the PR body, or use a docs/ or chore/ branch without an issue id if genuinely untracked."
          echo "::warning title=Missing Closes UNK-N in PR body::${msg}"
          {
            echo "## PR body Linear reference (advisory)"
            echo ""
            echo "${msg}"
          } >> "$GITHUB_STEP_SUMMARY"
          # Advisory: never red. Flip to 'exit 1' to graduate to blocking.
          exit 0

  # Single required status check for the branch ruleset. Aggregates every CI
  # job so the ruleset requires only this one context. Path-conditional jobs
  # that legitimately skip on a given PR (docs-only, frontend-only, etc.) no
  # longer leave an individually-required check unsatisfied — the trap that
  # blocked docs PRs from merging. Fails only when a needed job actually
  # failed or was cancelled; `skipped` is treated as a pass.
  #
  # `if: always()` is load-bearing: without it the gate would itself be
  # skipped when an upstream job fails, and GitHub reports a skipped required
  # check as success — which would let a broken build merge.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - backend
      - msrv
      - audit
      - dependency-review
      - workflow-lint
      - workflow-security
      - repo-lint
      - frontend
      - a11y
      - staging-smoke
      - secret-scan
      - iac-scan
      - openapi-policy
      - npm-license
      - sast
      - docs
      - commitlint
      - pr-linear-ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "$RESULTS"
          exit 1
