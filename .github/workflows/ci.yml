name: CI # sonar.yml's workflow_run trigger matches this string; renaming either orphans it silently.

# Display only, and independent of `name:` above, so the sonar.yml coupling is untouched.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1}', github.event.number, github.event.pull_request.title)
   || github.event_name == 'merge_group' && 'merge queue'
   || format('main: {0}', github.event.head_commit.message) }}

on:
  # PRs are squash-merged, so main's head commit is a SHA no pull_request run
  # analyzed; push keeps SonarQube Cloud's baseline current.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# A cancelled main-push run once wiped the Sonar coverage baseline; PR runs
# still cancel freely.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Kept in lockstep with the sqlx crate version by the backend-checks guard below.
  SQLX_CLI_VERSION: "0.9.0"

jobs:
  # Every filter includes ci.yml itself: a workflow edit must re-run the jobs it defines.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      audit: ${{ steps.filter.outputs.audit }}
      frontend: ${{ steps.filter.outputs.frontend }}
      staging: ${{ steps.filter.outputs.staging }}
      workflows: ${{ steps.filter.outputs.workflows }}
      iac: ${{ steps.filter.outputs.iac }}
      docker: ${{ steps.filter.outputs.docker }}
      openapi: ${{ steps.filter.outputs.openapi }}
      npm: ${{ steps.filter.outputs.npm }}
      docs: ${{ steps.filter.outputs.docs }}
      kache: ${{ steps.kache.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Resolved once here so every job that needs it reads one source, not a drifting copy.
      - name: Resolve pinned build-cache version
        id: kache
        run: |
          set -euo pipefail
          version=$(awk '
            /^\[tools\."github:kunobi-ninja\/kache"\]/ { in_kache = 1; next }
            in_kache && /^\[/ { exit }
            in_kache && /^version[[:space:]]*=/ { gsub(/[^0-9.]/, ""); print; exit }
          ' mise.toml || true)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not extract a valid kache version from mise.toml (got: '${version}')" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # merge_group's default base (HEAD~1) sees only the synthetic merge ref's
          # topmost commit; pin to base_sha to match the PR-against-main diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          # scripts/preflight-scope.sh reads the same file, so the two cannot drift.
          filters: .github/path-filters.yml

  backend-checks:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same digest compose.dev.yml pins, for dev/CI postgres parity.
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: reverie
          POSTGRES_PASSWORD: reverie
          POSTGRES_DB: reverie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reverie -d reverie_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # sqlx::test connects as the schema owner; per-test role pools are built in code.
      DATABASE_URL: postgres://reverie:reverie@localhost:5432/reverie_dev
      # Debuginfo deliberately absent here: backend/Cargo.toml declares it, so both
      # planes compile the same way without two settings having to agree.
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # A captured runner log is never a terminal, so cargo needs colour forced.
      CARGO_TERM_COLOR: always
      # Belt and braces with the object-read credentials below: a pull request is told
      # not to write to the store main restores from, not just relying on the bucket.
      KACHE_REMOTE_READONLY: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
      # -fmerge-all-constants is deterministic codegen so is safe to allowlist; kache
      # otherwise refuses to cache it and zstd-sys recompiles every run. Set via env,
      # not .kache.toml: these compiles run under ~/.cargo/registry, which the repo
      # is not an ancestor of.
      KACHE_CC_EXTRA_ALLOWLIST_FLAGS: -fmerge-all-constants
      # Fork PRs have no repository secrets, so the remote doesn't exist for them; they
      # fall back to the target/ tarball. In job env, since secrets reach env/with, not if.
      R2_CONFIGURED: ${{ secrets.R2_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # sqlx-cli must track the sqlx crate version, or `cargo sqlx prepare --check`
      # validates against a cache built by a mismatched proc-macro.
      - name: sqlx-cli pin matches sqlx crate version
        run: |
          crate="$(yq -p toml -o yaml '.dependencies.sqlx.version // .dependencies.sqlx' Cargo.toml)"
          case "$crate" in
            [0-9]*.[0-9]*) ;;
            *)
              echo "::error file=backend/Cargo.toml::could not parse sqlx crate version (got '$crate'); the dependency shape may have changed — update this guard"
              exit 1
              ;;
          esac
          if [ "$crate" != "$SQLX_CLI_VERSION" ]; then
            echo "::error file=.github/workflows/ci.yml::SQLX_CLI_VERSION ($SQLX_CLI_VERSION) != sqlx crate version ($crate in backend/Cargo.toml) — keep the cli pin in lockstep with the crate"
            exit 1
          fi
          echo "sqlx-cli pin ($SQLX_CLI_VERSION) matches sqlx crate ($crate)"

      # Shims stay off for the whole job: rustc links a registry dependency from
      # ~/.cargo/registry, which has no mise.toml above it for a shim to resolve
      # against. Steps needing a mise tool run under `mise exec` instead.
      - name: Install just (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.8"
          install_args: just
          add_shims_to_path: false

      - name: Backend static guards
        working-directory: ${{ github.workspace }}
        run: mise exec just -- just rust::guards

      # Components are per-job: this one lints, so clippy and rustfmt, not llvm-tools.
      - id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
          # A fork has no store credentials and falls back to caching target/ instead
          # (a cold compile once the last full-target generation expires). Tracked in
          # debt/2026-07-26-fork-pr-cache-fallback.md.
          cache-targets: ${{ secrets.R2_ACCOUNT_ID == '' }}
          # Restore-only on PR branches: the 10 GiB repo quota can't hold per-branch
          # copies of the gigabyte-scale rust caches without evicting others.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Content-addressed compile cache in R2, keyed per crate. See
      # adr/2026-07-26-remote-build-cache-on-r2.md.
      #
      # Write credentials are reserved for pushes to main; a PR gets object-read keys.
      #
      # Digest pinned past v1 (published 2026-06-15, never re-pointed): that tag's
      # contract has no `namespace` or `pr-comment` input, and GitHub silently drops
      # an undeclared input rather than erroring. Check any new input against
      # action.yml at this revision before returning to a tag. The digest is
      # upstream main as of 2026-06-19. The trailing comment names the branch on
      # its own because Renovate reads it as the ref to resolve, and a ref that
      # carries the date resolves to nothing.
      - name: Remote build cache (kache)
        if: env.R2_CONFIGURED == 'true'
        uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b # main
        with:
          version: ${{ needs.changes.outputs.kache }}
          s3-bucket: reverie-ci-cache
          s3-region: auto
          s3-endpoint: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          s3-access-key-id: ${{ github.ref == 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID_RW || secrets.R2_ACCESS_KEY_ID_RO }}
          s3-secret-access-key: ${{ github.ref == 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY_RW || secrets.R2_SECRET_ACCESS_KEY_RO }}
          # github-cache would refill the 10 GiB quota this cache exists to
          # escape; pr-comment needs `pull-requests: write`, not granted here.
          github-cache: false
          pr-comment: false
          # Explicit despite being the current Linux default: that default rests on
          # platform debug-info placement, not a caching guarantee.
          cache-executables: true
          # Shards make prefetch useful; unset, hits arrive one at a time. Keyed on
          # build configuration, not job name, so a toolchain bump rotates it rather
          # than warming shards for artifacts that no longer exist. Coverage needs
          # its own value: `-C instrument-coverage` is a separate key space.
          namespace: x86_64-unknown-linux-gnu/${{ steps.rust.outputs.version }}/dev

      # kache degrades quietly by design: it compiles for real when the store is
      # unreachable and still exits 0, so a mistyped secret would leave every job
      # uncached and green forever. Assert the remote resolved before depending on it.
      - name: Verify the remote cache resolved
        if: env.R2_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          stats="$(kache stats 2>&1 || true)"
          printf '%s\n' "${stats}"
          remote="$(printf '%s\n' "${stats}" | grep -m1 'Remote:' || true)"
          if [ -z "${remote}" ]; then
            echo "kache stats reported no Remote line; the output shape changed and this check can no longer tell configured from not" >&2
            exit 1
          fi
          case "${remote}" in
            *"not configured"*)
              echo "kache has no remote configured: the S3 inputs did not reach it, so this job would compile uncached and still pass" >&2
              exit 1
              ;;
          esac

      - name: Check formatting
        run: cargo fmt --check

      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 postgres://reverie:reverie@localhost:5432/reverie_dev -f docker/init-roles.sql
        working-directory: ${{ github.workspace }}

      # Must land before the first linking cargo invocation (sqlx-cli below), since
      # job-level RUSTFLAGS routes every link through mold.
      - name: Install mold and cargo-machete (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.8"
          install_args: mold github:bnjbvr/cargo-machete
          add_shims_to_path: false

      # Keyed on version + features alone, not workspace Cargo.lock, so Renovate lock
      # churn cannot invalidate it. Bump the key suffix if the features change.
      - name: Cache sqlx-cli binary
        id: cache-sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SQLX_CLI_VERSION }}-postgres-rustls

      - name: Install sqlx-cli (cache miss only)
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        # No --locked: sqlx-cli 0.9 stopped shipping Cargo.lock in its published crate.
        run: mise exec mold -- cargo install sqlx-cli --version ${{ env.SQLX_CLI_VERSION }} --no-default-features --features rustls,postgres

      - name: Unused dependencies (cargo-machete)
        run: mise exec github:bnjbvr/cargo-machete -- cargo machete

      - name: Apply migrations
        run: sqlx migrate run

      - name: Lint
        run: mise exec mold -- cargo clippy --workspace --all-targets --locked -- -D warnings

      # Without --document-private-items the scope is pub items only, matching the
      # Tier 1 comment-policy surface.
      - name: Doc lint (broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: mise exec mold -- cargo doc --locked --no-deps --workspace

      - name: Check sqlx query cache freshness
        run: mise exec mold -- cargo sqlx prepare --check -- --locked --tests

      # nextest does not run doctests; Reverie has none today, so this exists to fail
      # CI from day one on doctest drift.
      - name: Doctests
        run: mise exec mold -- cargo test --locked --doc --workspace

      # The cache action's post step runs from $GITHUB_WORKSPACE, which has no
      # Cargo.lock (the crate root is backend/), so it skips this upload itself.
      # Tracked in debt/2026-07-26-kache-shard-upload-step.md.
      - name: Upload prefetch shards
        if: env.R2_CONFIGURED == 'true' && github.ref == 'refs/heads/main'
        run: kache save-manifest

  # Kept off the checks job's serial critical path; raw execution profiles are
  # deleted before every run so cached results can never enter the report.
  backend:
    name: Backend coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: reverie
          POSTGRES_PASSWORD: reverie
          POSTGRES_DB: reverie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reverie -d reverie_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://reverie:reverie@localhost:5432/reverie_dev
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # See the backend-checks job.
      CARGO_TERM_COLOR: always
      CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Coverage instrumentation is read back by llvm-tools, so it's this job's alone.
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend -> target/llvm-cov-target
          shared-key: llvm-cov
          # Restore-only on PR branches; see the backend-checks cache step.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 postgres://reverie:reverie@localhost:5432/reverie_dev -f docker/init-roles.sql
        working-directory: ${{ github.workspace }}

      - name: Install linker and coverage tools (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.8"
          install_args: mold github:nextest-rs/nextest github:taiki-e/cargo-llvm-cov
          add_shims_to_path: false

      - name: Cache sqlx-cli binary
        id: cache-sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SQLX_CLI_VERSION }}-postgres-rustls

      - name: Install sqlx-cli (cache miss only)
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        run: mise exec mold -- cargo install sqlx-cli --version ${{ env.SQLX_CLI_VERSION }} --no-default-features --features rustls,postgres

      - name: Apply migrations
        run: sqlx migrate run

      # Remove raw execution data before retaining compiled artifacts with --no-clean.
      - name: Test (with coverage)
        run: |
          mkdir -p "$CARGO_LLVM_COV_TARGET_DIR"
          find "$CARGO_LLVM_COV_TARGET_DIR" -type f -name '*.profraw' -delete
          mise exec mold github:nextest-rs/nextest github:taiki-e/cargo-llvm-cov -- \
            cargo llvm-cov nextest --no-clean --locked --workspace --remap-path-prefix --lcov --output-path lcov.info

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/lcov.info
          if-no-files-found: error
          retention-days: 1

      # Codacy requires repo-root-relative SF: paths; the backend lcov is backend-relative.
      - name: Normalize coverage paths to repo root
        run: sed -i 's#^SF:#SF:backend/#' lcov.info

      # Reports above 10 MB fail server-side with an opaque JSON parse error, so
      # size is surfaced here instead.
      - name: Check coverage report size
        id: backend_lcov_size
        run: |
          size=$(wc -c < lcov.info)
          if [ "${size}" -gt 10485760 ]; then
            echo "::warning title=Coverage report oversized::backend/lcov.info is ${size} bytes; Codacy rejects reports above 10 MB."
            echo 'skip=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'skip=false' >> "${GITHUB_OUTPUT}"
          fi

      # Per-language advisory upload; PR-level Codacy contexts come from these steps.
      # The SHA pins the wrapper, not the reporter: v1.3.0 fetches Codacy's bootstrap
      # script from master on every run; no released revision accepts a reporter
      # version. That script verifies the SHA512 of the binary it installs.
      - name: Upload coverage to Codacy
        if: >-
          steps.backend_lcov_size.outputs.skip != 'true' &&
          github.actor != 'dependabot[bot]' &&
          github.actor != 'renovate[bot]' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            !startsWith(github.head_ref, 'renovate/') &&
            !startsWith(github.head_ref, 'dependabot/')))
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: backend/lcov.info
          language: Rust

  # Compiles on exactly the declared rust-version, so a dependency bump or new syntax
  # that silently raises the real minimum fails here instead of breaking
  # self-hosters building from source on the documented floor.
  msrv:
    name: MSRV check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: 0
      # See the backend-checks job.
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/^rust-version[^"]*"([0-9.]+)".*/\1/' || true)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Could not extract a valid rust-version from backend/Cargo.toml (got: '${version}')" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The one caller that overrides the pinned channel with the declared floor.
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
          # Restore-only on PR branches; see the backend-checks cache step.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # RUSTUP_TOOLCHAIN is what actually holds this job to the floor: rustup otherwise
      # honours backend/rust-toolchain.toml, passing while checking nothing. The
      # assertion below is the regression test for that override taking effect.
      # rustc reports a full x.y.z while rust-version may be x.y, hence the
      # patch-suffix match.
      - name: Check workspace builds on MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          active=$(rustc --version | cut -d' ' -f2)
          case "${active}" in
            "${RUSTUP_TOOLCHAIN}" | "${RUSTUP_TOOLCHAIN}".*) ;;
            *)
              echo "MSRV job is compiling on rustc ${active}, not the declared floor ${RUSTUP_TOOLCHAIN}: the toolchain override is not in effect" >&2
              exit 1
              ;;
          esac
          cargo check --workspace --all-targets --locked

  audit:
    name: Dependency policy (cargo-deny)
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install cargo-deny (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.8"
          install_args: github:EmbarkStudios/cargo-deny
      - name: Check dependencies (advisories, licenses, bans, sources)
        run: cargo deny check

  # Diffs the PR's dependency manifests against base and fails on any added package
  # with an advisory at/above the floor. pull_request-only: no diff to evaluate on
  # push or merge_group; ci-gate treats the skip as a pass.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # License policy is owned by cargo-deny; this layer gates vulnerabilities only.
          fail-on-severity: moderate
          # vp installs under the `vite` alias at vite@0.2.1, which sorts below every
          # historical real-vite advisory; vite-plus-core 0.2.1 is vite 8.x underneath
          # and carries the fixes. Revisit on a vp version bump. See
          # debt/2026-06-30-vite-plus-alias-dependency-review.md
          allow-ghsas: >-
            GHSA-353f-5xf4-qw67, GHSA-356w-63v5-8wf4, GHSA-4r4m-qw57-chr8,
            GHSA-4w7w-66w2-5vf9, GHSA-64vr-g452-qvp3, GHSA-859w-5945-r5v3,
            GHSA-9cwx-2883-4wfx, GHSA-c27g-q93r-2cwf, GHSA-fx2h-pf6j-xcff,
            GHSA-mv48-hcvh-8jj8, GHSA-v6wh-96g9-6wx3, GHSA-vg6x-rcgg-rjx6,
            GHSA-x574-m823-4x7w, GHSA-xcj6-pq6g-qj4x

  # Unconditional, and never gains an `if:`. A skipped caller reports a check run
  # named `lint`, while the ruleset requires `lint / <job>`, which would then never
  # report and leave every pull request pending. Filtering lives inside lint.yml.
  lint:
    uses: ./.github/workflows/lint.yml

  # Covers what hadolint's instruction lint doesn't: root-user defaults, missing
  # healthchecks, privileged/host-mode services, secrets-in-env shapes.
  # Suppressions live in .trivyignore with per-finding justification.
  iac-scan:
    name: IaC misconfig (trivy)
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install trivy (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.8"
          install_args: trivy

      - name: Scan IaC for misconfigurations (gating)
        run: |
          set -euo pipefail
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs node_modules,frontend/node_modules,docs/node_modules,backend/target \
            --skip-dirs .github \
            .

  # docker-publish only fires post-merge, so without this a broken image definition
  # merges green and detonates on main in the privileged publish lane. arm64 to match
  # the main-push publish arch and share its warm layer cache.
  docker-build:
    name: Docker image build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Read the publish lane's cache, never write it: a PR-controlled cache-to into
      # that scope would be a cache-poisoning surface.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=buildcache-arm64

  # Lints the generated spec against every oas and owasp rule it already
  # satisfies. Which rules those are, and why the rest are off, is .vacuum.yaml.
  openapi-policy:
    name: OpenAPI policy (vacuum)
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          mise-install-args: vacuum

      - name: Lint OpenAPI spec (gating)
        # info, not the default error: the strict security rule reports at info,
        # so a higher threshold would let a newly-public write endpoint pass.
        # The baseline is zero findings at every severity, so nothing else moves.
        run: >-
          vacuum lint --ruleset .vacuum.yaml --ignore-file .vacuum-ignore.yaml
          --fail-severity info --details docs/openapi.json

  # npm counterpart of cargo-deny's [licenses] allowlist.
  #
  # Excluded by name, not license: this build-time-only native tooling's compiled
  # output ships, but its own code never lands in it, so its license doesn't bind
  # the project (@img/sharp-libvips-*, lightningcss*, satteri/@bruits/satteri-*,
  # the last of which reads UNKNOWN until its pre-1.0 packaging gap is fixed
  # upstream). The gate still fails any other package carrying these licenses.
  npm-license:
    name: npm license policy
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-manager: true
          cache: true

      - name: Check npm licenses (gating)
        run: |
          set -euo pipefail
          vp install
          allow="MIT;Apache-2.0;ISC;0BSD;BSD-2-Clause;BSD-3-Clause;BlueOak-1.0.0;CC0-1.0;Python-2.0;Unlicense"
          rc=0
          for tree in . frontend docs; do
            echo "::group::license check (${tree})"
            (
              cd "$tree"
              vp exec license-checker-rseidelsohn \
                --production \
                --excludePrivatePackages \
                --excludePackagesStartingWith "@img/sharp-libvips;@bruits/satteri;satteri;lightningcss" \
                --onlyAllow "$allow"
            ) || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  # Rule-based SAST via opengrep, motivated by Rust, where CodeQL's extractor
  # resolves call targets poorly and pattern rules need no call-graph resolution.
  sast:
    name: SAST (opengrep)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout opengrep-rules (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: opengrep/opengrep-rules
          ref: f1d2b562b414783763fd02a6ed2736eaed622efa
          path: .opengrep-rules
          persist-credentials: false

      - name: Install opengrep (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.8"
          install_args: opengrep

      # Tests are not excluded wholesale (a blanket file drop is a coverage blind
      # spot); a legitimate insecure-API test gets a call-site `// nosemgrep:
      # <rule-id>` carve-out instead.
      #
      # rust.lang.security.args is excluded: main.rs reads argv for CLI subcommand
      # dispatch, not a security decision, and the rule can't tell the difference.
      # Its ID prefix derives from the rules-checkout path above — keep the two in
      # lockstep or the exclusion silently stops matching.
      - name: Scan source (gating)
        run: |
          set -euo pipefail
          opengrep scan \
            --config .opengrep-rules/rust/lang/security \
            --config .opengrep-rules/typescript/lang/security \
            --config .opengrep-rules/typescript/react/security \
            --exclude-rule opengrep-rules.rust.lang.security.args \
            --error \
            backend/src frontend/src

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install just and node (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.8"
          install_args: just
          add_shims_to_path: true

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-manager: true
          cache: true

      # Install from the repo root: the root prepare hook (lefthook install) resolves
      # its binary from the root node_modules.
      - name: Install
        working-directory: ${{ github.workspace }}
        run: vp install

      - name: Lint
        run: just js::oxlint

      - name: Test (with coverage)
        run: just js::test-coverage

      # A missing report must fail here, not read as 0% coverage downstream.
      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      # Codacy requires repo-root-relative SF: paths; the frontend lcov is frontend-relative.
      - name: Normalize coverage paths to repo root
        run: sed -i 's#^SF:#SF:frontend/#' coverage/lcov.info

      # Reports above 10 MB fail server-side with an opaque JSON parse error, so
      # size is surfaced here instead.
      - name: Check coverage report size
        id: frontend_lcov_size
        run: |
          size=$(wc -c < coverage/lcov.info)
          if [ "${size}" -gt 10485760 ]; then
            echo "::warning title=Coverage report oversized::frontend/coverage/lcov.info is ${size} bytes; Codacy rejects reports above 10 MB."
            echo 'skip=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'skip=false' >> "${GITHUB_OUTPUT}"
          fi

      # Per-language advisory upload; PR-level Codacy contexts come from these steps.
      - name: Upload coverage to Codacy
        if: >-
          steps.frontend_lcov_size.outputs.skip != 'true' &&
          github.actor != 'dependabot[bot]' &&
          github.actor != 'renovate[bot]' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            !startsWith(github.head_ref, 'renovate/') &&
            !startsWith(github.head_ref, 'dependabot/')))
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: frontend/coverage/lcov.info
          language: TypeScript

      - name: Stylelint
        run: just js::stylelint

      # Advisory until the known bg-black findings in stock shadcn overlays are addressed.
      - name: Detect (impeccable, advisory)
        run: just js::detect
        continue-on-error: true

      - name: Verify font integrity
        run: just js::font-integrity

      - name: Build
        run: just js::build

  # WCAG 2.2 AA gate: axe-core against the routes in
  # frontend/scripts/a11y/allowlist.mjs, failing on any violation outside that
  # file's allowlist.
  a11y:
    name: Accessibility (axe)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-manager: true
          cache: true

      - name: Install
        working-directory: ${{ github.workspace }}
        run: vp install

      # Read the installed package, not the lockfile: the manifest carries a
      # range, and under pnpm's isolated layout a version can appear in the
      # lockfile at more than one path. This step runs after `vp install`, so
      # what it reports is exactly the version the cached browser must match.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Unconditional even on a cache hit: `--with-deps` installs OS-level apt
      # packages that aren't cached and must be present every run.
      - name: Install Playwright Chromium
        run: vp exec playwright install --with-deps chromium

      # Do not also start a server here: Playwright's webServer config already runs
      # `vp dev` and never reuses an existing one, so a second would collide on
      # port 5173.
      - name: Run accessibility gate
        run: vp run a11y

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a11y-playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  # Catches role-clause regressions in init-roles.sql and required-env-var
  # regressions in compose's `${VAR:?required}` interpolations before they land
  # on staging.
  staging-smoke:
    name: Staging compose smoke
    needs: changes
    if: needs.changes.outputs.staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Distinct passwords per role so a swapped CREATE ROLE clause in init-roles.sql
      # can't authenticate cross-role and pass silently.
      - name: Prepare env files from examples
        working-directory: docker
        run: |
          set -euo pipefail
          cp staging.env.bootstrap.example .env
          # .env.runtime and .env.migrate are required: true on services not started
          # here, but compose validates env_file presence at parse time regardless.
          cp staging.env.runtime.example .env.runtime
          cp staging.env.migrate.example .env.migrate
          # `=.*`, not `=$`: an exact-empty anchor would silently no-op if the
          # examples acquire non-empty defaults, failing later at auth with an
          # opaque 28P01.
          sed -i \
            -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=smoke_super_pw_1|' \
            -e 's|^REVERIE_APP_PASSWORD=.*|REVERIE_APP_PASSWORD=smoke_app_pw_2|' \
            -e 's|^REVERIE_INGESTION_PASSWORD=.*|REVERIE_INGESTION_PASSWORD=smoke_ing_pw_3|' \
            -e 's|^REVERIE_READONLY_PASSWORD=.*|REVERIE_READONLY_PASSWORD=smoke_ro_pw_4|' \
            -e 's|^REVERIE_MIGRATOR_PASSWORD=.*|REVERIE_MIGRATOR_PASSWORD=smoke_mig_pw_5|' \
            -e 's|^REVERIE_VERSION=.*|REVERIE_VERSION=smoke-test|' \
            -e 's|^REVERIE_LIBRARY_HOST_PATH=.*|REVERIE_LIBRARY_HOST_PATH=/tmp/smoke-library|' \
            -e 's|^REVERIE_INGESTION_HOST_PATH=.*|REVERIE_INGESTION_HOST_PATH=/tmp/smoke-ingestion|' \
            -e 's|^REVERIE_QUARANTINE_HOST_PATH=.*|REVERIE_QUARANTINE_HOST_PATH=/tmp/smoke-quarantine|' \
            -e 's|^REVERIE_RECOVERY_PINS_HOST_PATH=.*|REVERIE_RECOVERY_PINS_HOST_PATH=/tmp/smoke-recovery-pins|' \
            .env

      - name: Bring up postgres service
        run: docker compose -f docker/compose.staging.yml up -d --wait --wait-timeout 120 reverie-postgres

      - name: Assert roles exist with CONNECT grant
        run: |
          set -euo pipefail
          exec_psql() {
            docker compose -f docker/compose.staging.yml exec -T \
              -e PGPASSWORD=smoke_super_pw_1 \
              reverie-postgres psql -v ON_ERROR_STOP=1 -At \
              -U reverie -d reverie "$@"
          }
          for role in reverie_app reverie_ingestion reverie_readonly reverie_migrator; do
            exists=$(exec_psql -c "SELECT 1 FROM pg_roles WHERE rolname = '${role}' AND rolcanlogin")
            if [ "$exists" != "1" ]; then
              echo "Role ${role} missing or cannot login" >&2
              exit 1
            fi
            # has_database_privilege would return true via Postgres' default PUBLIC
            # grant and mask a deleted GRANT CONNECT line, so query datacl directly.
            has_connect=$(exec_psql -c "SELECT EXISTS (SELECT 1 FROM pg_database d, aclexplode(d.datacl) acl WHERE d.datname = current_database() AND acl.grantee = (SELECT oid FROM pg_roles WHERE rolname = '${role}') AND acl.privilege_type = 'CONNECT')")
            if [ "$has_connect" != "t" ]; then
              echo "Role ${role} lacks an explicit CONNECT grant on $(exec_psql -c 'SELECT current_database()')" >&2
              exit 1
            fi
          done

      - name: Assert each role authenticates with its supplied password
        run: |
          set -euo pipefail
          login_as() {
            local role=$1 pw=$2
            docker compose -f docker/compose.staging.yml exec -T \
              -e PGPASSWORD="${pw}" \
              reverie-postgres psql -v ON_ERROR_STOP=1 -At \
              -h localhost -U "${role}" -d reverie -c 'SELECT 1' >/dev/null
          }
          login_as reverie_app       smoke_app_pw_2
          login_as reverie_ingestion smoke_ing_pw_3
          login_as reverie_readonly  smoke_ro_pw_4
          login_as reverie_migrator  smoke_mig_pw_5

      # THREAT: the migration identity must not be a superuser, create roles, or
      # bypass RLS. Catches active escalation only; deleting the explicit
      # NOSUPERUSER NOCREATEROLE NOBYPASSRLS clause yields the same f|f|f (they're
      # the CREATE ROLE defaults), so that clause's presence is guarded by review.
      - name: Assert reverie_migrator is not over-privileged
        run: |
          set -euo pipefail
          attrs=$(docker compose -f docker/compose.staging.yml exec -T \
            -e PGPASSWORD=smoke_super_pw_1 \
            reverie-postgres psql -v ON_ERROR_STOP=1 -At \
            -U reverie -d reverie \
            -c "SELECT rolsuper, rolcreaterole, rolbypassrls FROM pg_roles WHERE rolname = 'reverie_migrator'")
          if [ "$attrs" != "f|f|f" ]; then
            echo "reverie_migrator is over-privileged: rolsuper|rolcreaterole|rolbypassrls = ${attrs} (want f|f|f)" >&2
            exit 1
          fi

      # The migrator's two load-bearing grants (CREATE on the database, CREATE on
      # schema public) stay invisible to the role-exists/login/f|f|f checks above if
      # dropped; only a real DDL round-trip catches it. One statement exercises
      # both, leaving no residue.
      - name: Assert reverie_migrator has DDL capability
        run: |
          set -euo pipefail
          docker compose -f docker/compose.staging.yml exec -T \
            -e PGPASSWORD=smoke_mig_pw_5 \
            reverie-postgres psql -v ON_ERROR_STOP=1 -At \
            -h localhost -U reverie_migrator -d reverie \
            -c "CREATE SCHEMA _smoke_ddl; CREATE TABLE _smoke_ddl.probe (id int); DROP SCHEMA _smoke_ddl CASCADE;"

      # THREAT: the long-lived app must hold zero DDL credentials, so
      # DATABASE_URL_MIGRATION must reach reverie-migrate and never the reverie app
      # service. Runs before the negative-path step below blanks a var.
      - name: Assert DATABASE_URL_MIGRATION is scoped to reverie-migrate only
        working-directory: docker
        run: |
          set -euo pipefail
          rendered=$(docker compose -f compose.staging.yml config)
          if ! awk '/^  reverie-migrate:/{f=1} f && /^  [a-z]/ && !/^  reverie-migrate:/{f=0} f' <<<"$rendered" \
               | grep -q 'DATABASE_URL_MIGRATION'; then
            echo "DATABASE_URL_MIGRATION missing from reverie-migrate service config" >&2
            exit 1
          fi
          if awk '/^  reverie:/{f=1} f && /^  [a-z]/ && !/^  reverie:/{f=0} f' <<<"$rendered" \
               | grep -q 'DATABASE_URL_MIGRATION'; then
            echo "DATABASE_URL_MIGRATION leaked into the reverie app service — credential isolation broken" >&2
            exit 1
          fi

      - name: Tear down postgres service
        if: always()
        run: docker compose -f docker/compose.staging.yml down -v

      # Key-name presence in stderr is the signal: compose's exact wording isn't
      # pinned across versions. !cancelled() so a `:?required` regression isn't
      # silently skipped behind an earlier failure.
      - name: Assert missing required env var hard-fails
        if: ${{ !cancelled() }}
        working-directory: docker
        run: |
          set -euo pipefail
          sed -i 's|^REVERIE_APP_PASSWORD=.*|REVERIE_APP_PASSWORD=|' .env
          if stderr=$(docker compose -f compose.staging.yml config 2>&1 >/dev/null); then
            echo "Expected compose config to fail with missing REVERIE_APP_PASSWORD, but it succeeded" >&2
            echo "stderr was:" >&2
            echo "${stderr}" >&2
            exit 1
          fi
          if ! grep -qF REVERIE_APP_PASSWORD <<<"${stderr}"; then
            echo "compose config failed but stderr did not mention REVERIE_APP_PASSWORD" >&2
            echo "stderr was:" >&2
            echo "${stderr}" >&2
            exit 1
          fi

  # The gitleaks pre-commit hook is client-side: bypassable and never run on fork
  # PRs. Unconditional — a secret can land in any file type.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the pull_request scan below can walk the whole branch
          # range, not just the tip commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.8"
          install_args: gitleaks

      # On a pull_request, scan every commit the branch introduces: a secret added
      # and later removed within the branch is gone from the working tree but stays
      # readable in the pushed history. push/merge_group falls back to a full-tree
      # scan.
      - name: Scan for secrets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA}" ]; then
            gitleaks git . --no-banner --redact --log-opts "${PR_BASE_SHA}..HEAD"
          else
            gitleaks dir . --no-banner --redact
          fi

  # Build lives in the reusable docs-build.yml, shared with docs.yml's Pages deploy
  # lane; cross-workflow `needs` is impossible, so the job must exist here to join
  # ci-gate.
  docs:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-build.yml

  # Single required status check for the branch ruleset: `skipped` is a pass, so a
  # path-conditional job that legitimately skips doesn't block merge.
  #
  # `if: always()` is load-bearing: without it the gate is itself skipped when an
  # upstream job fails, and GitHub reports a skipped required check as success.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - backend
      - backend-checks
      - msrv
      - audit
      - dependency-review
      - lint
      - frontend
      - a11y
      - staging-smoke
      - secret-scan
      - iac-scan
      - docker-build
      - openapi-policy
      - npm-license
      - sast
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "$RESULTS"
          exit 1
