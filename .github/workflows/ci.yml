name: CI # sonar.yml's workflow_run trigger matches this string; renaming either orphans it silently.

# Display only, and independent of `name:` above, so the sonar.yml coupling is untouched.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1}', github.event.number, github.event.pull_request.title)
   || github.event_name == 'merge_group' && 'merge queue'
   || format('main: {0}', github.event.head_commit.message) }}

on:
  # PRs are squash-merged, so main's head commit is a SHA no pull_request run
  # analyzed; push keeps SonarQube Cloud's baseline current.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# A cancelled main-push run once wiped the Sonar coverage baseline; PR runs
# still cancel freely.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Every filter includes ci.yml itself: a workflow edit must re-run the jobs it defines.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      staging: ${{ steps.filter.outputs.staging }}
      workflows: ${{ steps.filter.outputs.workflows }}
      iac: ${{ steps.filter.outputs.iac }}
      docker: ${{ steps.filter.outputs.docker }}
      openapi: ${{ steps.filter.outputs.openapi }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # merge_group's default base (HEAD~1) sees only the synthetic merge ref's
          # topmost commit; pin to base_sha to match the PR-against-main diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          # scripts/preflight-scope.sh reads the same file, so the two cannot drift.
          filters: .github/path-filters.yml

  # Unconditional, and never gains an `if:`. A skipped caller reports a check run
  # named `lint`, while the ruleset requires `lint / <job>`, which would then never
  # report and leave every pull request pending. Filtering lives inside lint.yml.
  backend:
    uses: ./.github/workflows/backend.yml
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID_RW: ${{ secrets.R2_ACCESS_KEY_ID_RW }}
      R2_ACCESS_KEY_ID_RO: ${{ secrets.R2_ACCESS_KEY_ID_RO }}
      R2_SECRET_ACCESS_KEY_RW: ${{ secrets.R2_SECRET_ACCESS_KEY_RW }}
      R2_SECRET_ACCESS_KEY_RO: ${{ secrets.R2_SECRET_ACCESS_KEY_RO }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  lint:
    uses: ./.github/workflows/lint.yml

  security:
    uses: ./.github/workflows/security.yml

  deps:
    uses: ./.github/workflows/deps.yml

  frontend:
    uses: ./.github/workflows/frontend.yml
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  # The only caller granting more than the top-level default: a called workflow
  # can downgrade its caller's token but never elevate it, so the deploy job's
  # needs are declared here and narrowed again inside docs.yml.
  docs:
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  staging:
    uses: ./.github/workflows/staging.yml

  docker:
    uses: ./.github/workflows/docker.yml

  # Absent from ci-gate.needs on purpose: every job here is advisory and never
  # fails, so a detector hiccup must not block a merge.
  snyk:
    uses: ./.github/workflows/snyk.yml
    permissions:
      contents: read
      security-events: write
      packages: read
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Single required status check for the branch ruleset: `skipped` is a pass, so a
  # path-conditional job that legitimately skips doesn't block merge.
  #
  # `if: always()` is load-bearing: without it the gate is itself skipped when an
  # upstream job fails, and GitHub reports a skipped required check as success.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - backend
      - lint
      - security
      - deps
      - frontend
      - staging
      - docker
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "$RESULTS"
          exit 1
