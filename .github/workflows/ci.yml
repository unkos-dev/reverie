name: CI

on:
  # Push-to-main runs exist for SonarQube Cloud: PRs are squash-merged, so
  # main's head commit is a SHA no pull_request run ever analyzed — without
  # this trigger the default-branch baseline (new-code detection, coverage
  # badge) never updates.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Never cancel main-push runs: back-to-back merges would cancel the older
# run, reddening the workflow badge and starving the sonar job of coverage
# artifacts (a cancelled run once wiped the Sonar baseline to 0%).
# Superseded PR runs cancel freely.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Single source of truth for the migration CLI used by both backend jobs.
  # The backend-checks guard keeps this in lockstep with the sqlx crate.
  SQLX_CLI_VERSION: "0.9.0"

jobs:
  # Detect which areas of the repo changed so downstream jobs can skip when
  # their inputs are untouched. Every filter includes ci.yml itself: a
  # workflow edit must re-run the jobs it defines.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      audit: ${{ steps.filter.outputs.audit }}
      frontend: ${{ steps.filter.outputs.frontend }}
      staging: ${{ steps.filter.outputs.staging }}
      workflows: ${{ steps.filter.outputs.workflows }}
      iac: ${{ steps.filter.outputs.iac }}
      docker: ${{ steps.filter.outputs.docker }}
      openapi: ${{ steps.filter.outputs.openapi }}
      npm: ${{ steps.filter.outputs.npm }}
      docs: ${{ steps.filter.outputs.docs }}
      kache: ${{ steps.kache.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Resolve the pinned kache version once here (from mise.toml) so every
      # job that needs it reads one source instead of a drifting copy. The
      # Rust toolchain version is resolved separately, in
      # .github/actions/rust-toolchain, for the same reason.
      # `|| true` lets a dropped field reach the format guard instead of
      # failing the pipe opaquely.
      - name: Resolve pinned build-cache version
        id: kache
        run: |
          set -euo pipefail
          version=$(awk '
            /^\[tools\."github:kunobi-ninja\/kache"\]/ { in_kache = 1; next }
            in_kache && /^\[/ { exit }
            in_kache && /^version[[:space:]]*=/ { gsub(/[^0-9.]/, ""); print; exit }
          ' mise.toml || true)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not extract a valid kache version from mise.toml (got: '${version}')" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # On merge_group events paths-filter's default base (HEAD~1) sees
          # only the topmost commit in the synthetic merge ref; pin to
          # merge_group.base_sha so skip decisions match the PR-against-main
          # diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          # Filter definitions live in .github/path-filters.yml so the local
          # preflight scoper (scripts/preflight-scope.sh) reads the same source
          # and cannot drift from CI's skip decisions.
          filters: .github/path-filters.yml

  backend-checks:
    name: Backend checks
    needs: changes
    # Push-to-main always runs backend checks even when the merged change is
    # frontend-only, matching the coverage lane's default-branch policy.
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same digest compose.dev.yml pins, for dev/CI postgres parity.
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: reverie
          POSTGRES_PASSWORD: reverie
          POSTGRES_DB: reverie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reverie -d reverie_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # sqlx::test connects as the schema owner to create per-test
      # databases; role pools for reverie_app / reverie_ingestion are built
      # per-test in code.
      DATABASE_URL: postgres://reverie:reverie@localhost:5432/reverie_dev
      # CI-only build-speed tweaks. Incremental metadata tracking is wasted in
      # a single-shot build, and mold (installed below) removes the
      # single-threaded ld bottleneck. Debuginfo is deliberately absent:
      # backend/Cargo.toml declares it, so both planes compile the same way
      # without two settings having to agree.
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # Cargo emits colour only when it detects a terminal, and a captured
      # runner log is never one, so warnings and errors would arrive as
      # undifferentiated text. Set per job rather than per step because it
      # applies to every cargo call the job makes.
      CARGO_TERM_COLOR: always
      # Belt and braces with the object-read credentials below: a pull request
      # is told not to write to the store the default branch restores from,
      # rather than relying on the bucket to reject it.
      KACHE_REMOTE_READONLY: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
      # kache refuses to cache a C compilation carrying a flag its table does
      # not model, which is why zstd-sys recompiles every run.
      # -fmerge-all-constants is deterministic codegen, so allowlisting it is
      # safe. Set via env, not a repository `.kache.toml`: kache resolves that
      # file by walking up from the working directory, and these compiles run
      # under ~/.cargo/registry, where the repository is not an ancestor.
      # `-Wa,--debug-prefix-map=` stays off the allowlist: it embeds the
      # versioned registry path, so a pinned entry would stop matching on the
      # next aws-lc-sys bump.
      KACHE_CC_EXTRA_ALLOWLIST_FLAGS: -fmerge-all-constants
      # Fork pull requests cannot read repository secrets, so the remote does
      # not exist for them; pointing kache at an unreachable endpoint would
      # time out per crate and leave the setup check asserting nothing. They
      # fall back to the tarball carrying `target/` instead. In job env
      # because the secrets context reaches `env` and `with`, not a step's
      # `if`.
      R2_CONFIGURED: ${{ secrets.R2_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The static guards below need no toolchain, database, or installs;
      # they run first so a violation fails in seconds.

      # sqlx-cli must track the sqlx *crate* version, or `cargo sqlx prepare
      # --check` validates against a cache built by a mismatched proc-macro.
      # Both are hand-set in different files, so anchor on the crate and fail
      # loud when the cli pin differs from it in either direction.
      - name: sqlx-cli pin matches sqlx crate version
        run: |
          crate="$(yq -p toml -o yaml '.dependencies.sqlx.version // .dependencies.sqlx' Cargo.toml)"
          case "$crate" in
            [0-9]*.[0-9]*) ;;
            *)
              echo "::error file=backend/Cargo.toml::could not parse sqlx crate version (got '$crate'); the dependency shape may have changed — update this guard"
              exit 1
              ;;
          esac
          if [ "$crate" != "$SQLX_CLI_VERSION" ]; then
            echo "::error file=.github/workflows/ci.yml::SQLX_CLI_VERSION ($SQLX_CLI_VERSION) != sqlx crate version ($crate in backend/Cargo.toml) — keep the cli pin in lockstep with the crate"
            exit 1
          fi
          echo "sqlx-cli pin ($SQLX_CLI_VERSION) matches sqlx crate ($crate)"

      # just walks up to the repo-root justfile from this backend/ working
      # directory; rust::guards re-enters the repo root itself.
      #
      # Shims stay off for the whole job: rustc links a registry dependency
      # from ~/.cargo/registry, which has no mise.toml above it for a shim to
      # resolve against. Every step that needs a mise tool runs under `mise
      # exec` instead, so a step that forgets the wrapper fails loudly rather
      # than resolving silently.
      - name: Install just (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: just
          add_shims_to_path: false

      # Single-sourced in scripts/backend-guards.sh: runtime sqlx::query and
      # raw_sql invocations, raw axum .route( registrations, and em dashes in
      # the generated config schema, each checked against its
      # .github/*-allowlist.txt (the em-dash guard has none). The
      # datetime-crate boundary is a clippy lint instead, so it runs in the
      # lint job rather than here.
      - name: Backend static guards
        working-directory: ${{ github.workspace }}
        run: mise exec just -- just rust::guards

      # Installs the version backend/rust-toolchain.toml pins, so this job and
      # a developer's machine compile with the same rustc. Components are
      # per-job: this one lints, so clippy and rustfmt, not llvm-tools. The
      # step id is read by the cache namespace below.
      - id: rust
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
          # Registry only wherever the remote store below is reachable: the
          # registry is a fraction of `target/`, so caching it stays inside
          # the quota without evicting unrelated caches. A fork has no
          # credentials for that store and falls back to caching `target/`
          # instead, which does not restore what the default branch saves
          # (actions/cache keys on the path set) and compiles cold once the
          # last full-target generation expires. Tracked in
          # debt/2026-07-26-fork-pr-cache-fallback.md.
          cache-targets: ${{ secrets.R2_ACCOUNT_ID == '' }}
          # Restore-only on PR branches: the repo cache quota (10 GiB) cannot
          # hold per-branch copies of the gigabyte-scale rust caches, and the
          # resulting LRU eviction was costing warm caches elsewhere. PRs
          # branch from a fresh main, so main's cache is the right restore
          # source anyway.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Content-addressed compile cache in R2, keyed per crate so a bump only
      # invalidates that crate and its dependents; the tarball cache above
      # covers the registry instead. See
      # adr/2026-07-26-remote-build-cache-on-r2.md.
      #
      # Write credentials are reserved for pushes to main; a pull request gets
      # object-read keys, the same poisoning surface docker-build records for
      # its buildx scopes. pr-comment stays off (needs `pull-requests: write`,
      # which this workflow does not grant); github-cache stays off (it would
      # put the artifacts back inside the 10 GiB quota this exists to escape).
      #
      # Digest pinned past v1 (published 2026-06-15, never re-pointed): that
      # tag's contract has no `namespace` or `pr-comment` input, and GitHub
      # silently drops an undeclared input rather than erroring. Check any new
      # input against action.yml at this revision, and return to a tag once
      # upstream publishes one past v1.
      - name: Remote build cache (kache)
        if: env.R2_CONFIGURED == 'true'
        uses: kunobi-ninja/kache-action@a257c055543c2840700a9bbca8f9c3094a421b1b # main@2026-06-19
        with:
          version: ${{ needs.changes.outputs.kache }}
          s3-bucket: reverie-ci-cache
          s3-region: auto
          s3-endpoint: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          s3-access-key-id: ${{ github.ref == 'refs/heads/main' && secrets.R2_ACCESS_KEY_ID_RW || secrets.R2_ACCESS_KEY_ID_RO }}
          s3-secret-access-key: ${{ github.ref == 'refs/heads/main' && secrets.R2_SECRET_ACCESS_KEY_RW || secrets.R2_SECRET_ACCESS_KEY_RO }}
          github-cache: false
          pr-comment: false
          # Without this, build scripts and doctest binaries pass through
          # uncached (580 skipped executables). Already the Linux default
          # since kache 0.12.0, kept explicit because that default rests on
          # where the platform keeps debug information, not on a caching
          # guarantee, and losing it would just read as a slow run.
          cache-executables: true
          # Shards make prefetch useful: unset, hits arrive one request at a
          # time (~2min latency vs ~14s transfer across 1354 hits measured).
          #
          # Keyed on build configuration, not job name, so a toolchain bump
          # rotates it instead of warming shards for artifacts that no longer
          # exist. Coverage needs its own value: `-C instrument-coverage` is a
          # separate key space and reusing this namespace would cross the two.
          namespace: x86_64-unknown-linux-gnu/${{ steps.rust.outputs.version }}/dev

      # A cache degrades quietly by design: kache compiles for real whenever
      # the store is unreachable and still exits 0. A mistyped secret or a
      # renamed input would therefore leave every job uncached, slow, and
      # green forever, indistinguishable from a cold cache. Assert the remote
      # resolved before the compiling steps start depending on it.
      - name: Verify the remote cache resolved
        if: env.R2_CONFIGURED == 'true'
        run: |
          set -euo pipefail
          stats="$(kache stats 2>&1 || true)"
          printf '%s\n' "${stats}"
          remote="$(printf '%s\n' "${stats}" | grep -m1 'Remote:' || true)"
          if [ -z "${remote}" ]; then
            echo "kache stats reported no Remote line; the output shape changed and this check can no longer tell configured from not" >&2
            exit 1
          fi
          case "${remote}" in
            *"not configured"*)
              echo "kache has no remote configured: the S3 inputs did not reach it, so this job would compile uncached and still pass" >&2
              exit 1
              ;;
          esac

      - name: Check formatting
        run: cargo fmt --check

      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 postgres://reverie:reverie@localhost:5432/reverie_dev -f docker/init-roles.sql
        working-directory: ${{ github.workspace }}

      # Must land before the first linking cargo invocation (sqlx-cli below),
      # since job-level RUSTFLAGS routes every link through mold; shims stay
      # off for the same reason as the just install step above. cargo-machete
      # rides along so both tools are pinned in mise.toml rather than pulled
      # via an unpinned `apt-get install`.
      - name: Install mold and cargo-machete (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: mold github:bnjbvr/cargo-machete
          add_shims_to_path: false

      # sqlx-cli has no upstream prebuilt binaries, so a cache miss
      # compiles it from source (~60-90s with the feature trim to rustls +
      # postgres — the actual surface). The cache is keyed on version +
      # features alone, not workspace Cargo.lock, so Renovate lock churn
      # cannot invalidate it. Bump the key suffix if the features change.
      - name: Cache sqlx-cli binary
        id: cache-sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SQLX_CLI_VERSION }}-postgres-rustls

      - name: Install sqlx-cli (cache miss only)
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        # No `--locked`: sqlx-cli 0.9 stopped shipping Cargo.lock in its
        # published crate, so `--locked` errors with no lockfile to honour.
        run: mise exec mold -- cargo install sqlx-cli --version ${{ env.SQLX_CLI_VERSION }} --no-default-features --features rustls,postgres

      # Every unused crate is dead advisory/license/audit surface. Static
      # manifest-vs-source scan; justified carve-outs live in Cargo.toml's
      # [package.metadata.cargo-machete] ignored list.
      - name: Unused dependencies (cargo-machete)
        run: mise exec github:bnjbvr/cargo-machete -- cargo machete

      - name: Apply migrations
        run: sqlx migrate run

      - name: Lint
        run: mise exec mold -- cargo clippy --workspace --all-targets --locked -- -D warnings

      # Kills broken intra-doc cross-refs in existing docstrings. Without
      # --document-private-items the scope is pub items only, matching the
      # Tier 1 comment-policy surface.
      - name: Doc lint (broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: mise exec mold -- cargo doc --locked --no-deps --workspace

      # Drift guard on the committed .sqlx/ query cache: fails if the cache
      # is stale relative to the query macros + live schema.
      - name: Check sqlx query cache freshness
        run: mise exec mold -- cargo sqlx prepare --check -- --locked --tests

      # nextest does not run doctests. Reverie has none today; this step
      # exists so doctest drift fails CI from day one and is near-instant
      # while empty.
      - name: Doctests
        run: mise exec mold -- cargo test --locked --doc --workspace

      # Upload the prefetch shards the cache action's post step cannot: that
      # step is a JavaScript action running from $GITHUB_WORKSPACE, which has
      # no Cargo.lock (the crate root is backend/), so it skips the upload.
      # No arguments: the setup step already exported KACHE_NAMESPACE and the
      # remote settings. Tracked in debt/2026-07-26-kache-shard-upload-step.md.
      - name: Upload prefetch shards
        if: env.R2_CONFIGURED == 'true' && github.ref == 'refs/heads/main'
        run: kache save-manifest

  # Keep the instrumented build off the checks job's serial critical path.
  # A dedicated target directory is safe to retain because it is used only
  # with this job's fixed coverage flags; raw execution profiles are deleted
  # before every run so cached results can never enter the report.
  backend:
    name: Backend coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: reverie
          POSTGRES_PASSWORD: reverie
          POSTGRES_DB: reverie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reverie -d reverie_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://reverie:reverie@localhost:5432/reverie_dev
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      # See the backend-checks job.
      CARGO_TERM_COLOR: always
      CARGO_LLVM_COV_TARGET_DIR: target/llvm-cov-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Version from backend/rust-toolchain.toml; see the backend-checks
      # toolchain step. Coverage instrumentation is read back by llvm-tools, so
      # that component is this job's alone.
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend -> target/llvm-cov-target
          shared-key: llvm-cov
          # Restore-only on PR branches; see the backend-checks cache step.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 postgres://reverie:reverie@localhost:5432/reverie_dev -f docker/init-roles.sql
        working-directory: ${{ github.workspace }}

      # Before the sqlx-cli install, since the job-level RUSTFLAGS routes that
      # link through mold too. nextest and cargo-llvm-cov ride along, and
      # shims stay off, for the reasons given on the checks job's mold step.
      - name: Install linker and coverage tools (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: mold github:nextest-rs/nextest github:taiki-e/cargo-llvm-cov
          add_shims_to_path: false

      - name: Cache sqlx-cli binary
        id: cache-sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SQLX_CLI_VERSION }}-postgres-rustls

      - name: Install sqlx-cli (cache miss only)
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        run: mise exec mold -- cargo install sqlx-cli --version ${{ env.SQLX_CLI_VERSION }} --no-default-features --features rustls,postgres

      - name: Apply migrations
        run: sqlx migrate run

      # Cargo fingerprints safely invalidate changed objects in this
      # coverage-only target. Remove raw execution data before retaining the
      # compiled artifacts with --no-clean.
      - name: Test (with coverage)
        run: |
          mkdir -p "$CARGO_LLVM_COV_TARGET_DIR"
          find "$CARGO_LLVM_COV_TARGET_DIR" -type f -name '*.profraw' -delete
          mise exec mold github:nextest-rs/nextest github:taiki-e/cargo-llvm-cov -- \
            cargo llvm-cov nextest --no-clean --locked --workspace --remap-path-prefix --lcov --output-path lcov.info

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/lcov.info
          if-no-files-found: error
          retention-days: 1

  # MSRV floor enforcement: compile the workspace on exactly the declared
  # `rust-version` so a dependency bump or new syntax that silently raises
  # the real minimum fails here instead of breaking self-hosters building
  # from source on the documented floor. Compile-only against the committed
  # .sqlx cache — no Postgres needed.
  msrv:
    name: MSRV check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: 0
      # See the backend-checks job.
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Read the MSRV from Cargo.toml so the pinned toolchain and the
      # declared rust-version cannot drift. The sed stops at the first
      # quote so a trailing inline comment carrying another quoted version
      # can't be captured; `|| true` lets a dropped field flow through as
      # empty so the format guard reports it rather than an opaque pipe
      # failure.
      - name: Resolve declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/^rust-version[^"]*"([0-9.]+)".*/\1/' || true)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Could not extract a valid rust-version from backend/Cargo.toml (got: '${version}')" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The one caller that overrides the pinned channel: this job compiles on
      # the declared floor rather than on the version the toolchain file pins.
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: backend
          # Restore-only on PR branches; see the backend-checks cache step.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --locked forbids resolving newer, higher-MSRV dependency versions than
      # the committed lockfile; --all-targets covers tests and benches too.
      #
      # RUSTUP_TOOLCHAIN is what actually holds this job to the floor: rustup
      # otherwise honours backend/rust-toolchain.toml and this job would
      # compile on the pinned toolchain, passing while checking nothing. The
      # assertion below is the regression test for that override taking
      # effect. rustc reports a full x.y.z while rust-version may be x.y,
      # hence the patch-suffix match.
      - name: Check workspace builds on MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          active=$(rustc --version | cut -d' ' -f2)
          case "${active}" in
            "${RUSTUP_TOOLCHAIN}" | "${RUSTUP_TOOLCHAIN}".*) ;;
            *)
              echo "MSRV job is compiling on rustc ${active}, not the declared floor ${RUSTUP_TOOLCHAIN}: the toolchain override is not in effect" >&2
              exit 1
              ;;
          esac
          cargo check --workspace --all-targets --locked

  audit:
    name: Dependency policy (cargo-deny)
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install cargo-deny (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: github:EmbarkStudios/cargo-deny
      # advisories reads the RustSec database; check also enforces the
      # license, ban, and source policy in backend/deny.toml. Advisory
      # suppressions and their justifications live in deny.toml.
      - name: Check dependencies (advisories, licenses, bans, sources)
        run: cargo deny check

  # PR-gate newly-introduced vulnerable dependencies: diffs the PR's
  # dependency manifests against base and fails on any added package with
  # an advisory at/above the floor. Complements cargo-deny (whole lockfile)
  # and Renovate (post-merge, reactive). pull_request-only — there is no
  # diff to evaluate on push or merge_group; ci-gate treats the skip as a
  # pass.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # License policy is owned by cargo-deny (backend/deny.toml) to
          # avoid a second, drifting allowlist; this layer gates
          # vulnerabilities only.
          fail-on-severity: moderate
          # vp ships as a vite fork installed under the `vite` alias, so
          # the lock entry reads vite@0.2.1 and matches every historical
          # real-vite advisory (0.2.1 sorts below all real versions).
          # vite-plus-core 0.2.1 is vite 8.x underneath, which carries the
          # fixes, so these do not apply. Revisit on a vp version bump. See
          # debt/2026-06-30-vite-plus-alias-dependency-review.md
          allow-ghsas: >-
            GHSA-353f-5xf4-qw67, GHSA-356w-63v5-8wf4, GHSA-4r4m-qw57-chr8,
            GHSA-4w7w-66w2-5vf9, GHSA-64vr-g452-qvp3, GHSA-859w-5945-r5v3,
            GHSA-9cwx-2883-4wfx, GHSA-c27g-q93r-2cwf, GHSA-fx2h-pf6j-xcff,
            GHSA-mv48-hcvh-8jj8, GHSA-v6wh-96g9-6wx3, GHSA-vg6x-rcgg-rjx6,
            GHSA-x574-m823-4x7w, GHSA-xcj6-pq6g-qj4x

  # Syntax / context-availability lint for workflow files. Mirrors the
  # lefthook pre-commit invocation at the same pinned version so local and
  # CI cannot drift.
  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: actionlint

      - name: Lint workflow files
        run: actionlint -color

  # Covers what actionlint and CodeQL's actions analyzer do not: credential
  # persistence, template injection in run blocks, cache poisoning of
  # privileged deploys, dangerous triggers, over-broad permissions. Matters
  # here because label.yml uses pull_request_target and docker-publish.yml is
  # a privileged GHCR deployer.
  #
  # Runs through `just infra::zizmor` so local and CI use the same recipe and
  # pinned binary: plain `zizmor .` with no SARIF upload, so a finding is a
  # hard failure rather than a non-blocking Security-tab entry.
  workflow-security:
    name: Workflow security (zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Keeps the five token-gated audits running (impostor-commit,
      # known-vulnerable-actions, ref-confusion, ref-version-mismatch,
      # stale-action-refs); without it zizmor degrades to offline mode with a
      # warning instead of failing. contents: read is scope enough, since
      # those audits query public data about the referenced actions, not
      # privileged data on this repo.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned tools (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: just zizmor

      - name: Workflow security audit (zizmor)
        run: just infra::zizmor

  # IaC misconfiguration scan over the Dockerfile and compose files: the
  # security class hadolint's instruction lint doesn't cover — root-user
  # defaults, missing healthchecks, privileged/host-mode services,
  # secrets-in-env shapes. HIGH/CRITICAL to match the image-scan gate in
  # docker-publish.yml; suppressions live in .trivyignore with per-finding
  # justification.
  iac-scan:
    name: IaC misconfig (trivy)
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Keep this pin in lockstep with docker-publish.yml's.
      - name: Install trivy
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-release-attachments depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
          version: "0.72.0"
          sha256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
          url: "https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_Linux-64bit.tar.gz"
          binary: trivy
          archive-member: trivy

      # Scoped to the container/IaC surface: workflow security is zizmor's
      # remit and docs templates are not deployable IaC.
      - name: Scan IaC for misconfigurations (gating)
        run: |
          set -euo pipefail
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs node_modules,frontend/node_modules,docs/node_modules,backend/target \
            --skip-dirs .github \
            .

  # PR-time image build: docker-publish only fires post-merge, so without
  # this a broken image definition merges green and detonates on main in
  # the privileged publish lane (the lockfile-hoist incident). arm64 to
  # match the main-push publish arch and share its warm layer cache.
  docker-build:
    name: Docker image build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Read the publish lane's cache, never write it: a PR-controlled
      # cache-to into the scope the privileged publish job restores would
      # be a cache-poisoning surface.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=buildcache-arm64

  # checkov OpenAPI policy gate over the generated spec: securitySchemes
  # present and non-cleartext, global security rules defined,
  # operation-level security coverage. Suppressions, if ever needed, live
  # in .checkov.yaml with per-finding justification. Dockerfile/compose
  # misconfig is trivy's remit; workflow security is zizmor's.
  openapi-policy:
    name: OpenAPI policy (checkov)
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # checkov is pip-only (no standalone release binary). Pinned so a new
      # upstream policy cannot break the gate on an unrelated PR.
      - name: Install checkov 3.3.0
        run: pipx install checkov==3.3.0

      - name: Scan OpenAPI spec (gating)
        run: checkov -f docs/openapi.json --framework openapi --compact --config-file .checkov.yaml

  # npm counterpart of cargo-deny's [licenses] allowlist (Rust-only;
  # dependency-review-action gates PR-introduced vulnerabilities, not
  # licenses).
  #
  # Scope is --production of each tree: dev tooling is not redistributed. The
  # root tree has no production deps today, included so a later one is gated
  # from day one.
  #
  # Allowlist mirrors deny.toml's permissive-only set plus the permissive
  # licenses present in the npm trees. Excluded by name (not license): these
  # are build-time-only native tooling whose compiled *output* ships but whose
  # own code never lands in it, so their license does not bind the project:
  #   - @img/sharp-libvips-* (LGPL-3.0): sharp's libvips prebuilts.
  #   - lightningcss* (MPL-2.0): CSS transform; output is plain CSS.
  #   - satteri / @bruits/satteri-* (MIT upstream, no license field
  #     published): Markdown processor prebuilts; reads UNKNOWN until the
  #     pre-1.0 packaging gap is fixed upstream.
  # The gate still fails any other package carrying these licenses.
  npm-license:
    name: npm license policy
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install node (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: node "npm:npm"
          add_shims_to_path: true

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-manager: false
          cache: true

      # One workspace install; license-checker walks each package's
      # declared production deps resolved from the hoisted root
      # node_modules. The scanner itself is a lockfile-pinned root
      # devDependency.
      - name: Check npm licenses (gating)
        run: |
          set -euo pipefail
          vp install
          allow="MIT;Apache-2.0;ISC;0BSD;BSD-2-Clause;BSD-3-Clause;BlueOak-1.0.0;CC0-1.0;Python-2.0;Unlicense"
          rc=0
          for tree in . frontend docs; do
            echo "::group::license check (${tree})"
            (
              cd "$tree"
              npx --no-install license-checker-rseidelsohn \
                --production \
                --excludePrivatePackages \
                --excludePackagesStartingWith "@img/sharp-libvips;@bruits/satteri;satteri;lightningcss" \
                --onlyAllow "$allow"
            ) || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  # Rule-based SAST, motivated by Rust, where CodeQL's extractor resolves
  # only ~47% of call targets and pattern rules need no call-graph
  # resolution. Engine is opengrep, the Linux Foundation fork of semgrep.
  # Rulesets are SHA-pinned so an upstream rule addition cannot break the
  # gate on an unrelated PR.
  sast:
    name: SAST (opengrep)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout opengrep-rules (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: opengrep/opengrep-rules
          ref: f1d2b562b414783763fd02a6ed2736eaed622efa
          path: .opengrep-rules
          persist-credentials: false

      - name: Install opengrep
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-release-attachments depName=opengrep/opengrep extractVersion=^v(?<version>.+)$
          version: "1.25.0"
          sha256: "9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33"
          url: "https://github.com/opengrep/opengrep/releases/download/v{version}/opengrep_manylinux_x86"
          binary: opengrep

      # --error exits non-zero on any finding. Security packs only — the full
      # language packs bundle best-practice/portability rules, which are the
      # linter's remit. Tests are not excluded wholesale (a blanket file drop
      # is a coverage blind spot); a test legitimately exercising an insecure
      # API gets a call-site `// nosemgrep: <rule-id>` carve-out.
      #
      # Excluded rule: rust.lang.security.args fires on any std::env::args
      # use; main.rs reads argv for CLI subcommand dispatch, not a security
      # decision, and the rule cannot tell the difference. Its ID prefix is
      # derived from the rules-checkout `path:` above — keep the two in
      # lockstep or the exclusion silently stops matching.
      - name: Scan source (gating)
        run: |
          set -euo pipefail
          opengrep scan \
            --config .opengrep-rules/rust/lang/security \
            --config .opengrep-rules/typescript/lang/security \
            --config .opengrep-rules/typescript/react/security \
            --exclude-rule opengrep-rules.rust.lang.security.args \
            --error \
            backend/src frontend/src

  # Server-side lint gate for shell, the Dockerfile, spelling, YAML,
  # Markdown, prose, and formatting. The pre-commit hook runs these locally
  # but is bypassable and never runs on fork PRs, so this job is the
  # authoritative surface. Tools are pinned in mise.toml and invoked through
  # just recipes, so both planes evaluate the same binaries.
  repo-lint:
    name: Repo lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Static guard, invoked as the script rather than through `just` so it
      # still runs first, before mise and any install: the pins it checks are
      # what those installs would use, so drift should fail in seconds rather
      # than after provisioning the wrong vp. `just infra::vp-pin-drift` runs
      # the same script locally and in the preflight gate. jq and yq are both
      # preinstalled on the runner image, so this step needs no toolchain.
      - name: vp and node pins agree across every copy
        run: scripts/vp-pin-drift.sh

      # Same reasoning as the vp guard above: run the script directly, ahead
      # of mise, so a disagreeing npm pin fails in seconds rather than after
      # provisioning the npm that package.json would then reject. This job
      # enumerates recipes individually rather than running `just
      # infra::lint`, so a guard added only to that aggregate would run
      # locally and never on the merge path.
      - name: npm pin agrees between package.json and mise
        run: scripts/npm-pin-drift.sh

      # Single-source tool provisioning: mise installs the exact pins from
      # mise.toml, so this job runs the same binaries as the local hooks and
      # there is no per-workflow version copy to drift.
      # Shims stay on for this step, unlike the Rust jobs' mise-action calls:
      # this job runs only JS tools from the repo root, so there is no
      # registry package root for a shim to resolve against.
      - name: Install pinned tools (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: just shellcheck hadolint typos vale yamllint github:quarylabs/sqruff node "npm:npm"
          add_shims_to_path: true

      - name: Shell lint (shellcheck)
        run: just infra::shellcheck

      - name: No workflow re-pins a mise-managed tool
        run: just infra::tool-pin-drift

      # A custom manager whose regex stops matching yields no deps and no
      # error, so nothing else here can notice Renovate losing sight of the
      # devEngines pin.
      - name: Renovate still sees the devEngines npm pin
        run: just infra::renovate-npm-manager-selftest

      - name: ADR frontmatter and index coverage
        run: just infra::adr-frontmatter-selftest

      - name: Dockerfile lint (hadolint)
        run: just infra::hadolint

      - name: Spell check (typos)
        run: just infra::typos

      - name: YAML lint (yamllint)
        run: just infra::yamllint

      - name: SQL lint (sqruff)
        run: just infra::sqruff

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-manager: false
          cache: true

      - name: Install workspace
        run: vp install

      - name: Markdown lint (markdownlint-cli2)
        run: just js::markdownlint

      # Spelling emits at `warning`, so this surfaces findings without failing
      # the build. Scope and exclusions live in .vale.ini.
      - name: Prose lint (Vale)
        run: just infra::prose

      # Authoritative formatting gate: the pre-commit hook formats staged
      # files locally, but this whole-tree --check is what actually fails
      # the build. Scope lives in the root vite.config.ts fmt block.
      - name: Format check (oxfmt)
        run: just js::fmt-check

      # greptile.json must parse and every customContext.files[] pin must
      # resolve — a pin to a moved file degrades reviews silently.
      # Unconditional so a PR that deletes a pinned file fails here even if
      # it never touches greptile.json.
      - name: Validate greptile.json
        run: just infra::greptile-config

      # Dev-DB compose invariants (loopback bind, digest pin, parent volume
      # mount) and the recipe secret-echo guard: overridden DB credentials
      # must never print into echoed recipe lines.
      - name: Compose dev invariants
        run: just infra::compose-dev-invariants

      - name: Recipe secret-echo guard
        run: just infra::recipe-secret-echo-test

      # Two self-tests on this job take a script as their subject rather than
      # committed configuration, because no assertion inside that script could
      # do the same work. Both run in CI, not only locally, because a local
      # gate is bypassable and never runs on fork PRs.
      #
      # scripts/filter-sarif-unfixable-os.sh decides which container CVEs
      # reach the code-scanning dashboard; an edit that widens its match
      # silently withholds findings that do have fixes. The fixture builds a
      # case a live scan cannot be relied on to contain.
      - name: Container-CVE suppression predicate
        run: just infra::filter-sarif-unfixable-os-selftest

      # scripts/preflight-scope.sh decides which lanes a local gate runs.
      # Break the `scripts/*` arm of its escalates() and a change to the
      # scoper narrows its own gate silently. The scoper can't assert its way
      # out of that (the selector is the code under suspicion), and a local
      # gate is circular for the same reason. This job isn't: unconditional
      # and never consults the scoper.
      - name: Preflight lane scoper
        run: just infra::preflight-scope-selftest

      # Every dependency-resolving cargo invocation across the just recipes,
      # the git hooks, the workflow files (this one included), and the image
      # build must pass --locked (the package-ingress ADR's frozen-installs
      # control).
      - name: cargo --locked guard
        run: just infra::cargo-locked-guard

      - name: Validate lefthook.yml
        run: just infra::lefthook-validate

      # Reject issue-tracker references in public-facing source and docs —
      # they describe a private tracker, not the codebase. The issue-ref
      # guard itself scans the whole tree on every invocation; this filter
      # only decides whether a PR touches gated-scope file types at all, so
      # PRs outside that scope skip the step entirely. The plan-ref guard
      # that runs alongside it stays changed-files only.
      - name: Detect changed source and docs
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: source-changed
        with:
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          list-files: json
          filters: |
            source:
              - 'backend/src/**/*.rs'
              - 'frontend/src/**/*.{ts,tsx,js,jsx,css}'
              - '**/*.{md,mdx}'

      # The file list reaches the shell via env (never inline `${{ }}`),
      # and is NUL-delimited so a filename containing a newline cannot
      # split and bypass the guard. `shell: bash` because mapfile + process
      # substitution are bash-only.
      - name: Reject issue-tracker and plan refs in changed source
        if: steps.source-changed.outputs.source == 'true'
        shell: bash
        env:
          SOURCE_FILES: ${{ steps.source-changed.outputs.source_files }}
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(printf '%s' "$SOURCE_FILES" | jq -j '.[] + "\u0000"')
          if [ "${#files[@]}" -gt 0 ]; then
            just infra::no-issue-refs "${files[@]}"
            just infra::no-plan-refs "${files[@]}"
          fi

  frontend:
    name: Frontend
    needs: changes
    # Push-to-main always runs both stack jobs; see the backend job's note.
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # just walks up to the repo-root justfile from this frontend/ working
      # directory; each js:: recipe re-enters frontend/ via its own
      # [working-directory]. Shims stay on: this job runs only JS tools from
      # the repo root, so there is no registry package root for a shim to
      # resolve against.
      - name: Install just and node (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: just node "npm:npm"
          add_shims_to_path: true

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-manager: false
          cache: true

      # Install from the repo root: the root prepare hook (lefthook
      # install) resolves its binary from the root node_modules.
      - name: Install
        working-directory: ${{ github.workspace }}
        run: vp install

      - name: Lint
        run: just js::oxlint

      - name: Test (with coverage)
        run: just js::test-coverage

      # if-no-files-found: error — a missing report must fail here, not
      # read as 0% coverage downstream. Consumed by the sonar job within
      # this run; no post-run use, so minimum retention.
      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Stylelint
        run: just js::stylelint

      # Advisory until the 3 known bg-black findings in stock shadcn
      # overlays are addressed.
      - name: Detect (impeccable, advisory)
        run: just js::detect
        continue-on-error: true

      - name: Verify font integrity
        run: just js::font-integrity

      - name: Build
        run: just js::build

  # WCAG 2.2 AA gate: axe-core against the shipped routes in DEFAULT_TARGETS
  # (frontend/scripts/a11y/allowlist.mjs), failing on any violation outside
  # that file's allowlist. The Playwright config owns the dev-server lifecycle
  # and ships an arm64 Chromium, so the gate reproduces on the ARM64 dev box
  # as well as x86 CI.
  #
  # webServer runs the dev server, not a production-build preview: that has
  # always been what this gate measures, and switching it is a separate
  # change.
  a11y:
    name: Accessibility (axe)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install node (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: node "npm:npm"
          add_shims_to_path: true

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-manager: false
          cache: true

      # Install from the repo root (the root prepare hook needs npm's cwd
      # at the root to resolve lefthook). @playwright/test is a
      # lockfile-pinned frontend devDependency, so its integrity rides the
      # committed lockfile like every other npm dep.
      - name: Install
        working-directory: ${{ github.workspace }}
        run: vp install

      # Key the browser cache on the resolved @playwright/test version so a
      # lockfile bump misses cleanly and re-downloads.
      - name: Resolve Playwright version
        id: playwright
        working-directory: ${{ github.workspace }}
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Install unconditionally, even on a cache hit: the cache holds only the
      # browser binaries under ~/.cache/ms-playwright, but `--with-deps`
      # installs OS-level apt packages that are not cached and must be present
      # on every run.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # webServer in playwright.config.ts starts `npm run dev`, waits on the
      # scanned route, and tears it down. Do not also start a server here:
      # Playwright never reuses an existing server in CI, so a second one would
      # collide on port 5173 (EADDRINUSE).
      - name: Run accessibility gate
        run: npm run a11y

      # Traces (retain-on-failure) carry the attached axe-results.json plus DOM
      # snapshots and console for each failing scan; only present on a red run.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a11y-playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  # Smoke test the staging compose init path: catches role-clause
  # regressions in init-roles.sql and required-env-var regressions in the
  # compose `${VAR:?required}` interpolations before they land on staging.
  # Postgres-only `up` — the init surface under test is postgres.
  staging-smoke:
    name: Staging compose smoke
    needs: changes
    if: needs.changes.outputs.staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Build .env from the committed example so a required key renamed in
      # compose but not in the example is also caught. Distinct passwords
      # per role so a swapped CREATE ROLE clause in init-roles.sql can't
      # authenticate cross-role and pass silently.
      - name: Prepare env files from examples
        working-directory: docker
        run: |
          set -euo pipefail
          cp staging.env.bootstrap.example .env
          # .env.runtime and .env.migrate are required: true on services
          # that aren't started here; compose validates env_file presence
          # at parse time regardless. Stub values, never read.
          cp staging.env.runtime.example .env.runtime
          cp staging.env.migrate.example .env.migrate
          # `=.*` (not `=$`) so substitutions stay robust if the examples
          # ever acquire non-empty defaults; an exact-empty anchor would
          # silently no-op and fail later at auth with an opaque 28P01.
          sed -i \
            -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=smoke_super_pw_1|' \
            -e 's|^REVERIE_APP_PASSWORD=.*|REVERIE_APP_PASSWORD=smoke_app_pw_2|' \
            -e 's|^REVERIE_INGESTION_PASSWORD=.*|REVERIE_INGESTION_PASSWORD=smoke_ing_pw_3|' \
            -e 's|^REVERIE_READONLY_PASSWORD=.*|REVERIE_READONLY_PASSWORD=smoke_ro_pw_4|' \
            -e 's|^REVERIE_MIGRATOR_PASSWORD=.*|REVERIE_MIGRATOR_PASSWORD=smoke_mig_pw_5|' \
            -e 's|^REVERIE_VERSION=.*|REVERIE_VERSION=smoke-test|' \
            -e 's|^REVERIE_LIBRARY_HOST_PATH=.*|REVERIE_LIBRARY_HOST_PATH=/tmp/smoke-library|' \
            -e 's|^REVERIE_INGESTION_HOST_PATH=.*|REVERIE_INGESTION_HOST_PATH=/tmp/smoke-ingestion|' \
            -e 's|^REVERIE_QUARANTINE_HOST_PATH=.*|REVERIE_QUARANTINE_HOST_PATH=/tmp/smoke-quarantine|' \
            -e 's|^REVERIE_RECOVERY_PINS_HOST_PATH=.*|REVERIE_RECOVERY_PINS_HOST_PATH=/tmp/smoke-recovery-pins|' \
            .env

      - name: Bring up postgres service
        run: docker compose -f docker/compose.staging.yml up -d --wait --wait-timeout 120 reverie-postgres

      # `docker compose exec` keeps the psql client version matched to the
      # server image.
      - name: Assert roles exist with CONNECT grant
        run: |
          set -euo pipefail
          exec_psql() {
            docker compose -f docker/compose.staging.yml exec -T \
              -e PGPASSWORD=smoke_super_pw_1 \
              reverie-postgres psql -v ON_ERROR_STOP=1 -At \
              -U reverie -d reverie "$@"
          }
          for role in reverie_app reverie_ingestion reverie_readonly reverie_migrator; do
            exists=$(exec_psql -c "SELECT 1 FROM pg_roles WHERE rolname = '${role}' AND rolcanlogin")
            if [ "$exists" != "1" ]; then
              echo "Role ${role} missing or cannot login" >&2
              exit 1
            fi
            # Query pg_database.datacl directly (not has_database_privilege)
            # so deleting the explicit GRANT CONNECT lines is caught even
            # while Postgres' default PUBLIC -> CONNECT grant is in place;
            # has_database_privilege returns true via PUBLIC and would mask
            # the deletion.
            has_connect=$(exec_psql -c "SELECT EXISTS (SELECT 1 FROM pg_database d, aclexplode(d.datacl) acl WHERE d.datname = current_database() AND acl.grantee = (SELECT oid FROM pg_roles WHERE rolname = '${role}') AND acl.privilege_type = 'CONNECT')")
            if [ "$has_connect" != "t" ]; then
              echo "Role ${role} lacks an explicit CONNECT grant on $(exec_psql -c 'SELECT current_database()')" >&2
              exit 1
            fi
          done

      # Catches `LOGIN PASSWORD` clause regressions in init-roles.sql (the
      # 28P01-at-runtime failure mode).
      - name: Assert each role authenticates with its supplied password
        run: |
          set -euo pipefail
          login_as() {
            local role=$1 pw=$2
            docker compose -f docker/compose.staging.yml exec -T \
              -e PGPASSWORD="${pw}" \
              reverie-postgres psql -v ON_ERROR_STOP=1 -At \
              -h localhost -U "${role}" -d reverie -c 'SELECT 1' >/dev/null
          }
          login_as reverie_app       smoke_app_pw_2
          login_as reverie_ingestion smoke_ing_pw_3
          login_as reverie_readonly  smoke_ro_pw_4
          login_as reverie_migrator  smoke_mig_pw_5

      # THREAT: the migration identity must not be a superuser, create
      # roles, or bypass RLS. This catches *active* escalation (a CREATE/
      # ALTER ROLE adding SUPERUSER/CREATEROLE/BYPASSRLS). It does NOT
      # catch deletion of the explicit NOSUPERUSER NOCREATEROLE NOBYPASSRLS
      # clause from init-roles.sql — those are the CREATE ROLE defaults, so
      # removal yields the same f|f|f; the clause's presence is guarded by
      # review.
      - name: Assert reverie_migrator is not over-privileged
        run: |
          set -euo pipefail
          attrs=$(docker compose -f docker/compose.staging.yml exec -T \
            -e PGPASSWORD=smoke_super_pw_1 \
            reverie-postgres psql -v ON_ERROR_STOP=1 -At \
            -U reverie -d reverie \
            -c "SELECT rolsuper, rolcreaterole, rolbypassrls FROM pg_roles WHERE rolname = 'reverie_migrator'")
          if [ "$attrs" != "f|f|f" ]; then
            echo "reverie_migrator is over-privileged: rolsuper|rolcreaterole|rolbypassrls = ${attrs} (want f|f|f)" >&2
            exit 1
          fi

      # The migrator's two load-bearing grants: CREATE on the database (for
      # `CREATE SCHEMA` in the initial migration) and CREATE on schema
      # public (PG15+ revoked the implicit PUBLIC grant). Role-exists /
      # login / f|f|f all stay green if either is dropped — only a real DDL
      # round-trip catches it. One statement exercises both, leaving no
      # residue.
      - name: Assert reverie_migrator has DDL capability
        run: |
          set -euo pipefail
          docker compose -f docker/compose.staging.yml exec -T \
            -e PGPASSWORD=smoke_mig_pw_5 \
            reverie-postgres psql -v ON_ERROR_STOP=1 -At \
            -h localhost -U reverie_migrator -d reverie \
            -c "CREATE SCHEMA _smoke_ddl; CREATE TABLE _smoke_ddl.probe (id int); DROP SCHEMA _smoke_ddl CASCADE;"

      # THREAT: the long-lived app must hold zero DDL credentials, so
      # DATABASE_URL_MIGRATION must reach `reverie-migrate` and NOT the
      # `reverie` app service. Asserted against the fully-rendered config;
      # parse-time only, and runs while env files are still intact (before
      # the negative-path step blanks a var).
      - name: Assert DATABASE_URL_MIGRATION is scoped to reverie-migrate only
        working-directory: docker
        run: |
          set -euo pipefail
          rendered=$(docker compose -f compose.staging.yml config)
          if ! awk '/^  reverie-migrate:/{f=1} f && /^  [a-z]/ && !/^  reverie-migrate:/{f=0} f' <<<"$rendered" \
               | grep -q 'DATABASE_URL_MIGRATION'; then
            echo "DATABASE_URL_MIGRATION missing from reverie-migrate service config" >&2
            exit 1
          fi
          if awk '/^  reverie:/{f=1} f && /^  [a-z]/ && !/^  reverie:/{f=0} f' <<<"$rendered" \
               | grep -q 'DATABASE_URL_MIGRATION'; then
            echo "DATABASE_URL_MIGRATION leaked into the reverie app service — credential isolation broken" >&2
            exit 1
          fi

      - name: Tear down postgres service
        if: always()
        run: docker compose -f docker/compose.staging.yml down -v

      # Negative path: blank a required env var and assert `compose config`
      # hard-fails mentioning it. Key-name presence in stderr is the
      # signal — compose's exact wording is not pinned across versions.
      # `!cancelled()` so a regression in the `:?required` mechanism isn't
      # silently skipped behind an earlier failure.
      - name: Assert missing required env var hard-fails
        if: ${{ !cancelled() }}
        working-directory: docker
        run: |
          set -euo pipefail
          sed -i 's|^REVERIE_APP_PASSWORD=.*|REVERIE_APP_PASSWORD=|' .env
          if stderr=$(docker compose -f compose.staging.yml config 2>&1 >/dev/null); then
            echo "Expected compose config to fail with missing REVERIE_APP_PASSWORD, but it succeeded" >&2
            echo "stderr was:" >&2
            echo "${stderr}" >&2
            exit 1
          fi
          if ! grep -qF REVERIE_APP_PASSWORD <<<"${stderr}"; then
            echo "compose config failed but stderr did not mention REVERIE_APP_PASSWORD" >&2
            echo "stderr was:" >&2
            echo "${stderr}" >&2
            exit 1
          fi

  # Server-side secret scan. The gitleaks pre-commit hook is client-side:
  # bypassable and never run on fork PRs. Intentionally unconditional — a
  # secret can land in any file type, so every PR is scanned.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the pull_request scan below can walk the whole
          # branch range, not just the tip commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (mise)
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: "2026.8.5"
          install_args: gitleaks

      # On a pull_request, scan every commit the branch introduces: a secret
      # added and later removed within the branch is gone from the working
      # tree but stays readable in the pushed history, so a HEAD-only scan
      # would pass while the credential is still exposed. push/merge_group
      # has no PR base and falls back to a full-tree scan. --redact keeps any
      # match out of the public CI log.
      - name: Scan for secrets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA}" ]; then
            gitleaks git . --no-banner --redact --log-opts "${PR_BASE_SHA}..HEAD"
          else
            gitleaks dir . --no-banner --redact
          fi

  # PR-time docs build + internal-link gate. The build definition lives in
  # the reusable docs-build.yml, shared with docs.yml's Pages deploy lane
  # (cross-workflow `needs` is impossible, so the job must exist here to
  # join ci-gate). A skipped docs job (no docs change) is treated as a pass
  # by the aggregator.
  docs:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-build.yml

  # Advisory: absent from ci-gate.needs[] and continue-on-error, so a Sonar
  # outage or missing token never fails the build.
  sonar:
    name: SonarQube Cloud
    needs: [changes, backend, frontend]
    # A main analysis overwrites coverage with exactly what it submits;
    # SonarQube Cloud has no carryforward, so a missing report re-reports that
    # stack as 0%. Hence on push both producers must have succeeded. PR
    # analyses never touch the main baseline, so single-stack PRs still scan.
    # Skip fork PRs: no SONAR_TOKEN, so the scan only fails. Skip bot
    # dependency PRs by head branch (renovate/*, dependabot/*): their diffs
    # carry no analyzable first-party code, and keying on the branch rather
    # than the actor keeps the scan skipped when a human pushes a fix to the
    # bot branch. !cancelled(), not always(): always() runs even inside a
    # cancelled run, and once scanned main with zero artifacts, wiping the
    # baseline to 0%. The codacy-coverage job mirrors this condition.
    if: >-
      !cancelled() &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        !startsWith(github.head_ref, 'renovate/') &&
        !startsWith(github.head_ref, 'dependabot/'))) &&
      (github.event_name != 'push' ||
       (needs.backend.result == 'success' && needs.frontend.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # blame-based new-code detection
          persist-credentials: false

      # Best-effort: the producing job may be skipped on a single-stack PR.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: dl_backend
        with:
          name: backend-coverage
          path: backend
        continue-on-error: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: dl_frontend
        with:
          name: frontend-coverage
          path: frontend/coverage
        continue-on-error: true

      # Both reports carry stack-relative SF: paths; prepend each stack dir
      # so a single project resolves them against projectBaseDir. Without
      # this they match nothing and coverage reads 0%.
      - name: Normalize coverage paths to repo root
        run: |
          set -euo pipefail
          if [ -f backend/lcov.info ]; then
            sed -i 's#^SF:#SF:backend/#' backend/lcov.info
          fi
          if [ -f frontend/coverage/lcov.info ]; then
            sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info
          fi

      # On push a missing artifact must block the scan: it would overwrite
      # the main baseline with partial coverage (the job-level if already
      # requires both producers green, so a miss here is an artifact-infra
      # failure). On PRs the analysis is baseline-safe; annotate and
      # continue. The job stays advisory either way (continue-on-error,
      # absent from ci-gate).
      - name: Gate coverage inputs
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BACKEND_DL: ${{ steps.dl_backend.outcome }}
          FRONTEND_DL: ${{ steps.dl_frontend.outcome }}
        run: |
          if [ "${BACKEND_DL}" = 'failure' ] || [ "${FRONTEND_DL}" = 'failure' ]; then
            if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
              echo "::error title=Sonar coverage missing::A coverage artifact was absent on a main push; refusing to overwrite the baseline with partial coverage."
              exit 1
            fi
            echo "::warning title=Sonar coverage partial::A coverage artifact was absent (single-stack PR or upstream failure); Sonar scanned with incomplete coverage."
          fi
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::warning title=SONAR_TOKEN missing::SonarQube scan ran without a token; coverage was not published."
          fi

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Advisory: absent from ci-gate.needs[] and continue-on-error, so a Codacy
  # outage or missing token never fails the build. Deliberately a sibling of
  # the sonar job rather than steps inside it: the two coverage vendors are
  # under comparison, and separate jobs let either be dropped without
  # untangling shared steps.
  codacy-coverage:
    name: Codacy coverage
    needs: [backend, frontend]
    # Mirrors the sonar job's condition (see its comment for the rationale):
    # fork PRs carry no CODACY_PROJECT_TOKEN, so the upload can only fail; bot
    # dependency branches are skipped by head branch rather than actor; on
    # push both producers must have succeeded before a commit's coverage
    # publishes.
    if: >-
      !cancelled() &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        !startsWith(github.head_ref, 'renovate/') &&
        !startsWith(github.head_ref, 'dependabot/'))) &&
      (github.event_name != 'push' ||
       (needs.backend.result == 'success' && needs.frontend.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Best-effort: the producing job may be skipped on a single-stack PR.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-coverage
          path: backend
        continue-on-error: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-coverage
          path: frontend/coverage
        continue-on-error: true

      # Both reports carry stack-relative SF: paths; see the sonar job's
      # equivalent step. Codacy resolves coverage against repository-root
      # paths and reports no data at all when a file can't be located.
      - name: Normalize coverage paths to repo root
        run: |
          set -euo pipefail
          if [ -f backend/lcov.info ]; then
            sed -i 's#^SF:#SF:backend/#' backend/lcov.info
          fi
          if [ -f frontend/coverage/lcov.info ]; then
            sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info
          fi

      # The reporter is handed only the reports that exist: naming a missing
      # file fails the whole upload, which would otherwise turn every
      # single-stack PR into an error. Reports above 10 MB fail server-side
      # with a JSON parse error, so size is surfaced here where it is legible.
      - name: Collect coverage reports
        id: reports
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          list=''
          for f in backend/lcov.info frontend/coverage/lcov.info; do
            if [ ! -f "${f}" ]; then
              echo "::warning title=Coverage report missing::${f} was not produced; Codacy coverage will be partial."
              continue
            fi
            size=$(wc -c < "${f}")
            if [ "${size}" -gt 10485760 ]; then
              echo "::warning title=Coverage report oversized::${f} is ${size} bytes; Codacy rejects reports above 10 MB."
            fi
            list="${list:+${list},}${f}"
          done
          echo "list=${list}" >> "${GITHUB_OUTPUT}"
          if [ -z "${CODACY_PROJECT_TOKEN}" ]; then
            echo "::warning title=CODACY_PROJECT_TOKEN missing::Codacy coverage upload skipped."
            echo 'token=' >> "${GITHUB_OUTPUT}"
          else
            echo 'token=set' >> "${GITHUB_OUTPUT}"
          fi

      # The action SHA pins the wrapper, not the reporter: v1.3.0 fetches
      # Codacy's bootstrap script from master on every run, and no released
      # revision accepts a reporter version. The script verifies the SHA512 of
      # the binary it installs, so the unpinned surface is the script itself,
      # against a vendor that already receives the whole repository.
      - name: Upload coverage to Codacy
        if: steps.reports.outputs.list != '' && steps.reports.outputs.token == 'set'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.reports.outputs.list }}

  # Single required status check for the branch ruleset. Path-conditional
  # jobs that legitimately skip on a given PR no longer leave an
  # individually-required check unsatisfied; the gate fails only when a
  # needed job actually failed or was cancelled — `skipped` is a pass.
  #
  # `if: always()` is load-bearing: without it the gate is itself skipped
  # when an upstream job fails, and GitHub reports a skipped required check
  # as success — a broken build could merge.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - backend
      - backend-checks
      - msrv
      - audit
      - dependency-review
      - workflow-lint
      - workflow-security
      - repo-lint
      - frontend
      - a11y
      - staging-smoke
      - secret-scan
      - iac-scan
      - docker-build
      - openapi-policy
      - npm-license
      - sast
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "$RESULTS"
          exit 1
