name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which areas of the repo changed so downstream jobs can skip
  # entirely when their inputs are untouched. Documentation-only PRs
  # (CLAUDE.md, README, /plans/, etc.) skip the heavy jobs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      audit: ${{ steps.filter.outputs.audit }}
      frontend: ${{ steps.filter.outputs.frontend }}
      staging: ${{ steps.filter.outputs.staging }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On merge_group events, paths-filter's default base (HEAD~1)
          # only sees the topmost commit in the synthetic merge ref —
          # it would miss the diff for any PR sharing the queue. Pin
          # explicitly to merge_group.base_sha so downstream skip
          # decisions match the actual PR-against-main diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - 'docker/init-roles.sql'
              - 'docker-compose.yml'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            audit:
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            staging:
              - 'docker/compose.staging.yml'
              - 'docker/init-roles.sql'
              - 'docker/staging.env.bootstrap.example'
              - 'docker/staging.env.runtime.example'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reverie
          POSTGRES_PASSWORD: reverie
          POSTGRES_DB: reverie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reverie -d reverie_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # `sqlx::test` connects as the schema owner to create per-test databases
      # and run migrations against them; role pools for reverie_app /
      # reverie_ingestion are built per-test in code.
      DATABASE_URL: postgres://reverie:reverie@localhost:5432/reverie_dev
      # Single source of truth for the sqlx-cli pin. Both the cache key
      # and the `cargo install` invocation reference this; bumping it in
      # one place without the other would let a stale binary be restored.
      SQLX_CLI_VERSION: "0.8.6"
      # CI build-speed tweaks (CI-only — local dev untouched).
      #
      # Incremental builds add metadata-tracking overhead that's wasted in
      # CI's single-shot scenario. rust-cache's own README recommends
      # disabling for CI.
      CARGO_INCREMENTAL: 0
      # Trim test/dev debuginfo to `line-tables-only`: keeps panic
      # backtraces with `file:line` but drops full debug symbols. Cuts
      # link size + link time meaningfully (~10-20% on a 600-dep
      # workspace) without hiding panic detail in CI logs. Local dev
      # keeps default `debug = true` because `CARGO_PROFILE_*` is a
      # process-env override, not a Cargo.toml mutation.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # mold linker via GCC's `-fuse-ld=` driver flag (GCC 12+ supports
      # mold directly; Ubuntu 24.04 ships GCC 13). Cuts link time by
      # roughly 5-10× vs default `ld`, which is the single-threaded
      # bottleneck at the end of every cargo invocation. First CI run
      # after this PR pays a one-time rust-cache miss (RUSTFLAGS is part
      # of the cache key); subsequent runs see the speedup.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v6

      - name: Create database roles
        run: psql postgres://reverie:reverie@localhost:5432/reverie_dev -f docker/init-roles.sql
        working-directory: ${{ github.workspace }}

      # mold itself; the RUSTFLAGS at the job level routes the linker
      # invocation through it. Installs in ~5s from apt; pinned-version
      # not required because mold is ABI-compatible at the linker
      # interface and the binary is exercised only at build time.
      - name: Install mold linker
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # sqlx-cli has no upstream prebuilt binaries (launchbadge/sqlx never
      # publishes GitHub release assets and has no quickinstall mirror), so
      # install-action's only path was a 2-minute `cargo install` from source
      # on every run. Two-pronged fix:
      #
      # 1. Feature-trim — drop sqlite, mysql, native-tls, completions; keep
      #    only rustls + postgres (Reverie's actual surface). Cuts the
      #    cold-cache compile to ~60-90s.
      # 2. Dedicated cache keyed on sqlx-cli version + features alone (not
      #    workspace Cargo.lock). Renovate-triggered lock churn no longer
      #    invalidates the binary cache. Warm-cache restore is ~5s.
      #
      # If the sqlx-cli version or features change, bump the cache key
      # suffix so a stale binary isn't restored.
      - name: Cache sqlx-cli binary
        id: cache-sqlx-cli
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SQLX_CLI_VERSION }}-postgres-rustls

      - name: Install sqlx-cli (cache miss only)
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version ${{ env.SQLX_CLI_VERSION }} --no-default-features --features rustls,postgres --locked

      # cargo-nextest replaces the default `cargo test` runner for the
      # Test step below. install-action ships a prebuilt binary for
      # cargo-nextest, so this is a ~5s download.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9

      - name: Apply migrations
        run: sqlx migrate run

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      # Phase 1 of the tiered comment policy rollout
      # (adr/2026-05-08-tiered-comment-policy.md). No missing-docs
      # requirement yet — just kills broken intra-doc cross-refs in the
      # docstrings that already exist. `cargo doc` over the workspace
      # without `--document-private-items` is the conservative scope:
      # pub items only, matching Tier 1 surface.
      - name: Doc lint (broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: cargo doc --no-deps --workspace

      # UNK-167: drift guard on the committed .sqlx/ query cache. Every
      # `cargo sqlx prepare` regeneration must be checked in; CI fails if
      # cache is stale relative to query macros + live schema.
      - name: Check sqlx query cache freshness
        run: cargo sqlx prepare --check -- --tests

      # UNK-172: grep-guard against new runtime `sqlx::query[*](...)`
      # invocations creeping back in. Allowlist documents legitimate
      # carve-outs (DDL, dynamic SQL, set_config GUC, enum-drift probes).
      - name: Guard against new runtime sqlx::query invocations
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          violations=$(grep -rnE 'sqlx::query[a-z_]*\(' backend/src/ \
              | grep -v -F -f <(grep -vE '^\s*(#|$)' .github/sqlx-runtime-allowlist.txt) \
              || true)
          if [ -n "$violations" ]; then
              echo "Disallowed runtime sqlx::query invocations detected." >&2
              echo "Use compile-time macros (query!, query_as!, query_scalar!)" >&2
              echo "or add a justified entry to .github/sqlx-runtime-allowlist.txt." >&2
              echo "" >&2
              echo "$violations" >&2
              exit 1
          fi

      # nextest runs each test in its own process — better parallelism
      # than the default thread-per-test runner, and a crashing test
      # can't take down its siblings. Each `#[sqlx::test]` already gets
      # an isolated per-test database, so the per-process model adds
      # connection pressure (default nextest fans out to one process
      # per CPU; ubuntu-latest = 4 vCPUs × ~10 conns/process ≈ 40
      # concurrent conns vs. Postgres's default `max_connections=100`).
      # Comfortable headroom; first cold-run on this PR validates it
      # empirically.
      - name: Test
        run: cargo nextest run --workspace

      # nextest does not run doctests. Reverie has none today, but the
      # tiered comment policy (`adr/2026-05-08-tiered-comment-policy.md`)
      # will add examples on Tier 1 surface; keep this step so doctest
      # drift fails CI from day one. Near-instant while empty.
      - name: Doctests
        run: cargo test --doc --workspace

  audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # Suppressed advisories — each must have a justification:
        #
        # RUSTSEC-2023-0071 — rsa: Marvin Attack (PKCS#1 v1.5 timing sidechannel).
        #   No patched version exists upstream. Reverie uses rsa transitively via
        #   openidconnect for JWT *verification* only — the vulnerable PKCS#1 v1.5
        #   *decryption* path is never invoked.
        #
        # RUSTSEC-2026-0097 — rand: soundness issue (aliased &mut via log+thread_rng).
        #   rand 0.8.x is pulled in transitively by sqlx 0.8; the ecosystem has not
        #   yet released sqlx 0.9 / rand-0.9-compatible versions. Revisit when
        #   sqlx 0.9 goes stable.
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097

  # UNK-245: catch syntax / context-availability violations in workflow
  # files before merge. Mirrors the `actionlint` invocation wired into
  # the local pre-commit chain (lint-staged.config.js); both pin the same
  # version so local + CI behaviour cannot drift. PR #224 shipped a
  # `matrix.*` reference in a job-level `if:` that this check would have
  # caught locally.
  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Direct curl-tarball install pins the exact upstream release.
      # taiki-e/install-action's manifest doesn't track actionlint@1.7.12,
      # so it falls through to cargo-install which fails (actionlint is a
      # Go binary, not a Rust crate). Mirrors the install instructions in
      # CONTRIBUTING.md so local + CI use the same artefact.
      - name: Install actionlint v1.7.12
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$HOME/.local/bin" actionlint
          rm "$tarball"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint workflow files
        run: actionlint -color

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Stylelint
        run: npx stylelint 'src/**/*.css' --max-warnings 0

      # impeccable design anti-pattern detector (advisory). Flip to
      # blocking once the 3 known `bg-black` findings in stock shadcn
      # overlays are addressed (see memory entry
      # `project_bg_black_overlays_deferred`).
      - name: Detect (impeccable, advisory)
        run: npm run detect
        continue-on-error: true

      - name: Verify font integrity
        working-directory: frontend/public/fonts/fontshare/files
        run: sha256sum -c SHA256SUMS

      - name: Build
        run: npm run build

  # UNK-185: smoke test the staging compose init path. Catches role-clause
  # regressions in init-roles.sql and required-env-var regressions in the
  # compose `${VAR:?required}` interpolations before they land on staging.
  # Postgres-only `up` — the `reverie` service isn't booted (no image
  # available in this lane; the init surface under test is postgres).
  staging-smoke:
    name: Staging compose smoke
    needs: changes
    if: needs.changes.outputs.staging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Build .env from the committed example to also catch regressions where
      # a required key is renamed in compose.staging.yml but not in the
      # example (debt entry's failure mode #2). Distinct passwords per role
      # so a swapped CREATE ROLE clause in init-roles.sql can't authenticate
      # cross-role and pass silently.
      - name: Prepare env files from examples
        working-directory: docker
        run: |
          set -euo pipefail
          cp staging.env.bootstrap.example .env
          # `.env.runtime` is required: true on the reverie service; compose
          # still validates env_file presence at parse time even when the
          # service isn't being started. Populate with stub values — never
          # read since reverie isn't started.
          cp staging.env.runtime.example .env.runtime
          # Use `=.*` (not `=$`) so substitutions remain robust if the
          # example files ever acquire non-empty default values; an exact-
          # empty anchor would silently no-op and the smoke would fail
          # later at auth with an opaque 28P01.
          sed -i \
            -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=smoke_super_pw_1|' \
            -e 's|^REVERIE_APP_PASSWORD=.*|REVERIE_APP_PASSWORD=smoke_app_pw_2|' \
            -e 's|^REVERIE_INGESTION_PASSWORD=.*|REVERIE_INGESTION_PASSWORD=smoke_ing_pw_3|' \
            -e 's|^REVERIE_READONLY_PASSWORD=.*|REVERIE_READONLY_PASSWORD=smoke_ro_pw_4|' \
            -e 's|^REVERIE_VERSION=.*|REVERIE_VERSION=smoke-test|' \
            .env

      - name: Bring up postgres service
        run: docker compose -f docker/compose.staging.yml up -d --wait --wait-timeout 120 reverie-postgres

      # Assert init-roles.sql actually provisioned the three runtime roles
      # with LOGIN and CONNECT grant on POSTGRES_DB. `docker compose exec`
      # keeps the psql client version matched to the server image (postgres:18).
      - name: Assert roles exist with CONNECT grant
        run: |
          set -euo pipefail
          exec_psql() {
            docker compose -f docker/compose.staging.yml exec -T \
              -e PGPASSWORD=smoke_super_pw_1 \
              reverie-postgres psql -v ON_ERROR_STOP=1 -At \
              -U reverie -d reverie "$@"
          }
          for role in reverie_app reverie_ingestion reverie_readonly; do
            exists=$(exec_psql -c "SELECT 1 FROM pg_roles WHERE rolname = '${role}' AND rolcanlogin")
            if [ "$exists" != "1" ]; then
              echo "Role ${role} missing or cannot login" >&2
              exit 1
            fi
            # Query pg_database.datacl directly (not has_database_privilege)
            # so a regression that deletes the explicit GRANT CONNECT lines
            # from init-roles.sql is caught even while Postgres' default
            # PUBLIC -> CONNECT grant is still in place. has_database_privilege
            # returns true via PUBLIC and would mask the deletion.
            has_connect=$(exec_psql -c "SELECT EXISTS (SELECT 1 FROM pg_database d, aclexplode(d.datacl) acl WHERE d.datname = current_database() AND acl.grantee = (SELECT oid FROM pg_roles WHERE rolname = '${role}') AND acl.privilege_type = 'CONNECT')")
            if [ "$has_connect" != "t" ]; then
              echo "Role ${role} lacks an explicit CONNECT grant on $(exec_psql -c 'SELECT current_database()')" >&2
              exit 1
            fi
          done

      # Authenticate as each runtime role with the password we supplied via
      # env. Catches `LOGIN PASSWORD` clause regressions in init-roles.sql
      # (the 28P01-at-runtime failure mode the debt entry calls out).
      - name: Assert each role authenticates with its supplied password
        run: |
          set -euo pipefail
          login_as() {
            local role=$1 pw=$2
            docker compose -f docker/compose.staging.yml exec -T \
              -e PGPASSWORD="${pw}" \
              reverie-postgres psql -v ON_ERROR_STOP=1 -At \
              -h localhost -U "${role}" -d reverie -c 'SELECT 1' >/dev/null
          }
          login_as reverie_app       smoke_app_pw_2
          login_as reverie_ingestion smoke_ing_pw_3
          login_as reverie_readonly  smoke_ro_pw_4

      - name: Tear down postgres service
        if: always()
        run: docker compose -f docker/compose.staging.yml down -v

      # Negative path: blank a required env var, run `compose config`, assert
      # the `${VAR:?required}` interpolation surfaces a hard fail. `config`
      # is sufficient because variable substitution happens at parse time;
      # no daemon spin-up needed. Key-name presence in stderr is the
      # load-bearing signal — exact wording of compose's error message is
      # not pinned across versions.
      #
      # `if: !cancelled()` ensures this step runs even if the happy-path
      # assertions failed — otherwise a regression in the `:?required`
      # mechanism would be silently skipped behind any earlier failure,
      # since `compose config` is independent of the live containers.
      - name: Assert missing required env var hard-fails
        if: ${{ !cancelled() }}
        working-directory: docker
        run: |
          set -euo pipefail
          sed -i 's|^REVERIE_APP_PASSWORD=.*|REVERIE_APP_PASSWORD=|' .env
          if stderr=$(docker compose -f compose.staging.yml config 2>&1 >/dev/null); then
            echo "Expected compose config to fail with missing REVERIE_APP_PASSWORD, but it succeeded" >&2
            echo "stderr was:" >&2
            echo "${stderr}" >&2
            exit 1
          fi
          if ! grep -qF REVERIE_APP_PASSWORD <<<"${stderr}"; then
            echo "compose config failed but stderr did not mention REVERIE_APP_PASSWORD" >&2
            echo "stderr was:" >&2
            echo "${stderr}" >&2
            exit 1
          fi
