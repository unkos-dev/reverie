name: CI # sonar.yml's workflow_run trigger matches this string; renaming either orphans it silently.

# Display only, and independent of `name:` above, so the sonar.yml coupling is untouched.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1}', github.event.number, github.event.pull_request.title)
   || github.event_name == 'merge_group' && 'merge queue'
   || format('main: {0}', github.event.head_commit.message) }}

on:
  # PRs are squash-merged, so main's head commit is a SHA no pull_request run
  # analyzed; push keeps SonarQube Cloud's baseline current.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# A cancelled main-push run once wiped the Sonar coverage baseline; PR runs
# still cancel freely.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # No caller ever gains an `if:`. A skipped caller reports a check run named
  # after itself, while the ruleset requires `<caller> / <job>`, which would then
  # never report and leave every pull request pending. Filtering lives inside
  # each called workflow.
  backend:
    uses: ./.github/workflows/backend.yml
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID_RW: ${{ secrets.R2_ACCESS_KEY_ID_RW }}
      R2_ACCESS_KEY_ID_RO: ${{ secrets.R2_ACCESS_KEY_ID_RO }}
      R2_SECRET_ACCESS_KEY_RW: ${{ secrets.R2_SECRET_ACCESS_KEY_RW }}
      R2_SECRET_ACCESS_KEY_RO: ${{ secrets.R2_SECRET_ACCESS_KEY_RO }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  lint:
    uses: ./.github/workflows/lint.yml

  security:
    uses: ./.github/workflows/security.yml

  deps:
    uses: ./.github/workflows/deps.yml

  frontend:
    uses: ./.github/workflows/frontend.yml
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  # The only caller granting more than the top-level default: a called workflow
  # can downgrade its caller's token but never elevate it, so the deploy job's
  # needs are declared here and narrowed again inside docs.yml.
  docs:
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  staging:
    uses: ./.github/workflows/staging.yml

  docker:
    uses: ./.github/workflows/docker.yml

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  # Absent from ci-gate.needs on purpose: every job here is advisory and never
  # fails, so a detector hiccup must not block a merge.
  snyk:
    uses: ./.github/workflows/snyk.yml
    permissions:
      contents: read
      security-events: write
      packages: read
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Machinery backstop, not the enforcement: the per-job contexts are what name a
  # real failure. This catches the one thing they structurally cannot. A failed
  # `changes` detector skips its dependents, and GitHub counts a skipped required
  # check as passed, so the failure disappears. A caller's result aggregates its
  # whole called workflow, which makes the detector failure visible here.
  #
  # `if: always()` is load-bearing: without it the gate is itself skipped when an
  # upstream job fails, and GitHub reports a skipped required check as success.
  #
  # `snyk` is deliberately absent: its jobs are advisory and never fail.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - backend
      - frontend
      - deps
      - security
      - lint
      - docs
      - staging
      - docker
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "$RESULTS"
          exit 1
