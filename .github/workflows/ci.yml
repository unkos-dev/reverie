name: CI

on:
  # Push-to-main runs exist for SonarQube Cloud: PRs are squash-merged, so
  # main's head commit is a SHA no pull_request run ever analyzed — without
  # this trigger the default-branch baseline (new-code detection, coverage
  # badge) never updates.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Never cancel main-push runs: back-to-back merges would cancel the older
# run, reddening the workflow badge and starving the sonar job of coverage
# artifacts (a cancelled run once wiped the Sonar baseline to 0%).
# Superseded PR runs cancel freely.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Single source for the global vp version setup-vp installs. The repo-lint
  # drift guard ties it to package.json's vite-plus devDependency (the local
  # node_modules/.bin/vp every recipe actually runs); Renovate bumps both in
  # the grouped vite-plus PR.
  # renovate: datasource=npm depName=vite-plus
  VP_VERSION: "0.2.1"
  # Single node pin for CI, replacing the seven hand-copied node-version
  # inputs Renovate never tracked. engines.node and the Dockerfile base image
  # stay separately Renovate-managed.
  # renovate: datasource=node-version depName=node
  NODE_VERSION: "24.16.0"

jobs:
  # Detect which areas of the repo changed so downstream jobs can skip when
  # their inputs are untouched. Every filter includes ci.yml itself: a
  # workflow edit must re-run the jobs it defines.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      audit: ${{ steps.filter.outputs.audit }}
      frontend: ${{ steps.filter.outputs.frontend }}
      staging: ${{ steps.filter.outputs.staging }}
      workflows: ${{ steps.filter.outputs.workflows }}
      iac: ${{ steps.filter.outputs.iac }}
      docker: ${{ steps.filter.outputs.docker }}
      openapi: ${{ steps.filter.outputs.openapi }}
      npm: ${{ steps.filter.outputs.npm }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          # On merge_group events paths-filter's default base (HEAD~1) sees
          # only the topmost commit in the synthetic merge ref; pin to
          # merge_group.base_sha so skip decisions match the PR-against-main
          # diff.
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - 'docker/init-roles.sql'
              - 'docker/compose.dev.yml'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            audit:
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - 'backend/deny.toml'
              - '.github/workflows/ci.yml'
            frontend:
              # Root workspace inputs drive the frontend too: the hoisted
              # lockfile + shared overrides, and the root vite.config.ts
              # that owns the frontend lint config.
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            staging:
              - 'docker/compose.staging.yml'
              - 'docker/init-roles.sql'
              - 'docker/staging.env.bootstrap.example'
              - 'docker/staging.env.runtime.example'
              - '.github/workflows/ci.yml'
            workflows:
              # A suppression edit in zizmor.yml must re-run the scan even
              # with no workflow change (likewise .trivyignore and
              # .checkov.yaml in their filters below).
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/zizmor.yml'
            iac:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'docker/**'
              - '.trivyignore'
              - '.github/workflows/ci.yml'
            docker:
              # PR-time image build gate: the image definition plus every
              # manifest that shapes the build context's structure. Code-only
              # changes are deliberately excluded — compile breakage is the
              # backend/frontend jobs' remit; the failure class this gates
              # (e.g. a lockfile hoist breaking a COPY) is manifest-level.
              - 'Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'package-lock.json'
              - 'frontend/package.json'
              - 'docs/package.json'
              - 'backend/Cargo.toml'
              - 'backend/Cargo.lock'
              - '.github/workflows/ci.yml'
            openapi:
              - 'docs/openapi.json'
              - '.checkov.yaml'
              - '.github/workflows/ci.yml'
            npm:
              # Licenses only change when the dependency tree changes, so
              # PR-time gating is complete here — no cron needed (unlike
              # advisories, which drift over time; see scheduled-audit.yml).
              - 'package.json'
              - 'package-lock.json'
              - 'frontend/package.json'
              - 'docs/package.json'
              - '.github/workflows/ci.yml'
            docs:
              # Generated reference artifacts live under docs/, so a backend
              # regen trips this filter without a separate backend trigger;
              # a stale-but-unregenerated artifact is caught by the backend
              # job's drift tests instead. docs is an npm workspace, so the
              # root manifest/lockfile affect its build. docs-build.yml is
              # the shared build definition; docs.yml is the deploy lane
              # that must still pass the PR-time gate here.
              - 'docs/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docs.yml'
              - '.github/workflows/docs-build.yml'

  backend:
    name: Backend
    needs: changes
    # Push-to-main always runs both stack jobs: the sonar baseline analysis
    # needs both lcov artifacts because SonarQube Cloud has no coverage
    # carryforward; a stack whose report is absent re-reports as 0%.
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reverie
          POSTGRES_PASSWORD: reverie
          POSTGRES_DB: reverie_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reverie -d reverie_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # sqlx::test connects as the schema owner to create per-test
      # databases; role pools for reverie_app / reverie_ingestion are built
      # per-test in code.
      DATABASE_URL: postgres://reverie:reverie@localhost:5432/reverie_dev
      # Single source of truth for the sqlx-cli pin — referenced by the
      # cache key and the install step, and guarded against the sqlx crate
      # version below.
      SQLX_CLI_VERSION: "0.9.0"
      # CI-only build-speed tweaks; local dev is untouched. Incremental
      # metadata tracking is wasted in a single-shot build.
      # line-tables-only keeps file:line panic backtraces while cutting
      # link size/time. mold (installed below) removes the single-threaded
      # ld bottleneck.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # The static guards below need no toolchain, database, or installs;
      # they run first so a violation fails in seconds.

      # The sqlx-cli that checks the .sqlx offline cache must track the
      # sqlx *crate* version, or `cargo sqlx prepare --check` validates
      # against a cache produced by a mismatched proc-macro. Both are
      # hand-set in different files, so Renovate bumping one without a
      # human mirroring the other is silent drift. Anchor on the crate (the
      # source), fail loud if the cli pin (the copy) lags.
      - name: sqlx-cli pin matches sqlx crate version
        run: |
          crate="$(yq -p toml -o yaml '.dependencies.sqlx.version // .dependencies.sqlx' Cargo.toml)"
          case "$crate" in
            [0-9]*.[0-9]*) ;;
            *)
              echo "::error file=backend/Cargo.toml::could not parse sqlx crate version (got '$crate'); the dependency shape may have changed — update this guard"
              exit 1
              ;;
          esac
          if [ "$crate" != "$SQLX_CLI_VERSION" ]; then
            echo "::error file=.github/workflows/ci.yml::SQLX_CLI_VERSION ($SQLX_CLI_VERSION) != sqlx crate version ($crate in backend/Cargo.toml) — keep the cli pin in lockstep with the crate"
            exit 1
          fi
          echo "sqlx-cli pin ($SQLX_CLI_VERSION) matches sqlx crate ($crate)"

      # Grep-guard against new runtime `sqlx::query[*](...)` invocations —
      # queries must use the compile-time macros. The allowlist documents
      # justified carve-outs (DDL, dynamic SQL, set_config GUC, enum-drift
      # probes). Exit-code handling is load-bearing in all three guards
      # below: grep exit 1 means "clean", exit >1 is a real error that must
      # not read as clean, and an empty/missing allowlist fails here
      # (set -e) instead of failing open downstream.
      - name: Guard against new runtime sqlx::query invocations
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          allow=$(grep -vE '^\s*(#|$)' .github/sqlx-runtime-allowlist.txt)
          rc=0
          matches=$(grep -rnE 'sqlx::(query[a-z_]*|raw_sql)\(' backend/src/) || rc=$?
          if [ "$rc" -gt 1 ]; then
              exit "$rc"
          fi
          violations=''
          if [ -n "$matches" ]; then
              rc=0
              violations=$(grep -v -F -f <(printf '%s\n' "$allow") <<<"$matches") || rc=$?
              if [ "$rc" -gt 1 ]; then
                  exit "$rc"
              fi
          fi
          if [ -n "$violations" ]; then
              echo "Disallowed runtime sqlx::query invocations detected." >&2
              echo "Use compile-time macros (query!, query_as!, query_scalar!)" >&2
              echo "or add a justified entry to .github/sqlx-runtime-allowlist.txt." >&2
              echo "" >&2
              echo "$violations" >&2
              exit 1
          fi

      # Grep-guard: every shipped endpoint must register via OpenApiRouter
      # + routes!(...) backed by #[utoipa::path] so the generated spec
      # stays complete; raw `.route(` registrations bypass it. Allowlist
      # documents the exempt sites (test-only routers, justified
      # carve-outs).
      - name: Guard against undocumented raw .route( registrations
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          allow=$(grep -vE '^\s*(#|$)' .github/axum-route-allowlist.txt)
          rc=0
          matches=$(grep -rnE '\.route\(' backend/src/) || rc=$?
          if [ "$rc" -gt 1 ]; then
              exit "$rc"
          fi
          violations=''
          if [ -n "$matches" ]; then
              rc=0
              violations=$(grep -v -F -f <(printf '%s\n' "$allow") <<<"$matches") || rc=$?
              if [ "$rc" -gt 1 ]; then
                  exit "$rc"
              fi
          fi
          if [ -n "$violations" ]; then
              echo "Raw .route( registrations detected outside the allowlist." >&2
              echo "Register endpoints via OpenApiRouter + routes!(...) with #[utoipa::path]," >&2
              echo "or add a justified entry to .github/axum-route-allowlist.txt." >&2
              echo "" >&2
              echo "$violations" >&2
              exit 1
          fi

      # Grep-guard: the backend standardises on the `time` crate
      # (backend/AGENTS.md); chrono exists in Cargo.toml solely for
      # openidconnect's test-support signature. Allowlist covers that
      # carve-out.
      - name: Guard against chrono usage in runtime code
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          allow=$(grep -vE '^\s*(#|$)' .github/chrono-allowlist.txt)
          rc=0
          matches=$(grep -rnE 'use chrono|extern crate chrono' backend/src/) || rc=$?
          if [ "$rc" -gt 1 ]; then
              exit "$rc"
          fi
          violations=''
          if [ -n "$matches" ]; then
              rc=0
              violations=$(grep -v -F -f <(printf '%s\n' "$allow") <<<"$matches") || rc=$?
              if [ "$rc" -gt 1 ]; then
                  exit "$rc"
              fi
          fi
          if [ -n "$violations" ]; then
              echo "chrono imports detected outside the allowlist." >&2
              echo "Reverie uses the time crate (backend/AGENTS.md); chrono is" >&2
              echo "reserved for the documented openidconnect test-support carve-out." >&2
              echo "Justify any new entry in .github/chrono-allowlist.txt." >&2
              echo "" >&2
              echo "$violations" >&2
              exit 1
          fi

      # The schema descriptions are config-struct doc-comments (schemars
      # folds them in); the Vale gate covers Markdown but not this
      # generated JSON. Match raw U+2014 UTF-8 bytes (LC_ALL=C +
      # fixed-string) so the check never depends on grep's PCRE or locale
      # support — a PCRE-mode grep rejecting `\x{2014}` would exit non-zero
      # and pass the gate open.
      - name: Guard against em dashes in the config schema
        run: |
          if LC_ALL=C grep -nF $'\xe2\x80\x94' config.schema.json; then
            echo "::error::config.schema.json contains an em dash (lines above); recast the source doc-comment in backend/src/config and regenerate." >&2
            exit 1
          fi

      # dtolnay/rust-toolchain reads the toolchain from the git ref name,
      # so a SHA pin requires naming the channel explicitly via
      # `toolchain:`.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          # llvm-tools-preview ships the llvm-profdata/llvm-cov binaries
          # cargo-llvm-cov shells out to.
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --check

      - name: Create database roles
        run: psql postgres://reverie:reverie@localhost:5432/reverie_dev -f docker/init-roles.sql
        working-directory: ${{ github.workspace }}

      # mold itself; the job-level RUSTFLAGS routes linking through it. No
      # version pin: mold is ABI-compatible at the linker interface and
      # only exercised at build time.
      - name: Install mold linker
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends mold

      # sqlx-cli has no upstream prebuilt binaries, so a cache miss
      # compiles it from source (~60-90s with the feature trim to rustls +
      # postgres — the actual surface). The cache is keyed on version +
      # features alone, not workspace Cargo.lock, so Renovate lock churn
      # cannot invalidate it. Bump the key suffix if the features change.
      - name: Cache sqlx-cli binary
        id: cache-sqlx-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SQLX_CLI_VERSION }}-postgres-rustls

      - name: Install sqlx-cli (cache miss only)
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        # No `--locked`: sqlx-cli 0.9 stopped shipping Cargo.lock in its
        # published crate, so `--locked` errors with no lockfile to honour.
        run: cargo install sqlx-cli --version ${{ env.SQLX_CLI_VERSION }} --no-default-features --features rustls,postgres

      # Prebuilt binaries for the test runner, coverage wrapper, and
      # unused-dependency scanner (~5s).
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-nextest@0.9,cargo-llvm-cov@0.8.7,cargo-machete@0.9.2

      # Every unused crate is dead advisory/license/audit surface. Static
      # manifest-vs-source scan; justified carve-outs live in Cargo.toml's
      # [package.metadata.cargo-machete] ignored list.
      - name: Unused dependencies (cargo-machete)
        run: cargo machete

      - name: Apply migrations
        run: sqlx migrate run

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Kills broken intra-doc cross-refs in existing docstrings. Without
      # --document-private-items the scope is pub items only, matching the
      # Tier 1 comment-policy surface.
      - name: Doc lint (broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"
        run: cargo doc --no-deps --workspace

      # Drift guard on the committed .sqlx/ query cache: fails if the cache
      # is stale relative to the query macros + live schema.
      - name: Check sqlx query cache freshness
        run: cargo sqlx prepare --check -- --tests

      # Drift guard on the committed config JSON Schema. The check itself
      # lives in the gen_config_schema drift test (same generate→commit→check
      # contract as gen_openapi/gen_config_ref, and what the pre-push hook
      # runs locally); invoked standalone here so schema drift fails fast,
      # before the full nextest pass below.
      - name: Check config schema freshness
        run: cargo test --locked --test gen_config_schema

      # nextest runs each test in its own process; every #[sqlx::test]
      # gets an isolated per-test database. Single pass under llvm-cov,
      # emitting the LCOV report the sonar job consumes. llvm-cov uses a
      # separate target dir, so it neither disturbs nor reuses the build
      # above. --remap-path-prefix yields workspace-relative SF: paths so
      # the artifact is portable.
      - name: Test (with coverage)
        run: cargo llvm-cov nextest --locked --workspace --remap-path-prefix --lcov --output-path lcov.info

      # nextest does not run doctests. Reverie has none today; this step
      # exists so doctest drift fails CI from day one and is near-instant
      # while empty.
      - name: Doctests
        run: cargo test --locked --doc --workspace

      # if-no-files-found: error — a missing report must fail here, not
      # read as 0% coverage downstream. Consumed by the sonar job within
      # this run; no post-run use, so minimum retention.
      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/lcov.info
          if-no-files-found: error
          retention-days: 1

  # MSRV floor enforcement: compile the workspace on exactly the declared
  # `rust-version` so a dependency bump or new syntax that silently raises
  # the real minimum fails here instead of breaking self-hosters building
  # from source on the documented floor. Compile-only against the committed
  # .sqlx cache — no Postgres needed.
  msrv:
    name: MSRV check
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Read the MSRV from Cargo.toml so the pinned toolchain and the
      # declared rust-version cannot drift. The sed stops at the first
      # quote so a trailing inline comment carrying another quoted version
      # can't be captured; `|| true` lets a dropped field flow through as
      # empty so the format guard reports it rather than an opaque pipe
      # failure.
      - name: Resolve declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/^rust-version[^"]*"([0-9.]+)".*/\1/' || true)
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Could not extract a valid rust-version from backend/Cargo.toml (got: '${version}')" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The pinned SHA is the action's `stable` tag; the `toolchain:` input
      # overrides which channel is actually installed.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: backend

      # --locked forbids resolving newer, higher-MSRV dependency versions
      # than the committed lockfile; --all-targets covers tests and
      # benches, not just lib + bin.
      - name: Check workspace builds on MSRV
        run: cargo check --workspace --all-targets --locked

  audit:
    name: Dependency policy (cargo-deny)
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-deny@0.19.8
          # Fail closed: the default falls back to
          # cargo-binstall/cargo-install when no prebuilt is available,
          # silently changing the install source of a security scanner.
          fallback: none
      # advisories reads the RustSec database; check also enforces the
      # license, ban, and source policy in backend/deny.toml. Advisory
      # suppressions and their justifications live in deny.toml.
      - name: Check dependencies (advisories, licenses, bans, sources)
        run: cargo deny check

  # PR-gate newly-introduced vulnerable dependencies: diffs the PR's
  # dependency manifests against base and fails on any added package with
  # an advisory at/above the floor. Complements cargo-deny (whole lockfile)
  # and Renovate (post-merge, reactive). pull_request-only — there is no
  # diff to evaluate on push or merge_group; ci-gate treats the skip as a
  # pass.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # License policy is owned by cargo-deny (backend/deny.toml) to
          # avoid a second, drifting allowlist; this layer gates
          # vulnerabilities only.
          fail-on-severity: moderate
          # vp ships as a vite fork installed under the `vite` alias, so
          # the lock entry reads vite@0.2.1 and matches every historical
          # real-vite advisory (0.2.1 sorts below all real versions).
          # vite-plus-core 0.2.1 is vite 8.x underneath, which carries the
          # fixes, so these do not apply. Revisit on a vp version bump. See
          # debt/2026-06-30-vite-plus-alias-dependency-review.md
          allow-ghsas: >-
            GHSA-353f-5xf4-qw67, GHSA-356w-63v5-8wf4, GHSA-4r4m-qw57-chr8,
            GHSA-4w7w-66w2-5vf9, GHSA-64vr-g452-qvp3, GHSA-859w-5945-r5v3,
            GHSA-9cwx-2883-4wfx, GHSA-c27g-q93r-2cwf, GHSA-fx2h-pf6j-xcff,
            GHSA-mv48-hcvh-8jj8, GHSA-v6wh-96g9-6wx3, GHSA-vg6x-rcgg-rjx6,
            GHSA-x574-m823-4x7w, GHSA-xcj6-pq6g-qj4x

  # Syntax / context-availability lint for workflow files. Mirrors the
  # lefthook pre-commit invocation at the same pinned version so local and
  # CI cannot drift.
  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install actionlint
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
          version: "1.7.12"
          sha256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          url: "https://github.com/rhysd/actionlint/releases/download/v{version}/actionlint_{version}_linux_amd64.tar.gz"
          binary: actionlint
          archive-member: actionlint

      - name: Lint workflow files
        run: actionlint -color

  # Workflow-security scanner: covers the class actionlint and CodeQL's
  # actions analyzer don't — credential persistence, template injection in
  # run blocks, cache poisoning of privileged deploys, dangerous triggers,
  # over-broad permissions. Relevant because label.yml uses
  # pull_request_target and docker-publish.yml is a privileged GHCR
  # deployer.
  workflow-security:
    name: Workflow security (zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          # Gate mode: fail on any finding rather than upload SARIF (which
          # would need security-events:write and file a non-blocking
          # Security-tab entry instead of a hard red).
          advanced-security: false
          # Pinned so a new upstream release cannot add findings and break
          # the gate on an unrelated PR; matches the version the baseline
          # was triaged against.
          version: "1.25.2"

  # IaC misconfiguration scan over the Dockerfile and compose files: the
  # security class hadolint's instruction lint doesn't cover — root-user
  # defaults, missing healthchecks, privileged/host-mode services,
  # secrets-in-env shapes. HIGH/CRITICAL to match the image-scan gate in
  # docker-publish.yml; suppressions live in .trivyignore with per-finding
  # justification.
  iac-scan:
    name: IaC misconfig (trivy)
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Keep this pin in lockstep with docker-publish.yml's.
      - name: Install trivy
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
          version: "0.72.0"
          sha256: "0510e71e2fd39bf863856d499c8dc19feb4e7336546394c502a8f5cc7ab27460"
          url: "https://github.com/aquasecurity/trivy/releases/download/v{version}/trivy_{version}_Linux-64bit.tar.gz"
          binary: trivy
          archive-member: trivy

      # Scoped to the container/IaC surface: workflow security is zizmor's
      # remit and docs templates are not deployable IaC.
      - name: Scan IaC for misconfigurations (gating)
        run: |
          set -euo pipefail
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs node_modules,frontend/node_modules,docs/node_modules,backend/target \
            --skip-dirs .github \
            .

  # PR-time image build: docker-publish only fires post-merge, so without
  # this a broken image definition merges green and detonates on main in
  # the privileged publish lane (the lockfile-hoist incident). arm64 to
  # match the main-push publish arch and share its warm layer cache.
  docker-build:
    name: Docker image build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Read the publish lane's cache, never write it: a PR-controlled
      # cache-to into the scope the privileged publish job restores would
      # be a cache-poisoning surface.
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=buildcache-arm64

  # checkov OpenAPI policy gate over the generated spec: securitySchemes
  # present and non-cleartext, global security rules defined,
  # operation-level security coverage. Suppressions, if ever needed, live
  # in .checkov.yaml with per-finding justification. Dockerfile/compose
  # misconfig is trivy's remit; workflow security is zizmor's.
  openapi-policy:
    name: OpenAPI policy (checkov)
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # checkov is pip-only (no standalone release binary). Pinned so a new
      # upstream policy cannot break the gate on an unrelated PR.
      - name: Install checkov 3.3.0
        run: pipx install checkov==3.3.0

      - name: Scan OpenAPI spec (gating)
        run: checkov -f docs/openapi.json --framework openapi --compact --config-file .checkov.yaml

  # npm license-policy gate — the counterpart of cargo-deny's [licenses]
  # allowlist, which covers only the Rust tree (dependency-review-action
  # gates vulnerabilities on PR-introduced deps, not licenses).
  #
  # Scope: --production of each tree. What matters is what we *distribute*
  # (frontend bundle, published docs site); dev tooling is not
  # redistributed. The root tree has no production deps today — included so
  # one added later is gated from day one.
  #
  # Allowlist mirrors deny.toml's permissive-only set plus the permissive
  # licenses actually present in the npm trees. The exclusions are
  # build-time-only native tooling whose compiled *output* ships but whose
  # own code never lands in it, so their licenses do not bind the project:
  #   - @img/sharp-libvips-* (LGPL-3.0): sharp's libvips prebuilts.
  #   - lightningcss* (MPL-2.0): CSS transform; output is plain CSS.
  #   - satteri / @bruits/satteri-* (MIT upstream, no license field
  #     published): Markdown processor prebuilts; reads UNKNOWN until the
  #     pre-1.0 packaging gap is fixed upstream.
  # Each is excluded by name prefix, not by license, so the gate still
  # fails any other package carrying these licenses.
  npm-license:
    name: npm license policy
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          version: ${{ env.VP_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      # One workspace install; license-checker walks each package's
      # declared production deps resolved from the hoisted root
      # node_modules. The scanner itself is a lockfile-pinned root
      # devDependency.
      - name: Check npm licenses (gating)
        run: |
          set -euo pipefail
          vp install
          allow="MIT;Apache-2.0;ISC;0BSD;BSD-2-Clause;BSD-3-Clause;BlueOak-1.0.0;CC0-1.0;Python-2.0;Unlicense"
          rc=0
          for tree in . frontend docs; do
            echo "::group::license check (${tree})"
            (
              cd "$tree"
              npx --no-install license-checker-rseidelsohn \
                --production \
                --excludePrivatePackages \
                --excludePackagesStartingWith "@img/sharp-libvips;@bruits/satteri;satteri;lightningcss" \
                --onlyAllow "$allow"
            ) || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  # Rule-based SAST. Primary motivation is backfilling Rust, where CodeQL's
  # extractor resolves only ~47% of call targets — pattern rules don't
  # depend on call-graph resolution. Engine: opengrep (Linux Foundation
  # fork of semgrep) — OSS, no telemetry, signed release binaries,
  # semgrep-compatible rules. Rulesets SHA-pinned so upstream rule
  # additions can't break the gate on an unrelated PR.
  sast:
    name: SAST (opengrep)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Checkout opengrep-rules (pinned)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: opengrep/opengrep-rules
          ref: f1d2b562b414783763fd02a6ed2736eaed622efa
          path: .opengrep-rules
          persist-credentials: false

      - name: Install opengrep
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-releases depName=opengrep/opengrep extractVersion=^v(?<version>.+)$
          version: "1.23.0"
          sha256: "1f06548af379ab6080698a609612890ffad2d92dc2172f1e97d38d48096d5ef8"
          url: "https://github.com/opengrep/opengrep/releases/download/v{version}/opengrep_manylinux_x86"
          binary: opengrep

      # --error exits non-zero on any finding. Security packs only — the
      # full language packs bundle best-practice/portability rules that are
      # the linter's remit. Tests are not excluded wholesale (a blanket
      # file drop is a coverage blind spot); a test legitimately exercising
      # an insecure API gets a call-site `// nosemgrep: <rule-id>`
      # carve-out.
      #
      # Excluded rule: rust.lang.security.args fires on ANY std::env::args
      # use; main.rs reads argv for CLI subcommand dispatch, not security
      # decisions, and the rule cannot tell the difference. The rule-ID
      # prefix is derived from the rules-checkout `path:` above — keep the
      # two in lockstep or the exclusion silently stops matching.
      - name: Scan source (gating)
        run: |
          set -euo pipefail
          opengrep scan \
            --config .opengrep-rules/rust/lang/security \
            --config .opengrep-rules/typescript/lang/security \
            --config .opengrep-rules/typescript/react/security \
            --exclude-rule opengrep-rules.rust.lang.security.args \
            --error \
            backend/src frontend/src

  # DCO gate: every PR commit needs a Signed-off-by trailer certifying the
  # developercertificate.org attestation (see CONTRIBUTING.md). Runs on
  # pull_request and merge_group so it can be a required check without
  # stalling the merge queue; main pushes skip it because the trailer was
  # already enforced pre-merge.
  dco:
    name: DCO
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: ./scripts/dco-check.sh "$BASE_SHA" "$HEAD_SHA"

  # Server-side lint gate for shell scripts, the Dockerfile, spelling,
  # YAML, Markdown, prose, and formatting. The lefthook pre-commit hook
  # runs these locally, but pre-commit is bypassable (--no-verify) and
  # never runs on fork PRs — this job is the authoritative surface. Tool
  # versions are pinned to the workspace image so local and CI evaluate
  # against the same binaries; the lint invocations live in the just
  # recipes so CI and local share one definition.
  repo-lint:
    name: Repo lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Static guard, no toolchain — runs first so drift fails in seconds,
      # before any install. Each workflow carries its own VP_VERSION and
      # NODE_VERSION (reusable and standalone workflows do not inherit
      # ci.yml's env), so a partial edit or Renovate update could desync them
      # and run a different global vp. Assert every workflow's VP_VERSION
      # equals package.json's vite-plus devDependency (the local
      # node_modules/.bin/vp every recipe runs), and that all NODE_VERSION
      # pins agree. The grouped vite-plus Renovate PR moves the vp set
      # together; this fails loud if any file lags.
      - name: vp and node pins match across workflows and package.json
        run: |
          pkg="$(jq -r '.devDependencies["vite-plus"]' package.json)"
          case "$pkg" in
            [0-9]*.[0-9]*) ;;
            *)
              echo "::error file=package.json::could not parse vite-plus devDependency version (got '$pkg'); the dependency shape may have changed — update this guard"
              exit 1
              ;;
          esac
          rc=0
          node_ref=""
          for f in .github/workflows/ci.yml .github/workflows/docs-build.yml .github/workflows/scheduled-audit.yml; do
            vp="$(yq '.env.VP_VERSION' "$f")"
            nd="$(yq '.env.NODE_VERSION' "$f")"
            if [ "$vp" != "$pkg" ]; then
              echo "::error file=${f}::VP_VERSION ($vp) != vite-plus in package.json ($pkg) — keep every workflow's vp pin in lockstep; they ship in the grouped vite-plus Renovate PR"
              rc=1
            fi
            if [ -z "$node_ref" ]; then
              node_ref="$nd"
            elif [ "$nd" != "$node_ref" ]; then
              echo "::error file=${f}::NODE_VERSION ($nd) != the pin in the earlier workflows ($node_ref) — keep the node pins in lockstep"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then exit 1; fi
          echo "all workflow vp pins ($pkg) match package.json; node pins ($node_ref) consistent"

      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: just@1.53.0,typos@1.46.2

      - name: Install shellcheck
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-releases depName=koalaman/shellcheck extractVersion=^v(?<version>.+)$
          version: "0.9.0"
          sha256: "700324c6dd0ebea0117591c6cc9d7350d9c7c5c287acbad7630fa17b1d4d9e2f"
          url: "https://github.com/koalaman/shellcheck/releases/download/v{version}/shellcheck-v{version}.linux.x86_64.tar.xz"
          binary: shellcheck
          archive-member: shellcheck-v{version}/shellcheck
          strip-components: "1"

      - name: Install hadolint
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-releases depName=hadolint/hadolint extractVersion=^v(?<version>.+)$
          version: "2.14.0"
          sha256: "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47"
          url: "https://github.com/hadolint/hadolint/releases/download/v{version}/hadolint-Linux-x86_64"
          binary: hadolint

      - name: Install Vale
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-releases depName=errata-ai/vale extractVersion=^v(?<version>.+)$
          version: "3.15.1"
          sha256: "c024d9c157874fb043d4f24a055d60050d1bb18755251f590593eed5bace1857"
          url: "https://github.com/errata-ai/vale/releases/download/v{version}/vale_{version}_Linux_64-bit.tar.gz"
          binary: vale
          archive-member: vale

      # yamllint is pip-only; pinned to the workspace-image version.
      - name: Install yamllint 1.33.0
        run: pipx install yamllint==1.33.0

      - name: Shell lint (shellcheck)
        run: just infra::shellcheck

      - name: DCO gate self-test
        run: just infra::dco-selftest

      - name: Dockerfile lint (hadolint)
        run: just infra::hadolint

      - name: Spell check (typos)
        run: just infra::typos

      - name: YAML lint (yamllint)
        run: just infra::yamllint

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          version: ${{ env.VP_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Install workspace
        run: vp install

      - name: Markdown lint (markdownlint-cli2)
        run: just js::markdownlint

      # Ruleset self-test first (stdin snippets — fails the build if a
      # prose rule stops firing or starts matching clean prose), then the
      # scope test for vale-lint.sh's include/exclude classification, then
      # the prose pass itself. Every rule emits at `error`, so any finding
      # is a hard red.
      - name: Prose lint self-test (Vale ruleset)
        run: just infra::vale-selftest

      - name: Prose lint scope test (vale-lint.sh)
        run: just infra::vale-scope-test

      - name: Prose lint (Vale)
        run: just infra::prose

      # Authoritative formatting gate: the pre-commit hook formats staged
      # files locally, but this whole-tree --check is what actually fails
      # the build. Scope lives in the root vite.config.ts fmt block.
      - name: Format check (oxfmt)
        run: just js::fmt-check

      # greptile.json must parse and every customContext.files[] pin must
      # resolve — a pin to a moved file degrades reviews silently.
      # Unconditional so a PR that deletes a pinned file fails here even if
      # it never touches greptile.json.
      - name: Validate greptile.json
        run: just infra::greptile-config

      - name: Validate lefthook.yml
        run: just infra::lefthook-validate

      # Reject issue-tracker references in public-facing source and docs —
      # they describe a private tracker, not the codebase. Changed-files
      # only, so pre-existing references in untouched files don't fail the
      # build (a pre-release sweep clears those).
      - name: Detect changed source and docs
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: source-changed
        with:
          base: ${{ github.event.merge_group.base_sha || github.base_ref }}
          ref: ${{ github.event.merge_group.head_sha || github.ref }}
          list-files: json
          filters: |
            source:
              - 'backend/src/**/*.rs'
              - 'frontend/src/**/*.{ts,tsx,js,jsx,css}'
              - '**/*.{md,mdx}'

      # The file list reaches the shell via env (never inline `${{ }}`),
      # and is NUL-delimited so a filename containing a newline cannot
      # split and bypass the guard. `shell: bash` because mapfile + process
      # substitution are bash-only.
      - name: Reject issue-tracker refs in changed source
        if: steps.source-changed.outputs.source == 'true'
        shell: bash
        env:
          SOURCE_FILES: ${{ steps.source-changed.outputs.source_files }}
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(printf '%s' "$SOURCE_FILES" | jq -j '.[] + "\u0000"')
          if [ "${#files[@]}" -gt 0 ]; then
            just infra::no-issue-refs "${files[@]}"
          fi

  frontend:
    name: Frontend
    needs: changes
    # Push-to-main always runs both stack jobs; see the backend job's note.
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          version: ${{ env.VP_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      # Install from the repo root: the root prepare hook (lefthook
      # install) resolves its binary from the root node_modules.
      - name: Install
        working-directory: ${{ github.workspace }}
        run: vp install

      # just walks up to the repo-root justfile from this frontend/ working
      # directory; each js:: recipe re-enters frontend/ via its own
      # [working-directory].
      - name: Install just
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: just@1.53.0

      - name: Lint
        run: just js::oxlint

      - name: Test (with coverage)
        run: just js::test-coverage

      # if-no-files-found: error — a missing report must fail here, not
      # read as 0% coverage downstream. Consumed by the sonar job within
      # this run; no post-run use, so minimum retention.
      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Stylelint
        run: just js::stylelint

      # Advisory until the 3 known bg-black findings in stock shadcn
      # overlays are addressed.
      - name: Detect (impeccable, advisory)
        run: just js::detect
        continue-on-error: true

      - name: Verify font integrity
        run: just js::font-integrity

      - name: Build
        run: just js::build

  # WCAG 2.2 AA accessibility gate: axe-core against the dev-only design
  # showcase, failing on any violation outside the documented allowlist in
  # frontend/scripts/a11y/allowlist.mjs.
  #
  # Driver is @playwright/test + @axe-core/playwright. The Playwright config
  # owns the dev-server lifecycle (webServer) and ships a linux-arm64 Chromium
  # (chrome-headless-shell, falling back to full Chromium on arm64 since 1.57),
  # so the gate reproduces on the ARM64 dev box as well as x86 CI. The showcase
  # routes are dev-only (registered under import.meta.env.DEV), so the config
  # points webServer at `npm run dev`, never the production build.
  a11y:
    name: Accessibility (axe)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          version: ${{ env.VP_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      # Install from the repo root (the root prepare hook needs npm's cwd
      # at the root to resolve lefthook). @playwright/test is a
      # lockfile-pinned frontend devDependency, so its integrity rides the
      # committed lockfile like every other npm dep.
      - name: Install
        working-directory: ${{ github.workspace }}
        run: vp install

      # Key the browser cache on the resolved @playwright/test version so a
      # lockfile bump misses cleanly and re-downloads.
      - name: Resolve Playwright version
        id: playwright
        working-directory: ${{ github.workspace }}
        run: echo "version=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Install unconditionally, even on a cache hit: the cache holds only the
      # browser binaries under ~/.cache/ms-playwright, but `--with-deps`
      # installs OS-level apt packages that are not cached and must be present
      # on every run.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # webServer in playwright.config.ts starts `npm run dev`, waits on the
      # scanned route, and tears it down. Do not also start a server here:
      # Playwright never reuses an existing server in CI, so a second one would
      # collide on port 5173 (EADDRINUSE).
      - name: Run accessibility gate
        run: npm run a11y

      # Traces (retain-on-failure) carry the attached axe-results.json plus DOM
      # snapshots and console for each failing scan; only present on a red run.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a11y-playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  # Smoke test the staging compose init path: catches role-clause
  # regressions in init-roles.sql and required-env-var regressions in the
  # compose `${VAR:?required}` interpolations before they land on staging.
  # Postgres-only `up` — the init surface under test is postgres.
  staging-smoke:
    name: Staging compose smoke
    needs: changes
    if: needs.changes.outputs.staging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Build .env from the committed example so a required key renamed in
      # compose but not in the example is also caught. Distinct passwords
      # per role so a swapped CREATE ROLE clause in init-roles.sql can't
      # authenticate cross-role and pass silently.
      - name: Prepare env files from examples
        working-directory: docker
        run: |
          set -euo pipefail
          cp staging.env.bootstrap.example .env
          # .env.runtime and .env.migrate are required: true on services
          # that aren't started here; compose validates env_file presence
          # at parse time regardless. Stub values, never read.
          cp staging.env.runtime.example .env.runtime
          cp staging.env.migrate.example .env.migrate
          # `=.*` (not `=$`) so substitutions stay robust if the examples
          # ever acquire non-empty defaults; an exact-empty anchor would
          # silently no-op and fail later at auth with an opaque 28P01.
          sed -i \
            -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=smoke_super_pw_1|' \
            -e 's|^REVERIE_APP_PASSWORD=.*|REVERIE_APP_PASSWORD=smoke_app_pw_2|' \
            -e 's|^REVERIE_INGESTION_PASSWORD=.*|REVERIE_INGESTION_PASSWORD=smoke_ing_pw_3|' \
            -e 's|^REVERIE_READONLY_PASSWORD=.*|REVERIE_READONLY_PASSWORD=smoke_ro_pw_4|' \
            -e 's|^REVERIE_MIGRATOR_PASSWORD=.*|REVERIE_MIGRATOR_PASSWORD=smoke_mig_pw_5|' \
            -e 's|^REVERIE_VERSION=.*|REVERIE_VERSION=smoke-test|' \
            .env

      - name: Bring up postgres service
        run: docker compose -f docker/compose.staging.yml up -d --wait --wait-timeout 120 reverie-postgres

      # `docker compose exec` keeps the psql client version matched to the
      # server image.
      - name: Assert roles exist with CONNECT grant
        run: |
          set -euo pipefail
          exec_psql() {
            docker compose -f docker/compose.staging.yml exec -T \
              -e PGPASSWORD=smoke_super_pw_1 \
              reverie-postgres psql -v ON_ERROR_STOP=1 -At \
              -U reverie -d reverie "$@"
          }
          for role in reverie_app reverie_ingestion reverie_readonly reverie_migrator; do
            exists=$(exec_psql -c "SELECT 1 FROM pg_roles WHERE rolname = '${role}' AND rolcanlogin")
            if [ "$exists" != "1" ]; then
              echo "Role ${role} missing or cannot login" >&2
              exit 1
            fi
            # Query pg_database.datacl directly (not has_database_privilege)
            # so deleting the explicit GRANT CONNECT lines is caught even
            # while Postgres' default PUBLIC -> CONNECT grant is in place;
            # has_database_privilege returns true via PUBLIC and would mask
            # the deletion.
            has_connect=$(exec_psql -c "SELECT EXISTS (SELECT 1 FROM pg_database d, aclexplode(d.datacl) acl WHERE d.datname = current_database() AND acl.grantee = (SELECT oid FROM pg_roles WHERE rolname = '${role}') AND acl.privilege_type = 'CONNECT')")
            if [ "$has_connect" != "t" ]; then
              echo "Role ${role} lacks an explicit CONNECT grant on $(exec_psql -c 'SELECT current_database()')" >&2
              exit 1
            fi
          done

      # Catches `LOGIN PASSWORD` clause regressions in init-roles.sql (the
      # 28P01-at-runtime failure mode).
      - name: Assert each role authenticates with its supplied password
        run: |
          set -euo pipefail
          login_as() {
            local role=$1 pw=$2
            docker compose -f docker/compose.staging.yml exec -T \
              -e PGPASSWORD="${pw}" \
              reverie-postgres psql -v ON_ERROR_STOP=1 -At \
              -h localhost -U "${role}" -d reverie -c 'SELECT 1' >/dev/null
          }
          login_as reverie_app       smoke_app_pw_2
          login_as reverie_ingestion smoke_ing_pw_3
          login_as reverie_readonly  smoke_ro_pw_4
          login_as reverie_migrator  smoke_mig_pw_5

      # THREAT: the migration identity must not be a superuser, create
      # roles, or bypass RLS. This catches *active* escalation (a CREATE/
      # ALTER ROLE adding SUPERUSER/CREATEROLE/BYPASSRLS). It does NOT
      # catch deletion of the explicit NOSUPERUSER NOCREATEROLE NOBYPASSRLS
      # clause from init-roles.sql — those are the CREATE ROLE defaults, so
      # removal yields the same f|f|f; the clause's presence is guarded by
      # review.
      - name: Assert reverie_migrator is not over-privileged
        run: |
          set -euo pipefail
          attrs=$(docker compose -f docker/compose.staging.yml exec -T \
            -e PGPASSWORD=smoke_super_pw_1 \
            reverie-postgres psql -v ON_ERROR_STOP=1 -At \
            -U reverie -d reverie \
            -c "SELECT rolsuper, rolcreaterole, rolbypassrls FROM pg_roles WHERE rolname = 'reverie_migrator'")
          if [ "$attrs" != "f|f|f" ]; then
            echo "reverie_migrator is over-privileged: rolsuper|rolcreaterole|rolbypassrls = ${attrs} (want f|f|f)" >&2
            exit 1
          fi

      # The migrator's two load-bearing grants: CREATE on the database (for
      # `CREATE SCHEMA` in the initial migration) and CREATE on schema
      # public (PG15+ revoked the implicit PUBLIC grant). Role-exists /
      # login / f|f|f all stay green if either is dropped — only a real DDL
      # round-trip catches it. One statement exercises both, leaving no
      # residue.
      - name: Assert reverie_migrator has DDL capability
        run: |
          set -euo pipefail
          docker compose -f docker/compose.staging.yml exec -T \
            -e PGPASSWORD=smoke_mig_pw_5 \
            reverie-postgres psql -v ON_ERROR_STOP=1 -At \
            -h localhost -U reverie_migrator -d reverie \
            -c "CREATE SCHEMA _smoke_ddl; CREATE TABLE _smoke_ddl.probe (id int); DROP SCHEMA _smoke_ddl CASCADE;"

      # THREAT: the long-lived app must hold zero DDL credentials, so
      # DATABASE_URL_MIGRATION must reach `reverie-migrate` and NOT the
      # `reverie` app service. Asserted against the fully-rendered config;
      # parse-time only, and runs while env files are still intact (before
      # the negative-path step blanks a var).
      - name: Assert DATABASE_URL_MIGRATION is scoped to reverie-migrate only
        working-directory: docker
        run: |
          set -euo pipefail
          rendered=$(docker compose -f compose.staging.yml config)
          if ! awk '/^  reverie-migrate:/{f=1} f && /^  [a-z]/ && !/^  reverie-migrate:/{f=0} f' <<<"$rendered" \
               | grep -q 'DATABASE_URL_MIGRATION'; then
            echo "DATABASE_URL_MIGRATION missing from reverie-migrate service config" >&2
            exit 1
          fi
          if awk '/^  reverie:/{f=1} f && /^  [a-z]/ && !/^  reverie:/{f=0} f' <<<"$rendered" \
               | grep -q 'DATABASE_URL_MIGRATION'; then
            echo "DATABASE_URL_MIGRATION leaked into the reverie app service — credential isolation broken" >&2
            exit 1
          fi

      - name: Tear down postgres service
        if: always()
        run: docker compose -f docker/compose.staging.yml down -v

      # Negative path: blank a required env var and assert `compose config`
      # hard-fails mentioning it. Key-name presence in stderr is the
      # signal — compose's exact wording is not pinned across versions.
      # `!cancelled()` so a regression in the `:?required` mechanism isn't
      # silently skipped behind an earlier failure.
      - name: Assert missing required env var hard-fails
        if: ${{ !cancelled() }}
        working-directory: docker
        run: |
          set -euo pipefail
          sed -i 's|^REVERIE_APP_PASSWORD=.*|REVERIE_APP_PASSWORD=|' .env
          if stderr=$(docker compose -f compose.staging.yml config 2>&1 >/dev/null); then
            echo "Expected compose config to fail with missing REVERIE_APP_PASSWORD, but it succeeded" >&2
            echo "stderr was:" >&2
            echo "${stderr}" >&2
            exit 1
          fi
          if ! grep -qF REVERIE_APP_PASSWORD <<<"${stderr}"; then
            echo "compose config failed but stderr did not mention REVERIE_APP_PASSWORD" >&2
            echo "stderr was:" >&2
            echo "${stderr}" >&2
            exit 1
          fi

  # Server-side secret scan. The gitleaks pre-commit hook is client-side:
  # bypassable and never run on fork PRs. Intentionally unconditional — a
  # secret can land in any file type, so every PR is scanned.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so the pull_request scan below can walk the whole
          # branch range, not just the tip commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        uses: ./.github/actions/install-pinned-tool
        with:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
          version: "8.30.1"
          sha256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          url: "https://github.com/gitleaks/gitleaks/releases/download/v{version}/gitleaks_{version}_linux_x64.tar.gz"
          binary: gitleaks
          archive-member: gitleaks

      # On a pull_request, scan every commit the branch introduces — a
      # secret added and later removed within the branch is gone from the
      # working tree but stays permanently readable in the pushed history,
      # so a HEAD-only scan would pass while the credential is still
      # exposed. On push/merge_group there is no PR base; fall back to a
      # full-tree dir scan. --redact keeps any match out of the public CI
      # log.
      - name: Scan for secrets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_SHA}" ]; then
            gitleaks git . --no-banner --redact --log-opts "${PR_BASE_SHA}..HEAD"
          else
            gitleaks dir . --no-banner --redact
          fi

  # PR-time docs build + internal-link gate. The build definition lives in
  # the reusable docs-build.yml, shared with docs.yml's Pages deploy lane
  # (cross-workflow `needs` is impossible, so the job must exist here to
  # join ci-gate). A skipped docs job (no docs change) is treated as a pass
  # by the aggregator.
  docs:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs-build.yml

  # Server-side Conventional Commits gate: the local commit-msg hook is
  # bypassable and never runs on fork PRs, yet release-please's changelog
  # and linear-close.yml's extraction depend on commit shape. Two surfaces:
  # every commit the PR introduces (keeps branch history greppable), and
  # the PR title — squash-merge makes the title the subject of the commit
  # that lands on main, which is what release-please consumes.
  # pull_request-only: push/merge_group have no PR range or title; ci-gate
  # treats the skip as a pass.
  commitlint:
    name: Commit message lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so commitlint can walk the whole PR range.
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          version: ${{ env.VP_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      # Root lockfile carries the same pinned commitlint the local
      # commit-msg hook runs.
      - name: Install commitlint
        run: vp install

      # Event-payload SHAs, not refs: base.sha pins the fork point even if
      # the base branch moves mid-run, and neither value is
      # attacker-controlled text.
      - name: Lint PR commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # GitHub appends ` (#N)` to the squash subject; commitlint parses it
      # as part of the subject, so linting the bare title matches what
      # release-please will see.
      - name: Lint PR title (squash-merge subject)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --verbose

  # Advisory check that the PR body carries the `Closes UNK-N` magic word
  # (hard-rule-9): linear-close.yml's branch/title extraction is the
  # fallback and Linear's own branch-name matching is unreliable against
  # the prefix convention. Advisory so legitimate no-issue PRs are never
  # blocked; graduation to blocking = swap the final exit 0 for exit 1.
  pr-linear-ref:
    name: PR body Linear reference (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # THREAT: PR body and branch name are attacker-controlled text on
      # fork PRs — both reach the script via env, never template
      # interpolation.
      - name: Check for Closes UNK-N magic word
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if grep -qiE 'closes UNK-[0-9]+' <<<"${PR_BODY}"; then
            echo "PR body carries a Closes UNK-N magic word."
            exit 0
          fi
          # Legitimate no-issue class: docs/ or chore/ branch with no
          # embedded issue id.
          if grep -qE '^(docs|chore)/' <<<"${HEAD_REF}" && ! grep -qiE 'unk-[0-9]+' <<<"${HEAD_REF}"; then
            echo "No-issue branch (${HEAD_REF}) — Closes line not required."
            exit 0
          fi
          msg="PR body lacks a 'Closes UNK-N' line. Hard-rule-9: without the magic word the Linear issue is never auto-closed on merge (branch-name matching is unreliable). Add 'Closes UNK-XXX' to the PR body, or use a docs/ or chore/ branch without an issue id if genuinely untracked."
          echo "::warning title=Missing Closes UNK-N in PR body::${msg}"
          {
            echo "## PR body Linear reference (advisory)"
            echo ""
            echo "${msg}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Advisory: absent from ci-gate.needs[] and continue-on-error, so a Sonar
  # outage or missing token never fails the build.
  sonar:
    name: SonarQube Cloud
    needs: [changes, backend, frontend]
    # A main analysis overwrites coverage with exactly what it submits;
    # SonarQube Cloud has no carryforward, so a missing report re-reports
    # that stack as 0%. Hence on push both producers must have succeeded.
    # PR analyses never touch the main baseline, so single-stack PRs (one
    # producer skipped) still scan. Skip fork PRs: no SONAR_TOKEN, so the
    # scan only fails. Skip bot dependency PRs via the actor: Dependabot
    # runs read a separate secrets store without SONAR_TOKEN and hard-fail,
    # and Renovate scans waste a runner on diffs with no analyzable
    # first-party code. A human pushing to a bot branch becomes the actor,
    # re-enabling the scan (with normal secrets). !cancelled(), not
    # always(): always() runs even inside a cancelled run, and once
    # scanned main with zero artifacts, wiping the baseline to 0%.
    if: >-
      !cancelled() &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'push' ||
       (needs.backend.result == 'success' && needs.frontend.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # blame-based new-code detection
          persist-credentials: false

      # Best-effort: the producing job may be skipped on a single-stack PR.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: dl_backend
        with:
          name: backend-coverage
          path: backend
        continue-on-error: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        id: dl_frontend
        with:
          name: frontend-coverage
          path: frontend/coverage
        continue-on-error: true

      # Both reports carry stack-relative SF: paths; prepend each stack dir
      # so a single project resolves them against projectBaseDir. Without
      # this they match nothing and coverage reads 0%.
      - name: Normalize coverage paths to repo root
        run: |
          set -euo pipefail
          if [ -f backend/lcov.info ]; then
            sed -i 's#^SF:#SF:backend/#' backend/lcov.info
          fi
          if [ -f frontend/coverage/lcov.info ]; then
            sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info
          fi

      # On push a missing artifact must block the scan: it would overwrite
      # the main baseline with partial coverage (the job-level if already
      # requires both producers green, so a miss here is an artifact-infra
      # failure). On PRs the analysis is baseline-safe; annotate and
      # continue. The job stays advisory either way (continue-on-error,
      # absent from ci-gate).
      - name: Gate coverage inputs
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BACKEND_DL: ${{ steps.dl_backend.outcome }}
          FRONTEND_DL: ${{ steps.dl_frontend.outcome }}
        run: |
          if [ "${BACKEND_DL}" = 'failure' ] || [ "${FRONTEND_DL}" = 'failure' ]; then
            if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
              echo "::error title=Sonar coverage missing::A coverage artifact was absent on a main push; refusing to overwrite the baseline with partial coverage."
              exit 1
            fi
            echo "::warning title=Sonar coverage partial::A coverage artifact was absent (single-stack PR or upstream failure); Sonar scanned with incomplete coverage."
          fi
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::warning title=SONAR_TOKEN missing::SonarQube scan ran without a token; coverage was not published."
          fi

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Single required status check for the branch ruleset. Path-conditional
  # jobs that legitimately skip on a given PR no longer leave an
  # individually-required check unsatisfied; the gate fails only when a
  # needed job actually failed or was cancelled — `skipped` is a pass.
  #
  # `if: always()` is load-bearing: without it the gate is itself skipped
  # when an upstream job fails, and GitHub reports a skipped required check
  # as success — a broken build could merge.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - backend
      - msrv
      - audit
      - dependency-review
      - workflow-lint
      - workflow-security
      - repo-lint
      - frontend
      - a11y
      - staging-smoke
      - secret-scan
      - iac-scan
      - docker-build
      - openapi-policy
      - npm-license
      - sast
      - docs
      - commitlint
      - pr-linear-ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required CI job failed or was cancelled:"
          echo "$RESULTS"
          exit 1
