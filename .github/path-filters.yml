# Shared by CI's `changes` job and scripts/preflight-scope.sh; a filter edit
# changes both gates. Every filter includes ci.yml and this file itself, so
# an edit to either re-runs every gated job. Patterns are literal paths and
# trailing `/**` only: the local scoper has no glob engine.
backend:
  - "backend/**"
  - "docker/init-roles.sql"
  - "mise.toml"
  - ".github/workflows/ci.yml"
  # Not under `workflows`: a toolchain edit must trigger the backend jobs.
  - ".github/actions/rust-toolchain/**"
  - ".github/path-filters.yml"
audit:
  - "backend/Cargo.toml"
  - "backend/Cargo.lock"
  - "backend/deny.toml"
  - "mise.toml"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
frontend:
  # Root vite.config.ts, lockfile, and .npmrc govern the workspaces.
  - "frontend/**"
  - "package.json"
  - "package-lock.json"
  - ".npmrc"
  - "vite.config.ts"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
staging:
  - "docker/compose.staging.yml"
  - "docker/init-roles.sql"
  - "docker/staging.env.bootstrap.example"
  - "docker/staging.env.runtime.example"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
workflows:
  # A suppression edit must re-run the scan without a workflow change.
  - ".github/workflows/**"
  - ".github/actions/**"
  - ".github/zizmor.yml"
  - ".github/path-filters.yml"
iac:
  - "Dockerfile"
  - "docker-compose.yml"
  - "docker/**"
  - ".trivyignore"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
docker:
  # Manifests only: this gates build-context failures (a lockfile hoist
  # breaking a COPY); compile breakage is the backend/frontend jobs' remit.
  - "Dockerfile"
  - ".dockerignore"
  - "package.json"
  - "package-lock.json"
  - "frontend/package.json"
  - "docs/package.json"
  - "backend/Cargo.toml"
  - "backend/Cargo.lock"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
openapi:
  - "docs/openapi.json"
  - ".checkov.yaml"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
npm:
  - "package.json"
  - "package-lock.json"
  - "frontend/package.json"
  - "docs/package.json"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
docs:
  # docs/** includes generated reference artifacts, so a backend regen
  # trips this filter.
  - "docs/**"
  - "package.json"
  - "package-lock.json"
  - ".npmrc"
  - ".github/workflows/ci.yml"
  - ".github/workflows/docs.yml"
  - ".github/workflows/docs-build.yml"
  - ".github/path-filters.yml"
