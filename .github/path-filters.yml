# Shared by every concern workflow's `changes` job and by
# scripts/preflight-scope.sh; a filter edit changes both gates, which is why a
# detector reads this file rather than inlining its own patterns. Every filter
# includes this file and every workflow or composite action that defines a job
# it gates, so editing the definition re-runs the job. Patterns
# are literal paths and trailing `/**` only: the local scoper has no glob engine.
backend:
  - "backend/**"
  - "docker/init-roles.sql"
  - "mise.toml"
  - ".github/workflows/ci.yml"
  - ".github/workflows/backend.yml"
  # Not under `workflows`: a toolchain edit must trigger the backend jobs.
  - ".github/actions/rust-toolchain/**"
  - ".github/actions/setup/**"
  - ".github/workflows/security.yml"
  - ".github/path-filters.yml"
audit:
  - "backend/Cargo.toml"
  - "backend/Cargo.lock"
  - "backend/deny.toml"
  - "mise.toml"
  - ".github/workflows/ci.yml"
  - ".github/workflows/deps.yml"
  - ".github/actions/setup/**"
  - ".github/path-filters.yml"
frontend:
  # Root vite.config.ts, the lockfile, and pnpm-workspace.yaml (which declares
  # the workspace members, the catalog and the install-script policy) govern
  # every project.
  - "frontend/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "vite.config.ts"
  - ".github/workflows/ci.yml"
  - ".github/workflows/frontend.yml"
  - ".github/workflows/security.yml"
  - ".github/actions/setup/**"
  - ".github/path-filters.yml"
staging:
  - "docker/compose.staging.yml"
  - "docker/init-roles.sql"
  - "docker/staging.env.bootstrap.example"
  - "docker/staging.env.runtime.example"
  - ".github/workflows/ci.yml"
  - ".github/workflows/staging.yml"
  - ".github/path-filters.yml"
workflows:
  # A suppression edit must re-run the scan without a workflow change.
  - ".github/workflows/**"
  - ".github/actions/**"
  - ".github/zizmor.yml"
  - "mise.toml"
  - ".github/path-filters.yml"
iac:
  - "Dockerfile"
  - "docker-compose.yml"
  - "docker/**"
  - ".trivyignore"
  # trivy's own pin lives here, and this job has no push fallback, so a
  # scanner bump would otherwise merge without the scan it gates ever running.
  - "mise.toml"
  - ".github/workflows/ci.yml"
  - ".github/workflows/security.yml"
  - ".github/actions/setup/**"
  - ".github/path-filters.yml"
docker:
  # Manifests only: this gates build-context failures (a lockfile hoist
  # breaking a COPY); compile breakage is the backend/frontend jobs' remit.
  # verify-frontend-sbom.mjs belongs here because the Dockerfile copies it into
  # a stage and runs it, so a change to it can only be exercised by building
  # the image.
  - "Dockerfile"
  - ".dockerignore"
  - "scripts/verify-frontend-sbom.mjs"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "frontend/package.json"
  - "docs/package.json"
  - "backend/Cargo.toml"
  - "backend/Cargo.lock"
  - ".github/workflows/ci.yml"
  - ".github/workflows/docker.yml"
  - ".github/path-filters.yml"
openapi:
  - "docs/openapi.json"
  - ".vacuum.yaml"
  - ".vacuum-ignore.yaml"
  # vacuum's own pin lives here, and this job has no push fallback, so a
  # linter bump would otherwise merge without the lint it gates ever running.
  - "mise.toml"
  - ".github/workflows/ci.yml"
  - ".github/workflows/security.yml"
  - ".github/actions/setup/**"
  - ".github/path-filters.yml"
npm:
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "frontend/package.json"
  - "docs/package.json"
  - ".github/workflows/ci.yml"
  - ".github/workflows/deps.yml"
  - ".github/actions/setup/**"
  - ".github/path-filters.yml"
docs:
  # docs/** includes generated reference artifacts, so a backend regen
  # trips this filter.
  - "docs/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - ".github/workflows/ci.yml"
  - ".github/workflows/docs.yml"
  - ".github/path-filters.yml"
