# zizmor configuration (UNK-327). Documented exceptions for the workflow-
# security gate (the `workflow-security` job in .github/workflows/ci.yml).
# Every entry carries a justification; this file is the audit trail.
#
# An `ignore` entry suppresses a tool false-positive, NOT an accepted security
# risk: the underlying issue is genuinely absent and zizmor's heuristic cannot
# confirm that. A `disable` entry is different in kind, gives up real coverage,
# and states what is lost.
rules:
  ref-version-mismatch:
    # The repo pins every action by immutable commit SHA (the supply-chain
    # control, enforced by Renovate's helpers:pinGitHubActionDigests and the
    # SHA-pinning policy) and annotates each with a major-version comment
    # (`# v2`, `# v4`) that Renovate maintains. This audit wants the comment to
    # name the exact tag the SHA resolves to, which is incompatible with that
    # convention: an upstream major tag that moves past a pinned SHA leaves the
    # `# vN` comment reading as mismatched even though the SHA is correct, and
    # the finding then blocks every open pull request until the digest bump
    # lands. Renovate raises that bump on its own schedule, so the gate fails
    # for a window nobody in this repo controls.
    #
    # What this gives up: the audit also catches a missing version comment, and
    # one naming a different major than the SHA resolves to, which could mask a
    # downgrade. Accepted because the SHA is the control the supply-chain policy
    # actually rests on and Renovate owns the comments. Per-file ignores were
    # the previous shape and covered six of the workflows already, so the audit
    # was mostly off in practice while still needing a hand edit after every
    # upstream tag move.
    disable: true
  cache-poisoning:
    ignore:
      # docs.yml's build job uses actions/setup-node, and the same workflow
      # deploys the built site to GitHub Pages — zizmor flags that pairing as a
      # cache-poisoning surface. The npm cache is deliberately disabled (no
      # `cache:` input; see the comment on setup-node in docs.yml), so there is
      # no cache to poison. This Low-confidence finding is a residual heuristic
      # on the action's mere presence in a deploying workflow, not an enabled
      # cache. zizmor rates cache-poisoning Low-confidence regardless of the
      # `cache:` setting, so a confidence threshold cannot distinguish this safe
      # state from a real one without blinding the audit entirely.
      - docs.yml
