# Every entry carries a justification; this file is the audit trail.
rules:
  ref-version-mismatch:
    # SHA pins are the control; Renovate's `# vN` comments lag upstream tag
    # moves, so this false-fails on a schedule nobody here controls.
    disable: true
  cache-poisoning:
    ignore:
      # setup-node there has no cache: input; the finding fires on presence.
      - docs.yml
