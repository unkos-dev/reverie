# zizmor configuration (UNK-327). Documented suppressions for the workflow-
# security gate (the `workflow-security` job in .github/workflows/ci.yml). Each
# entry suppresses a tool false-positive, NOT an accepted security risk — the
# underlying issue is genuinely absent, zizmor's heuristic just can't confirm
# it. Every entry carries a justification; this file is the audit trail.
rules:
  ref-version-mismatch:
    ignore:
      # The repo pins every action by immutable commit SHA (the supply-chain
      # control, enforced by Renovate's helpers:pinGitHubActionDigests and the
      # SHA-pinning policy) and annotates each with a major-version comment
      # (`# v2`, `# v4`) that Renovate maintains. ref-version-mismatch wants the
      # comment to name the exact tag the SHA resolves to; when a major tag
      # later moves past the pinned SHA, the `# vN` comment reads as "mismatched"
      # even though the SHA is correct and current per our pinning convention.
      # The exact-version comment it wants conflicts with that deliberate,
      # Renovate-managed convention and adds nothing over the SHA pin itself, so
      # the audit is disabled for the affected files. Action staleness is
      # Renovate's job. The audit fires per-instance only once a major tag has
      # actually moved PAST the pinned SHA (so the `# vN` comment no longer
      # resolves to that SHA) — not on the mere presence of a major-version
      # comment. The entries below are the files flagged so far; other
      # workflows use the same SHA+`# vN` convention but were clean at triage
      # because their tags had not yet moved. zizmor ignores are per-file (no
      # glob), so add a file here if a future run flags it.
      - ci.yml
      - codeql.yml
      - docker-publish.yml
      - scheduled-audit.yml
      - scorecard.yml
      - snyk.yml
  cache-poisoning:
    ignore:
      # docs.yml's build job uses actions/setup-node, and the same workflow
      # deploys the built site to GitHub Pages — zizmor flags that pairing as a
      # cache-poisoning surface. The npm cache is deliberately disabled (no
      # `cache:` input; see the comment on setup-node in docs.yml), so there is
      # no cache to poison. This Low-confidence finding is a residual heuristic
      # on the action's mere presence in a deploying workflow, not an enabled
      # cache. zizmor rates cache-poisoning Low-confidence regardless of the
      # `cache:` setting, so a confidence threshold cannot distinguish this safe
      # state from a real one without blinding the audit entirely.
      - docs.yml
