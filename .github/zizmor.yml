# Every entry carries a justification; this file is the audit trail. An
# `ignore` suppresses a tool false-positive, never an accepted risk; a
# `disable` gives up real coverage and must state what is lost.
rules:
  ref-version-mismatch:
    # SHA pins are the control; Renovate's `# vN` comments lag upstream tag
    # moves, so this false-fails on a schedule nobody here controls.
    disable: true
  cache-poisoning:
    ignore:
      # setup-node there has no cache: input; the finding fires on presence.
      - website.yml
  dangerous-triggers:
    ignore:
      # sonar.yml runs read-only on main CI completions and executes no
      # PR-controlled code; the finding fires on the trigger class.
      - sonar.yml
