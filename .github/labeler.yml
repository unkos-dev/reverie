"area/backend":
  - changed-files:
      - any-glob-to-any-file:
          - "backend/**"

"area/frontend":
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"

"area/docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
          - "**/CLAUDE.md"
          - "**/AGENTS.md"
          - "**/GEMINI.md"

"area/infra":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "Dockerfile"
          - "docker-compose*.yml"
          - "*.dockerfile"
          - ".gitignore"
          - ".gitattributes"
          - ".editorconfig"
          - "release-please-config.json"
          - ".release-please-manifest.json"
          - "version.txt"

"security":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/security/**"
          - "backend/src/auth/**"
          - ".github/workflows/codeql.yml"
          - "**/*csp*"
          - "**/*security-headers*"

"dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "**/Cargo.lock"
          - "**/Cargo.toml"
          - "**/package.json"
          - "**/pnpm-lock.yaml"
