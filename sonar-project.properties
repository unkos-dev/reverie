# Single project aggregating both stacks' coverage (one analysis, both keys).
sonar.organization=unkos-dev
sonar.projectKey=unkos-dev_reverie

# Frontend tests are colocated in src, so they are reclassified by pattern
# rather than listing the dir under both sources and tests (Sonar errors on a
# file in both scopes, silently dropping coverage).
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx

sonar.exclusions=backend/target/**,backend/.sqlx/**,frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,frontend/src/components/ui/**,frontend/src/**/__fixtures__/**

# The JavaScript key covers TypeScript too. Rust is natively analyzed.
sonar.rust.lcov.reportPaths=backend/lcov.info
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
