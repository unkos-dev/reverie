# Single project aggregating both stacks' coverage (one analysis, both keys).
sonar.organization=unkos-dev
sonar.projectKey=unkos-dev_reverie

# Frontend tests are colocated in src, so they are reclassified by pattern
# rather than listing the dir under both sources and tests (Sonar errors on a
# file in both scopes, silently dropping coverage).
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx

# Dev-only design tree (build-excluded from production; assert-no-design-chunk
# gates it): its DOM-driving bench orchestration is exercised in measured
# browser runs by design, so it is excluded from coverage only. It stays in
# sonar.sources for bug/smell analysis.
sonar.coverage.exclusions=frontend/src/pages/design/**

sonar.exclusions=backend/target/**,backend/.sqlx/**,frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,frontend/src/components/ui/**,frontend/src/**/__fixtures__/**

# Test code is exempt from copy-paste detection: repetitive arrange-act-assert
# setup is idiomatic in tests and explicitness beats DRY there. Backend tests live
# beside sources (dedicated tests.rs modules and test_support), so they are not
# caught by the frontend-only test.inclusions above and must be listed here.
# suggest.rs: the per-entity sqlx query_as! bodies must be distinct string
# literals for compile-time schema verification (runtime SQL is banned on the
# data path), so their repetition is load-bearing, not copy-paste debt.
sonar.cpd.exclusions=backend/src/**/tests.rs,backend/src/test_support.rs,backend/src/routes/suggest.rs,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx

# The JavaScript key covers TypeScript too. Rust is natively analyzed.
sonar.rust.lcov.reportPaths=backend/lcov.info
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
