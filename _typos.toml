[default]
extend-ignore-re = [
  # Git short SHAs in backticks (e.g. `ba65bdf`) — hex digests trip the
  # dictionary on their leading letters (`ba` -> `by`/`be`).
  "`[0-9a-f]{7,40}`",
  # Valid hyphenated forms the tokeniser mis-splits into non-words. Scoped to
  # the exact phrase so the underlying dictionary stays active elsewhere.
  "pre-empted",
  "mis-aliasing",
  # Intentional misspelling in the Vale spelling self-test fixture. Scoped to the
  # fixture phrase, not a repo-wide allow of the bare word, so a genuine
  # `reciever` typo elsewhere is still caught.
  "reciever drops the frame",
]

[default.extend-words]
# Domain vocabulary (FRBR cataloguing model)
frbr = "frbr"

# Vendored codeguard files use "criticals" as a severity noun
criticals = "criticals"

# Intentional typo in settings test (deny_unknown_fields coverage)
concurency = "concurency"

# Color spaces / design tokens
oklch = "oklch"

# Crate / library names that look like typos
axum = "axum"
sqlx = "sqlx"
serde = "serde"
tokio = "tokio"
reqwest = "reqwest"

# EPUB spec vocabulary
opf = "opf"

[files]
extend-exclude = [
  "target/",
  "node_modules/",
  "frontend/dist/",
  "frontend/public/brand/",
  # Vendored codeguard security context — frozen as authored (see
  # docs/security/codeguard/README.md governance note).
  "docs/security/codeguard/",
  # Vale spelling assets: the vendored Australian-English Hunspell dictionary is
  # a 50k-word list, and the vocabulary accept-list holds brand terms and
  # identifiers. Both are word data, not prose, so typos must not scan them.
  "styles/config/dictionaries/",
  "styles/config/vocabularies/",
  "*.lock",
  "package-lock.json",
]
