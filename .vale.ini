# Vale configuration for Reverie prose linting.
#
# Drives a deterministic prose check over Markdown docs (Architecture Decision
# Records, the Starlight documentation site, and repo-root Markdown), catching
# mechanical prose anti-patterns: throat-clearing openers, business jargon,
# empty-emphasis adverbs, vague declaratives, and Wh- sentence
# openers. The judgement-level checks a regular expression cannot own (rhythm,
# voice, passive voice) stay with the authoring-side review aids.
#
# Posture is a hard gate for the mechanical rules: they emit at `error`, so
# `vale` exits non-zero on any finding, failing the commit (lint-staged) and the
# CI run. Inline code spans are outside prose scope; the ADR
# tree is exempt from the Wh-opener rule (deliberate "Why X / How" framings).
#
# The spelling check (Australian English, en_AU dictionary) is advisory: it
# emits at `warning`, and `vale` exits non-zero only on `error`-level findings,
# so spelling surfaces without blocking the gate. Brand terms and identifiers it
# should accept live in the Reverie vocabulary accept-list, never inline.
#
# Scope is owned by scripts/vale-lint.sh (the lint-staged and CI entry point),
# which selects the in-scope Markdown and excludes agent-process files.

StylesPath = styles
MinAlertLevel = suggestion

# Vocabulary accept-list (styles/config/vocabularies/Reverie/accept.txt): brand
# terms and identifiers that the Australian-English spelling check must treat as
# correctly spelled. A core option, so it sits above the syntax-specific blocks.
Vocab = Reverie

# Parse .mdx (Starlight content) with the Markdown processor.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = ReverieProse

# ADRs use deliberate "Why X and not Y" / "How it works" rhetorical framings;
# the Wh-opener rule misreads these as crutches. Exempt the ADR tree (the rest
# of ReverieProse still applies there).
[adr/**]
ReverieProse.WhStarter = NO
