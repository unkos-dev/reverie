# Vale configuration for Reverie prose linting.
#
# Drives a deterministic prose check over Markdown docs (Architecture Decision
# Records, the Starlight documentation site, and repo-root Markdown), catching
# mechanical prose anti-patterns: throat-clearing openers, business jargon,
# empty-emphasis adverbs, vague declaratives, em dashes, and Wh- sentence
# openers. The judgement-level checks a regular expression cannot own (rhythm,
# voice, passive voice) stay with the authoring-side review aids.
#
# Posture is advisory: every rule emits at `warning`, so `vale` exits zero and
# never blocks a commit or CI run. Promotion to a hard gate raises the rule
# levels to `error` once the existing docs are triaged clean.
#
# Scope is owned by scripts/vale-lint.sh (the lint-staged and CI entry point),
# which selects the in-scope Markdown and excludes agent-process files.

StylesPath = styles
MinAlertLevel = suggestion

# Parse .mdx (Starlight content) with the Markdown processor.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = ReverieProse
