# Australian-English spelling over Markdown prose. Style and voice are
# deliberately not linted: a regular expression judges neither without
# flattening prose that reads as intended.
#
# Spelling emits at `error`, so a finding fails the prose gate. A deliberate
# term goes in the vocabulary accept-list; an American spelling is recast in
# the prose instead (the accept-list's own header holds the rules).

StylesPath = styles
MinAlertLevel = suggestion

# A core option, so it sits above the syntax-specific blocks.
Vocab = Custom

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Custom

# Agent-process instructions and the archival .claude tree are not project prose.
[**/{CLAUDE,AGENTS,GEMINI}.md]
Custom.Spelling = NO

[.claude/**]
Custom.Spelling = NO

# Third-party rules carried verbatim from upstream. AGENTS.md forbids editing
# them, so linting them could only ever produce findings nobody is allowed to
# act on. Excluded here rather than in the recipe so the pre-commit hook, which
# lints whatever is staged, agrees with the gate.
[docs/security/codeguard/**]
Custom.Spelling = NO
