# checkov configuration — consumed by the openapi-policy CI job
# (.github/workflows/ci.yml), which scans the generated docs/openapi.json.
#
# Suppression registry, zizmor-style: every skip carries a justification
# and, where applicable, a lift condition. The spec is generated JSON, so
# inline per-resource suppressions are impossible — config-level skips
# scoped to the openapi framework are the only mechanism.
#
# CKV_OPENAPI_3 — "security schemes don't allow cleartext credentials
#   over unencrypted channel". Fires on `opds_basic` (http/basic).
#   Deliberate: OPDS clients (Kobo e-readers among them) support only
#   Basic auth, so the scheme cannot be replaced. The threat is owned
#   operationally — the scheme description in the spec and the operator
#   docs mandate HTTPS in production, and the session cookie is issued
#   with Secure when behind_https is on. Permanent, documented exception.
#
# CKV_OPENAPI_20 — "API keys are not sent over cleartext". Fires on the
#   `device_token_bearer` and `oidc_jwt_bearer` HTTP Bearer schemes (the
#   cleartext-transport check for the bearer/apiKey family, the Bearer
#   counterpart to CKV_OPENAPI_3's finding on `opds_basic`). Same deliberate
#   posture for both: the credential (personal device token or IdP-issued
#   access token) is presented over Bearer, HTTPS is mandated in production by
#   the scheme description and operator docs, and TLS is terminated at the
#   reverse proxy. Transport cannot be asserted in the generated spec, so the
#   finding is owned operationally. Permanent, documented exception. The
#   config-level skip already covers both schemes — no per-scheme change
#   needed when a new Bearer scheme is added.
#
# CKV_OPENAPI_21 — "arrays have a maximum number of items". Fires on
#   unbounded array query params (e.g. the `tag` filter). Real finding,
#   aligned with the project's bounded-queries invariant — but spec-side
#   maxItems without server-side enforcement would be documentation
#   theatre. Enforcement (validation + regenerated spec) belongs to
#   UNK-374, the unbounded-query compliance work under the keyset
#   pagination ADR. LIFT CONDITION: remove this skip when UNK-374 lands
#   maxItems in the generated spec.
skip-check:
  - CKV_OPENAPI_3
  - CKV_OPENAPI_20
  - CKV_OPENAPI_21
