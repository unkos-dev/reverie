[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
hadolint = "2.14.0"
just = "1.56.0"
shellcheck = "0.11.0"
typos = "1.48.0"
vale = "3.15.1"
yamllint = "1.38.0"

# Prebuilt Rust CI tools. The GitHub backend verifies release checksums,
# attestations, and SLSA provenance when upstream publishes them.
[tools."github:nextest-rs/nextest"]
version = "0.9.140"
version_prefix = "cargo-nextest-"
filter_bins = "cargo-nextest"

[tools."github:taiki-e/cargo-llvm-cov"]
version = "0.8.7"
filter_bins = "cargo-llvm-cov"

[tools."github:bnjbvr/cargo-machete"]
version = "0.9.2"
filter_bins = "cargo-machete"

[tools."github:EmbarkStudios/cargo-deny"]
version = "0.20.2"
filter_bins = "cargo-deny"

[tools."github:sourcefrog/cargo-mutants"]
version = "27.1.0"
filter_bins = "cargo-mutants"
