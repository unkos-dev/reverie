[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
hadolint = "2.15.1"
just = "1.58.0"
# Linker for the Rust build, routed in via `-C link-arg=-fuse-ld=mold`. Pinned
# here rather than installed with apt so CI resolves it through the same
# checksum-verified path as every other tool.
mold = "2.42.0"
opengrep = "1.27.1"
shellcheck = "0.11.0"
snyk = "1.1306.4"
trivy = "0.74.0"
typos = "1.49.0"
vale = "3.17.1"
yamllint = "1.38.0"
zizmor = "1.29.0"
# npm enforces `devEngines.packageManager` in package.json on every direct
# invocation, hard-erroring with EBADDEVENGINES when the running npm
# disagrees rather than honouring the declared `onFail: download`. Without
# this entry a checkout falls through to whatever npm the ambient config
# supplies, so a machine whose global pin has moved ahead can run neither
# `npm install` nor any lefthook step that shells out to npm. The JS jobs in
# CI hit the same wall through their bare `npx` invocations, because the npm
# bundled with node lags this pin, so mise-action installs this entry
# alongside node and the shim outranks the bundled copy on PATH.
#
# Both node and this entry ship npm and npx bins, and mise resolves a
# contested bin to the first tool listed in this table, for shims and for
# the PATH order `mise env` exports. `"npm:npm"` must stay listed before
# `node` below, or node's bundled npm shadows this pin and every direct
# npm/npx invocation fails with EBADDEVENGINES.
# `npm-pin-drift` holds this in lockstep with package.json and enforces
# this ordering.
# mise owns the node pin the same way it owns npm above: CI provisions node
# through jdx/mise-action, which reads this table, and setup-vp is told not
# to manage node (node-manager: false) so the two installers cannot disagree.
"npm:npm" = "12.0.2"
node = "24.19.0"

# SQL linter for backend/migrations, run by `just infra::sqruff`. No mise
# registry shorthand exists, so it takes the explicit GitHub backend form.
[tools."github:quarylabs/sqruff"]
version = "0.39.0"
filter_bins = "sqruff"

# Prebuilt Rust tools used by local recipes. The GitHub backend enables
# checksum and provenance verification when upstream publishes them.
[tools."github:nextest-rs/nextest"]
version = "0.9.143"
version_prefix = "cargo-nextest-"
filter_bins = "cargo-nextest"

[tools."github:taiki-e/cargo-llvm-cov"]
version = "0.8.7"
version_prefix = "v"
filter_bins = "cargo-llvm-cov"

# CI-only Rust tools. GitHub release tools use published checksums and
# provenance when available. cargo-mutants builds from the crates.io source
# archive with the crate checksum and its published Cargo.lock.
[tools."github:bnjbvr/cargo-machete"]
version = "0.9.2"
version_prefix = "v"
filter_bins = "cargo-machete"

[tools."github:EmbarkStudios/cargo-deny"]
version = "0.20.2"
filter_bins = "cargo-deny"

[tools."cargo:cargo-mutants"]
version = "27.1.0"
locked = true

# Content-addressed build cache used as the cargo rustc-wrapper for local
# builds. Pinning it here keeps `mise install` provisioning the same
# version the wrapper is configured against.
[tools."github:kunobi-ninja/kache"]
version = "0.14.2"
filter_bins = "kache"
