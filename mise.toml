[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
hadolint = "2.15.1"
just = "1.58.0"
# Linker for the Rust build, routed in via `-C link-arg=-fuse-ld=mold`. Pinned
# here rather than installed with apt so CI resolves it through the same
# checksum-verified path as every other tool.
mold = "2.42.1"
opengrep = "1.30.0"
rumdl = "v0.2.75"
shellcheck = "0.11.0"
snyk = "v1.1307.3"
trivy = "0.74.0"
typos = "1.50.2"
# OpenAPI linter for the generated spec, run by the openapi-policy CI job
# against .vacuum.yaml.
vacuum = "0.30.6"
vale = "3.22.0"
zizmor = "1.30.1"
# The package manager, resolved through mise's aqua backend and so
# checksum-verified. Two bootstraps need pnpm before any node_modules exists
# and therefore cannot reach it through vp: `just install`, which populates a
# fresh clone, and `just worktree`, which does the same for a new checkout.
# Everything past those points goes through vp instead. The image build used to
# be a third; it now runs on pnpm's own published image and provisions nothing
# through mise.
#
# Unlike the npm pin this replaces, the version here is a convenience rather
# than a correctness constraint. package.json's `packageManager` field is
# authoritative, and a pnpm whose version disagrees with it downloads and
# re-executes the declared version instead of refusing to run, so there is no
# EBADDEVENGINES-shaped failure to hold in lockstep and no bin contest with
# node to order around.
pnpm = "11.27.0"
# No node entry, deliberately. `devEngines.runtime` in package.json is the one
# place the Node version is written: vp honours it (so `node-manager: true` in
# CI resolves from the project rather than from a second pin here), pnpm
# honours it in the image build, and pnpm-lock.yaml carries the per-platform
# checksums for the download. A pin here would be the second declaration that
# arrangement exists to remove.

# Migration and query-cache CLI. Keep this in lockstep with the sqlx crate in
# backend/Cargo.toml. sqlx-cli 0.9 does not publish a Cargo.lock, so its own
# dependency tree remains the named package-ingress exception in REV-ADR-0050.
[tools."cargo:sqlx-cli"]
version = "0.9.0"
default-features = false
features = ["postgres", "rustls"]
locked = false

# SQL linter for backend/migrations, run by `just infra::sqruff`. No mise
# registry shorthand exists, so it takes the explicit GitHub backend form.
[tools."github:quarylabs/sqruff"]
version = "0.40.0"
filter_bins = "sqruff"

# YAML linter; reads .yamllint.yaml. Run by `just infra::ryl`.
[tools."github:owenlamont/ryl"]
version = "0.22.0"

# Prebuilt Rust tools used by local recipes. The GitHub backend enables
# checksum and provenance verification when upstream publishes them.
[tools."github:nextest-rs/nextest"]
version = "0.9.145"
version_prefix = "cargo-nextest-"
filter_bins = "cargo-nextest"

# CI-only Rust tools. GitHub release tools use published checksums and
# provenance when available.
[tools."github:bnjbvr/cargo-machete"]
version = "0.9.2"
version_prefix = "v"
filter_bins = "cargo-machete"

[tools."github:EmbarkStudios/cargo-deny"]
version = "0.20.2"
filter_bins = "cargo-deny"

# Prebuilt release asset, checksum-verified, rather than the cargo backend's
# from-source build against the crates.io source archive.
[tools."github:sourcefrog/cargo-mutants"]
version = "27.1.0"
version_prefix = "v"
filter_bins = "cargo-mutants"

# Specification linter for docs/specs, run by `just infra::specful`.
[tools."github:unkos-dev/specful"]
version = "0.5.4"
filter_bins = "specful"
