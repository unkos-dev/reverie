# yamllint configuration.
#
# Scoped to the rules that catch genuine YAML mistakes — syntax errors,
# duplicate keys, trailing whitespace, tab indentation — while disabling the
# stylistic rules that would fight oxfmt, the authoritative YAML formatter
# in this repo (see the "Format check (oxfmt)" CI step in ci.yml). oxfmt
# owns indentation, quoting, and line wrapping; yamllint is the semantic
# backstop, not a second formatter. Wired into the `repo-lint` CI job and the
# local pre-commit chain so both evaluate the same ruleset.
extends: default

rules:
  # oxfmt leaves long scalar values (URLs, SHA pins) and prose comments
  # unwrapped, and owns every other wrapping decision. A width rule here would
  # only flag the lines oxfmt deliberately keeps long, fighting the formatter.
  line-length: disable
  # GitHub Actions workflow files never carry a `---` document start.
  document-start: disable
  # `on:` is a legitimate top-level workflow key; the truthy rule would flag
  # it as a misspelled boolean. Keep the check for values, drop it for keys.
  truthy:
    check-keys: false
  # oxfmt emits a single space before an inline comment; the default rule
  # wants two and would reject every oxfmt-formatted file.
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
