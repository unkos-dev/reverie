# Codecov configuration.
#
# Coverage is informational across the board (project decision): it reports
# on PRs and the dashboard but never fails a build. Revisit a blocking floor
# only once a real baseline is established.
#
# Flags are carried forward so a PR that touches only one side of the
# monorepo does not show the untouched side as a coverage drop. CI gates the
# backend and frontend jobs behind a paths-filter (.github/workflows/ci.yml),
# so a frontend-only PR uploads no fresh backend report; carryforward reuses
# the last known backend coverage instead of reading it as a regression.
coverage:
  status:
    project:
      default:
        informational: true
      backend:
        informational: true
        flags:
          - backend
      frontend:
        informational: true
        flags:
          - frontend
    patch:
      default:
        informational: true

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true

comment:
  layout: "header, diff, flags, components"
  require_changes: false
